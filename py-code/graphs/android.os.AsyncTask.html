              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "android.os.AsyncTask", "label": "android.os.AsyncTask", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * \u003cp\u003eAsyncTask was intended to enable proper and easy use of the UI thread. However, the most\\n * common use case was for integrating into UI, and that would cause Context leaks, missed\\n * callbacks, or crashes on configuration changes. It also has inconsistent behavior on different\\n * versions of the platform, swallows exceptions from {@code doInBackground}, and does not provide\\n * much utility over using {@link Executor}s directly.\u003c/p\u003e\\n *\\n * \u003cp\u003eAsyncTask is designed to be a helper class around {@link Thread} and {@link Handler}\\n * and does not constitute a generic threading framework. AsyncTasks should ideally be\\n * used for short operations (a few seconds at the most.) If you need to keep threads\\n * running for long periods of time, it is highly recommended you use the various APIs\\n * provided by the \u003ccode\u003ejava.util.concurrent\u003c/code\u003e package such as {@link Executor},\\n * {@link ThreadPoolExecutor} and {@link FutureTask}.\u003c/p\u003e\\n *\\n * \u003cp\u003eAn asynchronous task is defined by a computation that runs on a background thread and\\n * whose result is published on the UI thread. An asynchronous task is defined by 3 generic\\n * types, called \u003ccode\u003eParams\u003c/code\u003e, \u003ccode\u003eProgress\u003c/code\u003e and \u003ccode\u003eResult\u003c/code\u003e,\\n * and 4 steps, called \u003ccode\u003eonPreExecute\u003c/code\u003e, \u003ccode\u003edoInBackground\u003c/code\u003e,\\n * \u003ccode\u003eonProgressUpdate\u003c/code\u003e and \u003ccode\u003eonPostExecute\u003c/code\u003e.\u003c/p\u003e\\n *\\n * \u003cdiv class=\"special reference\"\u003e\\n * \u003ch3\u003eDeveloper Guides\u003c/h3\u003e\\n * \u003cp\u003eFor more information about using tasks and threads, read the\\n * \u003ca href=\"{@docRoot}guide/components/processes-and-threads.html\"\u003eProcesses and\\n * Threads\u003c/a\u003e developer guide.\u003c/p\u003e\\n * \u003c/div\u003e\\n *\\n * \u003ch2\u003eUsage\u003c/h2\u003e\\n * \u003cp\u003eAsyncTask must be subclassed to be used. The subclass will override at least\\n * one method ({@link #doInBackground}), and most often will override a\\n * second one ({@link #onPostExecute}.)\u003c/p\u003e\\n *\\n * \u003cp\u003eHere is an example of subclassing:\u003c/p\u003e\\n * \u003cpre class=\"prettyprint\"\u003e\\n * private class DownloadFilesTask extends AsyncTask\u0026lt;URL, Integer, Long\u0026gt; {\\n *     protected Long doInBackground(URL... urls) {\\n *         int count = urls.length;\\n *         long totalSize = 0;\\n *         for (int i = 0; i \u0026lt; count; i++) {\\n *             totalSize += Downloader.downloadFile(urls[i]);\\n *             publishProgress((int) ((i / (float) count) * 100));\\n *             // Escape early if cancel() is called\\n *             if (isCancelled()) break;\\n *         }\\n *         return totalSize;\\n *     }\\n *\\n *     protected void onProgressUpdate(Integer... progress) {\\n *         setProgressPercent(progress[0]);\\n *     }\\n *\\n *     protected void onPostExecute(Long result) {\\n *         showDialog(\"Downloaded \" + result + \" bytes\");\\n *     }\\n * }\\n * \u003c/pre\u003e\\n *\\n * \u003cp\u003eOnce created, a task is executed very simply:\u003c/p\u003e\\n * \u003cpre class=\"prettyprint\"\u003e\\n * new DownloadFilesTask().execute(url1, url2, url3);\\n * \u003c/pre\u003e\\n *\\n * \u003ch2\u003eAsyncTask\\\u0027s generic types\u003c/h2\u003e\\n * \u003cp\u003eThe three types used by an asynchronous task are the following:\u003c/p\u003e\\n * \u003col\u003e\\n *     \u003cli\u003e\u003ccode\u003eParams\u003c/code\u003e, the type of the parameters sent to the task upon\\n *     execution.\u003c/li\u003e\\n *     \u003cli\u003e\u003ccode\u003eProgress\u003c/code\u003e, the type of the progress units published during\\n *     the background computation.\u003c/li\u003e\\n *     \u003cli\u003e\u003ccode\u003eResult\u003c/code\u003e, the type of the result of the background\\n *     computation.\u003c/li\u003e\\n * \u003c/ol\u003e\\n * \u003cp\u003eNot all types are always used by an asynchronous task. To mark a type as unused,\\n * simply use the type {@link Void}:\u003c/p\u003e\\n * \u003cpre\u003e\\n * private class MyTask extends AsyncTask\u0026lt;Void, Void, Void\u0026gt; { ... }\\n * \u003c/pre\u003e\\n *\\n * \u003ch2\u003eThe 4 steps\u003c/h2\u003e\\n * \u003cp\u003eWhen an asynchronous task is executed, the task goes through 4 steps:\u003c/p\u003e\\n * \u003col\u003e\\n *     \u003cli\u003e{@link #onPreExecute()}, invoked on the UI thread before the task\\n *     is executed. This step is normally used to setup the task, for instance by\\n *     showing a progress bar in the user interface.\u003c/li\u003e\\n *     \u003cli\u003e{@link #doInBackground}, invoked on the background thread\\n *     immediately after {@link #onPreExecute()} finishes executing. This step is used\\n *     to perform background computation that can take a long time. The parameters\\n *     of the asynchronous task are passed to this step. The result of the computation must\\n *     be returned by this step and will be passed back to the last step. This step\\n *     can also use {@link #publishProgress} to publish one or more units\\n *     of progress. These values are published on the UI thread, in the\\n *     {@link #onProgressUpdate} step.\u003c/li\u003e\\n *     \u003cli\u003e{@link #onProgressUpdate}, invoked on the UI thread after a\\n *     call to {@link #publishProgress}. The timing of the execution is\\n *     undefined. This method is used to display any form of progress in the user\\n *     interface while the background computation is still executing. For instance,\\n *     it can be used to animate a progress bar or show logs in a text field.\u003c/li\u003e\\n *     \u003cli\u003e{@link #onPostExecute}, invoked on the UI thread after the background\\n *     computation finishes. The result of the background computation is passed to\\n *     this step as a parameter.\u003c/li\u003e\\n * \u003c/ol\u003e\\n * \\n * \u003ch2\u003eCancelling a task\u003c/h2\u003e\\n * \u003cp\u003eA task can be cancelled at any time by invoking {@link #cancel(boolean)}. Invoking\\n * this method will cause subsequent calls to {@link #isCancelled()} to return true.\\n * After invoking this method, {@link #onCancelled(Object)}, instead of\\n * {@link #onPostExecute(Object)} will be invoked after {@link #doInBackground(Object[])}\\n * returns. To ensure that a task is cancelled as quickly as possible, you should always\\n * check the return value of {@link #isCancelled()} periodically from\\n * {@link #doInBackground(Object[])}, if possible (inside a loop for instance.)\u003c/p\u003e\\n *\\n * \u003ch2\u003eThreading rules\u003c/h2\u003e\\n * \u003cp\u003eThere are a few threading rules that must be followed for this class to\\n * work properly:\u003c/p\u003e\\n * \u003cul\u003e\\n *     \u003cli\u003eThe AsyncTask class must be loaded on the UI thread. This is done\\n *     automatically as of {@link android.os.Build.VERSION_CODES#JELLY_BEAN}.\u003c/li\u003e\\n *     \u003cli\u003eThe task instance must be created on the UI thread.\u003c/li\u003e\\n *     \u003cli\u003e{@link #execute} must be invoked on the UI thread.\u003c/li\u003e\\n *     \u003cli\u003eDo not call {@link #onPreExecute()}, {@link #onPostExecute},\\n *     {@link #doInBackground}, {@link #onProgressUpdate} manually.\u003c/li\u003e\\n *     \u003cli\u003eThe task can be executed only once (an exception will be thrown if\\n *     a second execution is attempted.)\u003c/li\u003e\\n * \u003c/ul\u003e\\n *\\n * \u003ch2\u003eMemory observability\u003c/h2\u003e\\n * \u003cp\u003eAsyncTask guarantees that all callback calls are synchronized to ensure the following\\n * without explicit synchronizations.\u003c/p\u003e\\n * \u003cul\u003e\\n *     \u003cli\u003eThe memory effects of {@link #onPreExecute}, and anything else\\n *     executed before the call to {@link #execute}, including the construction\\n *     of the AsyncTask object, are visible to {@link #doInBackground}.\\n *     \u003cli\u003eThe memory effects of {@link #doInBackground} are visible to\\n *     {@link #onPostExecute}.\\n *     \u003cli\u003eAny memory effects of {@link #doInBackground} preceding a call\\n *     to {@link #publishProgress} are visible to the corresponding\\n *     {@link #onProgressUpdate} call. (But {@link #doInBackground} continues to\\n *     run, and care needs to be taken that later updates in {@link #doInBackground}\\n *     do not interfere with an in-progress {@link #onProgressUpdate} call.)\\n *     \u003cli\u003eAny memory effects preceding a call to {@link #cancel} are visible\\n *     after a call to {@link #isCancelled} that returns true as a result, or\\n *     during and after a resulting call to {@link #onCancelled}.\\n * \u003c/ul\u003e\\n *\\n * \u003ch2\u003eOrder of execution\u003c/h2\u003e\\n * \u003cp\u003eWhen first introduced, AsyncTasks were executed serially on a single background\\n * thread. Starting with {@link android.os.Build.VERSION_CODES#DONUT}, this was changed\\n * to a pool of threads allowing multiple tasks to operate in parallel. Starting with\\n * {@link android.os.Build.VERSION_CODES#HONEYCOMB}, tasks are executed on a single\\n * thread to avoid common application errors caused by parallel execution.\u003c/p\u003e\\n * \u003cp\u003eIf you truly want parallel execution, you can invoke\\n * {@link #executeOnExecutor(java.util.concurrent.Executor, Object[])} with\\n * {@link #THREAD_POOL_EXECUTOR}.\u003c/p\u003e\\n *\\n * @deprecated Use the standard \u003ccode\u003ejava.util.concurrent\u003c/code\u003e or\\n *   \u003ca href=\"https://developer.android.com/topic/libraries/architecture/coroutines\"\u003e\\n *   Kotlin concurrency utilities\u003c/a\u003e instead.\\n \u0027}"}, {"color": "#97c2fc", "id": "public final Status getStatus()", "label": "public final Status getStatus()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the current status of this task.\\n     *\\n     * @return The current status.\\n     \u0027}"}, {"color": "#97c2fc", "id": "protected abstract Result doInBackground(Params... params)", "label": "protected abstract Result doInBackground(Params... params)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Override this method to perform a computation on a background thread. The\\n     * specified parameters are the parameters passed to {@link #execute}\\n     * by the caller of this task.\\n     *\\n     * This will normally run on a background thread. But to better\\n     * support testing frameworks, it is recommended that this also tolerates\\n     * direct execution on the foreground thread, as part of the {@link #execute} call.\\n     *\\n     * This method can call {@link #publishProgress} to publish updates\\n     * on the UI thread.\\n     *\\n     * @param params The parameters of the task.\\n     *\\n     * @return A result, defined by the subclass of this task.\\n     *\\n     * @see #onPreExecute()\\n     * @see #onPostExecute\\n     * @see #publishProgress\\n     \u0027}"}, {"color": "#97c2fc", "id": "execute", "label": "execute", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "publishProgress", "label": "publishProgress", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "protected void onPreExecute()", "label": "protected void onPreExecute()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Runs on the UI thread before {@link #doInBackground}.\\n     * Invoked directly by {@link #execute} or {@link #executeOnExecutor}.\\n     * The default version does nothing.\\n     *\\n     * @see #onPostExecute\\n     * @see #doInBackground\\n     \u0027}"}, {"color": "#97c2fc", "id": "doInBackground", "label": "doInBackground", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "executeOnExecutor", "label": "executeOnExecutor", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "protected void onPostExecute(Result result)", "label": "protected void onPostExecute(Result result)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * \u003cp\u003eRuns on the UI thread after {@link #doInBackground}. The\\n     * specified result is the value returned by {@link #doInBackground}.\\n     * To better support testing frameworks, it is recommended that this be\\n     * written to tolerate direct execution as part of the execute() call.\\n     * The default version does nothing.\u003c/p\u003e\\n     * \\n     * \u003cp\u003eThis method won\u0027t be invoked if the task was cancelled.\u003c/p\u003e\\n     *\\n     * @param result The result of the operation computed by {@link #doInBackground}.\\n     *\\n     * @see #onPreExecute\\n     * @see #doInBackground\\n     * @see #onCancelled(Object) \\n     \"}"}, {"color": "#97c2fc", "id": "protected void onProgressUpdate(Progress... values)", "label": "protected void onProgressUpdate(Progress... values)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Runs on the UI thread after {@link #publishProgress} is invoked.\\n     * The specified values are the values passed to {@link #publishProgress}.\\n     * The default version does nothing.\\n     *\\n     * @param values The values indicating progress.\\n     *\\n     * @see #publishProgress\\n     * @see #doInBackground\\n     \u0027}"}, {"color": "#97c2fc", "id": "protected void onCancelled(Result result)", "label": "protected void onCancelled(Result result)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * \u003cp\u003eRuns on the UI thread after {@link #cancel(boolean)} is invoked and\\n     * {@link #doInBackground(Object[])} has finished.\u003c/p\u003e\\n     * \\n     * \u003cp\u003eThe default implementation simply invokes {@link #onCancelled()} and\\n     * ignores the result. If you write your own implementation, do not call\\n     * \u003ccode\u003esuper.onCancelled(result)\u003c/code\u003e.\u003c/p\u003e\\n     *\\n     * @param result The result, if any, computed in\\n     *               {@link #doInBackground(Object[])}, can be null\\n     * \\n     * @see #cancel(boolean)\\n     * @see #isCancelled()\\n     \u0027}"}, {"color": "#97c2fc", "id": "cancel(boolean)", "label": "cancel(boolean)", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "onCancelled()", "label": "onCancelled()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "doInBackground(Object", "label": "doInBackground(Object", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "protected void onCancelled()", "label": "protected void onCancelled()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * \u003cp\u003eApplications should preferably override {@link #onCancelled(Object)}.\\n     * This method is invoked by the default implementation of\\n     * {@link #onCancelled(Object)}.\\n     * The default version does nothing.\u003c/p\u003e\\n     * \\n     * \u003cp\u003eRuns on the UI thread after {@link #cancel(boolean)} is invoked and\\n     * {@link #doInBackground(Object[])} has finished.\u003c/p\u003e\\n     *\\n     * @see #onCancelled(Object) \\n     * @see #cancel(boolean)\\n     * @see #isCancelled()\\n     \u0027}"}, {"color": "#97c2fc", "id": "onCancelled(Object)", "label": "onCancelled(Object)", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public final boolean isCancelled()", "label": "public final boolean isCancelled()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns \u003ctt\u003etrue\u003c/tt\u003e if this task was cancelled before it completed\\n     * normally. If you are calling {@link #cancel(boolean)} on the task,\\n     * the value returned by this method should be checked periodically from\\n     * {@link #doInBackground(Object[])} to end the task as soon as possible.\\n     *\\n     * @return \u003ctt\u003etrue\u003c/tt\u003e if task was cancelled before it completed\\n     *\\n     * @see #cancel(boolean)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final boolean cancel(boolean mayInterruptIfRunning)", "label": "public final boolean cancel(boolean mayInterruptIfRunning)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * \u003cp\u003eAttempts to cancel execution of this task.  This attempt will\\n     * fail if the task has already completed, already been cancelled,\\n     * or could not be cancelled for some other reason. If successful,\\n     * and this task has not started when \u003ctt\u003ecancel\u003c/tt\u003e is called,\\n     * this task should never run. If the task has already started,\\n     * then the \u003ctt\u003emayInterruptIfRunning\u003c/tt\u003e parameter determines\\n     * whether the thread executing this task should be interrupted in\\n     * an attempt to stop the task.\u003c/p\u003e\\n     * \\n     * \u003cp\u003eCalling this method will result in {@link #onCancelled(Object)} being\\n     * invoked on the UI thread after {@link #doInBackground(Object[])} returns.\\n     * Calling this method guarantees that onPostExecute(Object) is never\\n     * subsequently invoked, even if \u003ctt\u003ecancel\u003c/tt\u003e returns false, but\\n     * {@link #onPostExecute} has not yet run.  To finish the\\n     * task as early as possible, check {@link #isCancelled()} periodically from\\n     * {@link #doInBackground(Object[])}.\u003c/p\u003e\\n     *\\n     * \u003cp\u003eThis only requests cancellation. It never waits for a running\\n     * background task to terminate, even if \u003ctt\u003emayInterruptIfRunning\u003c/tt\u003e is\\n     * true.\u003c/p\u003e\\n     *\\n     * @param mayInterruptIfRunning \u003ctt\u003etrue\u003c/tt\u003e if the thread executing this\\n     *        task should be interrupted; otherwise, in-progress tasks are allowed\\n     *        to complete.\\n     *\\n     * @return \u003ctt\u003efalse\u003c/tt\u003e if the task could not be cancelled,\\n     *         typically because it has already completed normally;\\n     *         \u003ctt\u003etrue\u003c/tt\u003e otherwise\\n     *\\n     * @see #isCancelled()\\n     * @see #onCancelled(Object)\\n     \u0027}"}, {"color": "#97c2fc", "id": "onPostExecute", "label": "onPostExecute", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "isCancelled()", "label": "isCancelled()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public final Result get() throws InterruptedException, ExecutionException", "label": "public final Result get() throws InterruptedException, ExecutionException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Waits if necessary for the computation to complete, and then\\n     * retrieves its result.\\n     *\\n     * @return The computed result.\\n     *\\n     * @throws CancellationException If the computation was cancelled.\\n     * @throws ExecutionException If the computation threw an exception.\\n     * @throws InterruptedException If the current thread was interrupted\\n     *         while waiting.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final Result get(long timeout, TimeUnit unit) throws InterruptedException, ExecutionException, TimeoutException", "label": "public final Result get(long timeout, TimeUnit unit) throws InterruptedException, ExecutionException, TimeoutException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Waits if necessary for at most the given time for the computation\\n     * to complete, and then retrieves its result.\\n     *\\n     * @param timeout Time to wait before cancelling the operation.\\n     * @param unit The time unit for the timeout.\\n     *\\n     * @return The computed result.\\n     *\\n     * @throws CancellationException If the computation was cancelled.\\n     * @throws ExecutionException If the computation threw an exception.\\n     * @throws InterruptedException If the current thread was interrupted\\n     *         while waiting.\\n     * @throws TimeoutException If the wait timed out.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final AsyncTask\u003cParams, Progress, Result\u003e execute(Params... params)", "label": "public final AsyncTask\u003cParams, Progress, Result\u003e execute(Params... params)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Executes the task with the specified parameters. The task returns\\n     * itself (this) so that the caller can keep a reference to it.\\n     * \\n     * \u003cp\u003eNote: this function schedules the task on a queue for a single background\\n     * thread or pool of threads depending on the platform version.  When first\\n     * introduced, AsyncTasks were executed serially on a single background thread.\\n     * Starting with {@link android.os.Build.VERSION_CODES#DONUT}, this was changed\\n     * to a pool of threads allowing multiple tasks to operate in parallel. Starting\\n     * {@link android.os.Build.VERSION_CODES#HONEYCOMB}, tasks are back to being\\n     * executed on a single thread to avoid common application errors caused\\n     * by parallel execution.  If you truly want parallel execution, you can use\\n     * the {@link #executeOnExecutor} version of this method\\n     * with {@link #THREAD_POOL_EXECUTOR}; however, see commentary there for warnings\\n     * on its use.\\n     *\\n     * \u003cp\u003eThis method must be invoked on the UI thread.\\n     *\\n     * @param params The parameters of the task.\\n     *\\n     * @return This instance of AsyncTask.\\n     *\\n     * @throws IllegalStateException If {@link #getStatus()} returns either\\n     *         {@link AsyncTask.Status#RUNNING} or {@link AsyncTask.Status#FINISHED}.\\n     *\\n     * @see #executeOnExecutor(java.util.concurrent.Executor, Object[])\\n     * @see #execute(Runnable)\\n     \u0027}"}, {"color": "#97c2fc", "id": "DONUT", "label": "DONUT", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "THREAD_POOL_EXECUTOR", "label": "THREAD_POOL_EXECUTOR", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "HONEYCOMB", "label": "HONEYCOMB", "shape": "dot", "title": "{\u0027type\u0027: ver-written by an older one, leading to obscure data\\n     * loss and stability issues.  Such changes are best\\n     * executed in serial; to guarantee such work is serialized regardless of\\n     * platform version you can use this function with {@link #SERIAL_EXECUTOR}.\\n     *\\n     * \u003cp\u003eThis method must be invoked on the UI thread.\\n     *\\n     * @param exec The executor to use.  {@link #THREAD_POOL_EXECUTOR} is available as a\\n     *              convenient process-wide thread pool for tasks that are loosely coupled.\\n     * @param params The parameters of the task.\\n     *\\n     * @return This instance of AsyncTask.\\n     *\\n     * @throws IllegalStateException If {@link #getStatus()} returns either\\n     *         {@link AsyncTask.Status#RUNNING} or {@link AsyncTask.Status#FINISHED}.\\n     *\\n     * @see #execute(Object[])\\n     \u0027}"}, {"color": "#97c2fc", "id": "java.util.concurrent.Executor", "label": "java.util.concurrent.Executor", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * An object that executes submitted {@link Runnable} tasks. This\\n * interface provides a way of decoupling task submission from the\\n * mechanics of how each task will be run, including details of thread\\n * use, scheduling, etc.  An {@code Executor} is normally used\\n * instead of explicitly creating threads. For example, rather than\\n * invoking {@code new Thread(new RunnableTask()).start()} for each\\n * of a set of tasks, you might use:\\n *\\n * \u003cpre\u003e {@code\\n * Executor executor = anExecutor();\\n * executor.execute(new RunnableTask1());\\n * executor.execute(new RunnableTask2());\\n * ...}\u003c/pre\u003e\\n *\\n * However, the {@code Executor} interface does not strictly require\\n * that execution be asynchronous. In the simplest case, an executor\\n * can run the submitted task immediately in the caller\\\u0027s thread:\\n *\\n * \u003cpre\u003e {@code\\n * class DirectExecutor implements Executor {\\n *   public void execute(Runnable r) {\\n *     r.run();\\n *   }\\n * }}\u003c/pre\u003e\\n *\\n * More typically, tasks are executed in some thread other than the\\n * caller\\\u0027s thread.  The executor below spawns a new thread for each\\n * task.\\n *\\n * \u003cpre\u003e {@code\\n * class ThreadPerTaskExecutor implements Executor {\\n *   public void execute(Runnable r) {\\n *     new Thread(r).start();\\n *   }\\n * }}\u003c/pre\u003e\\n *\\n * Many {@code Executor} implementations impose some sort of\\n * limitation on how and when tasks are scheduled.  The executor below\\n * serializes the submission of tasks to a second executor,\\n * illustrating a composite executor.\\n *\\n * \u003cpre\u003e {@code\\n * class SerialExecutor implements Executor {\\n *   final Queue\u003cRunnable\u003e tasks = new ArrayDeque\u003c\u003e();\\n *   final Executor executor;\\n *   Runnable active;\\n *\\n *   SerialExecutor(Executor executor) {\\n *     this.executor = executor;\\n *   }\\n *\\n *   public synchronized void execute(Runnable r) {\\n *     tasks.add(() -\u003e {\\n *       try {\\n *         r.run();\\n *       } finally {\\n *         scheduleNext();\\n *       }\\n *     });\\n *     if (active == null) {\\n *       scheduleNext();\\n *     }\\n *   }\\n *\\n *   protected synchronized void scheduleNext() {\\n *     if ((active = tasks.poll()) != null) {\\n *       executor.execute(active);\\n *     }\\n *   }\\n * }}\u003c/pre\u003e\\n *\\n * The {@code Executor} implementations provided in this package\\n * implement {@link ExecutorService}, which is a more extensive\\n * interface.  The {@link ThreadPoolExecutor} class provides an\\n * extensible thread pool implementation. The {@link Executors} class\\n * provides convenient factory methods for these Executors.\\n *\\n * \u003cp\u003eMemory consistency effects: Actions in a thread prior to\\n * submitting a {@code Runnable} object to an {@code Executor}\\n * \u003ca href=\"package-summary.html#MemoryVisibility\"\u003e\u003ci\u003ehappen-before\u003c/i\u003e\u003c/a\u003e\\n * its execution begins, perhaps in another thread.\\n *\\n * @since 1.5\\n * @author Doug Lea\\n \u0027}"}, {"color": "#97c2fc", "id": " void execute(Runnable command)", "label": " void execute(Runnable command)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Executes the given command at some time in the future.  The command\\n     * may execute in a new thread, in a pooled thread, or in the calling\\n     * thread, at the discretion of the {@code Executor} implementation.\\n     *\\n     * @param command the runnable task\\n     * @throws RejectedExecutionException if this task cannot be\\n     * accepted for execution\\n     * @throws NullPointerException if command is null\\n     \u0027}"}, {"color": "#97c2fc", "id": "SERIAL_EXECUTOR", "label": "SERIAL_EXECUTOR", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public static void execute(Runnable runnable)", "label": "public static void execute(Runnable runnable)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Convenience version of {@link #execute(Object...)} for use with\\n     * a simple Runnable object. See {@link #execute(Object[])} for more\\n     * information on the order of execution.\\n     *\\n     * @see #execute(Object[])\\n     * @see #executeOnExecutor(java.util.concurrent.Executor, Object[])\\n     \u0027}"}, {"color": "#97c2fc", "id": "execute(Object...)", "label": "execute(Object...)", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "execute(Object", "label": "execute(Object", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "protected final void publishProgress(Progress... values)", "label": "protected final void publishProgress(Progress... values)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * This method can be invoked from {@link #doInBackground} to\\n     * publish updates on the UI thread while the background computation is\\n     * still running. Each call to this method will trigger the execution of\\n     * {@link #onProgressUpdate} on the UI thread.\\n     *\\n     * {@link #onProgressUpdate} will not be called if the task has been\\n     * canceled.\\n     *\\n     * @param values The progress values to update the UI with.\\n     *\\n     * @see #onProgressUpdate\\n     * @see #doInBackground\\n     \u0027}"}, {"color": "#97c2fc", "id": "onProgressUpdate", "label": "onProgressUpdate", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}]);

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
