        <center>
          <h1></h1>
        </center>
        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             

             

             
        </style>
    </head>


    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "android.hardware.camera2.TotalCaptureResult", "label": "android.hardware.camera2.TotalCaptureResult", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * \u003cp\u003eThe total assembled results of a single image capture from the image sensor.\u003c/p\u003e\\n *\\n * \u003cp\u003eContains the final configuration for the capture hardware (sensor, lens,\\n * flash), the processing pipeline, the control algorithms, and the output\\n * buffers.\u003c/p\u003e\\n *\\n * \u003cp\u003eA {@code TotalCaptureResult} is produced by a {@link CameraDevice} after processing a\\n * {@link CaptureRequest}. All properties listed for capture requests can also\\n * be queried on the capture result, to determine the final values used for\\n * capture. The result also includes additional metadata about the state of the\\n * camera device during the capture.\u003c/p\u003e\\n *\\n * \u003cp\u003eAll properties returned by {@link CameraCharacteristics#getAvailableCaptureResultKeys()}\\n * are available (that is {@link CaptureResult#get} will return non-{@code null}, if and only if\\n * that key that was enabled by the request. A few keys such as\\n * {@link CaptureResult#STATISTICS_FACES} are disabled by default unless enabled with a switch (such\\n * as {@link CaptureRequest#STATISTICS_FACE_DETECT_MODE}). Refer to each key documentation on\\n * a case-by-case basis.\u003c/p\u003e\\n *\\n * \u003cp\u003eFor a logical multi-camera device, if the CaptureRequest contains a surface for an underlying\\n * physical camera, the corresponding {@link TotalCaptureResult} object will include the metadata\\n * for that physical camera. And the mapping between the physical camera id and result metadata\\n * can be accessed via {@link #getPhysicalCameraResults}. If all requested surfaces are for the\\n * logical camera, no metadata for physical camera will be included.\u003c/p\u003e\\n *\\n * \u003cp\u003e{@link TotalCaptureResult} objects are immutable.\u003c/p\u003e\\n *\\n * @see CameraCaptureSession.CaptureCallback#onCaptureCompleted\\n \u0027}"}, {"color": "#97c2fc", "id": "public List\u003cCaptureResult\u003e getPartialResults()", "label": "public List\u003cCaptureResult\u003e getPartialResults()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Get the read-only list of partial results that compose this total result.\\n     *\\n     * \u003cp\u003eThe list is returned is unmodifiable; attempting to modify it will result in a\\n     * {@code UnsupportedOperationException} being thrown.\u003c/p\u003e\\n     *\\n     * \u003cp\u003eThe list size will be inclusive between {@code 0} and\\n     * {@link CameraCharacteristics#REQUEST_PARTIAL_RESULT_COUNT}, with elements in ascending order\\n     * of when {@link CameraCaptureSession.CaptureCallback#onCaptureProgressed} was invoked.\u003c/p\u003e\\n     *\\n     * @return unmodifiable list of partial results\\n     \u0027}"}, {"color": "#97c2fc", "id": "REQUEST_PARTIAL_RESULT_COUNT", "label": "REQUEST_PARTIAL_RESULT_COUNT", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "onCaptureProgressed", "label": "onCaptureProgressed", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public Map\u003cString, TotalCaptureResult\u003e getPhysicalCameraTotalResults()", "label": "public Map\u003cString, TotalCaptureResult\u003e getPhysicalCameraTotalResults()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Get the map between physical camera ids and their total capture result metadata\\n     *\\n     * \u003cp\u003eThis function can be called for logical multi-camera devices, which are devices that have\\n     * REQUEST_AVAILABLE_CAPABILITIES_LOGICAL_MULTI_CAMERA capability.\u003c/p\u003e\\n     *\\n     * \u003cp\u003eIf one or more streams from the underlying physical cameras were requested by the\\n     * corresponding capture request, this function returns the total result metadata for those\\n     * physical cameras. Otherwise, an empty map is returned.\u003c/p\u003e\\n     *\\n     * \u003cp\u003eThis function replaces the deprecated {@link #getPhysicalCameraResults}, and its return\\n     * value is a map of TotalCaptureResult rather than CaptureResult. \u003c/p\u003e\\n     *\\n     * \u003cp\u003eTo reprocess an image from a physical camera stream, typically returned from a\\n     * {@link MultiResolutionImageReader}, the application must look up this map to get the {@link\\n     * TotalCaptureResult} from the physical camera and pass it to {@link\\n     * CameraDevice#createReprocessCaptureRequest}.\u003c/p\u003e\\n     *\\n     * @return unmodifiable map between physical camera ids and their total capture result metadata\\n     \u0027}"}, {"color": "#97c2fc", "id": "createReprocessCaptureRequest", "label": "createReprocessCaptureRequest", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "MultiResolutionImageReader", "label": "MultiResolutionImageReader", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "getPhysicalCameraResults", "label": "getPhysicalCameraResults", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "TotalCaptureResult", "label": "TotalCaptureResult", "shape": "dot", "title": "{}"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "android.hardware.camera2.TotalCaptureResult", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public List\u003cCaptureResult\u003e getPartialResults()"}, {"arrows": "to", "from": "android.hardware.camera2.TotalCaptureResult", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Map\u003cString, TotalCaptureResult\u003e getPhysicalCameraTotalResults()"}, {"arrows": "to", "from": "public List\u003cCaptureResult\u003e getPartialResults()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "REQUEST_PARTIAL_RESULT_COUNT"}, {"arrows": "to", "from": "public List\u003cCaptureResult\u003e getPartialResults()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "onCaptureProgressed"}, {"arrows": "to", "from": "public Map\u003cString, TotalCaptureResult\u003e getPhysicalCameraTotalResults()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "createReprocessCaptureRequest"}, {"arrows": "to", "from": "public Map\u003cString, TotalCaptureResult\u003e getPhysicalCameraTotalResults()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "MultiResolutionImageReader"}, {"arrows": "to", "from": "public Map\u003cString, TotalCaptureResult\u003e getPhysicalCameraTotalResults()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "getPhysicalCameraResults"}, {"arrows": "to", "from": "public Map\u003cString, TotalCaptureResult\u003e getPhysicalCameraTotalResults()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "TotalCaptureResult"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
