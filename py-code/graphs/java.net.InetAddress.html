              // initialize global variables.
              var edges;

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "java.net.InetAddress", "label": "java.net.InetAddress", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * This class represents an Internet Protocol (IP) address.\\n *\\n * \u003cp\u003e An IP address is either a 32-bit or 128-bit unsigned number\\n * used by IP, a lower-level protocol on which protocols like UDP and\\n * TCP are built. The IP address architecture is defined by \u003ca\\n * href=\"http://www.ietf.org/rfc/rfc790.txt\"\u003e\u003ci\u003eRFC\u0026nbsp;790:\\n * Assigned Numbers\u003c/i\u003e\u003c/a\u003e, \u003ca\\n * href=\"http://www.ietf.org/rfc/rfc1918.txt\"\u003e \u003ci\u003eRFC\u0026nbsp;1918:\\n * Address Allocation for Private Internets\u003c/i\u003e\u003c/a\u003e, \u003ca\\n * href=\"http://www.ietf.org/rfc/rfc2365.txt\"\u003e\u003ci\u003eRFC\u0026nbsp;2365:\\n * Administratively Scoped IP Multicast\u003c/i\u003e\u003c/a\u003e, and \u003ca\\n * href=\"http://www.ietf.org/rfc/rfc2373.txt\"\u003e\u003ci\u003eRFC\u0026nbsp;2373: IP\\n * Version 6 Addressing Architecture\u003c/i\u003e\u003c/a\u003e. An instance of an\\n * InetAddress consists of an IP address and possibly its\\n * corresponding host name (depending on whether it is constructed\\n * with a host name or whether it has already done reverse host name\\n * resolution).\\n *\\n * \u003ch3\u003e Address types \u003c/h3\u003e\\n *\\n * \u003cblockquote\u003e\u003ctable cellspacing=2 summary=\"Description of unicast and multicast address types\"\u003e\\n *   \u003ctr\u003e\u003cth valign=top\u003e\u003ci\u003eunicast\u003c/i\u003e\u003c/th\u003e\\n *       \u003ctd\u003eAn identifier for a single interface. A packet sent to\\n *         a unicast address is delivered to the interface identified by\\n *         that address.\\n *\\n *         \u003cp\u003e The Unspecified Address -- Also called anylocal or wildcard\\n *         address. It must never be assigned to any node. It indicates the\\n *         absence of an address. One example of its use is as the target of\\n *         bind, which allows a server to accept a client connection on any\\n *         interface, in case the server host has multiple interfaces.\\n *\\n *         \u003cp\u003e The \u003ci\u003eunspecified\u003c/i\u003e address must not be used as\\n *         the destination address of an IP packet.\\n *\\n *         \u003cp\u003e The \u003ci\u003eLoopback\u003c/i\u003e Addresses -- This is the address\\n *         assigned to the loopback interface. Anything sent to this\\n *         IP address loops around and becomes IP input on the local\\n *         host. This address is often used when testing a\\n *         client.\u003c/td\u003e\u003c/tr\u003e\\n *   \u003ctr\u003e\u003cth valign=top\u003e\u003ci\u003emulticast\u003c/i\u003e\u003c/th\u003e\\n *       \u003ctd\u003eAn identifier for a set of interfaces (typically belonging\\n *         to different nodes). A packet sent to a multicast address is\\n *         delivered to all interfaces identified by that address.\u003c/td\u003e\u003c/tr\u003e\\n * \u003c/table\u003e\u003c/blockquote\u003e\\n *\\n * \u003ch4\u003e IP address scope \u003c/h4\u003e\\n *\\n * \u003cp\u003e \u003ci\u003eLink-local\u003c/i\u003e addresses are designed to be used for addressing\\n * on a single link for purposes such as auto-address configuration,\\n * neighbor discovery, or when no routers are present.\\n *\\n * \u003cp\u003e \u003ci\u003eSite-local\u003c/i\u003e addresses are designed to be used for addressing\\n * inside of a site without the need for a global prefix.\\n *\\n * \u003cp\u003e \u003ci\u003eGlobal\u003c/i\u003e addresses are unique across the internet.\\n *\\n * \u003ch4\u003e Textual representation of IP addresses \u003c/h4\u003e\\n *\\n * The textual representation of an IP address is address family specific.\\n *\\n * \u003cp\u003e\\n *\\n * For IPv4 address format, please refer to \u003cA\\n * HREF=\"Inet4Address.html#format\"\u003eInet4Address#format\u003c/A\u003e; For IPv6\\n * address format, please refer to \u003cA\\n * HREF=\"Inet6Address.html#format\"\u003eInet6Address#format\u003c/A\u003e.\\n *\\n * \u003cP\u003eThere is a \u003ca href=\"doc-files/net-properties.html#Ipv4IPv6\"\u003ecouple of\\n * System Properties\u003c/a\u003e affecting how IPv4 and IPv6 addresses are used.\u003c/P\u003e\\n *\\n * \u003ch4\u003e Host Name Resolution \u003c/h4\u003e\\n *\\n * Host name-to-IP address \u003ci\u003eresolution\u003c/i\u003e is accomplished through\\n * the use of a combination of local machine configuration information\\n * and network naming services such as the Domain Name System (DNS)\\n * and Network Information Service(NIS). The particular naming\\n * services(s) being used is by default the local machine configured\\n * one. For any host name, its corresponding IP address is returned.\\n *\\n * \u003cp\u003e \u003ci\u003eReverse name resolution\u003c/i\u003e means that for any IP address,\\n * the host associated with the IP address is returned.\\n *\\n * \u003cp\u003e The InetAddress class provides methods to resolve host names to\\n * their IP addresses and vice versa.\\n *\\n * \u003ch4\u003e InetAddress Caching \u003c/h4\u003e\\n *\\n * The InetAddress class has a cache to store successful as well as\\n * unsuccessful host name resolutions.\\n *\\n * \u003cp\u003e By default, when a security manager is installed, in order to\\n * protect against DNS spoofing attacks,\\n * the result of positive host name resolutions are\\n * cached forever. When a security manager is not installed, the default\\n * behavior is to cache entries for a finite (implementation dependent)\\n * period of time. The result of unsuccessful host\\n * name resolution is cached for a very short period of time (10\\n * seconds) to improve performance.\\n *\\n * \u003cp\u003e If the default behavior is not desired, then a Java security property\\n * can be set to a different Time-to-live (TTL) value for positive\\n * caching. Likewise, a system admin can configure a different\\n * negative caching TTL value when needed.\\n *\\n * \u003cp\u003e Two Java security properties control the TTL values used for\\n *  positive and negative host name resolution caching:\\n *\\n * \u003cblockquote\u003e\\n * \u003cdl\u003e\\n * \u003cdt\u003e\u003cb\u003enetworkaddress.cache.ttl\u003c/b\u003e\u003c/dt\u003e\\n * \u003cdd\u003eIndicates the caching policy for successful name lookups from\\n * the name service. The value is specified as as integer to indicate\\n * the number of seconds to cache the successful lookup. The default\\n * setting is to cache for an implementation specific period of time.\\n * \u003cp\u003e\\n * A value of -1 indicates \"cache forever\".\\n * \u003c/dd\u003e\\n * \u003cdt\u003e\u003cb\u003enetworkaddress.cache.negative.ttl\u003c/b\u003e (default: 10)\u003c/dt\u003e\\n * \u003cdd\u003eIndicates the caching policy for un-successful name lookups\\n * from the name service. The value is specified as as integer to\\n * indicate the number of seconds to cache the failure for\\n * un-successful lookups.\\n * \u003cp\u003e\\n * A value of 0 indicates \"never cache\".\\n * A value of -1 indicates \"cache forever\".\\n * \u003c/dd\u003e\\n * \u003c/dl\u003e\\n * \u003c/blockquote\u003e\\n *\\n * @author  Chris Warth\\n * @see     java.net.InetAddress#getByAddress(byte[])\\n * @see     java.net.InetAddress#getByAddress(java.lang.String, byte[])\\n * @see     java.net.InetAddress#getAllByName(java.lang.String)\\n * @see     java.net.InetAddress#getByName(java.lang.String)\\n * @see     java.net.InetAddress#getLocalHost()\\n * @since JDK1.0\\n \u0027}"}, {"color": "#97c2fc", "id": "private Object readResolve() throws ObjectStreamException", "label": "private Object readResolve() throws ObjectStreamException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Replaces the de-serialized object with an Inet4Address object.\\n     *\\n     * @return the alternate object to the de-serialized object.\\n     *\\n     * @throws ObjectStreamException if a new object replacing this\\n     * object could not be created\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isMulticastAddress()", "label": "public boolean isMulticastAddress()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Utility routine to check if the InetAddress is an\\n     * IP multicast address.\\n     * @return a {@code boolean} indicating if the InetAddress is\\n     * an IP multicast address\\n     * @since   JDK1.1\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isAnyLocalAddress()", "label": "public boolean isAnyLocalAddress()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Utility routine to check if the InetAddress in a wildcard address.\\n     * @return a {@code boolean} indicating if the Inetaddress is\\n     *         a wildcard address.\\n     * @since 1.4\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isLoopbackAddress()", "label": "public boolean isLoopbackAddress()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Utility routine to check if the InetAddress is a loopback address.\\n     *\\n     * @return a {@code boolean} indicating if the InetAddress is\\n     * a loopback address; or false otherwise.\\n     * @since 1.4\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isLinkLocalAddress()", "label": "public boolean isLinkLocalAddress()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Utility routine to check if the InetAddress is an link local address.\\n     *\\n     * @return a {@code boolean} indicating if the InetAddress is\\n     * a link local address; or false if address is not a link local unicast address.\\n     * @since 1.4\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isSiteLocalAddress()", "label": "public boolean isSiteLocalAddress()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Utility routine to check if the InetAddress is a site local address.\\n     *\\n     * @return a {@code boolean} indicating if the InetAddress is\\n     * a site local address; or false if address is not a site local unicast address.\\n     * @since 1.4\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isMCGlobal()", "label": "public boolean isMCGlobal()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Utility routine to check if the multicast address has global scope.\\n     *\\n     * @return a {@code boolean} indicating if the address has\\n     *         is a multicast address of global scope, false if it is not\\n     *         of global scope or it is not a multicast address\\n     * @since 1.4\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isMCNodeLocal()", "label": "public boolean isMCNodeLocal()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Utility routine to check if the multicast address has node scope.\\n     *\\n     * @return a {@code boolean} indicating if the address has\\n     *         is a multicast address of node-local scope, false if it is not\\n     *         of node-local scope or it is not a multicast address\\n     * @since 1.4\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isMCLinkLocal()", "label": "public boolean isMCLinkLocal()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Utility routine to check if the multicast address has link scope.\\n     *\\n     * @return a {@code boolean} indicating if the address has\\n     *         is a multicast address of link-local scope, false if it is not\\n     *         of link-local scope or it is not a multicast address\\n     * @since 1.4\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isMCSiteLocal()", "label": "public boolean isMCSiteLocal()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Utility routine to check if the multicast address has site scope.\\n     *\\n     * @return a {@code boolean} indicating if the address has\\n     *         is a multicast address of site-local scope, false if it is not\\n     *         of site-local scope or it is not a multicast address\\n     * @since 1.4\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isMCOrgLocal()", "label": "public boolean isMCOrgLocal()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Utility routine to check if the multicast address has organization scope.\\n     *\\n     * @return a {@code boolean} indicating if the address has\\n     *         is a multicast address of organization-local scope,\\n     *         false if it is not of organization-local scope\\n     *         or it is not a multicast address\\n     * @since 1.4\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isReachable(int timeout) throws IOException", "label": "public boolean isReachable(int timeout) throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Test whether that address is reachable. Best effort is made by the\\n     * implementation to try to reach the host, but firewalls and server\\n     * configuration may block requests resulting in a unreachable status\\n     * while some specific ports may be accessible.\\n     * \u003cp\u003e\\n     * Android implementation attempts ICMP ECHO REQUESTs first, on failure it\\n     * will fall back to TCP ECHO REQUESTs. Success on either protocol will\\n     * return true.\\n     * \u003cp\u003e\\n     * The timeout value, in milliseconds, indicates the maximum amount of time\\n     * the try should take. If the operation times out before getting an\\n     * answer, the host is deemed unreachable. A negative value will result\\n     * in an IllegalArgumentException being thrown.\\n     *\\n     * @param   timeout the time, in milliseconds, before the call aborts\\n     * @return a {@code boolean} indicating if the address is reachable.\\n     * @throws IOException if a network error occurs\\n     * @throws  IllegalArgumentException if {@code timeout} is negative.\\n     * @since 1.5\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isReachable(NetworkInterface netif, int ttl, int timeout) throws IOException", "label": "public boolean isReachable(NetworkInterface netif, int ttl, int timeout) throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Test whether that address is reachable. Best effort is made by the\\n     * implementation to try to reach the host, but firewalls and server\\n     * configuration may block requests resulting in a unreachable status\\n     * while some specific ports may be accessible.\\n     * \u003cp\u003e\\n     * Android implementation attempts ICMP ECHO REQUESTs first, on failure it\\n     * will fall back to TCP ECHO REQUESTs. Success on either protocol will\\n     * return true.\\n     * \u003cp\u003e\\n     * The {@code network interface} and {@code ttl} parameters\\n     * let the caller specify which network interface the test will go through\\n     * and the maximum number of hops the packets should go through.\\n     * A negative value for the {@code ttl} will result in an\\n     * IllegalArgumentException being thrown.\\n     * \u003cp\u003e\\n     * The timeout value, in milliseconds, indicates the maximum amount of time\\n     * the try should take. If the operation times out before getting an\\n     * answer, the host is deemed unreachable. A negative value will result\\n     * in an IllegalArgumentException being thrown.\\n     *\\n     * @param   netif   the NetworkInterface through which the\\n     *                    test will be done, or null for any interface\\n     * @param   ttl     the maximum numbers of hops to try or 0 for the\\n     *                  default\\n     * @param   timeout the time, in milliseconds, before the call aborts\\n     * @throws  IllegalArgumentException if either {@code timeout}\\n     *                          or {@code ttl} are negative.\\n     * @return a {@code boolean}indicating if the address is reachable.\\n     * @throws IOException if a network error occurs\\n     * @since 1.5\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String getHostName()", "label": "public String getHostName()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the host name for this IP address.\\n     *\\n     * \u003cp\u003eIf this InetAddress was created with a host name,\\n     * this host name will be remembered and returned;\\n     * otherwise, a reverse name lookup will be performed\\n     * and the result will be returned based on the system\\n     * configured name lookup service. If a lookup of the name service\\n     * is required, call\\n     * {@link #getCanonicalHostName() getCanonicalHostName}.\\n     *\\n     * \u003cp\u003eIf there is a security manager, its\\n     * {@code checkConnect} method is first called\\n     * with the hostname and {@code -1}\\n     * as its arguments to see if the operation is allowed.\\n     * If the operation is not allowed, it will return\\n     * the textual representation of the IP address.\\n     *\\n     * @return  the host name for this IP address, or if the operation\\n     *    is not allowed by the security check, the textual\\n     *    representation of the IP address.\\n     *\\n     * @see InetAddress#getCanonicalHostName\\n     * @see SecurityManager#checkConnect\\n     \u0027}"}, {"color": "#97c2fc", "id": "getCanonicalHostName()", "label": "getCanonicalHostName()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public String getCanonicalHostName()", "label": "public String getCanonicalHostName()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the fully qualified domain name for this IP address.\\n     * Best effort method, meaning we may not be able to return\\n     * the FQDN depending on the underlying system configuration.\\n     *\\n     * \u003cp\u003eIf there is a security manager, this method first\\n     * calls its {@code checkConnect} method\\n     * with the hostname and {@code -1}\\n     * as its arguments to see if the calling code is allowed to know\\n     * the hostname for this IP address, i.e., to connect to the host.\\n     * If the operation is not allowed, it will return\\n     * the textual representation of the IP address.\\n     *\\n     * @return  the fully qualified domain name for this IP address,\\n     *    or if the operation is not allowed by the security check,\\n     *    the textual representation of the IP address.\\n     *\\n     * @see SecurityManager#checkConnect\\n     *\\n     * @since 1.4\\n     \u0027}"}, {"color": "#97c2fc", "id": "private static String getHostFromNameService(InetAddress addr)", "label": "private static String getHostFromNameService(InetAddress addr)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the hostname for this address.\\n     *\\n     * \u003cp\u003eIf there is a security manager, this method first\\n     * calls its {@code checkConnect} method\\n     * with the hostname and {@code -1}\\n     * as its arguments to see if the calling code is allowed to know\\n     * the hostname for this IP address, i.e., to connect to the host.\\n     * If the operation is not allowed, it will return\\n     * the textual representation of the IP address.\\n     *\\n     * @return  the host name for this IP address, or if the operation\\n     *    is not allowed by the security check, the textual\\n     *    representation of the IP address.\\n     *\\n     * @see SecurityManager#checkConnect\\n     \u0027}"}, {"color": "#97c2fc", "id": "public byte[] getAddress()", "label": "public byte[] getAddress()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the raw IP address of this {@code InetAddress}\\n     * object. The result is in network byte order: the highest order\\n     * byte of the address is in {@code getAddress()[0]}.\\n     *\\n     * @return  the raw IP address of this object.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String getHostAddress()", "label": "public String getHostAddress()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the IP address string in textual presentation.\\n     *\\n     * @return  the raw IP address in a string format.\\n     * @since   JDK1.0.2\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int hashCode()", "label": "public int hashCode()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a hashcode for this IP address.\\n     *\\n     * @return  a hash code value for this IP address.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean equals(Object obj)", "label": "public boolean equals(Object obj)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares this object against the specified object.\\n     * The result is {@code true} if and only if the argument is\\n     * not {@code null} and it represents the same IP address as\\n     * this object.\\n     * \u003cp\u003e\\n     * Two instances of {@code InetAddress} repr ong and IPv6 byte array\\n     * must be 16 bytes long\\n     *\\n     * @param host the specified host\\n     * @param addr the raw IP address in network byte order\\n     * @return  an InetAddress object created from the raw IP address.\\n     * @exception  UnknownHostException  if IP address is of illegal length\\n     * @since 1.4\\n     \u0027}"}, {"color": "#97c2fc", "id": "private static InetAddress getByAddress(String host, byte[] addr, int scopeId) throws UnknownHostException", "label": "private static InetAddress getByAddress(String host, byte[] addr, int scopeId) throws UnknownHostException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 Do not delete. Called from native code.\u0027}"}, {"color": "#97c2fc", "id": "public static InetAddress getByName(String host) throws UnknownHostException", "label": "public static InetAddress getByName(String host) throws UnknownHostException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Determines the IP address of a host, given the host\\\u0027s name.\\n     *\\n     * \u003cp\u003e The host name can either be a machine name, such as\\n     * \"{@code java.sun.com}\", or a textual representation of its\\n     * IP address. If a literal IP address is supplied, only the\\n     * validity of the address format is checked.\\n     *\\n     * \u003cp\u003e For {@code host} specified in literal IPv6 address,\\n     * either the form defined in RFC 2732 or the literal IPv6 address\\n     * format defined in RFC 2373 is accepted. IPv6 scoped addresses are also\\n     * supported. See \u003ca href=\"Inet6Address.html#scoped\"\u003ehere\u003c/a\u003e for a description of IPv6\\n     * scoped addresses.\\n     *\\n     * \u003cp\u003e If the host is {@code null} then an {@code InetAddress}\\n     * representing an address of the loopback interface is returned.\\n     * See \u003ca href=\"http://www.ietf.org/rfc/rfc3330.txt\"\u0 s of the loopback interface is returned.\\n     * See \u003ca href=\"http://www.ietf.org/rfc/rfc3330.txt\"\u003eRFC\u0026nbsp;3330\u003c/a\u003e\\n     * section\u0026nbsp;2 and \u003ca href=\"http://www.ietf.org/rfc/rfc2373.txt\"\u003eRFC\u0026nbsp;2373\u003c/a\u003e\\n     * section\u0026nbsp;2.5.3. \u003c/p\u003e\\n     *\\n     * \u003cp\u003e If there is a security manager and {@code host} is not\\n     * null and {@code host.length() } is not equal to zero, the\\n     * security manager\\\u0027s\\n     * {@code checkConnect} method is called\\n     * with the hostname and {@code -1}\\n     * as its arguments to see if the operation is allowed.\\n     *\\n     * @param      host   the name of the host, or {@code null}.\\n     * @return     an array of all the IP addresses for a given host name.\\n     *\\n     * @exception  UnknownHostException  if no IP address for the\\n     *               {@code host} could be found, or if a scope_id was specified\\n     *               for a global IPv6 address.\\n     * @exception  SecurityException  if a security manager exists and its\\n     *               {@code checkConnect} method doesn\\\u0027t allow the operation.\\n     *\\n     * @see SecurityManager#checkConnect\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static InetAddress getLoopbackAddress()", "label": "public static InetAddress getLoopbackAddress()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the loopback address.\\n     * \u003cp\u003e\\n     * The InetAddress returned will represent the IPv4\\n     * loopback address, 127.0.0.1, or the IPv6 loopback\\n     * address, ::1. The IPv4 loopback address returned\\n     * is only one of many in the form 127.*.*.*\\n     *\\n     * @return  the InetAddress loopback instance.\\n     * @since 1.7\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static InetAddress getByAddress(byte[] addr) throws UnknownHostException", "label": "public s
