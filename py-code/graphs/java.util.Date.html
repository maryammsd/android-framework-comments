        <style type="text/css">

                 background-color: #ffffff;

          div.popup {
                 position:absolute;

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',

              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "java.util.Date", "label": "java.util.Date", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * The class {@code Date} represents a specific instant\\n * in time, with millisecond precision.\\n * \u003cp\u003e\\n * Prior to JDK\u0026nbsp;1.1, the class {@code Date} had two additional\\n * functions.  It allowed the interpretation of dates as year, month, day, hour,\\n * minute, and second values.  It also allowed the formatting and parsing\\n * of date strings.  Unfortunately, the API for these functions was not\\n * amenable to internationalization.  As of JDK\u0026nbsp;1.1, the\\n * {@code Calendar} class should be used to convert between dates and time\\n * fields and the {@code DateFormat} class should be used to format and\\n * parse date strings.\\n * The corresponding methods in {@code Date} are deprecated.\\n * \u003cp\u003e\\n * Although the {@code Date} class is intended to reflect\\n * coordinated universal time (UTC), it may not do so exactly,\\n * depending on the host environment of the Java Virtual Machine.\\n * Nearly all modern operating systems assume that 1\u0026nbsp;day\u0026nbsp;=\\n * 24\u0026nbsp;\u0026times;\u0026nbsp;60\u0026nbsp;\u0026times;\u0026nbsp;60\u0026nbsp;= 86400 seconds\\n * in all cases. In UTC, however, about once every year or two there\\n * is an extra second, called a \"leap second.\" The leap\\n * second is always added as the last second of the day, and always\\n * on December 31 or June 30. For example, the last minute of the\\n * year 1995 was 61 seconds long, thanks to an added leap second.\\n * Most computer clocks are not accurate enough to be able to reflect\\n * the leap-second distinction.\\n * \u003cp\u003e\\n * Some computer standards are defined in terms of Greenwich mean\\n * time (GMT), which is equivalent to universal time (UT).  GMT is\\n * the \"civil\" name for the standard; UT is the\\n * \"scientific\" name for the same standard. The\\n * distinction between UTC and UT is that UTC is based on an atomic\\n * clock and UT is based on astronomical observations, which for all\\n * practical purposes is an invisibly fine hair to split. Because the\\n * earth\\\u0027s rotation is not uniform (it slows down and speeds up\\n * in complicated ways), UT does not always flow uniformly. Leap\\n * seconds are introduced as needed into UTC so as to keep UTC within\\n * 0.9 seconds of UT1, which is a version of UT with certain\\n * corrections applied. There are other time and date systems as\\n * well; for example, the time scale used by the satellite-based\\n * global positioning system (GPS) is synchronized to UTC but is\\n * \u003ci\u003enot\u003c/i\u003e adjusted for leap seconds. An interesting source of\\n * further information is the United States Naval Observatory (USNO):\\n * \u003cblockquote\u003e\u003cpre\u003e\\n *     \u003ca href=\"https://www.usno.navy.mil/USNO\"\u003ehttps://www.usno.navy.mil/USNO\u003c/a\u003e\\n * \u003c/pre\u003e\u003c/blockquote\u003e\\n * \u003cp\u003e\\n * and the material regarding \"Systems of Time\" at:\\n * \u003cblockquote\u003e\u003cpre\u003e\\n *     \u003ca href=\"https://www.usno.navy.mil/USNO/time/master-clock/systems-of-time\"\u003ehttps://www.usno.navy.mil/USNO/time/master-clock/systems-of-time\u003c/a\u003e\\n * \u003c/pre\u003e\u003c/blockquote\u003e\\n * \u003cp\u003e\\n * which has descriptions of various different time systems including\\n * UT, UT1, and UTC.\\n * \u003cp\u003e\\n * In all methods of class {@code Date} that accept or return\\n * year, month, date, hours, minutes, and seconds values, the\\n * following representations are used:\\n * \u003cul\u003e\\n * \u003cli\u003eA year \u003ci\u003ey\u003c/i\u003e is represented by the integer\\n *     \u003ci\u003ey\u003c/i\u003e\u0026nbsp;{@code - 1900}.\\n * \u003cli\u003eA month is represented by an integer from 0 to 11; 0 is January,\\n *     1 is February, and so forth; thus 11 is December.\\n * \u003cli\u003eA date (day of month) is represented by an integer from 1 to 31\\n *     in the usual manner.\\n * \u003cli\u003eAn hour is represented by an integer from 0 to 23. Thus, the hour\\n *     from midnight to 1 a.m. is hour 0, and the hour from noon to 1\\n *     p.m. is hour 12.\\n * \u003cli\u003eA minute is represented by an integer from 0 to 59 in the usual manner.\\n * \u003cli\u003eA second is represented by an integer from 0 to 61; the values 60 and\\n *     61 occur only for leap seconds and even then only in Java\\n *     implementations that actually track leap seconds correctly. Because\\n *     of the manner in which leap seconds are currently introduced, it is\\n *     extremely unlikely that two leap seconds will occur in the same\\n *     minute, but this specification follows the date and time conventions\\n *     for ISO C.\\n * \u003c/ul\u003e\\n * \u003cp\u003e\\n * In all cases, arguments given to methods for these purposes need\\n * not fall within the indicated ranges; for example, a date may be\\n * specified as January 32 and is interpreted as meaning February 1.\\n *\\n * @author  James Gosling\\n * @author  Arthur van Hoff\\n * @author  Alan Liu\\n * @see     java.text.DateFormat\\n * @see     java.util.Calendar\\n * @see     java.util.TimeZone\\n * @since   1.0\\n \u0027}"}, {"color": "#97c2fc", "id": "public Object clone()", "label": "public Object clone()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Return a copy of this object.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public long getTime()", "label": "public long getTime()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the number of milliseconds since January 1, 1970, 00:00:00 GMT\\n     * represented by this {@code Date} object.\\n     *\\n     * @return  the number of milliseconds since January 1, 1970, 00:00:00 GMT\\n     *          represented by this date.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void setTime(long time)", "label": "public void setTime(long time)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Sets this {@code Date} object to represent a point in time that is\\n     * {@code time} milliseconds after January 1, 1970 00:00:00 GMT.\\n     *\\n     * @param   time   the number of milliseconds.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean before(Date when)", "label": "public boolean before(Date when)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tests if this date is before the specified date.\\n     *\\n     * @param   when   a date.\\n     * @return  {@code true} if and only if the instant of time\\n     *            represented by this {@code Date} object is strictly\\n     *            earlier than the instant represented by {@code when};\\n     *          {@code false} otherwise.\\n     * @throws    NullPointerException if {@code when} is null.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean after(Date when)", "label": "public boolean after(Date when)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tests if this date is after the specified date.\\n     *\\n     * @param   when   a date.\\n     * @return  {@code true} if and only if the instant represented\\n     *          by this {@code Date} object is strictly later than the\\n     *          instant represented by {@code when};\\n     *          {@code false} otherwise.\\n     * @throws    NullPointerException if {@code when} is null.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean equals(Object obj)", "label": "public boolean equals(Object obj)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares two dates for equality.\\n     * The result is {@code true} if and only if the argument is\\n     * not {@code null} and is a {@code Date} object that\\n     * represents the same point in time, to the millisecond, as this object.\\n     * \u003cp\u003e\\n     * Thus, two {@code Date} objects are equal if and only if the\\n     * {@code getTime} method returns the same {@code long}\\n     * value for both.\\n     *\\n     * @param   obj   the object to compare with.\\n     * @return  {@code true} if the objects are the same;\\n     *          {@code false} otherwise.\\n     * @see     java.util.Date#getTime()\\n     \u0027}"}, {"color": "#97c2fc", "id": " static final long getMillisOf(Date date)", "label": " static final long getMillisOf(Date date)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the millisecond value of this {@code Date} object\\n     * without affecting its internal state.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int compareTo(Date anotherDate)", "label": "public int compareTo(Date anotherDate)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares two Dates for ordering.\\n     *\\n     * @param   anotherDate   the {@code Date} to be compared.\\n     * @return  the value {@code 0} if the argument Date is equal to\\n     *          this Date; a value less than {@code 0} if this Date\\n     *          is before the Date argument; and a value greater than\\n     *      {@code 0} if this Date is after the Date argument.\\n     * @since   1.2\\n     * @throws    NullPointerException if {@code anotherDate} is null.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int hashCode()", "label": "public int hashCode()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a hash code value for this object. The result is the\\n     * exclusive OR of the two halves of the primitive {@code long}\\n     * value returned by the {@link Date#getTime}\\n     * method. That is, the hash code is the value of the expression:\\n     * \u003cblockquote\u003e\u003cpre\u003e{@code\\n     * (int)(this.getTime()^(this.getTime() \u003e\u003e\u003e 32))\\n     * }\u003c/pre\u003e\u003c/blockquote\u003e\\n     *\\n     * @return  a hash code value for this object.\\n     \u0027}"}, {"color": "#97c2fc", "id": "getTime", "label": "getTime", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public String toString()", "label": "public String toString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Converts this {@code Date} object to a {@code String}\\n     * of the form:\\n     * \u003cblockquote\u003e\u003cpre\u003e\\n     * dow mon dd hh:mm:ss zzz yyyy\u003c/pre\u003e\u003c/blockquote\u003e\\n     * where:\u003cul\u003e\\n     * \u003cli\u003e{@code dow} is the day of the week ({@code Sun, Mon, Tue, Wed,\\n     *     Thu, Fri, Sat}).\\n     * \u003cli\u003e{@code mon} is the month ({@code Jan, Feb, Mar, Apr, May, Jun,\\n     *     Jul, Aug, Sep, Oct, Nov, Dec}).\\n     * \u003cli\u003e{@code dd} is the day of the month ({@code 01} through\\n     *     {@code 31}), as two decimal digits.\\n     * \u003cli\u003e{@code hh} is the hour of the day ({@code 00} through\\n     *     {@code 23}), as two decimal digits.\\n     * \u003cli\u003e{@code mm} is the minute within the hour ({@code 00} through\\n     *     {@code 59}), as two decimal digits.\\n     * \u003cli\u003e{@code ss} is the second within the minute ({@code 00} through\\n     *     {@code 61}, as two decimal digits.\\n     * \u003cli\u003e{@code zzz} is the time zone (and may reflect daylight saving\\n     *     time). Standard time zone abbreviations include those\\n     *     recognized by the method {@code parse}. If time zone\\n     *     information is not available, then {@code zzz} is empty -\\n     *     that is, it consists of no characters at all.\\n     * \u003cli\u003e{@code yyyy} is the year, as four decimal digits.\\n     * \u003c/ul\u003e\\n     *\\n     * @return  a string representation of this date.\\n     * @see     java.util.Date#toLocaleString()\\n     * @see     java.util.Date#toGMTString()\\n     \u0027}"}, {"color": "#97c2fc", "id": "private static final StringBuilder convertToAbbr(StringBuilder sb, String name)", "label": "private static final StringBuilder convertToAbbr(StringBuilder sb, String name)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Converts the given name to its 3-letter abbreviation (e.g.,\\n     * \"monday\" -\u003e \"Mon\") and stored the abbreviation in the given\\n     * {@code StringBuilder}.\\n     \u0027}"}, {"color": "#97c2fc", "id": "private final BaseCalendar.Date normalize(BaseCalendar.Date date)", "label": "private final BaseCalendar.Date normalize(BaseCalendar.Date date)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 fastTime and the returned data are in sync upon return.\u0027}"}, {"color": "#97c2fc", "id": "private static final BaseCalendar getCalendarSystem(int year)", "label": "private static final BaseCalendar getCalendarSystem(int year)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the Gregorian or Julian calendar system to use with the\\n     * given date. Use Gregorian from October 15, 1582.\\n     *\\n     * @param year normalized calendar year (not -1900)\\n     * @return the CalendarSystem to use for the specified date\\n     \u0027}"}, {"color": "#97c2fc", "id": "private void writeObject(ObjectOutputStream s) throws IOException", "label": "private void writeObject(ObjectOutputStream s) throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Save the state of this object to a stream (i.e., serialize it).\\n     *\\n     * @serialData The value returned by {@code getTime()}\\n     *             is emitted (long).  This represents the offset from\\n     *             January 1, 1970, 00:00:00 GMT in milliseconds.\\n     \u0027}"}, {"color": "#97c2fc", "id": "private void readObject(ObjectInputStream s) throws IOException, ClassNotFoundException", "label": "private void readObject(ObjectInputStream s) throws IOException, ClassNotFoundException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Reconstitute this object from a stream (i.e., deserialize it).\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static Date from(Instant instant)", "label": "public static Date from(Instant instant)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Obtains an instance of {@code Date} from an {@code Instant} object.\\n     * \u003cp\u003e\\n     * {@code Instant} uses a precision of nanoseconds, whereas {@code Date}\\n     * uses a precision of milliseconds.  The conversion will truncate any\\n     * excess precision information as though the amount in nanoseconds was\\n     * subject to integer division by one million.\\n     * \u003cp\u003e\\n     * {@code Instant} can store points on the time-line further in the future\\n     * and further in the past than {@code Date}. In this scenario, this method\\n     * will throw an exception.\\n     *\\n     * @param instant  the instant to convert\\n     * @return a {@code Date} representing the same point on the time-line as\\n     *  the provided instant\\n     * @throws    NullPointerException if {@code instant} is null.\\n     * @throws    IllegalArgumentException if the instant is too large to\\n     *  represent as a {@code Date}\\n     * @since 1.8\\n     \u0027}"}, {"color": "#97c2fc", "id": "public Instant toInstant()", "label": "public Instant toInstant()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Converts this {@code Date} object to an {@code Instant}.\\n     * \u003cp\u003e\\n     * The conversion creates an {@code Instant} that represents the same\\n     * point on the time-line as this {@code Date}.\\n     *\\n     * @return an instant representing the same point on the time-line as\\n     *  this {@code Date} object\\n     * @since 1.8\\n     \u0027}"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Object clone()"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public long getTime()"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void setTime(long time)"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public boolean before(Date when)"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public boolean after(Date when)"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public boolean equals(Object obj)"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " static final long getMillisOf(Date date)"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public int compareTo(Date anotherDate)"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public int hashCode()"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public String toString()"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "private static final StringBuilder convertToAbbr(StringBuilder sb, String name)"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "private final BaseCalendar.Date normalize(BaseCalendar.Date date)"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "private static final BaseCalendar getCalendarSystem(int year)"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "private void writeObject(ObjectOutputStream s) throws IOException"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "private void readObject(ObjectInputStream s) throws IOException, ClassNotFoundException"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static Date from(Instant instant)"}, {"arrows": "to", "from": "java.util.Date", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Instant toInstant()"}, {"arrows": "to", "from": "public int hashCode()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "getTime"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
