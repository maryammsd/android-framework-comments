              function drawGraph() {

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "android.view.SurfaceHolder", "label": "android.view.SurfaceHolder", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * Abstract interface to someone holding a display surface.  Allows you to\\n * control the surface size and format, edit the pixels in the surface, and\\n * monitor changes to the surface.  This interface is typically available\\n * through the {@link SurfaceView} class.\\n *\\n * \u003cp\u003eWhen using this interface from a thread other than the one running\\n * its {@link SurfaceView}, you will want to carefully read the\\n * methods\\n * {@link #lockCanvas} and {@link Callback#surfaceCreated Callback.surfaceCreated()}.\\n \u0027}"}, {"color": "#97c2fc", "id": "public void addCallback(Callback callback)", "label": "public void addCallback(Callback callback)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Add a Callback interface for this holder.  There can several Callback\\n     * interfaces associated with a holder.\\n     *\\n     * @param callback The new Callback interface.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void removeCallback(Callback callback)", "label": "public void removeCallback(Callback callback)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Removes a previously added Callback interface from this holder.\\n     *\\n     * @param callback The Callback interface to remove.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isCreating()", "label": "public boolean isCreating()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Use this method to find out if the surface is in the process of being\\n     * created from Callback methods. This is intended to be used with\\n     * {@link Callback#surfaceChanged}.\\n     *\\n     * @return true if the surface is in the process of being created.\\n     \u0027}"}, {"color": "#97c2fc", "id": "surfaceChanged", "label": "surfaceChanged", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public void setFixedSize(int width, int height)", "label": "public void setFixedSize(int width, int height)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Make the surface a fixed size.  It will never change from this size.\\n     * When working with a {@link SurfaceView}, this must be called from the\\n     * same thread running the SurfaceView\u0027s window.\\n     *\\n     * @param width The surface\u0027s width.\\n     * @param height The surface\u0027s height.\\n     \"}"}, {"color": "#97c2fc", "id": "SurfaceView", "label": "SurfaceView", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "public void setSizeFromLayout()", "label": "public void setSizeFromLayout()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Allow the surface to resized based on layout of its container (this is\\n     * the default).  When this is enabled, you should monitor\\n     * {@link Callback#surfaceChanged} for changes to the size of the surface.\\n     * When working with a {@link SurfaceView}, this must be called from the\\n     * same thread running the SurfaceView\u0027s window.\\n     \"}"}, {"color": "#97c2fc", "id": "public void setFormat(int format)", "label": "public void setFormat(int format)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Set the desired PixelFormat of the surface.  The default is OPAQUE.\\n     * When working with a {@link SurfaceView}, this must be called from the\\n     * same thread running the SurfaceView\u0027s window.\\n     *\\n     * @param format A constant from PixelFormat.\\n     *\\n     * @see android.graphics.PixelFormat\\n     \"}"}, {"color": "#97c2fc", "id": "public void setKeepScreenOn(boolean screenOn)", "label": "public void setKeepScreenOn(boolean screenOn)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Enable or disable option to keep the screen turned on while this\\n     * surface is displayed.  The default is false, allowing it to turn off.\\n     * This is safe to call from any thread.\\n     *\\n     * @param screenOn Set to true to force the screen to stay on, false\\n     * to allow it to turn off.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public Canvas lockCanvas()", "label": "public Canvas lockCanvas()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Start editing the pixels in the surface.  The returned Canvas can be used\\n     * to draw into the surface\u0027s bitmap.  A null is returned if the surface has\\n     * not been created or otherwise cannot be edited.  You will usually need\\n     * to implement {@link Callback#surfaceCreated Callback.surfaceCreated}\\n     * to find out when the Surface is available for use.\\n     *\\n     * \u003cp\u003eThe content of the Surface is never preserved between unlockCanvas() and\\n     * lockCanvas(), for this reason, every pixel within the Surface area\\n     * must be written. The only exception to this rule is when a dirty\\n     * rectangle is specified, in which case, non-dirty pixels will be\\n     * preserved.\\n     *\\n     * \u003cp\u003eIf you call this repeatedly when the Surface is not ready (before\\n     * {@link Callback#surfaceCreated Callback.surfaceCreated} or after\\n     * {@link Callback#surfaceDestroyed Callback.surfaceDestroyed}), your calls\\n     * will be throttled to a slow rate in order to avoid consuming CPU.\\n     *\\n     * \u003cp\u003eIf null is not returned, this function internally holds a lock until\\n     * the corresponding {@link #unlockCanvasAndPost} call, preventing\\n     * {@link SurfaceView} from creating, destroying, or modifying the surface\\n     * while it is being drawn.  This can be more convenient than accessing\\n     * the Surface directly, as you do not need to do special synchronization\\n     * with a drawing thread in {@link Callback#surfaceDestroyed\\n     * Callback.surfaceDestroyed}.\\n     *\\n     * @return Canvas Use to draw into the surface.\\n     \"}"}, {"color": "#97c2fc", "id": "surfaceDestroyed", "label": "surfaceDestroyed", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "surfaceCreated", "label": "surfaceCreated", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "surfaceDestroyedCallback.surfaceDestroyed", "label": "surfaceDestroyedCallback.surfaceDestroyed", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "unlockCanvasAndPost", "label": "unlockCanvasAndPost", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public Canvas lockCanvas(Rect dirty)", "label": "public Canvas lockCanvas(Rect dirty)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Just like {@link #lockCanvas()} but allows specification of a dirty rectangle.\\n     * Every\\n     * pixel within that rectangle must be written; however pixels outside\\n     * the dirty rectangle will be preserved by the next call to lockCanvas().\\n     *\\n     * @see android.view.SurfaceHolder#lockCanvas\\n     *\\n     * @param dirty Area of the Surface that will be modified.\\n     * @return Canvas Use to draw into the surface.\\n     \u0027}"}, {"color": "#97c2fc", "id": "lockCanvas()", "label": "lockCanvas()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": " Canvas lockHardwareCanvas()", "label": " Canvas lockHardwareCanvas()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * \u003cp\u003eJust like {@link #lockCanvas()} but the returned canvas is hardware-accelerated.\\n     *\\n     * \u003cp\u003eSee the \u003ca href=\"{@docRoot}guide/topics/graphics/hardware-accel.html#unsupported\"\u003e\\n     * unsupported drawing operations\u003c/a\u003e for a list of what is and isn\\\u0027t\\n     * supported in a hardware-accelerated canvas.\\n     *\\n     * @return Canvas Use to draw into the surface.\\n     * @throws IllegalStateException If the canvas cannot be locked.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void unlockCanvasAndPost(Canvas canvas)", "label": "public void unlockCanvasAndPost(Canvas canvas)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Finish editing pixels in the surface.  After this call, the surface\u0027s\\n     * current pixels will be shown on the screen, but its content is lost,\\n     * in particular there is no guarantee that the content of the Surface\\n     * will remain unchanged when lockCanvas() is called again.\\n     *\\n     * @see #lockCanvas()\\n     *\\n     * @param canvas The Canvas previously returned by lockCanvas().\\n     \"}"}, {"color": "#97c2fc", "id": "public Rect getSurfaceFrame()", "label": "public Rect getSurfaceFrame()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Retrieve the current size of the surface.  Note: do not modify the\\n     * returned Rect.  This is only safe to call from the thread of\\n     * {@link SurfaceView}\u0027s window, or while inside of\\n     * {@link #lockCanvas()}.\\n     *\\n     * @return Rect The surface\u0027s dimensions.  The left and top are always 0.\\n     \"}"}, {"color": "#97c2fc", "id": "public Surface getSurface()", "label": "public Surface getSurface()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Direct access to the surface object.  The Surface may not always be\\n     * available -- for example when using a {@link SurfaceView} the holder\u0027s\\n     * Surface is not created until the view has been attached to the window\\n     * manager and performed a layout in order to determine the dimensions\\n     * and screen position of the Surface.    You will thus usually need\\n     * to implement {@link Callback#surfaceCreated Callback.surfaceCreated}\\n     * to find out when the Surface is available for use.\\n     *\\n     * \u003cp\u003eNote that if you directly access the Surface from another thread,\\n     * it is critical that you correctly implement\\n     * {@link Callback#surfaceCreated Callback.surfaceCreated} and\\n     * {@link Callback#surfaceDestroyed Callback.surfaceDestroyed} to ensure\\n     * that thread only accesses the Surface while it is valid, and that the\\n     * Surface does not get destroyed while the thread is using it.\\n     *\\n     * \u003cp\u003eThis method is intended to be used by frameworks which often need\\n     * direct access to the Surface object (usually to pass it to native code).\\n     *\\n     * @return Surface The surface.\\n     \"}"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "android.view.SurfaceHolder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void addCallback(Callback callback)"}, {"arrows": "to", "from": "android.view.SurfaceHolder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void removeCallback(Callback callback)"}, {"arrows": "to", "from": "android.view.SurfaceHolder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public boolean isCreating()"}, {"arrows": "to", "from": "android.view.SurfaceHolder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void setFixedSize(int width, int height)"}, {"arrows": "to", "from": "android.view.SurfaceHolder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void setSizeFromLayout()"}, {"arrows": "to", "from": "android.view.SurfaceHolder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void setFormat(int format)"}, {"arrows": "to", "from": "android.view.SurfaceHolder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void setKeepScreenOn(boolean screenOn)"}, {"arrows": "to", "from": "android.view.SurfaceHolder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Canvas lockCanvas()"}, {"arrows": "to", "from": "android.view.SurfaceHolder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Canvas lockCanvas(Rect dirty)"}, {"arrows": "to", "from": "android.view.SurfaceHolder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " Canvas lockHardwareCanvas()"}, {"arrows": "to", "from": "android.view.SurfaceHolder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void unlockCanvasAndPost(Canvas canvas)"}, {"arrows": "to", "from": "android.view.SurfaceHolder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Rect getSurfaceFrame()"}, {"arrows": "to", "from": "android.view.SurfaceHolder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Surface getSurface()"}, {"arrows": "to", "from": "public boolean isCreating()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "surfaceChanged"}, {"arrows": "to", "from": "public void setFixedSize(int width, int height)", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "SurfaceView"}, {"arrows": "to", "from": "public void setSizeFromLayout()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "surfaceChanged"}, {"arrows": "to", "from": "public void setSizeFromLayout()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "SurfaceView"}, {"arrows": "to", "from": "public void setFormat(int format)", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "SurfaceView"}, {"arrows": "to", "from": "public Canvas lockCanvas()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "surfaceDestroyed"}, {"arrows": "to", "from": "public Canvas lockCanvas()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "surfaceCreated"}, {"arrows": "to", "from": "public Canvas lockCanvas()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "surfaceDestroyedCallback.surfaceDestroyed"}, {"arrows": "to", "from": "public Canvas lockCanvas()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "unlockCanvasAndPost"}, {"arrows": "to", "from": "public Canvas lockCanvas()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "SurfaceView"}, {"arrows": "to", "from": "public Canvas lockCanvas(Rect dirty)", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "lockCanvas()"}, {"arrows": "to", "from": " Canvas lockHardwareCanvas()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "lockCanvas()"}, {"arrows": "to", "from": "public Rect getSurfaceFrame()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "lockCanvas()"}, {"arrows": "to", "from": "public Rect getSurfaceFrame()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "SurfaceView"}, {"arrows": "to", "from": "public Surface getSurface()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "surfaceDestroyed"}, {"arrows": "to", "from": "public Surface getSurface()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "surfaceCreated"}, {"arrows": "to", "from": "public Surface getSurface()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "SurfaceView"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
        </script>
