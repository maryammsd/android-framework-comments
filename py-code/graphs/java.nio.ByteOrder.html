        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "java.nio.ByteOrder", "label": "java.nio.ByteOrder", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\u0027}"}, {"color": "#97c2fc", "id": "public static ByteOrder nativeOrder()", "label": "public static ByteOrder nativeOrder()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Retrieves the native byte order of the underlying platform.\\n     *\\n     * \u003cp\u003e This method is defined so that performance-sensitive Java code can\\n     * allocate direct buffers with the same byte order as the hardware.\\n     * Native code libraries are often more efficient when such buffers are\\n     * used.  \u003c/p\u003e\\n     *\\n     * @return  The native byte order of the hardware upon which this Java\\n     *          virtual machine is running\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String toString()", "label": "public String toString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Constructs a string describing this object.\\n     *\\n     * \u003cp\u003e This method returns the string\\n     * {@code \"BIG_ENDIAN\"} for {@link #BIG_ENDIAN} and\\n     * {@code \"LITTLE_ENDIAN\"} for {@link #LITTLE_ENDIAN}.\\n     *\\n     * @return  The specified string\\n     \u0027}"}, {"color": "#97c2fc", "id": "LITTLE_ENDIAN", "label": "LITTLE_ENDIAN", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "BIG_ENDIAN", "label": "BIG_ENDIAN", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "java.nio.ByteOrder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static ByteOrder nativeOrder()"}, {"arrows": "to", "from": "java.nio.ByteOrder", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public String toString()"}, {"arrows": "to", "from": "public String toString()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "LITTLE_ENDIAN"}, {"arrows": "to", "from": "public String toString()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "BIG_ENDIAN"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
