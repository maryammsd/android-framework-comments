              // initialize global variables.

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "java.util.Map", "label": "java.util.Map", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * An object that maps keys to values.  A map cannot contain duplicate keys;\\n * each key can map to at most one value.\\n *\\n * \u003cp\u003eThis interface takes the place of the {@code Dictionary} class, which\\n * was a totally abstract class rather than an interface.\\n *\\n * \u003cp\u003eThe {@code Map} interface provides three \u003ci\u003ecollection views\u003c/i\u003e, which\\n * allow a map\\\u0027s contents to be viewed as a set of keys, collection of values,\\n * or set of key-value mappings.  The \u003ci\u003eorder\u003c/i\u003e of a map is defined as\\n * the order in which the iterators on the map\\\u0027s collection views return their\\n * elements.  Some map implementations, like the {@code TreeMap} class, make\\n * specific guarantees as to their order; others, like the {@code HashMap}\\n * class, do not.\\n *\\n * \u003cp\u003eNote: great care must be exercised if mutable objects are used as map\\n * keys.  The behavior of a map is not specified if the value of an object is\\n * changed in a manner that affects {@code equals} comparisons while the\\n * object is a key in the map.  A special case of this prohibition is that it\\n * is not permissible for a map to contain itself as a key.  While it is\\n * permissible for a map to contain itself as a value, extreme caution is\\n * advised: the {@code equals} and {@code hashCode} methods are no longer\\n * well defined on such a map.\\n *\\n * \u003cp\u003eAll general-purpose map implementation classes should provide two\\n * \"standard\" constructors: a void (no arguments) constructor which creates an\\n * empty map, and a constructor with a single argument of type {@code Map},\\n * which creates a new map with the same key-value mappings as its argument.\\n * In effect, the latter constructor allows the user to copy any map,\\n * producing an equivalent map of the desired class.  There is no way to\\n * enforce this recommendation (as interfaces cannot contain constructors) but\\n * all of the general-purpose map implementations in the JDK comply.\\n *\\n * \u003cp\u003eThe \"destructive\" methods contained in this interface, that is, the\\n * methods that modify the map on which they operate, are specified to throw\\n * {@code UnsupportedOperationException} if this map does not support the\\n * operation.  If this is the case, these methods may, but are not required\\n * to, throw an {@code UnsupportedOperationException} if the invocation would\\n * have no effect on the map.  For example, invoking the {@link #putAll(Map)}\\n * method on an unmodifiable map may, but is not required to, throw the\\n * exception if the map whose mappings are to be \"superimposed\" is empty.\\n *\\n * \u003cp\u003eSome map implementations have restrictions on the keys and values they\\n * may contain.  For example, some implementations prohibit null keys and\\n * values, and some have restrictions on the types of their keys.  Attempting\\n * to insert an ineligible key or value throws an unchecked exception,\\n * typically {@code NullPointerException} or {@code ClassCastException}.\\n * Attempting to query the presence of an ineligible key or value may throw an\\n * exception, or it may simply return false; some implementations will exhibit\\n * the former behavior and some will exhibit the latter.  More generally,\\n * attempting an operation on an ineligible key or value whose completion\\n * would not result in the insertion of an ineligible element into the map may\\n * throw an exception or it may succeed, at the option of the implementation.\\n * Such exceptions are marked as \"optional\" in the specification for this\\n * interface.\\n *\\n * \u003cp\u003eMany methods in Collections Framework interfaces are defined\\n * in terms of the {@link Object#equals(Object) equals} method.  For\\n * example, the specification for the {@link #containsKey(Object)\\n * containsKey(Object key)} method says: \"returns {@code true} if and\\n * only if this map contains a mapping for a key {@code k} such that\\n * {@code (key==null ? k==null : key.equals(k))}.\" This specification should\\n * \u003ci\u003enot\u003c/i\u003e be construed to imply that invoking {@code Map.containsKey}\\n * with a non-null argument {@code key} will cause {@code key.equals(k)} to\\n * be invoked for any key {@code k}.  Implementations are free to\\n * implement optimizations whereby the {@code equals} invocation is avoided,\\n * for example, by first comparing the hash codes of the two keys.  (The\\n * {@link Object#hashCode()} specification guarantees that two objects with\\n * unequal hash codes cannot be equal.)  More generally, implementations of\\n * the various Collections Framework interfaces are free to take advantage of\\n * the specified behavior of underlying {@link Object} methods wherever the\\n * implementor deems it appropriate.\\n *\\n * \u003cp\u003eSome map operations which perform recursive traversal of the map may fail\\n * with an exception for self-referential instances where the map directly or\\n * indirectly contains itself. This includes the {@code clone()},\\n * {@code equals()}, {@code hashCode()} and {@code toString()} methods.\\n * Implementations may optionally handle the self-referential scenario, however\\n * most current implementations do not do so.\\n *\\n * \u003ch2\u003e\u003ca id=\"unmodifiable\"\u003eUnmodifiable Maps\u003c/a\u003e\u003c/h2\u003e\\n * \u003cp\u003eThe {@link Map#of() Map.of},\\n * {@link Map#ofEntries(Map.Entry...) Map.ofEntries}, and\\n * {@link Map#copyOf Map.copyOf}\\n * static factory methods provide a convenient way to create unmodifiable maps.\\n * The {@code Map}\\n * instances created by these methods have the following characteristics:\\n *\\n * \u003cul\u003e\\n * \u003cli\u003eThey are \u003ca href=\"Collection.html#unmodifiable\"\u003e\u003ci\u003eunmodifiable\u003c/i\u003e\u003c/a\u003e. Keys and values\\n * cannot be added, removed, or updated. Calling any mutator method on the Map\\n * will always cause {@code UnsupportedOperationException} to be thrown.\\n * However, if the contained keys or values are themselves mutable, this may cause the\\n * Map to behave inconsistently or its contents to appear to change.\\n * \u003cli\u003eThey disallow {@code null} keys and values. Attempts to create them with\\n * {@code null} keys or values result in {@code NullPointerException}.\\n * \u003cli\u003eThey are serializable if all keys and values are serializable.\\n * \u003cli\u003eThey reject duplicate keys at creation time. Duplicate keys\\n * passed to a static factory method result in {@code IllegalArgumentException}.\\n * \u003cli\u003eThe iteration order of mappings is unspecified and is subject to change.\\n * \u003cli\u003eThey are \u003ca href=\"../lang/doc-files/ValueBased.html\"\u003evalue-based\u003c/a\u003e.\\n * Programmers should treat instances that are {@linkplain #equals(Object) equal}\\n * as interchangeable and should not use them for synchronization, or\\n * unpredictable behavior may occur. For example, in a future release,\\n * synchronization may fail. Callers should make no assumptions\\n * about the identity of the returned instances. Factories are free to\\n * create new instances or reuse existing ones.\\n * \u003cli\u003eThey are serialized as specified on the\\n * \u003ca href=\"{@docRoot}/serialized-form.html#java.util.CollSer\"\u003eSerialized Form\u003c/a\u003e\\n * page.\\n * \u003c/ul\u003e\\n *\\n * \u003cp\u003eThis interface is a member of the\\n * \u003ca href=\"{@docRoot}/java.base/java/util/package-summary.html#CollectionsFramework\"\u003e\\n * Java Collections Framework\u003c/a\u003e.\\n *\\n * @param \u003cK\u003e the type of keys maintained by this map\\n * @param \u003cV\u003e the type of mapped values\\n *\\n * @author  Josh Bloch\\n * @see HashMap\\n * @see TreeMap\\n * @see Hashtable\\n * @see SortedMap\\n * @see Collection\\n * @see Set\\n * @since 1.2\\n \u0027}"}, {"color": "#97c2fc", "id": " int size()", "label": " int size()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the number of key-value mappings in this map.  If the\\n     * map contains more than {@code Integer.MAX_VALUE} elements, returns\\n     * {@code Integer.MAX_VALUE}.\\n     *\\n     * @return the number of key-value mappings in this map\\n     \u0027}"}, {"color": "#97c2fc", "id": " boolean isEmpty()", "label": " boolean isEmpty()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns {@code true} if this map contains no key-value mappings.\\n     *\\n     * @return {@code true} if this map contains no key-value mappings\\n     \u0027}"}, {"color": "#97c2fc", "id": " boolean containsKey(Object key)", "label": " boolean containsKey(Object key)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns {@code true} if this map contains a mapping for the specified\\n     * key.  More formally, returns {@code true} if and only if\\n     * this map contains a mapping for a key {@code k} such that\\n     * {@code Objects.equals(key, k)}.  (There can be\\n     * at most one such mapping.)\\n     *\\n     * @param key key whose presence in this map is to be tested\\n     * @return {@code true} if this map contains a mapping for the specified\\n     *         key\\n     * @throws ClassCastException if the key is of an inappropriate type for\\n     *         this map\\n     * (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @throws NullPointerException if the specified key is null and this map\\n     *         does not permit null keys\\n     * (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     \u0027}"}, {"color": "#97c2fc", "id": " boolean containsValue(Object value)", "label": " boolean containsValue(Object value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns {@code true} if this map maps one or more keys to the\\n     * specified value.  More formally, returns {@code true} if and only if\\n     * this map contains at least one mapping to a value {@code v} such that\\n     * {@code Objects.equals(value, v)}.  This operation\\n     * will probably require time linear in the map size for most\\n     * implementations of the {@code Map} interface.\\n     *\\n     * @param value value whose presence in this map is to be tested\\n     * @return {@code true} if this map maps one or more keys to the\\n     *         specified value\\n     * @throws ClassCastException if the value is of an inappropriate type for\\n     *         this map\\n     * (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @throws NullPointerException if the specified value is null and this\\n     *         map does not permit null values\\n     * (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     \u0027}"}, {"color": "#97c2fc", "id": " V get(Object key)", "label": " V get(Object key)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the value to which the specified key is mapped,\\n     * or {@code null} if this map contains no mapping for the key.\\n     *\\n     * \u003cp\u003eMore formally, if this map contains a mapping from a key\\n     * {@code k} to a value {@code v} such that\\n     * {@code Objects.equals(key, k)},\\n     * then this method returns {@code v}; otherwise\\n     * it returns {@code null}.  (There can be at most one such mapping.)\\n     *\\n     * \u003cp\u003eIf this map permits null values, then a return value of\\n     * {@code null} does not \u003ci\u003enecessarily\u003c/i\u003e indicate that the map\\n     * contains no mapping for the key; it\\\u0027s also possible that the map\\n     * explicitly maps the key to {@code null}.  The {@link #containsKey\\n     * containsKey} operation may be used to distinguish these two cases.\\n     *\\n     * @param key the key whose associated value is to be returned\\n     * @return the value to which the specified key is mapped, or\\n     *         {@code null} if this map contains no mapping for the key\\n     * @throws ClassCastException if the key is of an inappropriate type for\\n     *         this map\\n     * (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @throws NullPointerException if the specified key is null and this map\\n     *         does not permit null keys\\n     * (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     \u0027}"}, {"color": "#97c2fc", "id": "containsKeycontainsKey", "label": "containsKeycontainsKey", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": " V put(K key, V value)", "label": " V put(K key, V value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Associates the specified value with the specified key in this map\\n     * (optional operation).  If the map previously contained a mapping for\\n     * the key, the old value is replaced by the specified value.  (A map\\n     * {@code m} is said to contain a mapping for a key {@code k} if and only\\n     * if {@link #containsKey(Object) m.containsKey(k)} would return\\n     * {@code true}.)\\n     *\\n     * @param key key with which the specified value is to be associated\\n     * @param value value to be associated with the specified key\\n     * @return the previous value associated with {@code key}, or\\n     *         {@code null} if there was no mapping for {@code key}.\\n     *         (A {@code null} return can also indicate that the map\\n     *         previously associated {@code null} with {@code key},\\n     *         if the implementation supports {@code null} values.)\\n     * @throws UnsupportedOperationException if the {@code put} operation\\n     *         is not supported by this map\\n     * @throws ClassCastException if the class of the specified key or value\\n     *         prevents it from being stored in this map\\n     * @throws NullPointerException if the specified key or value is null\\n     *         and this map does not permit null keys or values\\n     * @throws IllegalArgumentException if some property of the specified key\\n     *         or value prevents it from being stored in this map\\n     \u0027}"}, {"color": "#97c2fc", "id": "containsKey(Object)", "label": "containsKey(Object)", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": " V remove(Object key)", "label": " V remove(Object key)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Removes the mapping for a key from this map if it is present\\n     * (optional operation).   More formally, if this map contains a mapping\\n     * from key {@code k} to value {@code v} such that\\n     * {@code Objects.equals(key, k)}, that mapping\\n     * is removed.  (The map can contain at most one such mapping.)\\n     *\\n     * \u003cp\u003eReturns the value to which this map previously associated the key,\\n     * or {@code null} if the map contained no mapping for the key.\\n     *\\n     * \u003cp\u003eIf this map permits null values, then a return value of\\n     * {@code null} does not \u003ci\u003enecessarily\u003c/i\u003e indicate that the map\\n     * contained no mapping for the key; it\\\u0027s also possible that the map\\n     * explicitly mapped the key to {@code null}.\\n     *\\n     * \u003cp\u003eThe map will not contain a mapping for the specified key once the\\n     * call returns.\\n     *\\n     * @param key key whose mapping is to be removed from the map\\n     * @return the previous value associated with {@code key}, or\\n     *         {@code null} if there was no mapping for {@code key}.\\n     * @throws UnsupportedOperationException if the {@code remove} operation\\n     *         is not supported by this map\\n     * @throws ClassCastException if the key is of an inappropriate type for\\n     *         this map\\n     * (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @throws NullPointerException if the specified key is null and this\\n     *         map does not permit null keys\\n     * (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     \u0027}"}, {"color": "#97c2fc", "id": " void putAll(Map\u003c? extends K, ? extends V\u003e m)", "label": " void putAll(Map\u003c? extends K, ? extends V\u003e m)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Copies all of the mappings from the specified map to this map\\n     * (optional operation).  The effect of this call is equivalent to that\\n     * of calling {@link #put(Object,Object) put(k, v)} on this map once\\n     * for each mapping from key {@code k} to value {@code v} in the\\n     * specified map.  The behavior of this operation is undefined if the\\n     * specified map is modified while the operation is in progress.\\n     *\\n     * @param m mappings to be stored in this map\\n     * @throws UnsupportedOperationException if the {@code putAll} operation\\n     *         is not supported by this map\\n     * @throws ClassCastException if the class of a key or value in the\\n     *         specified map prevents it from being stored in this map\\n     * @throws NullPointerException if the specified map is null, or if\\n     *         this map does not permit null keys or values, and the\\n     *         specified map contains null keys or values\\n     * @throws IllegalArgumentException if some property of a key or value in\\n     *         the specified map prevents it from being stored in this map\\n     \u0027}"}, {"color": "#97c2fc", "id": "put(Object", "label": "put(Object", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": " void clear()", "label": " void clear()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Removes all of the mappings from this map (optional operation).\\n     * The map will be empty after this call returns.\\n     *\\n     * @throws UnsupportedOperationException if the {@code clear} operation\\n     *         is not supported by this map\\n     \u0027}"}, {"color": "#97c2fc", "id": " Set\u003cK\u003e keySet()", "label": " Set\u003cK\u003e keySet()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns a {@link Set} view of the keys contained in this map.\\n     * The set is backed by the map, so changes to the map are\\n     * reflected in the set, and vice-versa.  If the map is modified\\n     * while an iteration over the set is in progress (except through\\n     * the iterator\u0027s own {@code remove} operation), the results of\\n     * the iteration are undefined.  The set supports element removal,\\n     * which removes the corresponding mapping from the map, via the\\n     * {@code Iterator.remove}, {@code Set.remove},\\n     * {@code removeAll}, {@code retainAll}, and {@code clear}\\n     * operations.  It does not support the {@code add} or {@code addAll}\\n     * operations.\\n     *\\n     * @return a set view of the keys contained in this map\\n     \"}"}, {"color": "#97c2fc", "id": "Set", "label": "Set", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": " Collection\u003cV\u003e values()", "label": " Collection\u003cV\u003e values()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns a {@link Collection} view of the values contained in this map.\\n     * The collection is backed by the map, so changes to the map are\\n     * reflected in the collection, and vice-versa.  If the map is\\n     * modified while an iteration over the collection is in progress\\n     * (except through the iterator\u0027s own {@code remove} operation),\\n     * the results of the iteration are undefined.  The collection\\n     * supports element removal, which removes the corresponding\\n     * mapping from the map, via the {@code Iterator.remove},\\n     * {@code Collection.remove}, {@code removeAll},\\n     * {@code retainAll} and {@code clear} operations.  It does not\\n     * support the {@code add} or {@code addAll} operations.\\n     *\\n     * @return a collection view of the values contained in this map\\n     \"}"}, {"color": "#97c2fc", "id": "Collection", "label": "Collection", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": " Set\u003cMap.Entry\u003cK, V\u003e\u003e entrySet()", "label": " Set\u003cMap.Entry\u003cK, V\u003e\u003e entrySet()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns a {@link Set} view of the mappings contained in this map.\\n     * The set is backed by the map, so changes to the map are\\n     * reflected in the set, and vice-versa.  If the map is modified\\n     * while an iteration over the set is in progress (except through\\n     * the iterator\u0027s own {@code remove} operation, or through the\\n     * {@code setValue} operation on a map entry returned by the\\n     * iterator) the results of the iteration are undefined.  The set\\n     * supports element removal, which removes the corresponding\\n     * mapping from the map, via the {@code Iterator.remove},\\n     * {@code Set.remove}, {@code removeAll}, {@code retainAll} and\\n     * {@code clear} operations.  It does not support the\\n     * {@code add} or {@code addAll} operations.\\n     *\\n     * @return a set view of the mappings contained in this map\\n     \"}"}, {"color": "#97c2fc", "id": " boolean equals(Object o)", "label": " boolean equals(Object o)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares the specified object with this map for equality.  Returns\\n     * {@code true} if the given object is also a map and the two maps\\n     * represent the same mappings.  More formally, two maps {@code m1} and\\n     * {@code m2} represent the same mappings if\\n     * {@code m1.entrySet().equals(m2.entrySet())}.  This ensures that the\\n     * {@code equals} method works properly across different implementations\\n     * of the {@code Map} interface.\\n     *\\n     * @param o object to be compared for equality with this map\\n     * @return {@code true} if the specified object is equal to this map\\n     \u0027}"}, {"color": "#97c2fc", "id": " int hashCode()", "label": " int hashCode()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the hash code value for this map.  The hash code of a map is\\n     * defined to be the sum of the hash codes of each entry in the map\u0027s\\n     * {@code entrySet()} view.  This ensures that {@code m1.equals(m2)}\\n     * implies that {@code m1.hashCode()==m2.hashCode()} for any two maps\\n     * {@code m1} and {@code m2}, as required by the general contract of\\n     * {@link Object#hashCode}.\\n     *\\n     * @return the hash code value for this map\\n     * @see Map.Entry#hashCode()\\n     * @see Object#equals(Object)\\n     * @see #equals(Object)\\n     \"}"}, {"color": "#97c2fc", "id": "hashCode", "label": "hashCode", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": " V getOrDefault(Object key, V defaultValue)", "label": " V getOrDefault(Object key, V defaultValue)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * {@inheritDoc}\\n     *\\n     * @implNote This implementation assumes that the ConcurrentMap cannot\\n     * contain null values and {@code get()} returning null unambiguously means\\n     * the key is absent. Implementations which support null values\\n     * \u003cstrong\u003emust\u003c/strong\u003e override this default implementation.\\n     *\\n     * @throws ClassCastException {@inheritDoc}\\n     * @throws NullPointerException {@inheritDoc}\\n     * @since 1.8\\n     \u0027}"}, {"color": "#97c2fc", "id": " void forEach(BiConsumer\u003c? super K, ? super V\u003e action)", "label": " void forEach(BiConsumer\u003c? super K, ? super V\u003e action)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * {@inheritDoc}\\n     *\\n     * @implSpec The default implementation is equivalent to, for this\\n     * {@code map}:\\n     * \u003cpre\u003e {@code\\n     * for (Map.Entry\u003cK,V\u003e entry : map.entrySet()) {\\n     *   action.accept(entry.getKey(), entry.getValue());\\n     * }}\u003c/pre\u003e\\n     *\\n     * @implNote The default implementation assumes that\\n     * {@code IllegalStateException} thrown by {@code getKey()} or\\n     * {@code getValue()} indicates that the entry has been removed and cannot\\n     * be processed. Operation continues for subsequent entries.\\n     *\\n     * @throws NullPointerException {@inheritDoc}\\n     * @since 1.8\\n     \u0027}"}, {"color": "#97c2fc", "id": " void replaceAll(BiFunction\u003c? super K, ? super V, ? extends V\u003e function)", "label": " void replaceAll(BiFunction\u003c? super K, ? super V, ? extends V\u003e function)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * {@inheritDoc}\\n     *\\n     * @implSpec\\n     * \u003cp\u003eThe default implementation is equivalent to, for this {@code map}:\\n     * \u003cpre\u003e {@code\\n     * for (Map.Entry\u003cK,V\u003e entry : map.entrySet()) {\\n     *   K k;\\n     *   V v;\\n     *   do {\\n     *     k = entry.getKey();\\n     *     v = entry.getValue();\\n     *   } while (!map.replace(k, v, function.apply(k, v)));\\n     * }}\u003c/pre\u003e\\n     *\\n     * The default implementation may retry these steps when multiple\\n     * threads attempt updates including potentially calling the function\\n     * repeatedly for a given key.\\n     *\\n     * \u003cp\u003eThis implementation assumes that the ConcurrentMap cannot contain null\\n     * values and {@code get()} returning null unambiguously means the key is\\n     * absent. Implementations which support null values \u003cstrong\u003emust\u003c/strong\u003e\\n     * override this default implementation.\\n     *\\n     * @throws UnsupportedOperationException {@inheritDoc}\\n     * @throws NullPointerException {@inheritDoc}\\n     * @throws ClassCastException {@inheritDoc}\\n     * @throws IllegalArgumentException {@inheritDoc}\\n     * @since 1.8\\n     \u0027}"}, {"color": "#97c2fc", "id": " V putIfAbsent(K key, V value)", "label": " V putIfAbsent(K key, V value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * If the specified key is not already associated\\n     * with a value, associates it with the given value.\\n     * This is equivalent to, for this {@code map}:\\n     * \u003cpre\u003e {@code\\n     * if (!map.containsKey(key))\\n     *   return map.put(key, value);\\n     * else\\n     *   return map.get(key);}\u003c/pre\u003e\\n     *\\n     * except that the action is performed atomically.\\n     *\\n     * @implNote This implementation intentionally re-abstracts the\\n     * inappropriate default provided in {@code Map}.\\n     *\\n     * @param key key with which the specified value is to be associated\\n     * @param value value to be associated with the specified key\\n     * @return the previous value associated with the specified key, or\\n     *         {@code null} if there was no mapping for the key.\\n     *         (A {@code null} return can also indicate that the map\\n     *         previously associated {@code null} with the key,\\n     *         if the implementation supports null values.)\\n     * @throws UnsupportedOperationException if the {@code put} operation\\n     *         is not supported by this map\\n     * @throws ClassCastException if the class of the specified key or value\\n     *         prevents it from being stored in this map\\n     * @throws NullPointerException if the specified key or value is null,\\n     *         and this map does not permit null keys or values\\n     * @throws IllegalArgumentException if some property of the specified key\\n     *         or value prevents it from being stored in this map\\n     \u0027}"}, {"color": "#97c2fc", "id": " boolean remove(Object key, Object value)", "label": " boolean remove(Object key, Object value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Removes the entry for a key only if currently mapped to a given value.\\n     * This is equivalent to, for this {@code map}:\\n     * \u003cpre\u003e {@code\\n     * if (map.containsKey(key)\\n     *     \u0026\u0026 Objects.equals(map.get(key), value)) {\\n     *   map.remove(key);\\n     *   return true;\\n     * } else {\\n     *   return false;\\n     * }}\u003c/pre\u003e\\n     *\\n     * except that the action is performed atomically.\\n     *\\n     * @implNote This implementation intentionally re-abstracts the\\n     * inappropriate default provided in {@code Map}.\\n     *\\n     * @param key key with which the specified value is associated\\n     * @param value value expected to be associated with the specified key\\n     * @return {@code true} if the value was removed\\n     * @throws UnsupportedOperationException if the {@code remove} operation\\n     *         is not supported by this map\\n     * @throws ClassCastException if the key or value is of an inappropriate\\n     *         type for this map\\n     * (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @throws NullPointerException if the specified key or value is null,\\n     *         and this map does not permit null keys or values\\n     * (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     \u0027}"}, {"color": "#97c2fc", "id": " boolean replace(K key, V oldValue, V newValue)", "label": " boolean replace(K key, V oldValue, V newValue)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Replaces the entry for a key only if currently mapped to a given value.\\n     * This is equivalent to, for this {@code map}:\\n     * \u003cpre\u003e {@code\\n     * if (map.containsKey(key)\\n     *     \u0026\u0026 Objects.equals(map.get(key), oldValue)) {\\n     *   map.put(key, newValue);\\n     *   return true;\\n     * } else {\\n     *   return false;\\n     * }}\u003c/pre\u003e\\n     *\\n     * except that the action is performed atomically.\\n     *\\n     * @implNote This implementation intentionally re-abstracts the\\n     * inappropriate default provided in {@code Map}.\\n     *\\n     * @param key key with which the specified value is associated\\n     * @param oldValue value expected to be associated with the specified key\\n     * @param newValue value to be associated with the specified key\\n     * @return {@code true} if the value was replaced\\n     * @throws UnsupportedOperationException if the {@code put} operation\\n     *         is not supported by this map\\n     * @throws ClassCastException if the class of a specified key or value\\n     *         prevents it from being stored in this map\\n     * @throws NullPointerException if a specified key or value is null,\\n     *         and this map does not permit null keys or values\\n     * @throws IllegalArgumentException if some property of a specified key\\n     *         or value prevents it from being stored in this map\\n     \u0027}"}, {"color": "#97c2fc", "id": " V replace(K key, V value)", "label": " V replace(K key, V value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Replaces the entry for a key only if currently mapped to some value.\\n     * This is equivalent to, for this {@code map}:\\n     * \u003cpre\u003e {@code\\n     * if (map.containsKey(key))\\n     *   return map.put(key, value);\\n     * else\\n     *   return null;}\u003c/pre\u003e\\n     *\\n     * except that the action is performed atomically.\\n     *\\n     * @implNote This implementation intentionally re-abstracts the\\n     * inappropriate default provided in {@code Map}.\\n     *\\n     * @param key key with which the specified value is associated\\n     * @param value value to be associated with the specified key\\n     * @return the previous value associated with the specified key, or\\n     *         {@code null} if there was no mapping for the key.\\n     *         (A {@code null} return can also indicate that the map\\n     *         previously associated {@code null} with the key,\\n     *         if the implementation supports null values.)\\n     * @throws UnsupportedOperationException if the {@code put} operation\\n     *         is not supported by this map\\n     * @throws ClassCastException if the class of the specified key or value\\n     *         prevents it from being stored in this map\\n     * @throws NullPointerException if the specified key or value is null,\\n     *         and this map does not permit null keys or values\\n     * @throws IllegalArgumentException if some property of the specified key\\n     *         or value prevents it from being stored in this map\\n     \u0027}"}, {"color": "#97c2fc", "id": " V computeIfAbsent(K key, Function\u003c? super K, ? extends V\u003e mappingFunction)", "label": " V computeIfAbsent(K key, Function\u003c? super K, ? extends V\u003e mappingFunction)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * {@inheritDoc}\\n     *\\n     * @implSpec\\n     * The default implementation is equivalent to the following steps for this\\n     * {@code map}:\\n     *\\n     * \u003cpre\u003e {@code\\n     * V oldValue, newValue;\\n     * return ((oldValue = map.get(key)) == null\\n     *         \u0026\u0026 (newValue = mappingFunction.apply(key)) != null\\n     *         \u0026\u0026 (oldValue = map.putIfAbsent(key, newValue)) == null)\\n     *   ? newValue\\n     *   : oldValue;}\u003c/pre\u003e\\n     *\\n     * \u003cp\u003eThis implementation assumes that the ConcurrentMap cannot contain null\\n     * values and {@code get()} returning null unambiguously means the key is\\n     * absent. Implementations which support null values \u003cstrong\u003emust\u003c/strong\u003e\\n     * override this default implementation.\\n     *\\n     * @throws UnsupportedOperationException {@inheritDoc}\\n     * @throws ClassCastException {@inheritDoc}\\n     * @throws NullPointerException {@inheritDoc}\\n     * @throws IllegalArgumentException {@inheritDoc}\\n     * @since 1.8\\n     \u0027}"}, {"color": "#97c2fc", "id": "java.util.concurrent.ConcurrentMap", "label": "java.util.concurrent.ConcurrentMap", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * A {@link Map} providing thread safety and atomicity guarantees.\\n *\\n * \u003cp\u003eTo maintain the specified guarantees, default implementations of\\n * methods including {@link #putIfAbsent} inherited from {@link Map}\\n * must be overridden by implementations of this interface. Similarly,\\n * implementations of the collections returned by methods {@link\\n * #keySet}, {@link #values}, and {@link #entrySet} must override\\n * methods such as {@code removeIf} when necessary to\\n * preserve atomicity guarantees.\\n *\\n * \u003cp\u003eMemory consistency effects: As with other concurrent\\n * collections, actions in a thread prior to placing an object into a\\n * {@code ConcurrentMap} as a key or value\\n * \u003ca href=\"package-summary.html#MemoryVisibility\"\u003e\u003ci\u003ehappen-before\u003c/i\u003e\u003c/a\u003e\\n * actions subsequent to the access or removal of that object from\\n * the {@code ConcurrentMap} in another thread.\\n *\\n * \u003cp\u003eThis interface is a member of the\\n * \u003ca href=\"{@docRoot}/java.base/java/util/package-summary.html#CollectionsFramework\"\u003e\\n * Java Collections Framework\u003c/a\u003e.\\n *\\n * @since 1.5\\n * @author Doug Lea\\n * @param \u003cK\u003e the type of keys maintained by this map\\n * @param \u003cV\u003e the type of mapped values\\n \u0027}"}, {"color": "#97c2fc", "id": " V computeIfPresent(K key, BiFunction\u003c? super K, ? super V, ? extends V\u003e remappingFunction)", "label": " V computeIfPresent(K key, BiFunction\u003c? super K, ? super V, ? extends V\u003e remappingFunction)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * If the value for the specified key is present and non-null, attempts to\\n     * compute a new mapping given the key and its current mapped value.\\n     *\\n     * \u003cp\u003eIf the remapping function returns {@code null}, the mapping is removed.\\n     * If the remapping function itself throws an (unchecked) exception, the\\n     * exception is rethrown, and the current mapping is left unchanged.\\n     *\\n     * \u003cp\u003eThe remapping function should not modify this map during computation.\\n     *\\n     * @implSpec\\n     * The default implementation is equivalent to performing the following\\n     * steps for this {@code map}, then returning the current value or\\n     * {@code null} if now absent:\\n     *\\n     * \u003cpre\u003e {@code\\n     * if (map.get(key) != null) {\\n     *     V oldValue = map.get(key);\\n     *     V newValue = remappingFunction.apply(key, oldValue);\\n     *     if (newValue != null)\\n     *         map.put(key, newValue);\\n     *     else\\n     *         map.remove(key);\\n     * }\\n     * }\u003c/pre\u003e\\n     *\\n     * \u003cp\u003eThe default implementation makes no guarantees about detecting if the\\n     * remapping function modifies this map during computation and, if\\n     * appropriate, reporting an error. Non-concurrent implementations should\\n     * override this method and, on a best-effort basis, throw a\\n     * {@code ConcurrentModificationException} if it is detected that the\\n     * remapping function modifies this map during computation. Concurrent\\n     * implementations should override this method and, on a best-effort basis,\\n     * throw an {@code IllegalStateException} if it is detected that the\\n     * remapping function modifies this map during computation and as a result\\n     * computation would never complete.\\n     *\\n     * \u003cp\u003eThe default implementation makes no guarantees about synchronization\\n     * or atomicity properties of this method. Any implementation providing\\n     * atomicity guarantees must override this method and document its\\n     * concurrency properties. In particular, all implementations of\\n     * subinterface {@link java.util.concurrent.ConcurrentMap} must document\\n     * whether the remapping function is applied once atomically only if the\\n     * value is not present.\\n     *\\n     * @param key key with which the specified value is to be associated\\n     * @param remappingFunction the remapping function to compute a value\\n     * @return the new value associated with the specified key, or null if none\\n     * @throws NullPointerException if the specified key is null and\\n     *         this map does not support null keys, or the\\n     *         remappingFunction is null\\n     * @throws UnsupportedOperationException if the {@code put} operation\\n     *         is not supported by this map\\n     *         (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @throws ClassCastException if the class of the specified key or value\\n     *         prevents it from being stored in this map\\n     *         (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @throws IllegalArgumentException if some property of the specified key\\n     *         or value prevents it from being stored in this map\\n     *         (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @since 1.8\\n     \u0027}"}, {"color": "#97c2fc", "id": " V compute(K key, BiFunction\u003c? super K, ? super V, ? extends V\u003e remappingFunction)", "label": " V compute(K key, BiFunction\u003c? super K, ? super V, ? extends V\u003e remappingFunction)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Attempts to compute a mapping for the specified key and its current\\n     * mapped value (or {@code null} if there is no current mapping). For\\n     * example, to either create or append a {@code String} msg to a value\\n     * mapping:\\n     *\\n     * \u003cpre\u003e {@code\\n     * map.compute(key, (k, v) -\u003e (v == null) ? msg : v.concat(msg))}\u003c/pre\u003e\\n     * (Method {@link #merge merge()} is often simpler to use for such purposes.)\\n     *\\n     * \u003cp\u003eIf the remapping function returns {@code null}, the mapping is removed\\n     * (or remains absent if initially absent).  If the remapping function\\n     * itself throws an (unchecked) exception, the exception is rethrown, and\\n     * the current mapping is left unchanged.\\n     *\\n     * \u003cp\u003eThe remapping function should not modify this map during computation.\\n     *\\n     * @implSpec\\n     * The default implementation is equivalent to performing the following\\n     * steps for this {@code map}:\\n     *\\n     * \u003cpre\u003e {@code\\n     * V oldValue = map.get(key);\\n     * V newValue = remappingFunction.apply(key, oldValue);\\n     * if (newValue != null) {\\n     *     map.put(key, newValue);\\n     * } else if (oldValue != null || map.containsKey(key)) {\\n     *     map.remove(key);\\n     * }\\n     * return newValue;\\n     * }\u003c/pre\u003e\\n     *\\n     * \u003cp\u003eThe default implementation makes no guarantees about detecting if the\\n     * remapping function modifies this map during computation and, if\\n     * appropriate, reporting an error. Non-concurrent implementations should\\n     * override this method and, on a best-effort basis, throw a\\n     * {@code ConcurrentModificationException} if it is detected that the\\n     * remapping function modifies this map during computation. Concurrent\\n     * implementations should override this method and, on a best-effort basis,\\n     * throw an {@code IllegalStateException} if it is detected that the\\n     * remapping function modifies this map during computation and as a result\\n     * computation would never complete.\\n     *\\n     * \u003cp\u003eThe default implementation makes no guarantees about synchronization\\n     * or atomicity properties of this method. Any implementation providing\\n     * atomicity guarantees must override this method and document its\\n     * concurrency properties. In particular, all implementations of\\n     * subinterface {@link java.util.concurrent.ConcurrentMap} must document\\n     * whether the remapping function is applied once atomically only if the\\n     * value is not present.\\n     *\\n     * @param key key with which the specified value is to be associated\\n     * @param remappingFunction the remapping function to compute a value\\n     * @return the new value associated with the specified key, or null if none\\n     * @throws NullPointerException if the specified key is null and\\n     *         this map does not support null keys, or the\\n     *         remappingFunction is null\\n     * @throws UnsupportedOperationException if the {@code put} operation\\n     *         is not supported by this map\\n     *         (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @throws ClassCastException if the class of the specified key or value\\n     *         prevents it from being stored in this map\\n     *         (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @throws IllegalArgumentException if some property of the specified key\\n     *         or value prevents it from being stored in this map\\n     *         (\u003ca href=\"{@docRoot}/java.base/java/util/Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @since 1.8\\n     \u0027}"}, {"color": "#97c2fc", "id": " V merge(K key, V value, BiFunction\u003c? super V, ? super V, ? extends V\u003e remappingFunction)", "label": " V merge(K key, V value, BiFunction\u003c? super V, ? super V, ? extends V\u003e remappingFunction)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * If the specified key is not already associated with a value or is\\n     * associated with null, associates it with the given non-null value.\\n     * Otherwise, replaces the associated value with the results of the given\\n     * remapping function, or removes if the result is {@code null}. This\\n     * method may be of use when combining multiple mapped values for a key.\\n     * For example, to either create or append a {@code String msg} to a\\n     * value mapping:\\n     *\\n     * \u003cpre\u003e {@code\\n     * map.merge(key, msg, String::concat)\\n     * }\u003c/pre\u003e\\n     *\\n     * \u003cp\u003eIf the remapping function returns {@code null}, the mapping is removed.\\n     * If the remapping function itself throws an (unchecked) exception, the\\n     * exception is rethrown, and the current mapping is left unchanged.\\n     *\\n     * \u003cp\u003eThe remapping function should not modify this map during computation.\\n     *\\n     * @implSpec\\n     * The default implementation is equivalent to performing the following\\n     * steps for this {@code map}, then returning the current value or\\n     * {@code null} if absent:\\n     *\\n     * \u003cpre\u003e {@code\\n     * V oldValue = map.get(key);\\n     * V newValue = (oldValue == null) ? value :\\n     *              remappingFunction.apply(oldValue, value);\\n     * if (newValue == null)\\n     *     map.remove(key);\\n     * else\\n     *     map.put(key, newValue);\\n     * }\u003c/pre\u003e\\n     *\\n     * \u003cp\u003eThe default implementation makes no guarantees about detecting if the\\n     * remapping function modifies this map during computation and, if\\n     * appropriate, reporting an error. Non-concurrent implementations should\\n     * override this method and, on a best-effort basis, throw a\\n     * {@code ConcurrentModificationException} if it is detected that the\\n     * remapping function modifies this map during computation. Concurrent\\n     * implementations should override this method and, on a best-effort basis,\\n     * throw an {@code IllegalStateEx
