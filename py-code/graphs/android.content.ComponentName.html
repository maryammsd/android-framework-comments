        <center>
          <h1></h1>
        </center>
        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "android.content.ComponentName", "label": "android.content.ComponentName", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * Identifier for a specific application component\\n * ({@link android.app.Activity}, {@link android.app.Service},\\n * {@link android.content.BroadcastReceiver}, or\\n * {@link android.content.ContentProvider}) that is available.  Two\\n * pieces of information, encapsulated here, are required to identify\\n * a component: the package (a String) it exists in, and the class (a String)\\n * name inside of that package.\\n *\\n \u0027}"}, {"color": "#97c2fc", "id": "public static ComponentName createRelative(@NonNull String pkg, @NonNull String cls)", "label": "public static ComponentName createRelative(@NonNull String pkg, @NonNull String cls)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Create a new component identifier where the class name may be specified\\n     * as either absolute or relative to the containing package.\\n     *\\n     * \u003cp\u003eRelative package names begin with a \u003ccode\u003e\\\u0027.\\\u0027\u003c/code\u003e character. For a package\\n     * \u003ccode\u003e\"com.example\"\u003c/code\u003e and class name \u003ccode\u003e\".app.MyActivity\"\u003c/code\u003e this method\\n     * will return a ComponentName with the package \u003ccode\u003e\"com.example\"\u003c/code\u003eand class name\\n     * \u003ccode\u003e\"com.example.app.MyActivity\"\u003c/code\u003e. Fully qualified class names are also\\n     * permitted.\u003c/p\u003e\\n     *\\n     * @param pkg the name of the package the component exists in\\n     * @param cls the name of the class inside of \u003cvar\u003epkg\u003c/var\u003e that implements\\n     *            the component\\n     * @return the new ComponentName\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static ComponentName createRelative(@NonNull Context pkg, @NonNull String cls)", "label": "public static ComponentName createRelative(@NonNull Context pkg, @NonNull String cls)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Create a new component identifier where the class name may be specified\\n     * as either absolute or relative to the containing package.\\n     *\\n     * \u003cp\u003eRelative package names begin with a \u003ccode\u003e\\\u0027.\\\u0027\u003c/code\u003e character. For a package\\n     * \u003ccode\u003e\"com.example\"\u003c/code\u003e and class name \u003ccode\u003e\".app.MyActivity\"\u003c/code\u003e this method\\n     * will return a ComponentName with the package \u003ccode\u003e\"com.example\"\u003c/code\u003eand class name\\n     * \u003ccode\u003e\"com.example.app.MyActivity\"\u003c/code\u003e. Fully qualified class names are also\\n     * permitted.\u003c/p\u003e\\n     *\\n     * @param pkg a Context for the package implementing the component\\n     * @param cls the name of the class inside of \u003cvar\u003epkg\u003c/var\u003e that implements\\n     *            the component\\n     * @return the new ComponentName\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String getPackageName()", "label": "public String getPackageName()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Return the package name of this component.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String getClassName()", "label": "public String getClassName()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Return the class name of this component.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String getShortClassName()", "label": "public String getShortClassName()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Return the class name, either fully qualified or in a shortened form\\n     * (with a leading \u0027.\u0027) if it is a suffix of the package.\\n     \"}"}, {"color": "#97c2fc", "id": "public String flattenToString()", "label": "public String flattenToString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Return a String that unambiguously describes both the package and\\n     * class names contained in the ComponentName.  You can later recover\\n     * the ComponentName from this string through\\n     * {@link #unflattenFromString(String)}.\\n     *\\n     * @return Returns a new String holding the package and class names.  This\\n     * is represented as the package name, concatenated with a \u0027/\u0027 and then the\\n     * class name.\\n     *\\n     * @see #unflattenFromString(String)\\n     \"}"}, {"color": "#97c2fc", "id": "unflattenFromString(String)", "label": "unflattenFromString(String)", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public String flattenToShortString()", "label": "public String flattenToShortString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * The same as {@link #flattenToString()}, but abbreviates the class\\n     * name if it is a suffix of the package.  The result can still be used\\n     * with {@link #unflattenFromString(String)}.\\n     *\\n     * @return Returns a new String holding the package and class names.  This\\n     * is represented as the package name, concatenated with a \u0027/\u0027 and then the\\n     * class name.\\n     *\\n     * @see #unflattenFromString(String)\\n     \"}"}, {"color": "#97c2fc", "id": "flattenToString()", "label": "flattenToString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public static ComponentName unflattenFromString(@NonNull String str)", "label": "public static ComponentName unflattenFromString(@NonNull String str)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Recover a ComponentName from a String that was previously created with\\n     * {@link #flattenToString()}.  It splits the string at the first \\\u0027/\\\u0027,\\n     * taking the part before as the package name and the part after as the\\n     * class name.  As a special convenience (to use, for example, when\\n     * parsing component names on the command line), if the \\\u0027/\\\u0027 is immediately\\n     * followed by a \\\u0027.\\\u0027 then the final class name will be the concatenation\\n     * of the package name with the string following the \\\u0027/\\\u0027.  Thus\\n     * \"com.foo/.Blah\" becomes package=\"com.foo\" class=\"com.foo.Blah\".\\n     *\\n     * @param str The String that was returned by flattenToString().\\n     * @return Returns a new ComponentName containing the package and class\\n     * names that were encoded in \u003cvar\u003estr\u003c/var\u003e\\n     *\\n     * @see #flattenToString()\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String toShortString()", "label": "public String toShortString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Return string representation of this class without the class\u0027s name\\n     * as a prefix.\\n     \"}"}, {"color": "#97c2fc", "id": "public boolean equals(@Nullable Object obj)", "label": "public boolean equals(@Nullable Object obj)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * {@inheritDoc}\\n     *\\n     * \u003cp\u003eTwo components are considered to be equal if the packages in which they reside have the\\n     * same name, and if the classes that implement each component also have the same name.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static void writeToParcel(ComponentName c, Parcel out)", "label": "public static void writeToParcel(ComponentName c, Parcel out)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Write a ComponentName to a Parcel, handling null pointers.  Must be\\n     * read with {@link #readFromParcel(Parcel)}.\\n     *\\n     * @param c The ComponentName to be written.\\n     * @param out The Parcel in which the ComponentName will be placed.\\n     *\\n     * @see #readFromParcel(Parcel)\\n     \u0027}"}, {"color": "#97c2fc", "id": "readFromParcel(Parcel)", "label": "readFromParcel(Parcel)", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public static ComponentName readFromParcel(Parcel in)", "label": "public static ComponentName readFromParcel(Parcel in)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Read a ComponentName from a Parcel that was previously written\\n     * with {@link #writeToParcel(ComponentName, Parcel)}, returning either\\n     * a null or new object as appropriate.\\n     *\\n     * @param in The Parcel from which to read the ComponentName\\n     * @return Returns a new ComponentName matching the previously written\\n     * object, or null if a null had been written.\\n     *\\n     * @see #writeToParcel(ComponentName, Parcel)\\n     \u0027}"}, {"color": "#97c2fc", "id": "writeToParcel(ComponentName", "label": "writeToParcel(ComponentName", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "android.content.ComponentName", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static ComponentName createRelative(@NonNull String pkg, @NonNull String cls)"}, {"arrows": "to", "from": "android.content.ComponentName", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static ComponentName createRelative(@NonNull Context pkg, @NonNull String cls)"}, {"arrows": "to", "from": "android.content.ComponentName", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public String getPackageName()"}, {"arrows": "to", "from": "android.content.ComponentName", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public String getClassName()"}, {"arrows": "to", "from": "android.content.ComponentName", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public String getShortClassName()"}, {"arrows": "to", "from": "android.content.ComponentName", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public String flattenToString()"}, {"arrows": "to", "from": "android.content.ComponentName", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public String flattenToShortString()"}, {"arrows": "to", "from": "android.content.ComponentName", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static ComponentName unflattenFromString(@NonNull String str)"}, {"arrows": "to", "from": "android.content.ComponentName", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public String toShortString()"}, {"arrows": "to", "from": "android.content.ComponentName", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public boolean equals(@Nullable Object obj)"}, {"arrows": "to", "from": "android.content.ComponentName", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static void writeToParcel(ComponentName c, Parcel out)"}, {"arrows": "to", "from": "android.content.ComponentName", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static ComponentName readFromParcel(Parcel in)"}, {"arrows": "to", "from": "public String flattenToString()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "unflattenFromString(String)"}, {"arrows": "to", "from": "public String flattenToShortString()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "unflattenFromString(String)"}, {"arrows": "to", "from": "public String flattenToShortString()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "flattenToString()"}, {"arrows": "to", "from": "public static ComponentName unflattenFromString(@NonNull String str)", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "flattenToString()"}, {"arrows": "to", "from": "public static void writeToParcel(ComponentName c, Parcel out)", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "readFromParcel(Parcel)"}, {"arrows": "to", "from": "public static ComponentName readFromParcel(Parcel in)", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "writeToParcel(ComponentName"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
