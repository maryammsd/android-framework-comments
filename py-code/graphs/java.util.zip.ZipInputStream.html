        <center>
          <h1></h1>
        </center>
        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             

             

             
             /* position absolute is important and the container has to be relative or absolute as well. */
          div.popup {
                 position:absolute;
                 top:0px;
                 left:0px;
                 display:none;
                 background-color:#f5f4ed;
                 -moz-border-radius: 3px;
                 -webkit-border-radius: 3px;
                 border-radius: 3px;
                 border: 1px solid #808074;
                 box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
          }

          /* hide the original tooltip */
          .vis-tooltip {
            display:none;
          }
             
        </style>
    </head>


    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "java.util.zip.ZipInputStream", "label": "java.util.zip.ZipInputStream", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * This class implements an input stream filter for reading files in the\\n * ZIP file format. Includes support for both compressed and uncompressed\\n * entries.\\n *\\n * @author      David Connelly\\n * @since 1.1\\n \u0027}"}, {"color": "#97c2fc", "id": "private void ensureOpen() throws IOException", "label": "private void ensureOpen() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Check to make sure that this stream has not been closed\\n     \u0027}"}, {"color": "#97c2fc", "id": "public ZipEntry getNextEntry() throws IOException", "label": "public ZipEntry getNextEntry() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Reads the next ZIP file entry and positions the stream at the\\n     * beginning of the entry data.\\n     *\\n     * \u003cp\u003eIf the app targets Android U or above, zip file entry names containing\\n     * \"..\" or starting with \"/\" passed here will throw a {@link ZipException}.\\n     * For more details, see {@link dalvik.system.ZipPathValidator}.\\n     *\\n     * @return the next ZIP file entry, or null if there are no more entries\\n     * @throws ZipException if (1) a ZIP file error has occurred or\\n     *            (2) \u003ccode\u003etargetSdkVersion \u003e= BUILD.VERSION_CODES.UPSIDE_DOWN_CAKE\u003c/code\u003e\\n     *            and (the \u003ccode\u003ename\u003c/code\u003e argument contains \"..\" or starts with \"/\").\\n     * @throws IOException if an I/O error has occurred\\n     \u0027}"}, {"color": "#97c2fc", "id": "ZipException", "label": "ZipException", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "dalvik.system.ZipPathValidator", "label": "dalvik.system.ZipPathValidator", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * Enables validation of zip file entry paths to prevent exploitation of the path traversal\\n * vulnerability, e.g. zip path entries containing \"..\" or \"/\". For more details, read\\n * \u003ca href=\"https://developer.android.com/topic/security/risks/zip-path-traversal\"\u003ethis\u003c/a\u003e.\\n * \u003cp\u003e\\n * The default implementation accepts all zip file entry paths without raising any exceptions.\\n * \u003cp\u003e\\n * For custom validation rules, the core functionality should be implemented in a {@link Callback}\\n * interface and that instance should be set in {@link #setCallback(Callback)}.\\n * \u003cp\u003e\\n * Existing validation could be set to a default one by calling {@link #clearCallback()}.\\n \u0027}"}, {"color": "#97c2fc", "id": "public static void clearCallback()", "label": "public static void clearCallback()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Clears the current validation mechanism by setting the current callback instance to a default\\n     * validation.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static void setCallback(@NonNull Callback callback)", "label": "public static void setCallback(@NonNull Callback callback)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Sets the current callback implementation for zip paths.\\n     * \u003cp\u003e\\n     * The provided callback should not perform IO or any blocking operations, but only perform path\\n     * validation. A typical implementation will validate String entries in a single pass and throw\\n     * a {@link ZipException} if the path contains potentially hazardous components such as \"..\".\\n     *\\n     * @param callback An instance of {@link Callback}\\\u0027s implementation.\\n     \u0027}"}, {"color": "#97c2fc", "id": "Callback", "label": "Callback", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "java.util.zip.ZipException", "label": "java.util.zip.ZipException", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\u0027}"}, {"color": "#97c2fc", "id": "public void closeEntry() throws IOException", "label": "public void closeEntry() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Closes the current ZIP entry and positions the stream for reading the\\n     * next entry.\\n     * @throws    ZipException if a ZIP file error has occurred\\n     * @throws    IOException if an I/O error has occurred\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int available() throws IOException", "label": "public int available() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns 0 after EOF has reached for the current entry data,\\n     * otherwise always return 1.\\n     * \u003cp\u003e\\n     * Programs should not count on this method to return the actual number\\n     * of bytes that could be read without blocking.\\n     *\\n     * @return     1 before EOF and 0 after EOF has reached for current entry.\\n     * @throws     IOException  if an I/O error occurs.\\n     *\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int read(byte[] b, int off, int len) throws IOException", "label": "public int read(byte[] b, int off, int len) throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Reads from the current ZIP entry into an array of bytes.\\n     * If {@code len} is not zero, the method\\n     * blocks until some input is available; otherwise, no\\n     * bytes are read and {@code 0} is returned.\\n     * @param b the buffer into which the data is read\\n     * @param off the start offset in the destination array {@code b}\\n     * @param len the maximum number of bytes read\\n     * @return the actual number of bytes read, or -1 if the end of the\\n     *         entry is reached\\n     * @throws     NullPointerException if {@code b} is {@code null}.\\n     * @throws     IndexOutOfBoundsException if {@code off} is negative,\\n     * {@code len} is negative, or {@code len} is greater than\\n     * {@code b.length - off}\\n     * @throws    ZipException if a ZIP file error has occurred\\n     * @throws    IOException if an I/O error has occurred\\n     \u0027}"}, {"color": "#97c2fc", "id": "public long skip(long n) throws IOException", "label": "public long skip(long n) throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Skips specified number of bytes in the current ZIP entry.\\n     * @param n the number of bytes to skip\\n     * @return the actual number of bytes skipped\\n     * @throws    ZipException if a ZIP file error has occurred\\n     * @throws    IOException if an I/O error has occurred\\n     * @throws    IllegalArgumentException if {@code n \u003c 0}\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void close() throws IOException", "label": "public void close() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Closes this input stream and releases any system resources associated\\n     * with the stream.\\n     * @throws    IOException if an I/O error has occurred\\n     \u0027}"}, {"color": "#97c2fc", "id": "private ZipEntry readLOC() throws IOException", "label": "private ZipEntry readLOC() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Reads local file (LOC) header for next entry.\\n     \u0027}"}, {"color": "#97c2fc", "id": "protected ZipEntry createZipEntry(String name)", "label": "protected ZipEntry createZipEntry(String name)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Creates a new {@code ZipEntry} object for the specified\\n     * entry name.\\n     *\\n     * @param name the ZIP file entry name\\n     * @return the ZipEntry just created\\n     \u0027}"}, {"color": "#97c2fc", "id": "private void readEnd(ZipEntry e) throws IOException", "label": "private void readEnd(ZipEntry e) throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Reads end of deflated entry as well as EXT descriptor if present.\\n     *\\n     * Local headers for DEFLATED entries may optionally be followed by a\\n     * data descriptor, and that data descriptor may optionally contain a\\n     * leading signature (EXTSIG).\\n     *\\n     * From the zip spec http://www.pkware.com/documents/casestudies/APPNOTE.TXT\\n     *\\n     * \"\"\"Although not originally assigned a signature, the value 0x08074b50\\n     * has commonly been adopted as a signature value for the data descriptor\\n     * record.  Implementers should be aware that ZIP files may be\\n     * encountered with or without this signature marking data descriptors\\n     * and should account for either case when reading ZIP files to ensure\\n     * compatibility.\"\"\"\\n     \u0027}"}, {"color": "#97c2fc", "id": "private void readFully(byte[] b, int off, int len) throws IOException", "label": "private void readFully(byte[] b, int off, int len) throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Reads bytes, blocking until all bytes are read.\\n     \u0027}"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "java.util.zip.ZipInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "private void ensureOpen() throws IOException"}, {"arrows": "to", "from": "java.util.zip.ZipInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public ZipEntry getNextEntry() throws IOException"}, {"arrows": "to", "from": "java.util.zip.ZipInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void closeEntry() throws IOException"}, {"arrows": "to", "from": "java.util.zip.ZipInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public int available() throws IOException"}, {"arrows": "to", "from": "java.util.zip.ZipInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public int read(byte[] b, int off, int len) throws IOException"}, {"arrows": "to", "from": "java.util.zip.ZipInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public long skip(long n) throws IOException"}, {"arrows": "to", "from": "java.util.zip.ZipInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void close() throws IOException"}, {"arrows": "to", "from": "java.util.zip.ZipInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "private ZipEntry readLOC() throws IOException"}, {"arrows": "to", "from": "java.util.zip.ZipInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "protected ZipEntry createZipEntry(String name)"}, {"arrows": "to", "from": "java.util.zip.ZipInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "private void readEnd(ZipEntry e) throws IOException"}, {"arrows": "to", "from": "java.util.zip.ZipInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "private void readFully(byte[] b, int off, int len) throws IOException"}, {"arrows": "to", "from": "public ZipEntry getNextEntry() throws IOException", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "ZipException"}, {"arrows": "to", "from": "public ZipEntry getNextEntry() throws IOException", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "dalvik.system.ZipPathValidator"}, {"arrows": "to", "from": "dalvik.system.ZipPathValidator", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static void clearCallback()"}, {"arrows": "to", "from": "dalvik.system.ZipPathValidator", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static void setCallback(@NonNull Callback callback)"}, {"arrows": "to", "from": "public static void setCallback(@NonNull Callback callback)", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "Callback"}, {"arrows": "to", "from": "public static void setCallback(@NonNull Callback callback)", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "java.util.zip.ZipException"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
