              // initialize global variables.

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "android.net.Uri", "label": "android.net.Uri", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * Immutable URI reference. A URI reference includes a URI and a fragment, the\\n * component of the URI following a \\\u0027#\\\u0027. Builds and parses URI references\\n * which conform to\\n * \u003ca href=\"http://www.faqs.org/rfcs/rfc2396.html\"\u003eRFC 2396\u003c/a\u003e.\\n *\\n * \u003cp\u003eIn the interest of performance, this class performs little to no\\n * validation. Behavior is undefined for invalid input. This class is very\\n * forgiving--in the face of invalid input, it will return garbage\\n * rather than throw an exception unless otherwise specified.\\n \u0027}"}, {"color": "#97c2fc", "id": "public abstract boolean isHierarchical()", "label": "public abstract boolean isHierarchical()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns true if this URI is hierarchical like \"http://google.com\".\\n     * Absolute URIs are hierarchical if the scheme-specific part starts with\\n     * a \\\u0027/\\\u0027. Relative URIs are always hierarchical.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean isOpaque()", "label": "public boolean isOpaque()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns true if this URI is opaque like \"mailto:nobody@google.com\". The\\n     * scheme-specific part of an opaque URI cannot start with a \\\u0027/\\\u0027.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract boolean isRelative()", "label": "public abstract boolean isRelative()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns true if this URI is relative, i.e.\u0026nbsp;if it doesn\u0027t contain an\\n     * explicit scheme.\\n     *\\n     * @return true if this URI is relative, false if it\u0027s absolute\\n     \"}"}, {"color": "#97c2fc", "id": "public boolean isAbsolute()", "label": "public boolean isAbsolute()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns true if this URI is absolute, i.e.\u0026nbsp;if it contains an\\n     * explicit scheme.\\n     *\\n     * @return true if this URI is absolute, false if it\u0027s relative\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract String getScheme()", "label": "public abstract String getScheme()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the scheme of this URI. Example: \"http\"\\n     *\\n     * @return the scheme or null if this is a relative URI\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract String getSchemeSpecificPart()", "label": "public abstract String getSchemeSpecificPart()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the scheme-specific part of this URI, i.e.\u0026nbsp;everything between\\n     * the scheme separator \\\u0027:\\\u0027 and the fragment separator \\\u0027#\\\u0027. If this is a\\n     * relative URI, this method returns the entire URI. Decodes escaped octets.\\n     *\\n     * \u003cp\u003eExample: \"//www.google.com/search?q=android\"\\n     *\\n     * @return the decoded scheme-specific-part\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract String getEncodedSchemeSpecificPart()", "label": "public abstract String getEncodedSchemeSpecificPart()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the scheme-specific part of this URI, i.e.\u0026nbsp;everything between\\n     * the scheme separator \\\u0027:\\\u0027 and the fragment separator \\\u0027#\\\u0027. If this is a\\n     * relative URI, this method returns the entire URI. Leaves escaped octets\\n     * intact.\\n     *\\n     * \u003cp\u003eExample: \"//www.google.com/search?q=android\"\\n     *\\n     * @return the encoded scheme-specific-part\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract String getAuthority()", "label": "public abstract String getAuthority()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the decoded authority part of this URI. For\\n     * server addresses, the authority is structured as follows:\\n     * {@code [ userinfo \\\u0027@\\\u0027 ] host [ \\\u0027:\\\u0027 port ]}\\n     *\\n     * \u003cp\u003eExamples: \"google.com\", \"bob@google.com:80\"\\n     *\\n     * @return the authority for this URI or null if not present\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract String getEncodedAuthority()", "label": "public abstract String getEncodedAuthority()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the encoded authority part of this URI. For\\n     * server addresses, the authority is structured as follows:\\n     * {@code [ userinfo \\\u0027@\\\u0027 ] host [ \\\u0027:\\\u0027 port ]}\\n     *\\n     * \u003cp\u003eExamples: \"google.com\", \"bob@google.com:80\"\\n     *\\n     * @return the authority for this URI or null if not present\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract String getUserInfo()", "label": "public abstract String getUserInfo()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the decoded user information from the authority.\\n     * For example, if the authority is \"nobody@google.com\", this method will\\n     * return \"nobody\".\\n     *\\n     * @return the user info for this URI or null if not present\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract String getEncodedUserInfo()", "label": "public abstract String getEncodedUserInfo()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the encoded user information from the authority.\\n     * For example, if the authority is \"nobody@google.com\", this method will\\n     * return \"nobody\".\\n     *\\n     * @return the user info for this URI or null if not present\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract String getHost()", "label": "public abstract String getHost()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the encoded host from the authority for this URI. For example,\\n     * if the authority is \"bob@google.com\", this method will return\\n     * \"google.com\".\\n     *\\n     * @return the host for this URI or null if not present\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract int getPort()", "label": "public abstract int getPort()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the port from the authority for this URI. For example,\\n     * if the authority is \"google.com:80\", this method will return 80.\\n     *\\n     * @return the port for this URI or -1 if invalid or not present\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract String getPath()", "label": "public abstract String getPath()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the decoded path.\\n     *\\n     * @return the decoded path, or null if this is not a hierarchical URI\\n     * (like \"mailto:nobody@google.com\") or the URI is invalid\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract String getEncodedPath()", "label": "public abstract String getEncodedPath()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the encoded path.\\n     *\\n     * @return the encoded path, or null if this is not a hierarchical URI\\n     * (like \"mailto:nobody@google.com\") or the URI is invalid\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract String getQuery()", "label": "public abstract String getQuery()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the decoded query component from this URI. The query comes after\\n     * the query separator (\\\u0027?\\\u0027) and before the fragment separator (\\\u0027#\\\u0027). This\\n     * method would return \"q=android\" for\\n     * \"http://www.google.com/search?q=android\".\\n     *\\n     * @return the decoded query or null if there isn\\\u0027t one\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract String getEncodedQuery()", "label": "public abstract String getEncodedQuery()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the encoded query component from this URI. The query comes after\\n     * the query separator (\\\u0027?\\\u0027) and before the fragment separator (\\\u0027#\\\u0027). This\\n     * method would return \"q=android\" for\\n     * \"http://www.google.com/search?q=android\".\\n     *\\n     * @return the encoded query or null if there isn\\\u0027t one\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract String getFragment()", "label": "public abstract String getFragment()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Gets the decoded fragment part of this URI, everything after the \u0027#\u0027.\\n     *\\n     * @return the decoded fragment or null if there isn\u0027t one\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract String getEncodedFragment()", "label": "public abstract String getEncodedFragment()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Gets the encoded fragment part of this URI, everything after the \u0027#\u0027.\\n     *\\n     * @return the encoded fragment or null if there isn\u0027t one\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract List\u003cString\u003e getPathSegments()", "label": "public abstract List\u003cString\u003e getPathSegments()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Gets the decoded path segments.\\n     *\\n     * @return decoded path segments, each without a leading or trailing \u0027/\u0027\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract String getLastPathSegment()", "label": "public abstract String getLastPathSegment()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the decoded last segment in the path.\\n     *\\n     * @return the decoded last segment or null if the path is empty\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean equals(@Nullable Object o)", "label": "public boolean equals(@Nullable Object o)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares this Uri to another object for equality. Returns true if the\\n     * encoded string representations of this Uri and the given Uri are\\n     * equal. Case counts. Paths are not normalized. If one Uri specifies a\\n     * default port explicitly and the other leaves it implicit, they will not\\n     * be considered equal.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int hashCode()", "label": "public int hashCode()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Hashes the encoded string represention of this Uri consistently with\\n     * {@link #equals(Object)}.\\n     \u0027}"}, {"color": "#97c2fc", "id": "equals(Object)", "label": "equals(Object)", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public int compareTo(Uri other)", "label": "public int compareTo(Uri other)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares the string representation of this Uri with that of\\n     * another.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract String toString()", "label": "public abstract String toString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the encoded string representation of this URI.\\n     * Example: \"http://google.com/\"\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract Builder buildUpon()", "label": "public abstract Builder buildUpon()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Constructs a new builder, copying the attributes from this Uri.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static Uri parse(String uriString)", "label": "public static Uri parse(String uriString)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Creates a Uri which parses the given encoded URI string.\\n     *\\n     * @param uriString an RFC 2396-compliant, encoded URI\\n     * @throws NullPointerException if uriString is null\\n     * @return Uri for this given uri string\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static Uri fromFile(File file)", "label": "public static Uri fromFile(File file)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Creates a Uri from a file. The URI has the form\\n     * \"file://\u003cabsolute path\u003e\". Encodes path characters with the exception of\\n     * \\\u0027/\\\u0027.\\n     *\\n     * \u003cp\u003eExample: \"file:///tmp/android.txt\"\\n     *\\n     * @throws NullPointerException if file is null\\n     * @return a Uri for the given file\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static Uri fromParts(String scheme, String ssp, String fragment)", "label": "public static Uri fromParts(String scheme, String ssp, String fragment)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates an opaque Uri from the given components. Encodes the ssp\\n     * which means this method cannot be used to create hierarchical URIs.\\n     *\\n     * @param scheme of the URI\\n     * @param ssp scheme-specific-part, everything between the\\n     *  scheme separator (\u0027:\u0027) and the fragment separator (\u0027#\u0027), which will\\n     *  get encoded\\n     * @param fragment fragment, everything after the \u0027#\u0027, null if undefined,\\n     *  will get encoded\\n     *\\n     * @throws NullPointerException if scheme or ssp is null\\n     * @return Uri composed of the given scheme, ssp, and fragment\\n     *\\n     * @see Builder if you don\u0027t want the ssp and fragment to be encoded\\n     \"}"}, {"color": "#97c2fc", "id": "public Set\u003cString\u003e getQueryParameterNames()", "label": "public Set\u003cString\u003e getQueryParameterNames()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns a set of the unique names of all query parameters. Iterating\\n     * over the set will return the names in order of their first occurrence.\\n     *\\n     * @throws UnsupportedOperationException if this isn\u0027t a hierarchical URI\\n     *\\n     * @return a set of decoded names\\n     \"}"}, {"color": "#97c2fc", "id": "public List\u003cString\u003e getQueryParameters(String key)", "label": "public List\u003cString\u003e getQueryParameters(String key)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Searches the query string for parameter values with the given key.\\n     *\\n     * @param key which will be encoded\\n     *\\n     * @throws UnsupportedOperationException if this isn\u0027t a hierarchical URI\\n     * @throws NullPointerException if key is null\\n     * @return a list of decoded values\\n     \"}"}, {"color": "#97c2fc", "id": "public String getQueryParameter(String key)", "label": "public String getQueryParameter(String key)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Searches the query string for the first value with the given key.\\n     *\\n     * \u003cp\u003e\u003cstrong\u003eWarning:\u003c/strong\u003e Prior to Jelly Bean, this decoded\\n     * the \u0027+\u0027 character as \u0027+\u0027 rather than \u0027 \u0027.\\n     *\\n     * @param key which will be encoded\\n     * @throws UnsupportedOperationException if this isn\u0027t a hierarchical URI\\n     * @throws NullPointerException if key is null\\n     * @return the decoded value or null if no parameter is found\\n     \"}"}, {"color": "#97c2fc", "id": "public boolean getBooleanQueryParameter(String key, boolean defaultValue)", "label": "public boolean getBooleanQueryParameter(String key, boolean defaultValue)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Searches the query string for the first value with the given key and interprets it\\n     * as a boolean value. \"false\" and \"0\" are interpreted as \u003ccode\u003efalse\u003c/code\u003e, everything\\n     * else is interpreted as \u003ccode\u003etrue\u003c/code\u003e.\\n     *\\n     * @param key which will be decoded\\n     * @param defaultValue the default value to return if there is no query parameter for key\\n     * @return the boolean interpretation of the query parameter key\\n     \u0027}"}, {"color": "#97c2fc", "id": "public Uri normalizeScheme()", "label": "public Uri normalizeScheme()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Return an equivalent URI with a lowercase scheme component.\\n     * This aligns the Uri with Android best practices for\\n     * intent filtering.\\n     *\\n     * \u003cp\u003eFor example, \"HTTP://www.android.com\" becomes\\n
