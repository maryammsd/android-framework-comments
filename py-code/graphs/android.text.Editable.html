        <style type="text/css">

             #mynetwork {
                 width: 100%;

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "android.text.Editable", "label": "android.text.Editable", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * This is the interface for text whose content and markup\\n * can be changed (as opposed\\n * to immutable text like Strings).  If you make a {@link DynamicLayout}\\n * of an Editable, the layout will be reflowed as the text is changed.\\n \u0027}"}, {"color": "#97c2fc", "id": "public Editable replace(int st, int en, CharSequence source, int start, int end)", "label": "public Editable replace(int st, int en, CharSequence source, int start, int end)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Replaces the specified range (\u003ccode\u003est\u0026hellip;en\u003c/code\u003e) of text in this\\n     * Editable with a copy of the slice \u003ccode\u003estart\u0026hellip;end\u003c/code\u003e from\\n     * \u003ccode\u003esource\u003c/code\u003e.  The destination slice may be empty, in which case\\n     * the operation is an insertion, or the source slice may be empty,\\n     * in which case the operation is a deletion.\\n     * \u003cp\u003e\\n     * Before the change is committed, each filter that was set with\\n     * {@link #setFilters} is given the opportunity to modify the\\n     * \u003ccode\u003esource\u003c/code\u003e text.\\n     * \u003cp\u003e\\n     * If \u003ccode\u003esource\u003c/code\u003e\\n     * is Spanned, the spans from it are preserved into the Editable.\\n     * Existing spans within the Editable that entirely cover the replaced\\n     * range are retained, but any that were strictly within the range\\n     * that was replaced are removed. If the \u003ccode\u003esource\u003c/code\u003e contains a span\\n     * with {@link Spanned#SPAN_PARAGRAPH} flag, and it does not satisfy the\\n     * paragraph boundary constraint, it is not retained. As a special case, the\\n     * cursor position is preserved even when the entire range where it is located\\n     * is replaced.\\n     * @return  a reference to this object.\\n     *\\n     * @see Spanned#SPAN_PARAGRAPH\\n     \u0027}"}, {"color": "#97c2fc", "id": "SPAN_PARAGRAPH", "label": "SPAN_PARAGRAPH", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "setFilters", "label": "setFilters", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public Editable replace(int st, int en, CharSequence text)", "label": "public Editable replace(int st, int en, CharSequence text)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Convenience for replace(st, en, text, 0, text.length())\\n     * @see #replace(int, int, CharSequence, int, int)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public Editable insert(int where, CharSequence text, int start, int end)", "label": "public Editable insert(int where, CharSequence text, int start, int end)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Convenience for replace(where, where, text, start, end)\\n     * @see #replace(int, int, CharSequence, int, int)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public Editable insert(int where, CharSequence text)", "label": "public Editable insert(int where, CharSequence text)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Convenience for replace(where, where, text, 0, text.length());\\n     * @see #replace(int, int, CharSequence, int, int)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public Editable delete(int st, int en)", "label": "public Editable delete(int st, int en)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Convenience for replace(st, en, \"\", 0, 0)\\n     * @see #replace(int, int, CharSequence, int, int)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public Editable append(CharSequence text)", "label": "public Editable append(CharSequence text)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Convenience for replace(length(), length(), text, 0, text.length())\\n     * @see #replace(int, int, CharSequence, int, int)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public Editable append(CharSequence text, int start, int end)", "label": "public Editable append(CharSequence text, int start, int end)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Convenience for replace(length(), length(), text, start, end)\\n     * @see #replace(int, int, CharSequence, int, int)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public Editable append(char text)", "label": "public Editable append(char text)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Convenience for append(String.valueOf(text)).\\n     * @see #replace(int, int, CharSequence, int, int)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void clear()", "label": "public void clear()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Convenience for replace(0, length(), \"\", 0, 0).\\n     * Note that this clears the text, not the spans;\\n     * use {@link #clearSpans} if you need that.\\n     * @see #replace(int, int, CharSequence, int, int)\\n     \u0027}"}, {"color": "#97c2fc", "id": "clearSpans", "label": "clearSpans", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public void clearSpans()", "label": "public void clearSpans()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Removes all spans from the Editable, as if by calling\\n     * {@link #removeSpan} on each of them.\\n     \u0027}"}, {"color": "#97c2fc", "id": "removeSpan", "label": "removeSpan", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public void setFilters(InputFilter[] filters)", "label": "public void setFilters(InputFilter[] filters)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Sets the series of filters that will be called in succession\\n     * whenever the text of this Editable is changed, each of which has\\n     * the opportunity to limit or transform the text that is being inserted.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public InputFilter[] getFilters()", "label": "public InputFilter[] getFilters()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the array of input filters that are currently applied\\n     * to changes to this Editable.\\n     \u0027}"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "android.text.Editable", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Editable replace(int st, int en, CharSequence source, int start, int end)"}, {"arrows": "to", "from": "android.text.Editable", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Editable replace(int st, int en, CharSequence text)"}, {"arrows": "to", "from": "android.text.Editable", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Editable insert(int where, CharSequence text, int start, int end)"}, {"arrows": "to", "from": "android.text.Editable", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Editable insert(int where, CharSequence text)"}, {"arrows": "to", "from": "android.text.Editable", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Editable delete(int st, int en)"}, {"arrows": "to", "from": "android.text.Editable", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Editable append(CharSequence text)"}, {"arrows": "to", "from": "android.text.Editable", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Editable append(CharSequence text, int start, int end)"}, {"arrows": "to", "from": "android.text.Editable", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Editable append(char text)"}, {"arrows": "to", "from": "android.text.Editable", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void clear()"}, {"arrows": "to", "from": "android.text.Editable", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void clearSpans()"}, {"arrows": "to", "from": "android.text.Editable", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void setFilters(InputFilter[] filters)"}, {"arrows": "to", "from": "android.text.Editable", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public InputFilter[] getFilters()"}, {"arrows": "to", "from": "public Editable replace(int st, int en, CharSequence source, int start, int end)", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "SPAN_PARAGRAPH"}, {"arrows": "to", "from": "public Editable replace(int st, int en, CharSequence source, int start, int end)", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "setFilters"}, {"arrows": "to", "from": "public void clear()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "clearSpans"}, {"arrows": "to", "from": "public void clearSpans()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "removeSpan"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
