        <center>

        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "java.io.ByteArrayInputStream", "label": "java.io.ByteArrayInputStream", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * A {@code ByteArrayInputStream} contains\\n * an internal buffer that contains bytes that\\n * may be read from the stream. An internal\\n * counter keeps track of the next byte to\\n * be supplied by the {@code read} method.\\n * \u003cp\u003e\\n * Closing a {@code ByteArrayInputStream} has no effect. The methods in\\n * this class can be called after the stream has been closed without\\n * generating an {@code IOException}.\\n *\\n * @author  Arthur van Hoff\\n * @see     java.io.StringBufferInputStream\\n * @since   1.0\\n \u0027}"}, {"color": "#97c2fc", "id": "public synchronized int read()", "label": "public synchronized int read()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Reads the next byte of data from this input stream. The value\\n     * byte is returned as an {@code int} in the range\\n     * {@code 0} to {@code 255}. If no byte is available\\n     * because the end of the stream has been reached, the value\\n     * {@code -1} is returned.\\n     * \u003cp\u003e\\n     * This {@code read} method\\n     * cannot block.\\n     *\\n     * @return  the next byte of data, or {@code -1} if the end of the\\n     *          stream has been reached.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public synchronized int read(byte[] b, int off, int len)", "label": "public synchronized int read(byte[] b, int off, int len)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Reads up to {@code len} bytes of data into an array of bytes from this\\n     * input stream.  If {@code pos} equals {@code count}, then {@code -1} is\\n     * returned to indicate end of file.  Otherwise, the  number {@code k} of\\n     * bytes read is equal to the smaller of {@code len} and {@code count-pos}.\\n     * If {@code k} is positive, then bytes {@code buf[pos]} through\\n     * {@code buf[pos+k-1]} are copied into {@code b[off]} through\\n     * {@code b[off+k-1]} in the manner performed by {@code System.arraycopy}.\\n     * The value {@code k} is added into {@code pos} and {@code k} is returned.\\n     * \u003cp\u003e\\n     * This {@code read} method cannot block.\\n     *\\n     * @param   b     the buffer into which the data is read.\\n     * @param   off   the start offset in the destination array {@code b}\\n     * @param   len   the maximum number of bytes read.\\n     * @return  the total number of bytes read into the buffer, or\\n     *          {@code -1} if there is no more data because the end of\\n     *          the stream has been reached.\\n     * @throws  NullPointerException If {@code b} is {@code null}.\\n     * @throws  IndexOutOfBoundsException If {@code off} is negative,\\n     * {@code len} is negative, or {@code len} is greater than\\n     * {@code b.length - off}\\n     \u0027}"}, {"color": "#97c2fc", "id": "public synchronized long skip(long n)", "label": "public synchronized long skip(long n)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Skips {@code n} bytes of input from this input stream. Fewer\\n     * bytes might be skipped if the end of the input stream is reached.\\n     * The actual number {@code k}\\n     * of bytes to be skipped is equal to the smaller\\n     * of {@code n} and  {@code count-pos}.\\n     * The value {@code k} is added into {@code pos}\\n     * and {@code k} is returned.\\n     *\\n     * @param   n   the number of bytes to be skipped.\\n     * @return  the actual number of bytes skipped.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public synchronized int available()", "label": "public synchronized int available()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the number of remaining bytes that can be read (or skipped over)\\n     * from this input stream.\\n     * \u003cp\u003e\\n     * The value returned is {@code count - pos},\\n     * which is the number of bytes remaining to be read from the input buffer.\\n     *\\n     * @return  the number of remaining bytes that can be read (or skipped\\n     *          over) from this input stream without blocking.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean markSupported()", "label": "public boolean markSupported()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tests if this {@code InputStream} supports mark/reset. The\\n     * {@code markSupported} method of {@code ByteArrayInputStream}\\n     * always returns {@code true}.\\n     *\\n     * @since   1.1\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void mark(int readAheadLimit)", "label": "public void mark(int readAheadLimit)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Set the current marked position in the stream.\\n     * ByteArrayInputStream objects are marked at position zero by\\n     * default when constructed.  They may be marked at another\\n     * position within the buffer by this method.\\n     * \u003cp\u003e\\n     * If no mark has been set, then the value of the mark is the\\n     * offset passed to the constructor (or 0 if the offset was not\\n     * supplied).\\n     *\\n     * \u003cp\u003e Note: The {@code readAheadLimit} for this class\\n     *  has no meaning.\\n     *\\n     * @since   1.1\\n     \u0027}"}, {"color": "#97c2fc", "id": "public synchronized void reset()", "label": "public synchronized void reset()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Resets the buffer to the marked position.  The marked position\\n     * is 0 unless another position was marked or an offset was specified\\n     * in the constructor.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void close() throws IOException", "label": "public void close() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Closing a {@code ByteArrayInputStream} has no effect. The methods in\\n     * this class can be called after the stream has been closed without\\n     * generating an {@code IOException}.\\n     \u0027}"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "java.io.ByteArrayInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public synchronized int read()"}, {"arrows": "to", "from": "java.io.ByteArrayInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public synchronized int read(byte[] b, int off, int len)"}, {"arrows": "to", "from": "java.io.ByteArrayInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public synchronized long skip(long n)"}, {"arrows": "to", "from": "java.io.ByteArrayInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public synchronized int available()"}, {"arrows": "to", "from": "java.io.ByteArrayInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public boolean markSupported()"}, {"arrows": "to", "from": "java.io.ByteArrayInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void mark(int readAheadLimit)"}, {"arrows": "to", "from": "java.io.ByteArrayInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public synchronized void reset()"}, {"arrows": "to", "from": "java.io.ByteArrayInputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void close() throws IOException"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
