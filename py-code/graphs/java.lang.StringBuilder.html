              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "java.lang.StringBuilder", "label": "java.lang.StringBuilder", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * A mutable sequence of characters.  This class provides an API compatible\\n * with {@code StringBuffer}, but with no guarantee of synchronization.\\n * This class is designed for use as a drop-in replacement for\\n * {@code StringBuffer} in places where the string buffer was being\\n * used by a single thread (as is generally the case).   Where possible,\\n * it is recommended that this class be used in preference to\\n * {@code StringBuffer} as it will be faster under most implementations.\\n *\\n * \u003cp\u003eThe principal operations on a {@code StringBuilder} are the\\n * {@code append} and {@code insert} methods, which are\\n * overloaded so as to accept data of any type. Each effectively\\n * converts a given datum to a string and then appends or inserts the\\n * characters of that string to the string builder. The\\n * {@code append} method always adds these characters at the end\\n * of the builder; the {@code insert} method adds the characters at\\n * a specified point.\\n * \u003cp\u003e\\n * For example, if {@code z} refers to a string builder object\\n * whose current contents are \"{@code start}\", then\\n * the method call {@code z.append(\"le\")} would cause the string\\n * builder to contain \"{@code startle}\", whereas\\n * {@code z.insert(4, \"le\")} would alter the string builder to\\n * contain \"{@code starlet}\".\\n * \u003cp\u003e\\n * In general, if sb refers to an instance of a {@code StringBuilder},\\n * then {@code sb.append(x)} has the same effect as\\n * {@code sb.insert(sb.length(), x)}.\\n * \u003cp\u003e\\n * Every string builder has a capacity. As long as the length of the\\n * character sequence contained in the string builder does not exceed\\n * the capacity, it is not necessary to allocate a new internal\\n * buffer. If the internal buffer overflows, it is automatically made larger.\\n *\\n * \u003cp\u003eInstances of {@code StringBuilder} are not safe for\\n * use by multiple threads. If such synchronization is required then it is\\n * recommended that {@link java.lang.StringBuffer} be used.\\n *\\n * \u003cp\u003eUnless otherwise noted, passing a {@code null} argument to a constructor\\n * or method in this class will cause a {@link NullPointerException} to be\\n * thrown.\\n *\\n * @apiNote\\n * {@code StringBuilder} implements {@code Comparable} but does not override\\n * {@link Object#equals equals}. Thus, the natural ordering of {@code StringBuilder}\\n * is inconsistent with equals. Care should be exercised if {@code StringBuilder}\\n * objects are used as keys in a {@code SortedMap} or elements in a {@code SortedSet}.\\n * See {@link Comparable}, {@link java.util.SortedMap SortedMap}, or\\n * {@link java.util.SortedSet SortedSet} for more information.\\n *\\n * @author      Michael McCloskey\\n * @see         java.lang.StringBuffer\\n * @see         java.lang.String\\n * @since       1.5\\n \u0027}"}, {"color": "#97c2fc", "id": "public int compareTo(StringBuilder another)", "label": "public int compareTo(StringBuilder another)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares two {@code StringBuilder} instances lexicographically. This method\\n     * follows the same rules for lexicographical comparison as defined in the\\n     * {@linkplain java.lang.CharSequence#compare(java.lang.CharSequence,\\n     * java.lang.CharSequence)  CharSequence.compare(this, another)} method.\\n     *\\n     * \u003cp\u003e\\n     * For finer-grained, locale-sensitive String comparison, refer to\\n     * {@link java.text.Collator}.\\n     *\\n     * @param another the {@code StringBuilder} to be compared with\\n     *\\n     * @return  the value {@code 0} if this {@code StringBuilder} contains the same\\n     * character sequence as that of the argument {@code StringBuilder}; a negative integer\\n     * if this {@code StringBuilder} is lexicographically less than the\\n     * {@code StringBuilder} argument; or a positive integer if this {@code StringBuilder}\\n     * is lexicographically greater than the {@code StringBuilder} argument.\\n     *\\n     * @since 11\\n     \u0027}"}, {"color": "#97c2fc", "id": "java.text.Collator", "label": "java.text.Collator", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\u0027}"}, {"color": "#97c2fc", "id": "public static synchronized Collator getInstance()", "label": "public static synchronized Collator getInstance()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the Collator for the current default locale.\\n     * The default locale is determined by java.util.Locale.getDefault.\\n     * @return the Collator for the default locale.(for example, en_US)\\n     * @see java.util.Locale#getDefault\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static Collator getInstance(Locale desiredLocale)", "label": "public static Collator getInstance(Locale desiredLocale)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Gets the Collator for the desired locale.\\n     * @param desiredLocale the desired locale.\\n     * @return the Collator for the desired locale.\\n     * @see java.util.Locale\\n     * @see java.util.ResourceBundle\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract int compare(String source, String target)", "label": "public abstract int compare(String source, String target)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares the source string to the target string according to the\\n     * collation rules for this Collator.  Returns an integer less than,\\n     * equal to or greater than zero depending on whether the source String is\\n     * less than, equal to or greater than the target string.  See the Collator\\n     * class description for an example of use.\\n     * \u003cp\u003e\\n     * For a one time comparison, this method has the best performance. If a\\n     * given String will be involved in multiple comparisons, CollationKey.compareTo\\n     * has the best performance. See the Collator class description for an example\\n     * using CollationKeys.\\n     * @param source the source string.\\n     * @param target the target string.\\n     * @return Returns an integer value. Value is less than zero if source is less than\\n     * target, value is zero if source and target are equal, value is greater than zero\\n     * if source is greater than target.\\n     * @see java.text.CollationKey\\n     * @see java.text.Collator#getCollationKey\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int compare(Object o1, Object o2)", "label": "public int compare(Object o1, Object o2)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares its two arguments for order.  Returns a negative integer,\\n     * zero, or a positive integer as the first argument is less than, equal\\n     * to, or greater than the second.\\n     * \u003cp\u003e\\n     * This implementation merely returns\\n     *  {@code  compare((String)o1, (String)o2) }.\\n     *\\n     * @return a negative integer, zero, or a positive integer as the\\n     *         first argument is less than, equal to, or greater than the\\n     *         second.\\n     * @throws    ClassCastException the arguments cannot be cast to Strings.\\n     * @see java.util.Comparator\\n     * @since   1.2\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract CollationKey getCollationKey(String source)", "label": "public abstract CollationKey getCollationKey(String source)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\ @see java.text.Collator#IDENTICAL\\n     \"}"}, {"color": "#97c2fc", "id": "public synchronized void setStrength(int newStrength)", "label": "public synchronized void setStrength(int newStrength)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Sets this Collator\u0027s strength property.  The strength property determines\\n     * the minimum level of difference considered significant during comparison.\\n     * See the Collator class description for an example of use.\\n     * @param newStrength  the new strength value.\\n     * @see java.text.Collator#getStrength\\n     * @see java.text.Collator#PRIMARY\\n     * @see java.text.Collator#SECONDARY\\n     * @see java.text.Collator#TERTIARY\\n     * @see java.text.Collator#IDENTICAL\\n     * @throws     IllegalArgumentException If the new strength value is not one of\\n     * PRIMARY, SECONDARY, TERTIARY or IDENTICAL.\\n     \"}"}, {"color": "#97c2fc", "id": "public synchronized int getDecomposition()", "label": "public synchronized int getDecomposition()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Get the decomposition mode of this Collator. Decomposition mode\\n     * determines how Unicode composed characters are handled. Adjusting\\n     * decomposition mode allows the user to select between faster and more\\n     * complete collation behavior.\\n     * \u003cp\u003eThe three values for decomposition mode are:\\n     * \u003cUL\u003e\\n     * \u003cLI\u003eNO_DECOMPOSITION,\\n     * \u003cLI\u003eCANONICAL_DECOMPOSITION\\n     * \u003cLI\u003eFULL_DECOMPOSITION.\\n     * \u003c/UL\u003e\\n     * See the documentation for these three constants for a description\\n     * of their meaning.\\n     * @return the decomposition mode\\n     * @see java.text.Collator#setDecomposition\\n     * @see java.text.Collator#NO_DECOMPOSITION\\n     * @see java.text.Collator#CANONICAL_DECOMPOSITION\\n     * @see java.text.Collator#FULL_DECOMPOSITION\\n     \u0027}"}, {"color": "#97c2fc", "id": "public synchronized void setDecomposition(int decompositionMode)", "label": "public synchronized void setDecomposition(int decompositionMode)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Set the decomposition mode of this Collator. See getDecomposition\\n     * for a description of decomposition mode.\\n     * @param decompositionMode  the new decomposition mode.\\n     * @see java.text.Collator#getDecomposition\\n     * @see java.text.Collator#NO_DECOMPOSITION\\n     * @see java.text.Collator#CANONICAL_DECOMPOSITION\\n     * @see java.text.Collator#FULL_DECOMPOSITION\\n     * @throws    IllegalArgumentException If the given value is not a valid decomposition\\n     * mode.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static synchronized Locale[] getAvailableLocales()", "label": "public static synchronized Locale[] getAvailableLocales()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns an array of all locales for which the\\n     * {@code getInstance} methods of this class can return\\n     * localized instances.\\n     *\\n     * @return An array of locales for which localized\\n     *         {@code Collator} instances are available.\\n     \u0027}"}, {"color": "#97c2fc", "id": "private int decompositionMode_Java_ICU(int mode)", "label": "private int decompositionMode_Java_ICU(int mode)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 BEGIN Android-added: conversion method for decompositionMode constants.\u0027}"}, {"color": "#97c2fc", "id": "public Object clone()", "label": "public Object clone()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a new collator with the same decomposition mode and\\n     * strength value as this collator.\\n     *\\n     * @return a shallow copy of this collator.\\n     * @see java.lang.Cloneable\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean equals(Object that)", "label": "public boolean equals(Object that)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares the equality of two Collators.\\n     * @param that the Collator to be compared with this.\\n     * @return true if this Collator is the same as that Collator;\\n     * false otherwise.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract int hashCode()", "label": "public abstract int hashCode()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Generates the hash code for this Collator.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public StringBuilder append(StringBuffer sb)", "label": "public StringBuilder append(StringBuffer sb)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Appends the specified {@code StringBuffer} to this sequence.\\n     * \u003cp\u003e\\n     * The characters of the {@code StringBuffer} argument are appended,\\n     * in order, to this sequence, increasing the\\n     * length of this sequence by the length of the argument.\\n     * If {@code sb} is {@code null}, then the four characters\\n     * {@code \"null\"} are appended to this sequence.\\n     * \u003cp\u003e\\n     * Let \u003ci\u003en\u003c/i\u003e be the length of this character sequence just prior to\\n     * execution of the {@code append} method. Then the character at index\\n     * \u003ci\u003ek\u003c/i\u003e in the new character sequence is equal to the character at\\n     * index \u003ci\u003ek\u003c/i\u003e in the old character sequence, if \u003ci\u003ek\u003c/i\u003e is less than\\n     * \u003ci\u003en\u003c/i\u003e; otherwise, it is equal to the character at index \u003ci\u003ek-n\u003c/i\u003e\\n     * in the argument {@code sb}.\\n     *\\n
