<html>
    <head>
        <meta charset="utf-8">
        
            <script src="lib/bindings/utils.js"></script>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/dist/vis-network.min.css" integrity="sha512-WgxfT5LWjfszlPHXRmBWHkV2eceiWTOBvrKCNbdgDYTHrT2AeLCGbF4sZlZw3UMN3WtL0tGUoIAKsu8mllg/XA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
            <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js" integrity="sha512-LnvoEWDFrqGHlHmDD2101OrLcbsfkrzoSpvtSQtxK3RMnRV0eOkhhBN2dXHKRrUU8p2DGRTk35n4O8nWSVe1mQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script type="text/javascript" src="../node_modules/vis/dist/vis.js"> </script>-->
        <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6"

        />
        <script
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf"

        ></script>


        <center>
          <h1></h1>
        </center>
        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             

             

             
             /* position absolute is important and the container has to be relative or absolute as well. */
          div.popup {
                 position:absolute;
                 top:0px;
                 left:0px;
                 display:none;
                 background-color:#f5f4ed;
                 -moz-border-radius: 3px;
                 -webkit-border-radius: 3px;
                 border-radius: 3px;
                 border: 1px solid #808074;
                 box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
          }

          /* hide the original tooltip */
          .vis-tooltip {
            display:none;
          }
             
        </style>
    </head>


    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "java.lang.CharSequence", "label": "java.lang.CharSequence", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\u0027}"}, {"color": "#97c2fc", "id": " int length()", "label": " int length()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the length of this character sequence.  The length is the number\\n     * of 16-bit {@code char}s in the sequence.\\n     *\\n     * @return  the number of {@code char}s in this sequence\\n     \u0027}"}, {"color": "#97c2fc", "id": " char charAt(int index)", "label": " char charAt(int index)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the {@code char} value at the specified index.  An index ranges from zero\\n     * to {@code length() - 1}.  The first {@code char} value of the sequence is at\\n     * index zero, the next at index one, and so on, as for array\\n     * indexing.\\n     *\\n     * \u003cp\u003eIf the {@code char} value specified by the index is a\\n     * \u003ca href=\"{@docRoot}/java.base/java/lang/Character.html#unicode\"\u003esurrogate\u003c/a\u003e, the surrogate\\n     * value is returned.\\n     *\\n     * @param   index   the index of the {@code char} value to be returned\\n     *\\n     * @return  the specified {@code char} value\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          if the {@code index} argument is negative or not less than\\n     *          {@code length()}\\n     \u0027}"}, {"color": "#97c2fc", "id": " boolean isEmpty()", "label": " boolean isEmpty()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns {@code true} if this character sequence is empty.\\n     *\\n     * @implSpec\\n     * The default implementation returns the result of calling {@code length() == 0}.\\n     *\\n     * @return {@code true} if {@link #length()} is {@code 0}, otherwise\\n     * {@code false}\\n     *\\n     * @since 15\\n     \u0027}"}, {"color": "#97c2fc", "id": "length()", "label": "length()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": " CharSequence subSequence(int start, int end)", "label": " CharSequence subSequence(int start, int end)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a {@code CharSequence} that is a subsequence of this sequence.\\n     * The subsequence starts with the {@code char} value at the specified index and\\n     * ends with the {@code char} value at index {@code end - 1}.  The length\\n     * (in {@code char}s) of the\\n     * returned sequence is {@code end - start}, so if {@code start == end}\\n     * then an empty sequence is returned.\\n     *\\n     * @param   start   the start index, inclusive\\n     * @param   end     the end index, exclusive\\n     *\\n     * @return  the specified subsequence\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          if {@code start} or {@code end} are negative,\\n     *          if {@code end} is greater than {@code length()},\\n     *          or if {@code start} is greater than {@code end}\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String toString()", "label": "public String toString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a string containing the characters in this sequence in the same\\n     * order as this sequence.  The length of the string will be the length of\\n     * this sequence.\\n     *\\n     * @return  a string consisting of exactly this sequence of characters\\n     \u0027}"}, {"color": "#97c2fc", "id": "public IntStream chars()", "label": "public IntStream chars()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a stream of {@code int} zero-extending the {@code char} values\\n     * from this sequence.  Any char which maps to a \u003ca\\n     * href=\"{@docRoot}/java.base/java/lang/Character.html#unicode\"\u003esurrogate code\\n     * point\u003c/a\u003e is passed through uninterpreted.\\n     *\\n     * \u003cp\u003eThe stream binds to this sequence when the terminal stream operation\\n     * commences (specifically, for mutable sequences the spliterator for the\\n     * stream is \u003ca href=\"../util/Spliterator.html#binding\"\u003e\u003cem\u003elate-binding\u003c/em\u003e\u003c/a\u003e).\\n     * If the sequence is modified during that operation then the result is\\n     * undefined.\\n     *\\n     * @return an IntStream of char values from this sequence\\n     * @since 1.8\\n     \u0027}"}, {"color": "#97c2fc", "id": "public IntStream codePoints()", "label": "public IntStream codePoints()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a stream of code point values from this sequence.  Any surrogate\\n     * pairs encountered in the sequence are combined as if by {@linkplain\\n     * Character#toCodePoint Character.toCodePoint} and the result is passed\\n     * to the stream. Any other code units, including ordinary BMP characters,\\n     * unpaired surrogates, and undefined code units, are zero-extended to\\n     * {@code int} values which are then passed to the stream.\\n     *\\n     * \u003cp\u003eThe stream binds to this sequence when the terminal stream operation\\n     * commences (specifically, for mutable sequences the spliterator for the\\n     * stream is \u003ca href=\"../util/Spliterator.html#binding\"\u003e\u003cem\u003elate-binding\u003c/em\u003e\u003c/a\u003e).\\n     * If the sequence is modified during that operation then the result is\\n     * undefined.\\n     *\\n     * @return an IntStream of Unicode code points from this sequence\\n     * @since 1.8\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static int compare(CharSequence cs1, CharSequence cs2)", "label": "public static int compare(CharSequence cs1, CharSequence cs2)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares two {@code CharSequence} instances lexicographically. Returns a\\n     * negative value, zero, or a positive value if the first sequence is lexicographically\\n     * less than, equal to, or greater than the second, respectively.\\n     *\\n     * \u003cp\u003e\\n     * The lexicographical ordering of {@code CharSequence} is defined as follows.\\n     * Consider a {@code CharSequence} \u003ci\u003ecs\u003c/i\u003e of length \u003ci\u003elen\u003c/i\u003e to be a\\n     * sequence of char values, \u003ci\u003ecs[0]\u003c/i\u003e to \u003ci\u003ecs[len-1]\u003c/i\u003e. Suppose \u003ci\u003ek\u003c/i\u003e\\n     * is the lowest index at which the corresponding char values from each sequence\\n     * differ. The lexicographic ordering of the sequences is determined by a numeric\\n     * comparison of the char values \u003ci\u003ecs1[k]\u003c/i\u003e with \u003ci\u003ecs2[k]\u003c/i\u003e. If there is\\n     * no such index \u003ci\u003ek\u003c/i\u003e, the shorter sequence is considered lexicographically\\n     * less than the other. If the sequences have the same length, the sequences are\\n     * considered lexicographically equal.\\n     *\\n     *\\n     * @param cs1 the first {@code CharSequence}\\n     * @param cs2 the second {@code CharSequence}\\n     *\\n     * @return  the value {@code 0} if the two {@code CharSequence} are equal;\\n     *          a negative integer if the first {@code CharSequence}\\n     *          is lexicographically less than the second; or a\\n     *          positive integer if the first {@code CharSequence} is\\n     *          lexicographically greater than the second.\\n     *\\n     * @since 11\\n     \u0027}"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "java.lang.CharSequence", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " int length()"}, {"arrows": "to", "from": "java.lang.CharSequence", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " char charAt(int index)"}, {"arrows": "to", "from": "java.lang.CharSequence", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " boolean isEmpty()"}, {"arrows": "to", "from": "java.lang.CharSequence", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " CharSequence subSequence(int start, int end)"}, {"arrows": "to", "from": "java.lang.CharSequence", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public String toString()"}, {"arrows": "to", "from": "java.lang.CharSequence", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public IntStream chars()"}, {"arrows": "to", "from": "java.lang.CharSequence", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public IntStream codePoints()"}, {"arrows": "to", "from": "java.lang.CharSequence", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static int compare(CharSequence cs1, CharSequence cs2)"}, {"arrows": "to", "from": " boolean isEmpty()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "length()"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
