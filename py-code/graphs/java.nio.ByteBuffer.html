              // initialize global variables.

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "java.nio.ByteBuffer", "label": "java.nio.ByteBuffer", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\u0027}"}, {"color": "#97c2fc", "id": "public static ByteBuffer allocateDirect(int capacity)", "label": "public static ByteBuffer allocateDirect(int capacity)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Allocates a new direct byte buffer.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s position will be zero, its limit will be its\\n     * capacity, its mark will be undefined, each of its elements will be\\n     * initialized to zero, and its byte order will be\\n     * {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.  Whether or not it has a\\n     * {@link #hasArray backing array} is unspecified.\\n     *\\n     * @param  capacity\\n     *         The new buffer\u0027s capacity, in bytes\\n     *\\n     * @return  The new byte buffer\\n     *\\n     * @throws  IllegalArgumentException\\n     *          If the {@code capacity} is a negative integer\\n     \"}"}, {"color": "#97c2fc", "id": "BIG_ENDIAN", "label": "BIG_ENDIAN", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "hasArray", "label": "hasArray", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public static ByteBuffer allocate(int capacity)", "label": "public static ByteBuffer allocate(int capacity)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Allocates a new byte buffer.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s position will be zero, its limit will be its\\n     * capacity, its mark will be undefined, each of its elements will be\\n     * initialized to zero, and its byte order will be\\n\\n     * {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n\\n     * It will have a {@link #array backing array}, and its\\n     * {@link #arrayOffset array offset} will be zero.\\n     *\\n     * @param  capacity\\n     *         The new buffer\u0027s capacity, in bytes\\n     *\\n     * @return  The new byte buffer\\n     *\\n     * @throws  IllegalArgumentException\\n     *          If the {@code capacity} is a negative integer\\n     \"}"}, {"color": "#97c2fc", "id": "array", "label": "array", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "arrayOffset", "label": "arrayOffset", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public static ByteBuffer wrap(byte[] array, int offset, int length)", "label": "public static ByteBuffer wrap(byte[] array, int offset, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Wraps a byte array into a buffer.\\n     *\\n     * \u003cp\u003e The new buffer will be backed by the given byte array;\\n     * that is, modifications to the buffer will cause the array to be modified\\n     * and vice versa.  The new buffer\u0027s capacity will be\\n     * {@code array.length}, its position will be {@code offset}, its limit\\n     * will be {@code offset + length}, its mark will be undefined, and its\\n     * byte order will be\\n\\n     * {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n\\n     * Its {@link #array backing array} will be the given array, and\\n     * its {@link #arrayOffset array offset} will be zero.  \u003c/p\u003e\\n     *\\n     * @param  array\\n     *         The array that will back the new buffer\\n     *\\n     * @param  offset\\n     *         The offset of the subarray to be used; must be non-negative and\\n     *         no larger than {@code array.length}.  The new buffer\u0027s position\\n     *         will be set to this value.\\n     *\\n     * @param  length\\n     *         The length of the subarray to be used;\\n     *         must be non-negative and no larger than\\n     *         {@code array.length - offset}.\\n     *         The new buffer\u0027s limit will be set to {@code offset + length}.\\n     *\\n     * @return  The new byte buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If the preconditions on the {@code offset} and {@code length}\\n     *          parameters do not hold\\n     \"}"}, {"color": "#97c2fc", "id": "public static ByteBuffer wrap(byte[] array)", "label": "public static ByteBuffer wrap(byte[] array)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Wraps a byte array into a buffer.\\n     *\\n     * \u003cp\u003e The new buffer will be backed by the given byte array;\\n     * that is, modifications to the buffer will cause the array to be modified\\n     * and vice versa.  The new buffer\u0027s capacity and limit will be\\n     * {@code array.length}, its position will be zero, its mark will be\\n     * undefined, and its byte order will be\\n\\n     * {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n\\n     * Its {@link #array backing array} will be the given array, and its\\n     * {@link #arrayOffset array offset} will be zero.  \u003c/p\u003e\\n     *\\n     * @param  array\\n     *         The array that will back this buffer\\n     *\\n     * @return  The new byte buffer\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer slice()", "label": "public abstract ByteBuffer slice()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a new byte buffer whose content is a shared subsequence of\\n     * this buffer\u0027s content.\\n     *\\n     * \u003cp\u003e The content of the new buffer will start at this buffer\u0027s current\\n     * position.  Changes to this buffer\u0027s content will be visible in the new\\n     * buffer, and vice versa; the two buffers\u0027 position, limit, and mark\\n     * values will be independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s position will be zero, its capacity and its limit\\n     * will be the number of bytes remaining in this buffer, its mark will be\\n     * undefined, and its byte order will be\\n\\n     * {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n     * The new buffer will be direct if, and only if, this buffer is direct, and\\n     * it will be read-only if, and only if, this buffer is read-only.  \u003c/p\u003e\\n     *\\n     * @return  The new byte buffer\\n\\n     *\\n     * @see #alignedSlice(int)\\n\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer slice(int index, int length)", "label": "public abstract ByteBuffer slice(int index, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a new byte buffer whose content is a shared subsequence of\\n     * this buffer\u0027s content.\\n     *\\n     * \u003cp\u003e The content of the new buffer will start at position {@code index}\\n     * in this buffer, and will contain {@code length} elements. Changes to\\n     * this buffer\u0027s content will be visible in the new buffer, and vice versa;\\n     * the two buffers\u0027 position, limit, and mark values will be independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s position will be zero, its capacity and its limit\\n     * will be {@code length}, its mark will be undefined, and its byte order\\n     * will be\\n\\n     * {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n     * The new buffer will be direct if, and only if, this buffer is direct,\\n     * and it will be read-only if, and only if, this buffer is read-only. \u003c/p\u003e\\n     *\\n     * @param   index\\n     *          The position in this buffer at which the content of the new\\n     *          buffer will start; must be non-negative and no larger than\\n     *          {@link #limit() limit()}\\n     *\\n     * @param   length\\n     *          The number of elements the new buffer will contain; must be\\n     *          non-negative and no larger than {@code limit() - index}\\n     *\\n     * @return  The new buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative or greater than {@code limit()},\\n     *          {@code length} is negative, or {@code length \u003e limit() - index}\\n     *\\n     * @since 13\\n     \"}"}, {"color": "#97c2fc", "id": "limit()", "label": "limit()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer duplicate()", "label": "public abstract ByteBuffer duplicate()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a new byte buffer that shares this buffer\u0027s content.\\n     *\\n     * \u003cp\u003e The content of the new buffer will be that of this buffer.  Changes\\n     * to this buffer\u0027s content will be visible in the new buffer, and vice\\n     * versa; the two buffers\u0027 position, limit, and mark values will be\\n     * independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s capacity, limit, position,\\n\\n     * and mark values will be identical to those of this buffer, and its byte\\n     * order will be {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n     * The new buffer will be direct if, and only if, this buffer is direct, and\\n     * it will be read-only if, and only if, this buffer is read-only.  \u003c/p\u003e\\n     *\\n     * @return  The new byte buffer\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer asReadOnlyBuffer()", "label": "public abstract ByteBuffer asReadOnlyBuffer()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a new, read-only byte buffer that shares this buffer\u0027s\\n     * content.\\n     *\\n     * \u003cp\u003e The content of the new buffer will be that of this buffer.  Changes\\n     * to this buffer\u0027s content will be visible in the new buffer; the new\\n     * buffer itself, however, will be read-only and will not allow the shared\\n     * content to be modified.  The two buffers\u0027 position, limit, and mark\\n     * values will be independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s capacity, limit, position,\\n\\n     * and mark values will be identical to those of this buffer, and its byte\\n     * order will be {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n     *\\n     * \u003cp\u003e If this buffer is itself read-only then this method behaves in\\n     * exactly the same way as the {@link #duplicate duplicate} method.  \u003c/p\u003e\\n     *\\n     * @return  The new, read-only byte buffer\\n     \"}"}, {"color": "#97c2fc", "id": "duplicate", "label": "duplicate", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public abstract byte get()", "label": "public abstract byte get()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Relative \u003ci\u003eget\u003c/i\u003e method.  Reads the byte at this buffer\u0027s\\n     * current position, and then increments the position.\\n     *\\n     * @return  The byte at the buffer\u0027s current position\\n     *\\n     * @throws  BufferUnderflowException\\n     *          If the buffer\u0027s current position is not smaller than its limit\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer put(byte b)", "label": "public abstract ByteBuffer put(byte b)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Relative \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e Writes the given byte into this buffer at the current\\n     * position, and then increments the position. \u003c/p\u003e\\n     *\\n     * @param  b\\n     *         The byte to be written\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferOverflowException\\n     *          If this buffer\u0027s current position is not smaller than its limit\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract byte get(int index)", "label": "public abstract byte get(int index)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Absolute \u003ci\u003eget\u003c/i\u003e method.  Reads the byte at the given\\n     * index.\\n     *\\n     * @param  index\\n     *         The index from which the byte will be read\\n     *\\n     * @return  The byte at the given index\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative\\n     *          or not smaller than the buffer\u0027s limit\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer put(int index, byte b)", "label": "public abstract ByteBuffer put(int index, byte b)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Absolute \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e Writes the given byte into this buffer at the given\\n     * index. \u003c/p\u003e\\n     *\\n     * @param  index\\n     *         The index at which the byte will be written\\n     *\\n     * @param  b\\n     *         The byte value to be written\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative\\n     *          or not smaller than the buffer\u0027s limit\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \"}"}, {"color": "#97c2fc", "id": "public ByteBuffer get(byte[] dst, int offset, int length)", "label": "public ByteBuffer get(byte[] dst, int offset, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Relative bulk \u003ci\u003eget\u003c/i\u003e method.\\n     *\\n     * \u003cp\u003e This method transfers bytes from this buffer into the given\\n     * destination array.  If there are fewer bytes remaining in the\\n     * buffer than are required to satisfy the request, that is, if\\n     * {@code length}\u0026nbsp;{@code \u003e}\u0026nbsp;{@code remaining()}, then no\\n     * bytes are transferred and a {@link BufferUnderflowException} is\\n     * thrown.\\n     *\\n     * \u003cp\u003e Otherwise, this method copies {@code length} bytes from this\\n     * buffer into the given array, starting at the current position of this\\n     * buffer and at the given offset in the array.  The position of this\\n     * buffer is then incremented by {@code length}.\\n     *\\n     * \u003cp\u003e In other words, an invocation of this method of the form\\n     * \u003ccode\u003esrc.get(dst,\u0026nbsp;off,\u0026nbsp;len)\u003c/code\u003e has exactly the same effect as\\n     * the loop\\n     *\\n     * \u003cpre\u003e{@code\\n     *     for (int i = off; i \u003c off + len; i++)\\n     *         dst[i] = src.get();\\n     * }\u003c/pre\u003e\\n     *\\n     * except that it first checks that there are sufficient bytes in\\n     * this buffer and it is potentially much more efficient.\\n     *\\n     * @param  dst\\n     *         The array into which bytes are to be written\\n     *\\n     * @param  offset\\n     *         The offset within the array of the first byte to be\\n     *         written; must be non-negative and no larger than\\n     *         {@code dst.length}\\n     *\\n     * @param  length\\n     *         The maximum number of bytes to be written to the given\\n     *         array; must be non-negative and no larger than\\n     *         {@code dst.length - offset}\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferUnderflowException\\n     *          If there are fewer than {@code length} bytes\\n     *          remaining in this buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If the preconditions on the {@code offset} and {@code length}\\n     *          parameters do not hold\\n     \u0027}"}, {"color": "#97c2fc", "id": "BufferUnderflowException", "label": "BufferUnderflowException", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "public ByteBuffer get(byte[] dst)", "label": "public ByteBuffer get(byte[] dst)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Relative bulk \u003ci\u003eget\u003c/i\u003e method.\\n     *\\n     * \u003cp\u003e This method transfers bytes from this buffer into the given\\n     * destination array.  An invocation of this method of the form\\n     * {@code src.get(a)} behaves in exactly the same way as the invocation\\n     *\\n     * \u003cpre\u003e\\n     *     src.get(a, 0, a.length) \u003c/pre\u003e\\n     *\\n     * @param   dst\\n     *          The destination array\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferUnderflowException\\n     *          If there are fewer than {@code length} bytes\\n     *          remaining in this buffer\\n     \u0027}"}, {"color": "#97c2fc", "id": "public ByteBuffer get(int index, byte[] dst, int offset, int length)", "label": "public ByteBuffer get(int index, byte[] dst, int offset, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Absolute bulk \u003ci\u003eget\u003c/i\u003e method.\\n     *\\n     * \u003cp\u003e This method transfers {@code length} bytes from this\\n     * buffer into the given array, starting at the given index in this\\n     * buffer and at the given offset in the array.  The position of this\\n     * buffer is unchanged.\\n     *\\n     * \u003cp\u003e An invocation of this method of the form\\n     * \u003ccode\u003esrc.get(index,\u0026nbsp;dst,\u0026nbsp;offset,\u0026nbsp;length)\u003c/code\u003e\\n     * has exactly the same effect as the following loop except that it first\\n     * checks the consistency of the supplied parameters and it is potentially\\n     * much more efficient:\\n     *\\n     * \u003cpre\u003e{@code\\n     *     for (int i = offset, j = index; i \u003c offset + length; i++, j++)\\n     *         dst[i] = src.get(j);\\n     * }\u003c/pre\u003e\\n     *\\n     * @param  index\\n     *         The index in this buffer from which the first byte will be\\n     *         read; must be non-negative and less than {@code limit()}\\n     *\\n     * @param  dst\\n     *         The destination array\\n     *\\n     * @param  offset\\n     *         The offset within the array of the first byte to be\\n     *         written; must be non-negative and less than\\n     *         {@code dst.length}\\n     *\\n     * @param  length\\n     *         The number of bytes to be written to the given array;\\n     *         must be non-negative and no larger than the smaller of\\n     *         {@code limit() - index} and {@code dst.length - offset}\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If the preconditions on the {@code index}, {@code offset}, and\\n     *          {@code length} parameters do not hold\\n     *\\n     * @since 13\\n     \u0027}"}, {"color": "#97c2fc", "id": "public ByteBuffer get(int index, byte[] dst)", "label": "public ByteBuffer get(int index, byte[] dst)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Absolute bulk \u003ci\u003eget\u003c/i\u003e method.\\n     *\\n     * \u003cp\u003e This method transfers bytes from this buffer into the given\\n     * destination array.  The position of this buffer is unchanged.  An\\n     * invocation of this method of the form\\n     * \u003ccode\u003esrc.get(index,\u0026nbsp;dst)\u003c/code\u003e behaves in exactly the same\\n     * way as the invocation:\\n     *\\n     * \u003cpre\u003e\\n     *     src.get(index, dst, 0, dst.length) \u003c/pre\u003e\\n     *\\n     * @param  index\\n     *         The index in this buffer from which the first byte will be\\n     *         read; must be non-negative and less than {@code limit()}\\n     *\\n     * @param  dst\\n     *         The destination array\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative, not smaller than {@code limit()},\\n     *          or {@code limit() - index \u003c dst.length}\\n     *\\n     * @since 13\\n     \u0027}"}, {"color": "#97c2fc", "id": "public ByteBuffer put(ByteBuffer src)", "label": "public ByteBuffer put(ByteBuffer src)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Relative bulk \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e This method transfers the bytes remaining in the given source\\n     * buffer into this buffer.  If there are more bytes remaining in the\\n     * source buffer than in this buffer, that is, if\\n     * {@code src.remaining()}\u0026nbsp;{@code \u003e}\u0026nbsp;{@code remaining()},\\n     * then no bytes are transferred and a {@link\\n     * BufferOverflowException} is thrown.\\n     *\\n     * \u003cp\u003e Otherwise, this method copies\\n     * \u003ci\u003en\u003c/i\u003e\u0026nbsp;=\u0026nbsp;{@code src.remaining()} bytes from the given\\n     * buffer into this buffer, starting at each buffer\u0027s current position.\\n     * The positions of both buffers are then incremented by \u003ci\u003en\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e In other words, an invocation of this method of the form\\n     * {@code dst.put(src)} has exactly the same effect as the loop\\n     *\\n     * \u003cpre\u003e\\n     *     while (src.hasRemaining())\\n     *         dst.put(src.get()); \u003c/pre\u003e\\n     *\\n     * except that it first checks that there is sufficient space in this\\n     * buffer and it is potentially much more efficient.  If this buffer and\\n     * the source buffer share the same backing array or memory, then the\\n     * result will be as if the source elements were first copied to an\\n     * intermediate location before being written into this buffer.\\n     *\\n     * @param  src\\n     *         The source buffer from which bytes are to be read;\\n     *         must not be this buffer\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferOverflowException\\n     *          If there is insufficient space in this buffer\\n     *          for the remaining bytes in the source buffer\\n     *\\n     * @throws  IllegalArgumentException\\n     *          If the source buffer is this buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \"}"}, {"color": "#97c2fc", "id": "BufferOverflowException", "label": "BufferOverflowException", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "public ByteBuffer put(int index, ByteBuffer src, int offset, int length)", "label": "public ByteBuffer put(int index, ByteBuffer src, int offset, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Absolute bulk \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e This method transfers {@code length} bytes into this buffer from\\n     * the given source buffer, starting at the given {@code offset} in the\\n     * source buffer and the given {@code index} in this buffer. The positions\\n     * of both buffers are unchanged.\\n     *\\n     * \u003cp\u003e In other words, an invocation of this method of the form\\n     * \u003ccode\u003edst.put(index,\u0026nbsp;src,\u0026nbsp;offset,\u0026nbsp;length)\u003c/code\u003e\\n     * has exactly the same effect as the loop\\n     *\\n     * \u003cpre\u003e{@code\\n     * for (int i = offset, j = index; i \u003c offset + length; i++, j++)\\n     *     dst.put(j, src.get(i));\\n     * }\u003c/pre\u003e\\n     *\\n     * except that it first checks the consistency of the supplied parameters\\n     * and it is potentially much more efficient.  If this buffer and\\n     * the source buffer share the same backing array or memory, then the\\n     * result will be as if the source elements were first copied to an\\n     * intermediate location before being written into this buffer.\\n     *\\n     * @param index\\n     *        The index in this buffer at which the first byte will be\\n     *        written; must be non-negative and less than {@code limit()}\\n     *\\n     * @param src\\n     *        The buffer from which bytes are to be read\\n     *\\n     * @param offset\\n     *        The index within the source buffer of the first byte to be\\n     *        read; must be non-negative and less than {@code src.limit()}\\n     *\\n     * @param length\\n     *        The number of bytes to be read from the given buffer;\\n     *        must be non-negative and no larger than the smaller of\\n     *        {@code limit() - index} and {@code src.limit() - offset}\\n     *\\n     * @return This buffer\\n     *\\n     * @throws IndexOutOfBoundsException\\n     *         If the preconditions on the {@code index}, {@code offset}, and\\n     *         {@code length} parameters do not hold\\n     *\\n     * @throws ReadOnlyBufferException\\n     *         If this buffer is read-only\\n     *\\n     * @since 16\\n     \u0027}"}, {"color": "#97c2fc", "id": "public ByteBuffer put(byte[] src, int offset, int length)", "label": "public ByteBuffer put(byte[] src, int offset, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Relative bulk \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e This method transfers bytes into this buffer from the given\\n     * source array.  If there are more bytes to be copied from the array\\n     * than remain in this buffer, that is, if\\n     * {@code length}\u0026nbsp;{@code \u003e}\u0026nbsp;{@code remaining()}, then no\\n     * bytes are transferred and a {@link BufferOverflowException} is\\n     * thrown.\\n     *\\n     * \u003cp\u003e Otherwise, this method copies {@code length} bytes from the\\n     * given array into this buffer, starting at the given offset in the array\\n     * and at the current position of this buffer.  The position of this buffer\\n     * is then incremented by {@code length}.\\n     *\\n     * \u003cp\u003e In other words, an invocation of this method of the form\\n     * \u003ccode\u003edst.put(src,\u0026nbsp;off,\u0026nbsp;len)\u003c/code\u003e has exactly the same effect as\\n     * the loop\\n     *\\n     * \u003cpre\u003e{@code\\n     *     for (int i = off; i \u003c off + len; i++)\\n     *         dst.put(src[i]);\\n     * }\u003c/pre\u003e\\n     *\\n     * except that it first checks that there is sufficient space in this\\n     * buffer and it is potentially much more efficient.\\n     *\\n     * @param  src\\n     *         The array from which bytes are to be read\\n     *\\n     * @param  offset\\n     *         The offset within the array of the first byte to be read;\\n     *         must be non-negative and no larger than {@code src.length}\\n     *\\n     * @param  length\\n     *         The number of bytes to be read from the given array;\\n     *         must be non-negative and no larger than\\n     *         {@code src.length - offset}\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferOverflowException\\n     *          If there is insufficient space in this buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If the preconditions on the {@code offset} and {@code length}\\n     *          parameters do not hold\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final ByteBuffer put(byte[] src)", "label": "public final ByteBuffer put(byte[] src)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Relative bulk \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e This method transfers the entire content of the given source\\n     * byte array into this buffer.  An invocation of this method of the\\n     * form {@code dst.put(a)} behaves in exactly the same way as the\\n     * invocation\\n     *\\n     * \u003cpre\u003e\\n     *     dst.put(a, 0, a.length) \u003c/pre\u003e\\n     *\\n     * @param   src\\n     *          The source array\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferOverflowException\\n     *          If there is insufficient space in this buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \u0027}"}, {"color": "#97c2fc", "id": "public ByteBuffer put(int index, byte[] src, int offset, int length)", "label": "public ByteBuffer put(int index, byte[] src, int offset, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Absolute bulk \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e This method transfers {@code length} bytes from the given\\n     * array, starting at the given offset in the array and at the given index\\n     * in this buffer.  The position of this buffer is unchanged.\\n     *\\n     * \u003cp\u003e An invocation of this method of the form\\n     * \u003ccode\u003edst.put(index,\u0026nbsp;src,\u0026nbsp;offset,\u0026nbsp;length)\u003c/code\u003e\\n     * has exactly the same effect as the following loop except that it first\\n     * checks the consistency of the supplied parameters and it is potentially\\n     * much more efficient:\\n     *\\n     * \u003cpre\u003e{@code\\n     *     for (int i = offset, j = index; i \u003c offset + length; i++, j++)\\n     *         dst.put(j, src[i]);\\n     * }\u003c/pre\u003e\\n     *\\n     * @param  index\\n     *         The index in this buffer at which the first byte will be\\n     *         written; must be non-negative and less than {@code limit()}\\n     *\\n     * @param  src\\n     *         The array from which bytes are to be read\\n     *\\n     * @param  offset\\n     *         The offset within the array of the first byte to be read;\\n     *         must be non-negative and less than {@code src.length}\\n     *\\n     * @param  length\\n     *         The number of bytes to be read from the given array;\\n     *         must be non-negative and no larger than the smaller of\\n     *         {@code limit() - index} and {@code src.length - offset}\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If the preconditions on the {@code index}, {@code offset}, and\\n     *          {@code length} parameters do not hold\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     *\\n     * @since 13\\n     \u0027}"}, {"color": "#97c2fc", "id": "public ByteBuffer put(int index, byte[] src)", "label": "public ByteBuffer put(int index, byte[] src)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Absolute bulk \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e This method copies bytes into this buffer from the given source\\n     * array.  The position of this buffer is unchanged.  An invocation of this\\n     * method of the form \u003ccode\u003edst.put(index,\u0026nbsp;src)\u003c/code\u003e\\n     * behaves in exactly the same way as the invocation:\\n     *\\n     * \u003cpre\u003e\\n     *     dst.put(index, src, 0, src.length); \u003c/pre\u003e\\n     *\\n     * @param  index\\n     *         The index in this buffer at which the first byte will be\\n     *         written; must be non-negative and less than {@code limit()}\\n     *\\n     * @param  src\\n     *         The array from which bytes are to be read\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative, not smaller than {@code limit()},\\n     *          or {@code limit() - index \u003c src.length}\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     *\\n     * @since 13\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final boolean hasArray()", "label": "public final boolean hasArray()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether or not this buffer is backed by an accessible byte\\n     * array.\\n     *\\n     * \u003cp\u003e If this method returns {@code true} then the {@link #array() array}\\n     * and {@link #arrayOffset() arrayOffset} methods may safely be invoked.\\n     * \u003c/p\u003e\\n     *\\n     * @return  {@code true} if, and only if, this buffer\\n     *          is backed by an array and is not read-only\\n     \u0027}"}, {"color": "#97c2fc", "id": "array()", "label": "array()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "arrayOffset()", "label": "arrayOffset()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public final byte[] array()", "label": "public final byte[] array()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the byte array that backs this\\n     * buffer\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e Modifications to this buffer\u0027s content will cause the returned\\n     * array\u0027s content to be modified, and vice versa.\\n     *\\n     * \u003cp\u003e Invoke the {@link #hasArray hasArray} method before invoking this\\n     * method in order to ensure that this buffer has an accessible backing\\n     * array.  \u003c/p\u003e\\n     *\\n     * @return  The array that backs this buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is backed by an array but is read-only\\n     *\\n     * @throws  UnsupportedOperationException\\n     *          If this buffer is not backed by an accessible array\\n     \"}"}, {"color": "#97c2fc", "id": "public final int arrayOffset()", "label": "public final int arrayOffset()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the offset within this buffer\u0027s backing array of the first\\n     * element of the buffer\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e If this buffer is backed by an array then buffer position \u003ci\u003ep\u003c/i\u003e\\n     * corresponds to array index \u003ci\u003ep\u003c/i\u003e\u0026nbsp;+\u0026nbsp;{@code arrayOffset()}.\\n     *\\n     * \u003cp\u003e Invoke the {@link #hasArray hasArray} method before invoking this\\n     * method in order to ensure that this buffer has an accessible backing\\n     * array.  \u003c/p\u003e\\n     *\\n     * @return  The offset within this buffer\u0027s array\\n     *          of the first element of the buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is backed by an array but is read-only\\n     *\\n     * @throws  UnsupportedOperationException\\n     *          If this buffer is not backed by an accessible array\\n     \"}"}, {"color": "#97c2fc", "id": "public Buffer position(int newPosition)", "label": "public Buffer position(int newPosition)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 Android-changed: Un-final the method until confirmation of causing no app compat.\u0027}"}, {"color": "#97c2fc", "id": "public Buffer limit(int newLimit)", "label": "public Buffer limit(int newLimit)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 Android-changed: Un-final the method until confirmation of causing no app compat.\u0027}"}, {"color": "#97c2fc", "id": "public Buffer mark()", "label": "public Buffer mark()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 Android-changed: Un-final the method until confirmation of causing no app compat.\u0027}"}, {"color": "#97c2fc", "id": "public Buffer reset()", "label": "public Buffer reset()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 Android-changed: Un-final the method until confirmation of causing no app compat.\u0027}"}, {"color": "#97c2fc", "id": "public Buffer clear()", "label": "public Buffer clear()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 Android-changed: Un-final the method until confirmation of causing no app compat.\u0027}"}, {"color": "#97c2fc", "id": "public Buffer flip()", "label": "public Buffer flip()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 Android-changed: Un-final the method until confirmation of causing no app compat.\u0027}"}, {"color": "#97c2fc", "id": "public Buffer rewind()", "label": "public Buffer rewind()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 Android-changed: Un-final the method until confirmation of causing no app compat.\u0027}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer compact()", "label": "public abstract ByteBuffer compact()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Compacts this buffer\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e The bytes between the buffer\u0027s current position and its limit,\\n     * if any, are copied to the beginning of the buffer.  That is, the\\n     * byte at index \u003ci\u003ep\u003c/i\u003e\u0026nbsp;=\u0026nbsp;{@code position()} is copied\\n     * to index zero, the byte at index \u003ci\u003ep\u003c/i\u003e\u0026nbsp;+\u0026nbsp;1 is copied\\n     * to index one, and so forth until the byte at index\\n     * {@code limit()}\u0026nbsp;-\u0026nbsp;1 is copied to index\\n     * \u003ci\u003en\u003c/i\u003e\u0026nbsp;=\u0026nbsp;{@code limit()}\u0026nbsp;-\u0026nbsp;{@code 1}\u0026nbsp;-\u0026nbsp;\u003ci\u003ep\u003c/i\u003e.\\n     * The buffer\u0027s position is then set to \u003ci\u003en+1\u003c/i\u003e and its limit is set to\\n     * its capacity.  The mark, if defined, is discarded.\\n     *\\n     * \u003cp\u003e The buffer\u0027s position is set to the number of bytes copied,\\n     * rather than to zero, so that an invocation of this method can be\\n     * followed immediately by an invocation of another relative \u003ci\u003eput\u003c/i\u003e\\n     * method. \u003c/p\u003e\\n     *\\n\\n     *\\n     * \u003cp\u003e Invoke this method after writing data from a buffer in case the\\n     * write was incomplete.  The following loop, for example, copies bytes\\n     * from one channel to another via the buffer {@code buf}:\\n     *\\n     * \u003cblockquote\u003e\u003cpre\u003e{@code\\n     *   buf.clear();          // Prepare buffer for use\\n     *   while (in.read(buf) \u003e= 0 || buf.position != 0) {\\n     *       buf.flip();\\n     *       out.write(buf);\\n     *       buf.compact();    // In case of partial write\\n     *   }\\n     * }\u003c/pre\u003e\u003c/blockquote\u003e\\n     *\\n\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract boolean isDirect()", "label": "public abstract boolean isDirect()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether or not this byte buffer is direct.\\n     *\\n     * @return  {@code true} if, and only if, this buffer is direct\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String toString()", "label": "public String toString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a string summarizing the state of this buffer.\\n     *\\n     * @return  A summary string\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int hashCode()", "label": "public int hashCode()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the current hash code of this buffer.\\n     *\\n     * \u003cp\u003e The hash code of a byte buffer depends only upon its remaining\\n     * elements; that is, upon the elements from {@code position()} up to, and\\n     * including, the element at {@code limit()}\u0026nbsp;-\u0026nbsp;{@code 1}.\\n     *\\n     * \u003cp\u003e Because buffer hash codes are content-dependent, it is inadvisable\\n     * to use buffers as keys in hash maps or similar data structures unless it\\n     * is known that their contents will not change.  \u003c/p\u003e\\n     *\\n     * @return  The current hash code of this buffer\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean equals(Object ob)", "label": "public boolean equals(Object ob)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether or not this buffer is equal to another object.\\n     *\\n     * \u003cp\u003e Two byte buffers are equal if, and only if,\\n     *\\n     * \u003col\u003e\\n     *\\n     *   \u003cli\u003e\u003cp\u003e They have the same element type,  \u003c/p\u003e\u003c/li\u003e\\n     *\\n     *   \u003cli\u003e\u003cp\u003e They have the same number of remaining elements, and\\n     *   \u003c/p\u003e\u003c/li\u003e\\n     *\\n     *   \u003cli\u003e\u003cp\u003e The two sequences of remaining elements, considered\\n     *   independently of their starting positions, are pointwise equal.\\n\\n\\n\\n\\n\\n\\n\\n     *   \u003c/p\u003e\u003c/li\u003e\\n     *\\n     * \u003c/ol\u003e\\n     *\\n     * \u003cp\u003e A byte buffer is not equal to any other type of object.  \u003c/p\u003e\\n     *\\n     * @param  ob  The object to which this buffer is to be compared\\n     *\\n     * @return  {@code true} if, and only if, this buffer is equal to the\\n     *           given object\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int compareTo(ByteBuffer that)", "label": "public int compareTo(ByteBuffer that)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares this buffer to another.\\n     *\\n     * \u003cp\u003e Two byte buffers are compared by comparing their sequences of\\n     * remaining elements lexicographically, without regard to the starting\\n     * position of each sequence within its corresponding buffer.\\n\\n\\n\\n\\n\\n\\n\\n\\n     * Pairs of {@code byte} elements are compared as if by invoking\\n     * {@link Byte#compare(byte,byte)}.\\n\\n     *\\n     * \u003cp\u003e A byte buffer is not comparable to any other type of object.\\n     *\\n     * @return  A negative integer, zero, or a positive integer as this buffer\\n     *          is less than, equal to, or greater than the given buffer\\n     \u0027}"}, {"color": "#97c2fc", "id": "compare(byte", "label": "compare(byte", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public int mismatch(ByteBuffer that)", "label": "public int mismatch(ByteBuffer that)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Finds and returns the relative index of the first mismatch between this\\n     * buffer and a given buffer.  The index is relative to the\\n     * {@link #position() position} of each buffer and will be in the range of\\n     * 0 (inclusive) up to the smaller of the {@link #remaining() remaining}\\n     * elements in each buffer (exclusive).\\n     *\\n     * \u003cp\u003e If the two buffers share a common prefix then the returned index is\\n     * the length of the common prefix and it follows that there is a mismatch\\n     * between the two buffers at that index within the respective buffers.\\n     * If one buffer is a proper prefix of the other then the returned index is\\n     * the smaller of the remaining elements in each buffer, and it follows that\\n     * the index is only valid for the buffer with the larger number of\\n     * remaining elements.\\n     * Otherwise, there is no mismatch.\\n     *\\n     * @param  that\\n     *         The byte buffer to be tested for a mismatch with this buffer\\n     *\\n     * @return  The relative index of the first mismatch between this and the\\n     *          given buffer, otherwise -1 if no mismatch.\\n     *\\n     * @since 11\\n     \u0027}"}, {"color": "#97c2fc", "id": "position()", "label": "position()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "remaining()", "label": "remaining()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public final ByteOrder order()", "label": "public final ByteOrder order()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Retrieves this buffer\u0027s byte order.\\n     *\\n     * \u003cp\u003e The byte order is used when reading or writing multibyte values, and\\n     * when creating buffers that are views of this byte buffer.  The order of\\n     * a newly-created byte buffer is always {@link ByteOrder#BIG_ENDIAN\\n     * BIG_ENDIAN}.  \u003c/p\u003e\\n     *\\n     * @return  This buffer\u0027s byte order\\n     \"}"}, {"color": "#97c2fc", "id": "BIG_ENDIANBIG_ENDIAN", "label": "BIG_ENDIANBIG_ENDIAN", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public final ByteBuffer order(ByteOrder bo)", "label": "public final ByteBuffer order(ByteOrder bo)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Modifies this buffer\u0027s byte order.\\n     *\\n     * @param  bo\\n     *         The new byte order,\\n     *         either {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}\\n     *         or {@link ByteOrder#LITTLE_ENDIAN LITTLE_ENDIAN}\\n     *\\n     * @return  This buffer\\n     \"}"}, {"color": "#97c2fc", "id": "LITTLE_ENDIAN", "label": "LITTLE_ENDIAN", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public final int alignmentOffset(int index, int unitSize)", "label": "public final int alignmentOffset(int index, int unitSize)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the memory address, pointing to the byte at the given index,\\n     * modulo the given unit size.\\n     *\\n     * \u003cp\u003e The return value is non-negative in the range of {@code 0}\\n     * (inclusive) up to {@code unitSize} (exclusive), with zero indicating\\n     * that the address of the byte at the index is aligned for the unit size,\\n     * and a positive value that the address is misaligned for the unit size.\\n     * If the address of the byte at the index is misaligned, the return value\\n     * represents how much the index should be adjusted to locate a byte at an\\n     * aligned address.  Specifically, the index should either be decremented by\\n     * the return value if the latter is not greater than {@code index}, or be\\n     * incremented by the unit size minus the return value.  Therefore given\\n     * \u003cblockquote\u003e\u003cpre\u003e\\n     * int value = alignmentOffset(index, unitSize)\u003c/pre\u003e\u003c/blockquote\u003e\\n     * then the identities\\n     * \u003cblockquote\u003e\u003cpre\u003e\\n     * alignmentOffset(index - value, unitSize) == 0, value \u0026le; index\u003c/pre\u003e\u003c/blockquote\u003e\\n     * and\\n     * \u003cblockquote\u003e\u003cpre\u003e\\n     * alignmentOffset(index + (unitSize - value), unitSize) == 0\u003c/pre\u003e\u003c/blockquote\u003e\\n     * must hold.\\n     *\\n     * @apiNote\\n     * This method may be utilized to determine if unit size bytes from an\\n     * index can be accessed atomically, if supported by the native platform.\\n     *\\n     * @implNote\\n     * This implementation throws {@code UnsupportedOperationException} for\\n     * non-direct buffers when the given unit size is greater than {@code 8}.\\n     *\\n     * @param  index\\n     *         The index to query for alignment offset, must be non-negative, no\\n     *         upper bounds check is performed\\n     *\\n     * @param  unitSize\\n     *         The unit size in bytes, must be a power of {@code 2}\\n     *\\n     * @return  The indexed byte\u0027s memory address modulo the unit size\\n     *\\n     * @throws IllegalArgumentException\\n     *         If the index is negative or the unit size is not a power of\\n     *         {@code 2}\\n     *\\n     * @throws UnsupportedOperationException\\n     *         If the native platform does not guarantee stable alignment offset\\n     *         values for the given unit size when managing the memory regions\\n     *         of buffers of the same kind as this buffer (direct or\\n     *         non-direct).  For example, if garbage collection would result\\n     *         in the moving of a memory region covered by a non-direct buffer\\n     *         from one location to another and both locations have different\\n     *         alignment characteristics.\\n     *\\n     * @see #alignedSlice(int)\\n     * @since 9\\n     \"}"}, {"color": "#97c2fc", "id": "public final ByteBuffer alignedSlice(int unitSize)", "label": "public final ByteBuffer alignedSlice(int unitSize)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a new byte buffer whose content is a shared and aligned\\n     * subsequence of this buffer\u0027s content.\\n     *\\n     * \u003cp\u003e The content of the new buffer will start at this buffer\u0027s current\\n     * position rounded up to the index of the nearest aligned byte for the\\n     * given unit size, and end at this buffer\u0027s limit rounded down to the index\\n     * of the nearest aligned byte for the given unit size.\\n     * If rounding results in out-of-bound values then the new buffer\u0027s capacity\\n     * and limit will be zero.  If rounding is within bounds the following\\n     * expressions will be true for a new buffer {@code nb} and unit size\\n     * {@code unitSize}:\\n     * \u003cpre\u003e{@code\\n     * nb.alignmentOffset(0, unitSize) == 0\\n     * nb.alignmentOffset(nb.limit(), unitSize) == 0\\n     * }\u003c/pre\u003e\\n     *\\n     * \u003cp\u003e Changes to this buffer\u0027s content will be visible in the new\\n     * buffer, and vice versa; the two buffers\u0027 position, limit, and mark\\n     * values will be independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s position will be zero, its capacity and its limit\\n     * will be the number of bytes remaining in this buffer or fewer subject to\\n     * alignment, its mark will be undefined, and its byte order will be\\n     * {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n     *\\n     * The new buffer will be direct if, and only if, this buffer is direct, and\\n     * it will be read-only if, and only if, this buffer is read-only.  \u003c/p\u003e\\n     *\\n     * @apiNote\\n     * This method may be utilized to create a new buffer where unit size bytes\\n     * from index, that is a multiple of the unit size, may be accessed\\n     * atomically, if supported by the native platform.\\n     *\\n     * @implNote\\n     * This implementation throws {@code UnsupportedOperationException} for\\n     * non-direct buffers when the given unit size is greater than {@code 8}.\\n     *\\n     * @param  unitSize\\n     *         The unit size in bytes, must be a power of {@code 2}\\n     *\\n     * @return  The new byte buffer\\n     *\\n     * @throws IllegalArgumentException\\n     *         If the unit size not a power of {@code 2}\\n     *\\n     * @throws UnsupportedOperationException\\n     *         If the native platform does not guarantee stable aligned slices\\n     *         for the given unit size when managing the memory regions\\n     *         of buffers of the same kind as this buffer (direct or\\n     *         non-direct).  For example, if garbage collection would result\\n     *         in the moving of a memory region covered by a non-direct buffer\\n     *         from one location to another and both locations have different\\n     *         alignment characteristics.\\n     *\\n     * @see #alignmentOffset(int, int)\\n     * @see #slice()\\n     * @since 9\\n     \"}"}, {"color": "#97c2fc", "id": " abstract byte _get(int i)", "label": " abstract byte _get(int i)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 package-private\u0027}"}, {"color": "#97c2fc", "id": " abstract void _put(int i, byte b)", "label": " abstract void _put(int i, byte b)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 package-private\u0027}"}, {"color": "#97c2fc", "id": "public abstract char getChar()", "label": "public abstract char getChar()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Relative \u003ci\u003eget\u003c/i\u003e method for reading a char value.\\n     *\\n     * \u003cp\u003e Reads the next two bytes at this buffer\u0027s current position,\\n     * composing them into a char value according to the current byte order,\\n     * and then increments the position by two.  \u003c/p\u003e\\n     *\\n     * @return  The char value at the buffer\u0027s current position\\n     *\\n     * @throws  BufferUnderflowException\\n     *          If there are fewer than two bytes\\n     *          remaining in this buffer\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer putChar(char value)", "label": "public abstract ByteBuffer putChar(char value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Relative \u003ci\u003eput\u003c/i\u003e method for writing a char\\n     * value\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e Writes two bytes containing the given char value, in the\\n     * current byte order, into this buffer at the current position, and then\\n     * increments the position by two.  \u003c/p\u003e\\n     *\\n     * @param  value\\n     *         The char value to be written\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferOverflowException\\n     *          If there are fewer than two bytes\\n     *          remaining in this buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract char getChar(int index)", "label": "public abstract char getChar(int index)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Absolute \u003ci\u003eget\u003c/i\u003e method for reading a char value.\\n     *\\n     * \u003cp\u003e Reads two bytes at the given index, composing them into a\\n     * char value according to the current byte order.  \u003c/p\u003e\\n     *\\n     * @param  index\\n     *         The index from which the bytes will be read\\n     *\\n     * @return  The char value at the given index\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative\\n     *          or not smaller than the buffer\u0027s limit,\\n     *          minus one\\n     \"}"}, {"color": "#97c2fc", "id": " abstract char getCharUnchecked(int index)", "label": " abstract char getCharUnchecked(int index)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 BEGIN Android-added: {get,put}*Unchecked() accessors.\u0027}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer putChar(int index, char value)", "label": "public abstract ByteBuffer putChar(int index, char value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Absolute \u003ci\u003eput\u003c/i\u003e method for writing a char\\n     * value\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e Writes two bytes containing the given char value, in the\\n     * current byte order, into this buffer at the given index.  \u003c/p\u003e\\n     *\\n     * @param  index\\n     *         The index at which the bytes will be written\\n     *\\n     * @param  value\\n     *         The char value to be written\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative\\n     *          or not smaller than the buffer\u0027s limit,\\n     *          minus one\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \"}"}, {"color": "#97c2fc", "id": " abstract void putCharUnchecked(int index, char value)", "label": " abstract void putCharUnchecked(int index, char value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 BEGIN Android-added: {get,put}*Unchecked() accessors.\u0027}"}, {"color": "#97c2fc", "id": "public abstract CharBuffer asCharBuffer()", "label": "public abstract CharBuffer asCharBuffer()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a view of this byte buffer as a char buffer.\\n     *\\n     * \u003cp\u003e The content of the new buffer will start at this buffer\u0027s current\\n     * position.  Changes to this buffer\u0027s content will be visible in the new\\n     * buffer, and vice versa; the two buffers\u0027 position, limit, and mark\\n     * values will be independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s position will be zero, its capacity and its limit\\n     * will be the number of bytes remaining in this buffer divided by\\n     * two, its mark will be undefined, and its byte order will be that\\n     * of the byte buffer at the moment the view is created.  The new buffer\\n     * will be direct if, and only if, this buffer is direct, and it will be\\n     * read-only if, and only if, this buffer is read-only.  \u003c/p\u003e\\n     *\\n     * @return  A new char buffer\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract short getShort()", "label": "public abstract short getShort()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Relative \u003ci\u003eget\u003c/i\u003e method for reading a short value.\\n     *\\n     * \u003cp\u003e Reads the next two bytes at this buffer\u0027s current position,\\n     * composing them into a short value according to the current byte order,\\n     * and then increments the position by two.  \u003c/p\u003e\\n     *\\n     * @return  The short value at the buffer\u0027s current position\\n     *\\n     * @throws  BufferUnderflowException\\n     *          If there are fewer than two bytes\\n     *          remaining in this buffer\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer putShort(short value)", "label": "public abstract ByteBuffer putShort(short value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Relative \u003ci\u003eput\u003c/i\u003e method for writing a short\\n     * value\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e Writes two bytes containing the given short value, in the\\n     * current byte order, into this buffer at the current position, and then\\n     * increments the position by two.  \u003c/p\u003e\\n     *\\n     * @param  value\\n     *         The short value to be written\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferOverflowException\\n     *          If there are fewer than two bytes\\n     *          remaining in this buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abst                           setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
                      });
                  

                  return network;

              }
              drawGraph();
        </script>
