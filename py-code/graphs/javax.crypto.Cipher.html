out standard transformation names.\\n     *\\n     * @param provider the provider.\\n     *\\n     * @return a cipher that implements the requested transformation.\\n     *\\n     * @exception NoSuchAlgorithmException if \u003ccode\u003etransformation\u003c/code\u003e\\n     *          is null, empty, in an invalid format,\\n     *          or if a CipherSpi implementation for the specified algorithm\\n     *          is not available from the specified Provider object.\\n     *\\n     * @exception NoSuchPaddingException if \u003ccode\u003etransformation\u003c/code\u003e\\n     *          contains a padding scheme that is not available.\\n     *\\n     * @exception IllegalArgumentException if the \u003ccode\u003eprovider\u003c/code\u003e\\n     *          is null.\\n     *\\n     * @see java.security.Provider\\n     \u0027}"}, {"color": "#97c2fc", "id": " void updateProviderIfNeeded()", "label": " void updateProviderIfNeeded()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Choose the Spi from the first provider available. Used if\\n     * delayed provider selection is not possible because init()\\n     * is not the first method called.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final Provider getProvider()", "label": "public final Provider getProvider()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the provider of this {@code SecureRandom} object.\\n     *\\n     * @return the provider of this {@code SecureRandom} object.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final String getAlgorithm()", "label": "public final String getAlgorithm()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the algorithm name of this \u003ccode\u003eCipher\u003c/code\u003e object.\\n     *\\n     * \u003cp\u003eThis is the same name that was specified in one of the\\n     * \u003ccode\ 27 throw InvalidParameterExeption if not\u0027}"}, {"color": "#97c2fc", "id": "public final void init(int opmode, Key key) throws InvalidKeyException", "label": "public final void init(int opmode, Key key) throws InvalidKeyException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Initializes this cipher with a key.\\n     *\\n     * \u003cp\u003eThe cipher is initialized for one of the following four operations:\\n     * encryption, decryption, key wrapping or key unwrapping, depending\\n     * on the value of \u003ccode\u003eopmode\u003c/code\u003e.\\n     *\\n     * \u003cp\u003eIf this cipher requires any algorithm parameters that cannot be\\n     * derived from the given \u003ccode\u003ekey\u003c/code\u003e, the underlying cipher\\n     * implementation is supposed to generate the required parameters itself\\n     * (using provider-specific default or random values) if it is being\\n     * initialized for encryption or key wrapping, and raise an\\n     * \u003ccode\u003eInvalidKeyException\u003c/code\u003e if it is being\\n     * initialized for decryption or key unwrapping.\\n     * The generated parameters can be retrieved using\\n     * {@link #getParameters() getParameters} or\\n     * {@link #getIV() getIV} (if the parameter is an IV).\\n     *\\n     * \u003cp\u003eIf this cipher requires algorithm parameters that cannot be\\n     * derived from the input parameters, and there are no reasonable\\n     * provider-specific default values, initialization will\\n     * necessarily fail.\\n     *\\n     * \u003cp\u003eIf this cipher (including its underlying feedback or padding scheme)\\n     * requires any random bytes (e.g., for parameter generation), it will get\\n     * them using the {@link java.security.SecureRandom}\\n     * implementation of the highest-priority\\n     * installed provider as the source of randomness.\\n     * (If none of the installed providers supply an implementation of\\n     * f a {@code SecureRandomSpi}\\n     *         implementation for the specified algorithm is not\\n     *         available from the specified provider\\n     *\\n     * @throws NoSuchProviderException if the specified provider is not\\n     *         registered in the security provider list\\n     *\\n     * @throws NullPointerException if {@code algorithm} is {@code null}\\n     *\\n     * @see Provider\\n     *\\n     * @since 1.2\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static SecureRandom getInstance(String algorithm, Provider provider) throws NoSuchAlgorithmException", "label": "public static SecureRandom getInstance(String algorithm, Provider provider) throws NoSuchAlgorithmException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a {@code SecureRandom} object that implements the specified\\n     * Random Number Generator (RNG) algorithm.\\n     *\\n     * \u003cp\u003e A new {@code SecureRandom} object encapsulating the\\n     * {@code SecureRandomSpi} implementation from the specified {@code Provider}\\n     * object is returned.  Note that the specified {@code Provider} object\\n     * does not have to be registered in the provider list.\\n     *\\n     * @param algorithm the name of the RNG algorithm.\\n     * See the {@code SecureRandom} section in the \u003ca href=\\n     * \"{@docRoot}/../specs/security/standard-names.html#securerandom-number-generation-algorithms\"\u003e\\n     * Java Security Standard Algorithm Names Specification\u003c/a\u003e\\n     * for information about standard RNG algorithm names.\\n     *\\n     * @param provider the provider.\\n     *\\n     * @return the new {@code SecureRandom} object\\n     *\\n     * @throws IllegalArgumentException if the specified provider is\\n     *         {@code null}\\n     *\\n     * @throws NoSuchAlgorithmException if a {@code SecureRandomSpi}\\n     *         implementation for the specified algorithm is not available\\n ty Standard Algorithm Names Specification\u003c/a\u003e\\n     * for information about standard RNG algorithm names.\\n     *\\n     * @param params the {@code SecureRandomParameters}\\n     *               the newly created {@code SecureRandom} object must support.\\n     *\\n     * @return the new {@code SecureRandom} object\\n     *\\n     * @throws IllegalArgumentException if the specified params is\\n     *         {@code null}\\n     *\\n     * @throws NoSuchAlgorithmException if no Provider supports a\\n     *         {@code SecureRandomSpi} implementation for the specified\\n     *         algorithm and parameters\\n     *\\n     * @throws NullPointerException if {@code algorithm} is {@code null}\\n     *\\n     * @see Provider\\n     *\\n     * @since 9\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static SecureRandom getInstance(String algorithm, SecureRandomParameters params, String provider) throws NoSuchAlgorithmException, NoSuchProviderException", "label": "public static SecureRandom getInstance(String algorithm, SecureRandomParameters params, String provider) throws NoSuchAlgorithmException, NoSuchProviderException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a {@code SecureRandom} object that implements the specified\\n     * Random Number Generator (RNG) algorithm and supports the specified\\n     * {@code SecureRandomParameters} request.\\n     *\\n     * \u003cp\u003e A new {@code SecureRandom} object encapsulating the\\n     * {@code SecureRandomSpi} implementation from the specified provider\\n     * is returned.  The specified provider must be registered\\n     * in the security provider list.\\n     *\\n     * \u003cp\u003e Note that the list of registered providers may be retrieved via\\n     * the {@link Security#getProviders() Security.getProviders()} method.\\n     *\\n     * @param algorithm the name of the RNG algorithm.\\n     * See the {@code SecureRandom} section in the \u003ca href=\\n     * \"{@docRoot}/../specs/security/standard-names.html#securerandom-number-generation-algorithms\"\u003e\\n     * Java Security Standard Algorithm Names Specification\u003c/a\u003e\\n     * for information about standard RNG algorithm names.\\n     *\\n     * @param params the {@code SecureRandomParameters}\\n     *               the newly created {@code SecureRandom} object must support.\\n     *\\n     * @param provider the name of the provider.\\n     *\\n     * @return the new {@code SecureRandom} object\\n     *\\n     * @throws IllegalArgumentException if the provider name is {@code null}\\n     *         or empty, or params is {@code null}\\n     *\\n     * @throws NoSuchAlgorithmException if the specified provider does not\\n     *         support a {@code SecureRandomSpi} implementation for the\\n     *         specified algorithm and parameters\\n     *\\n     * @throws NoSuchProviderException if the specified provider is not\\n     *         registered in the security provider list\\n     *\\n     * @throws NullPointerException if {@code algorithm} is {@code null}\\n     *\\n     * @see Provider\\n     *\\n     * @since 9\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static SecureRandom getInstance(String algorithm, SecureRandomParameters params, Provider provider) throws NoSuchAlgorithmException", "label": "public static SecureRandom getInstance(String algorithm, SecureRandomParameters params, Provider provider) throws NoSuchAlgorithmException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a {@code SecureRandom} object that implements the specified\\n     * Random Number Generator (RNG) algorithm and supports the specified\\n     * {@code SecureRandomParameters} request.\\n     *\\n     * \u003cp\u003e A new {@code SecureRandom} object encapsulating the\\n     * {@code SecureRandomSpi} implementation from the specified\\n     * {@code Provider} object is returned.  Note that the specified\\n     * {@code Provider} object does not have to be registered in the\\n     * provider list.\\n     *\\n     * @param algorithm the name of the RNG algorithm.\\n     * See the {@code SecureRandom} section in the \u003ca href=\\n     * \"{@docRoot}/../specs/security/standard-names.html#securerandom-number-generation-algorithms\"\u003e\\n     * Java Security Standard Algorithm Names Specification\u003c/a\u003e\\n     * for information about standard RNG algorithm names.\\n     *\\n     * @param params the {@code SecureRandomParameters}\\n     *               the newly created {@code SecureRandom} object must support.\\n     *\\n     * @param provider the provider.\\n     *\\n     * @return the new {@code SecureRandom} object\\n     *\\n     * @throws IllegalArgumentException if the specified provider or params\\n     *         is {@code null}\\n     *\\n     * @throws NoSuchAlgorithmException if the specified provider does not\\n     *         support a {@code SecureRandomSpi} implementation for the\\n     *         specified algorithm and parameters\\n     *\\n     * @throws NullPointerException if {@code algorithm} is {@code null}\\n     *\\n     * @see Provider\\n     *\\n     * @since 9\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String getAlgorithm()", "label": "public String getAlgorithm()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the name of the algorithm implemented by this\\n     * {@code SecureRandom} object.\\n     *\\n     * @return the name of the algorithm or {@code unknown}\\n     *          if the algorithm name cannot be determined.\\n     * @since 1.5\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String toString()", "label": "public String toString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a Human-readable string representation of this\\n     * {@code SecureRandom}.\\n     *\\n     * @return the string representation\\n     \u0027}"}, {"color": "#97c2fc", "id": "public SecureRandomParameters getParameters()", "label": "public SecureRandomParameters getParameters()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the effective {@link SecureRandomParameters} for this\\n     * {@code SecureRandom} instance.\\n     * \u003cp\u003e\\n     * The returned value can be different from the\\n     * {@code SecureRandomParameters} object passed into a {@code getInstance}\\n     * method, but it cannot change during the lifetime of this\\n     * {@code SecureRandom} object.\\n     * \u003cp\u003e\\n     * A caller can use the returned value to find out what features this\\n     * {@code SecureRandom} supports.\\n     *\\n     * @return the effective {@link SecureRandomParameters} parameters,\\n     * or {@code null} if no parameters were used.\\n     *\\n     * @since 9\\n     * @see SecureRandomSpi\\n     \u0027}"}, {"color": "#97c2fc", "id": "SecureRandomParameters", "label": "SecureRandomParameters", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "public void setSeed(byte[] seed)", "label": "public void setSeed(byte[] seed)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Reseeds this random object with the given seed. The seed supplements,\\n     * rather than replaces, the existing seed. Thus, repeated calls are\\n     * guaranteed never to reduce randomness.\\n     * \u003cp\u003e\\n     * A PRNG {@code SecureRandom} will not seed itself automatically if\\n     * {@code setSeed} is called before any {@code nextBytes} or {@code reseed}\\n     * calls. The caller should make sure that the {@code seed} argument\\n     * contains enough entropy for the security of this {@code SecureRandom}.\\n     *\\n     * @param seed the seed.\\n     *\\n     * @see #getSeed\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void setSeed(long seed)", "label": "public void setSeed(long seed)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Reseeds this random object, using the eight bytes contained\\n     * in the given {@code long seed}. The given seed supplements,\\n     * rather than replaces, the existing seed. Thus, repeated calls\\n     * are guaranteed never to reduce randomness.\\n     *\\n     * \u003cp\u003eThis method is defined for compatibility with\\n     * {@code java.util.Random}.\\n     *\\n     * @param seed the seed.\\n     *\\n     * @see #getSeed\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void nextBytes(byte[] bytes)", "label": "public void nextBytes(byte[] bytes)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Generates a user-specified number of random bytes.\\n     *\\n     * @param bytes the array to be filled in with random bytes.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void nextBytes(byte[] bytes, SecureRandomParameters params)", "label": "public void nextBytes(byte[] bytes, SecureRandomParameters params)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Generates a user-specified number of random bytes with\\n     * additional parameters.\\n     *\\n     * @param bytes the array to be filled in with random bytes\\n     * @param params additional parameters\\n     * @throws NullPointerException if {@code bytes} is null\\n     * @throws UnsupportedOperationException if the underlying provider\\n     *         implementation has not overridden this method\\n     * @throws IllegalArgumentException if {@code params} is {@code null},\\n     *         illegal or unsupported by this {@code SecureRandom}\\n     *\\n     * @since 9\\n     \u0027}"}, {"color": "#97c2fc", "id": "protected final int next(int numBits)", "label": "protected final int next(int numBits)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Generates an integer containing the user-specified number of\\n     * pseudo-random bits (right justified, with leading zeros).  This\\n     * method overrides a {@code java.util.Random} method, and serves\\n     * to provide a source of random bits to all of the methods inherited\\n     * from that class (for example, {@code nextInt},\\n     * {@code nextLong}, and {@code nextFloat}).\\n     *\\n     * @param numBits number of pseudo-random bits to be generated, where\\n     * {@code 0 \u003c= numBits \u003c= 32}.\\n     *\\n     * @return an {@code int} containing the user-specified number\\n     * of pseudo-random bits (right justified, with leading zeros).\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static byte[] getSeed(int numBytes)", "label": "public static byte[] getSeed(int numBytes)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the given number of seed bytes, computed using the seed\\n     * generation algorithm that this class uses to seed itself.  This\\n     * call may be used to seed other random number generators.\\n     *\\n     * \u003cp\u003eThis method is only included for backwards compatibility.\\n     * The caller is encouraged to use one of the alternative\\n     * {@code getInstance} methods to obtain a {@code SecureRandom} object, and\\n     * then call the {@code generateSeed} method to obtain seed bytes\\n     * from that object.\\n     *\\n     * @param numBytes the number of seed bytes to generate.\\n     *\\n     * @throws IllegalArgumentException if {@code numBytes} is negative\\n     * @return the seed bytes.\\n     *\\n     * @see #setSeed\\n     \u0027}"}, {"color": "#97c2fc", "id": "public byte[] generateSeed(int numBytes)", "label": "public byte[] generateSeed(int numBytes)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the given number of seed bytes, computed using the seed\\n     * generation algorithm that this class uses to seed itself.  This\\n     * call may be used to seed other random number generators.\\n     *\\n     * @param numBytes the number of seed bytes to generate.\\n     * @throws IllegalArgumentException if {@code numBytes} is negative\\n     * @return the seed bytes.\\n     \u0027}"}, {"color": "#97c2fc", "id": "private static byte[] longToByteArray(long l)", "label": "private static byte[] longToByteArray(long l)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Helper function to convert a long into a byte array (least significant\\n     * byte first).\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static SecureRandom getInstanceStrong() throws NoSuchAlgorithmException", "label": "public static SecureRandom getInstanceStrong() throws NoSuchAlgorithmException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a {@code SecureRandom} object.\\n     *\\n     * In Android this is equivalent to get a SHA1PRNG from AndroidOpenSSL.\\n     *\\n     * Some situations require strong random values, such as when\\n     * creating high-value/long-lived secrets like RSA public/private\\n     * keys.  To help guide applications in selecting a suitable strong\\n     * {@code SecureRandom} implementation, Java distributions\\n     * include a list of known strong {@code SecureRandom}\\n     * implementations in the {@code securerandom.strongAlgorithms}\\n     * Security property.\\n     * \u003cp\u003e\\n     * Every implementation of the Java platform is required to\\n     * support at least one strong {@code SecureRandom} implementation.\\n     *\\n     * @return a strong {@code SecureRandom} implementation\\n     *\\n     * @throws NoSuchAlgorithmException if no algorithm is available\\n     *\\n     * @see Security#getProperty(String)\\n     *\\n     * @since 1.8\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void reseed()", "label": "public void reseed()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Reseeds this {@code SecureRandom} with entropy input read from its\\n     * entropy source.\\n     *\\n     * @throws UnsupportedOperationException if the underlying provider\\n     *         implementation has not overridden this method.\\n     *\\n     * @since 9\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void reseed(SecureRandomParameters params)", "label": "public void reseed(SecureRandomParameters params)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Reseeds this {@code SecureRandom} with entropy input read from its\\n     * entropy source with additional parameters.\\n     * \u003cp\u003e\\n     * Note that entropy is obtained from an entropy source. While\\n     * some data in {@code params} may contain entropy, its main usage is to\\n     * provide diversity.\\n     *\\n     * @param params extra parameters\\n     * @throws UnsupportedOperationException if the underlying provider\\n     *         implementation has not overridden this method.\\n     * @throws IllegalArgumentException if {@code params} is {@code null},\\n     *         illegal or unsupported by this {@code SecureRandom}\\n     *\\n     * @since 9\\n     \u0027}"}, {"color": "#97c2fc", "id": "getIV()", "label": "getIV()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "getParameters()", "label": "getParameters()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public final void init(int opmode, Key key, SecureRandom random) throws InvalidKeyException", "label": "public final void init(int opmode, Key key, SecureRandom random) throws InvalidKeyException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Initializes this cipher with a key and a source of randomness.\\n     *\\n     * \u003cp\u003eThe cipher is initialized for one of the following four operations:\\n     * encryption, decryption, key wrapping or  key unwrapping, depending\\n     * on the value of \u003ccode\u003eopmode\u003c/code\u003e.\\n     *\\n     * \u003cp\u003eIf this cipher requires any algorithm parameters that cannot be\\n     * derived from the given \u003ccode\u003ekey\u003c/code\u003e, the underlying cipher\\n     * implementation is supposed to generate the required parameters itself\\n     * (using provider-specific default or random values) if it is being\\n     * initialized for encryption or key wrapping, and raise an\\n     * \u003ccode\u003eInvalidKeyException\u003c/code\u003e if it is being\\n     * initialized for decryption or key unwrapping.\\n     * The generated parameters can be retrieved using\\n     * {@link #getParameters() getParameters} or\\n     * {@link #getIV() getIV} (if the parameter is an IV).\\n     *\\n     * \u003cp\u003eIf this cipher requires algorithm parameters that cannot be\\n     * derived from the input parameters, and there are no reasonable\\n     * provider-specific default values, initialization will\\n     * necessarily fail.\\n     *\\n     * \u003cp\u003eIf this cipher (including its underlying feedback or padding scheme)\\n     * requires any random bytes (e.g., for parameter generation), it will get\\n     * them from \u003ccode\u003erandom\u003c/code\u003e.\\n     *\\n     * \u003cp\u003eNote that when a Cipher object is initialized, it loses all\\n     * previously-acquired state. In other words, initializing a Cipher is\\n     * equivalent to creating a new instance of that Cipher and initializing\\n     * it.\\n     *\\n     * @param opmode the operation mode of this cipher (this is one of the\\n     * following:\\n     * \u003ccode\u003eENCRYPT_MODE\u003c/code\u003e, \u003ccode\u003eDECRYPT_MODE\u003c/code\u003e,\\n     * \u003ccode\u003eWRAP_MODE\u003c/code\u003e or \u003ccode\u003eUNWRAP_MODE\u003c/code\u003e)\\n     * @param key the encryption key\\n     * @param random the source of randomness\\n     *\\n     * @exception InvalidKeyException if the given key is inappropriate for\\n     * initializing this cipher, or requires\\n     * algorithm parameters that cannot be\\n     * determined from the given key, or if the given key has a keysize that\\n     * exceeds the maximum allowable keysize (as determined from the\\n     * configured jurisdiction policy files).\\n     * @throws UnsupportedOperationException if (@code opmode} is\\n     * {@code WRAP_MODE} or {@code UNWRAP_MODE} but the mode is not implemented\\n     * by the underlying {@code CipherSpi}.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final void init(int opmode, Key key, AlgorithmParameterSpec params) throws InvalidKeyException, InvalidAlgorithmParameterException", "label": "public final void init(int opmode, Key key, AlgorithmParameterSpec params) throws InvalidKeyException, InvalidAlgorithmParameterException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Initializes this cipher with a key and a set of algorithm\\n     * parameters.\\n     *\\n     * \u003cp\u003eThe cipher is initialized for one of the following four operations:\\n     * encryption, decryption, key wrapping or  key unwrapping, depending\\n     * on the value of \u003ccode\u003eopmode\u003c/code\u003e.\\n     *\\n     * \u003cp\u003eIf this cipher requires any algorithm parameters and\\n     * \u003ccode\u003eparams\u003c/code\u003e is null, the underlying cipher implementation is\\n     * supposed to generate the required parameters itself (using\\n     * provider-specific default or random values) if it is being\\n     * initialized for encryption or key wrapping, and raise an\\n     * \u003ccode\u003eInvalidAlgorithmParameterException\u003c/code\u003e if it is being\\n     * initialized for decryption or key unwrapping.\\n     * The generated parameters can be retrieved using\\n     * {@link #getParameters() getParameters} or\\n     * {@link #getIV() getIV} (if the parameter is an IV).\\n     *\\n     * \u003cp\u003eIf this cipher requires algorithm parameters that cannot be\\n     * derived from the input parameters, and there are no reasonable\\n     * provider-specific default values, initialization will\\n     * necessarily fail.\\n     *\\n     * \u003cp\u003eIf this cipher (including its underlying feedback or padding scheme)\\n     * requires any random bytes (e.g., for parameter generation), it will get\\n     * them using the {@link java.security.SecureRandom}\\n     * implementation of the highest-priority\\n     * installed provider as the source of randomness.\\n     * (If none of the installed providers supply an implementation of\\n     * SecureRandom, a system-provided source of randomness will be used.)\\n     *\\n     * \u003cp\u003eNote that when a Cipher object is initialized, it loses all\\n     * previously-acquired state. In other words, initializing a Cipher is\\n     * equivalent to creating a new instance of that Cipher and initializing\\n     * it.\\n     *\\n     * @param opmode the operation mode of this cipher (this is one of the\\n     * following:\\n     * \u003ccode\u003eENCRYPT_MODE\u003c/code\u003e, \u003ccode\u003eDECRYPT_MODE\u003c/code\u003e,\\n     * \u003ccode\u003eWRAP_MODE\u003c/code\u003e or \u003ccode\u003eUNWRAP_MODE\u003c/code\u003e)\\n     * @param key the encryption key\\n     * @param params the algorithm parameters\\n     *\\n     * @exception InvalidKeyException if the given key is inappropriate for\\n     * initializing this cipher, or its keysize exceeds the maximum allowable\\n     * keysize (as determined from the configured jurisdiction policy files).\\n     * @exception InvalidAlgorithmParameterException if the given algorithm\\n     * parameters are inappropriate for this cipher,\\n     * or this cipher requires\\n     * algorithm parameters and \u003ccode\u003eparams\u003c/code\u003e is null, or the given\\n     * algorithm parameters imply a cryptographic strength that would exceed\\n     * the legal limits (as determined from the configured jurisdiction\\n     * policy files).\\n     * @throws UnsupportedOperationException if (@code opmode} is\\n     * {@code WRAP_MODE} or {@code UNWRAP_MODE} but the mode is not implemented\\n     * by the underlying {@code CipherSpi}.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final void init(int opmode, Key key, AlgorithmParameterSpec params, SecureRandom random) throws InvalidKeyException, InvalidAlgorithmParameterException", "label": "public final void init(int opmode, Key key, AlgorithmParameterSpec params, SecureRandom random) throws InvalidKeyException, InvalidAlgorithmParameterException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Initializes this cipher with a key, a set of algorithm\\n     * parameters, and a source of randomness.\\n     *\\n     * \u003cp\u003eThe cipher is initialized for one of the following four operations:\\n     * encryption, decryption, key wrapping or  key unwrapping, depending\\n     * on the value of \u003ccode\u003eopmode\u003c/code\u003e.\\n     *\\n     * \u003cp\u003eIf this cipher requires any algorithm parameters and\\n     * \u003ccode\u003eparams\u003c/code\u003e is null, the underlying cipher implementation is\\n     * supposed to generate the required parameters itself (using\\n     * provider-specific default or random values) if it is being\\n     * initialized for encryption or key wrapping, and raise an\\n     * \u003ccode\u003eInvalidAlgorithmParameterException\u003c/code\u003e if it is being\\n     * initialized for decryption or key unwr c final byte[] update(byte[] input)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Continues a multiple-part encryption or decryption operation\\n     * (depending on how this cipher was initialized), processing another data\\n     * part.\\n     *\\n     * \u003cp\u003eThe bytes in the \u003ccode\u003einput\u003c/code\u003e buffer are processed, and the\\n     * result is stored in a new buffer.\\n     *\\n     * \u003cp\u003eIf \u003ccode\u003einput\u003c/code\u003e has a length of zero, this method returns\\n     * \u003ccode\u003enull\u003c/code\u003e.\\n     *\\n     * @param input the input buffer\\n     *\\n     * @return the new buffer with the result, or null if the underlying\\n     * cipher is a block cipher and the input data is too short to result in a\\n     * new block.\\n     *\\n     * @exception IllegalStateException if this cipher is in a wrong state\\n     * (e.g., has not been initialized)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final byte[] update(byte[] input, int inputOffset, int inputLen)", "label": "public final byte[] update(byte[] input, int inputOffset, int inputLen)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Continues a multiple-part encryption or decryption operation\\n     * (depending on how this cipher was initialized), processing another data\\n     * part.\\n     *\\n     * \u003cp\u003eThe first \u003ccode\u003einputLen\u003c/code\u003e bytes in the \u003ccode\u003einput\u003c/code\u003e\\n     * buffer, starting at \u003ccode\u003einputOffset\u003c/code\u003e inclusive, are processed,\\n     * and the result is stored in a new buffer.\\n     *\\n     * \u003cp\u003eIf \u003ccode\u003einputLen\u003c/code\u003e is zero, this method returns\\n     * \u003ccode\u003enull\u003c/code\u003e.\\n     *\\n     * @param input the input buffer\\n     * @param inputOffset the offset in \u003ccode\u003einput\u003c                           if (popupTimeout !== null) {

                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
