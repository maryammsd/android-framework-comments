        <center>
          <h1></h1>
        </center>
        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             

             

             
        </style>

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "android.content.pm.PackageInfo", "label": "android.content.pm.PackageInfo", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * Overall information about the contents of a package.  This corresponds\\n * to all of the information collected from AndroidManifest.xml.\\n \u0027}"}, {"color": "#97c2fc", "id": "public long getLongVersionCode()", "label": "public long getLongVersionCode()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Return {@link android.R.styleable#AndroidManifest_versionCode versionCode} and\\n     * {@link android.R.styleable#AndroidManifest_versionCodeMajor versionCodeMajor} combined\\n     * together as a single long value.  The\\n     * {@link android.R.styleable#AndroidManifest_versionCodeMajor versionCodeMajor} is placed in\\n     * the upper 32 bits.\\n     \u0027}"}, {"color": "#97c2fc", "id": "AndroidManifest_versionCode", "label": "AndroidManifest_versionCode", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "AndroidManifest_versionCodeMajor", "label": "AndroidManifest_versionCodeMajor", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public void setLongVersionCode(long longVersionCode)", "label": "public void setLongVersionCode(long longVersionCode)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Set the full version code in this PackageInfo, updating {@link #versionCode}\\n     * with the lower bits.\\n     * @see #getLongVersionCode()\\n     \u0027}"}, {"color": "#97c2fc", "id": "versionCode", "label": "versionCode", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public long getArchiveTimeMillis()", "label": "public long getArchiveTimeMillis()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the time at which the app was archived for the user.  Units are as\\n     * per {@link System#currentTimeMillis()}.\\n     \u0027}"}, {"color": "#97c2fc", "id": "currentTimeMillis()", "label": "currentTimeMillis()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public String getApexPackageName()", "label": "public String getApexPackageName()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * If the package is an APEX package (i.e. the value of {@link #isApex}\\n     * is true), returns the package name of the APEX. If the package\\n     * is one APK-in-APEX app, returns the package name of the parent\\n     * APEX that contains the app. If the package is not one of the above\\n     * two cases, returns {@code null}.\\n     \u0027}"}, {"color": "#97c2fc", "id": "isApex", "label": "isApex", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "android.content.pm.PackageInfo", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public long getLongVersionCode()"}, {"arrows": "to", "from": "android.content.pm.PackageInfo", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void setLongVersionCode(long longVersionCode)"}, {"arrows": "to", "from": "android.content.pm.PackageInfo", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public long getArchiveTimeMillis()"}, {"arrows": "to", "from": "android.content.pm.PackageInfo", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public String getApexPackageName()"}, {"arrows": "to", "from": "public long getLongVersionCode()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "AndroidManifest_versionCode"}, {"arrows": "to", "from": "public long getLongVersionCode()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "AndroidManifest_versionCodeMajor"}, {"arrows": "to", "from": "public void setLongVersionCode(long longVersionCode)", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "versionCode"}, {"arrows": "to", "from": "public long getArchiveTimeMillis()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "currentTimeMillis()"}, {"arrows": "to", "from": "public String getApexPackageName()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "isApex"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
