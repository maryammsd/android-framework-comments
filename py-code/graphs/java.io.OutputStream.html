        <center>
          <h1></h1>

        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "java.io.OutputStream", "label": "java.io.OutputStream", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * This abstract class is the superclass of all classes representing\\n * an output stream of bytes. An output stream accepts output bytes\\n * and sends them to some sink.\\n * \u003cp\u003e\\n * Applications that need to define a subclass of\\n * {@code OutputStream} must always provide at least a method\\n * that writes one byte of output.\\n *\\n * @author  Arthur van Hoff\\n * @see     java.io.BufferedOutputStream\\n * @see     java.io.ByteArrayOutputStream\\n * @see     java.io.DataOutputStream\\n * @see     java.io.FilterOutputStream\\n * @see     java.io.InputStream\\n * @see     java.io.OutputStream#write(int)\\n * @since   1.0\\n \u0027}"}, {"color": "#97c2fc", "id": "public static OutputStream nullOutputStream()", "label": "public static OutputStream nullOutputStream()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a new {@code OutputStream} which discards all bytes.  The\\n     * returned stream is initially open.  The stream is closed by calling\\n     * the {@code close()} method.  Subsequent calls to {@code close()} have\\n     * no effect.\\n     *\\n     * \u003cp\u003e While the stream is open, the {@code write(int)}, {@code\\n     * write(byte[])}, and {@code write(byte[], int, int)} methods do nothing.\\n     * After the stream has been closed, these methods all throw {@code\\n     * IOException}.\\n     *\\n     * \u003cp\u003e The {@code flush()} method does nothing.\\n     *\\n     * @return an {@code OutputStream} which discards all bytes\\n     *\\n     * @since 11\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract void write(int b) throws IOException", "label": "public abstract void write(int b) throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Writes the specified byte to this output stream. The general\\n     * contract for {@code write} is that one byte is written\\n     * to the output stream. The byte to be written is the eight\\n     * low-order bits of the argument {@code b}. The 24\\n     * high-order bits of {@code b} are ignored.\\n     * \u003cp\u003e\\n     * Subclasses of {@code OutputStream} must provide an\\n     * implementation for this method.\\n     *\\n     * @param      b   the {@code byte}.\\n     * @throws     IOException  if an I/O error occurs. In particular,\\n     *             an {@code IOException} may be thrown if the\\n     *             output stream has been closed.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void write(byte[] b) throws IOException", "label": "public void write(byte[] b) throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Writes {@code b.length} bytes from the specified byte array\\n     * to this output stream. The general contract for {@code write(b)}\\n     * is that it should have exactly the same effect as the call\\n     * {@code write(b, 0, b.length)}.\\n     *\\n     * @param      b   the data.\\n     * @throws     IOException  if an I/O error occurs.\\n     * @see        java.io.OutputStream#write(byte[], int, int)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void write(byte[] b, int off, int len) throws IOException", "label": "public void write(byte[] b, int off, int len) throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Writes {@code len} bytes from the specified byte array\\n     * starting at offset {@code off} to this output stream.\\n     * The general contract for {@code write(b, off, len)} is that\\n     * some of the bytes in the array {@code b} are written to the\\n     * output stream in order; element {@code b[off]} is the first\\n     * byte written and {@code b[off+len-1]} is the last byte written\\n     * by this operation.\\n     * \u003cp\u003e\\n     * The {@code write} method of {@code OutputStream} calls\\n     * the write method of one argument on each of the bytes to be\\n     * written out. Subclasses are encouraged to override this method and\\n     * provide a more efficient implementation.\\n     * \u003cp\u003e\\n     * If {@code b} is {@code null}, a\\n     * {@code NullPointerException} is thrown.\\n     * \u003cp\u003e\\n     * If {@code off} is negative, or {@code len} is negative, or\\n     * {@code off+len} is greater than the length of the array\\n     * {@code b}, then an {@code IndexOutOfBoundsException} is thrown.\\n     *\\n     * @param      b     the data.\\n     * @param      off   the start offset in the data.\\n     * @param      len   the number of bytes to write.\\n     * @throws     IOException  if an I/O error occurs. In particular,\\n     *             an {@code IOException} is thrown if the output\\n     *             stream is closed.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void flush() throws IOException", "label": "public void flush() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Flushes this output stream and forces any buffered output bytes\\n     * to be written out. The general contract of {@code flush} is\\n     * that calling it is an indication that, if any bytes previously\\n     * written have been buffered by the implementation of the output\\n     * stream, such bytes should immediately be written to their\\n     * intended destination.\\n     * \u003cp\u003e\\n     * If the intended destination of this stream is an abstraction provided by\\n     * the underlying operating system, for example a file, then flushing the\\n     * stream guarantees only that bytes previously written to the stream are\\n     * passed to the operating system for writing; it does not guarantee that\\n     * they are actually written to a physical device such as a disk drive.\\n     * \u003cp\u003e\\n     * The {@code flush} method of {@code OutputStream} does nothing.\\n     *\\n     * @throws     IOException  if an I/O error occurs.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void close() throws IOException", "label": "public void close() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Closes this output stream and releases any system resources\\n     * associated with this stream. The general contract of {@code close}\\n     * is that it closes the output stream. A closed stream cannot perform\\n     * output operations and cannot be reopened.\\n     * \u003cp\u003e\\n     * The {@code close} method of {@code OutputStream} does nothing.\\n     *\\n     * @throws     IOException  if an I/O error occurs.\\n     \u0027}"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "java.io.OutputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static OutputStream nullOutputStream()"}, {"arrows": "to", "from": "java.io.OutputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public abstract void write(int b) throws IOException"}, {"arrows": "to", "from": "java.io.OutputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void write(byte[] b) throws IOException"}, {"arrows": "to", "from": "java.io.OutputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void write(byte[] b, int off, int len) throws IOException"}, {"arrows": "to", "from": "java.io.OutputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void flush() throws IOException"}, {"arrows": "to", "from": "java.io.OutputStream", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void close() throws IOException"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
