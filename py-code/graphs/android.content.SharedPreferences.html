        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             

             

             
             /* position absolute is important and the container has to be relative or absolute as well. */
          div.popup {
                 position:absolute;
                 top:0px;
                 left:0px;
                 display:none;
                 background-color:#f5f4ed;
                 -moz-border-radius: 3px;
                 -webkit-border-radius: 3px;
                 border-radius: 3px;
                 border: 1px solid #808074;
                 box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
          }

          /* hide the original tooltip */
          .vis-tooltip {
            display:none;
          }

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "android.content.SharedPreferences", "label": "android.content.SharedPreferences", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * Interface for accessing and modifying preference data returned by {@link\\n * Context#getSharedPreferences}.  For any particular set of preferences,\\n * there is a single instance of this class that all clients share.\\n * Modifications to the preferences must go through an {@link Editor} object\\n * to ensure the preference values remain in a consistent state and control\\n * when they are committed to storage.  Objects that are returned from the\\n * various \u003ccode\u003eget\u003c/code\u003e methods must be treated as immutable by the application.\\n *\\n * \u003cp\u003eSharedPreferences is best suited to storing data about how the user prefers\\n * to experience the app, for example, whether the user prefers a particular UI theme\\n * or whether they prefer viewing particular content in a list vs. a grid. To this end,\\n * SharedPreferences reflects changes {@link Editor#commit() committed} or\\n * {@link Editor#apply() applied} by {@link Editor}s \u003cem\u003eimmediately\u003c/em\u003e, potentially\\n * before those changes are durably persisted.\\n * Under some circumstances such as app crashes or termination these changes may be lost,\\n * even if an {@link OnSharedPreferenceChangeListener} reported the change was successful.\\n * SharedPreferences is not recommended for storing data that is sensitive to this\\n * kind of rollback to a prior state such as user security or privacy settings.\\n * For other high-level data persistence options, see\\n * \u003ca href=\"https://d.android.com/room\"\u003eRoom\u003c/a\u003e or\\n * \u003ca href=\"https://d.android.com/datastore\"\u003eDataStore\u003c/a\u003e.\\n *\\n * \u003cp\u003e\u003cem\u003eNote:\u003c/em\u003e Common implementations guarantee that outstanding edits to preference\\n * files are persisted to disk when host Activities become stopped. In some situations\\n * (e.g. performing many {@link Editor#commit()} or {@link Editor#apply()}\\n * operations just prior to navigating away from the host Activity) this can lead\\n * to blocking the main thread during lifecycle transition events and associated\\n * ANR errors. For more details see the documentation for {@link Editor#commit()} and\\n * {@link Editor#apply()}.\\n *\\n * \u003cp\u003e\u003cem\u003eNote: This class does not support use across multiple processes.\u003c/em\u003e\\n *\\n * \u003cdiv class=\"special reference\"\u003e\\n * \u003ch3\u003eDeveloper Guides\u003c/h3\u003e\\n * \u003cp\u003eFor more information about using SharedPreferences, read the\\n * \u003ca href=\"{@docRoot}guide/topics/data/data-storage.html#pref\"\u003eData Storage\u003c/a\u003e\\n * developer guide.\u003c/p\u003e\u003c/div\u003e\\n *\\n * @see Context#getSharedPreferences\\n \u0027}"}, {"color": "#97c2fc", "id": " Map\u003cString, ?\u003e getAll()", "label": " Map\u003cString, ?\u003e getAll()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Retrieve all values from the preferences.\\n     *\\n     * \u003cp\u003eNote that you \u003cem\u003emust not\u003c/em\u003e modify the collection returned\\n     * by this method, or alter any of its contents.  The consistency of your\\n     * stored data is not guaranteed if you do.\\n     *\\n     * @return Returns a map containing a list of pairs key/value representing\\n     * the preferences.\\n     *\\n     * @throws NullPointerException\\n     \u0027}"}, {"color": "#97c2fc", "id": " String getString(String key, @Nullable String defValue)", "label": " String getString(String key, @Nullable String defValue)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Retrieve a String value from the preferences.\\n     * \\n     * @param key The name of the preference to retrieve.\\n     * @param defValue Value to return if this preference does not exist.\\n     * \\n     * @return Returns the preference value if it exists, or defValue.  Throws\\n     * ClassCastException if there is a preference with this name that is not\\n     * a String.\\n     * \\n     * @throws ClassCastException\\n     \u0027}"}, {"color": "#97c2fc", "id": " Set\u003cString\u003e getStringSet(String key, @Nullable Set\u003cString\u003e defValues)", "label": " Set\u003cString\u003e getStringSet(String key, @Nullable Set\u003cString\u003e defValues)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Retrieve a set of String values from the preferences.\\n     * \\n     * \u003cp\u003eNote that you \u003cem\u003emust not\u003c/em\u003e modify the set instance returned\\n     * by this call.  The consistency of the stored data is not guaranteed\\n     * if you do, nor is your ability to modify the instance at all.\\n     *\\n     * @param key The name of the preference to retrieve.\\n     * @param defValues Values to return if this preference does not exist.\\n     * \\n     * @return Returns the preference values if they exist, or defValues.\\n     * Throws ClassCastException if there is a preference with this name\\n     * that is not a Set.\\n     * \\n     * @throws ClassCastException\\n     \u0027}"}, {"color": "#97c2fc", "id": " int getInt(String key, int defValue)", "label": " int getInt(String key, int defValue)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Retrieve an int value from the preferences.\\n     * \\n     * @param key The name of the preference to retrieve.\\n     * @param defValue Value to return if this preference does not exist.\\n     * \\n     * @return Returns the preference value if it exists, or defValue.  Throws\\n     * ClassCastException if there is a preference with this name that is not\\n     * an int.\\n     * \\n     * @throws ClassCastException\\n     \u0027}"}, {"color": "#97c2fc", "id": " long getLong(String key, long defValue)", "label": " long getLong(String key, long defValue)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Retrieve a long value from the preferences.\\n     * \\n     * @param key The name of the preference to retrieve.\\n     * @param defValue Value to return if this preference does not exist.\\n     * \\n     * @return Returns the preference value if it exists, or defValue.  Throws\\n     * ClassCastException if there is a preference with this name that is not\\n     * a long.\\n     * \\n     * @throws ClassCastException\\n     \u0027}"}, {"color": "#97c2fc", "id": " float getFloat(String key, float defValue)", "label": " float getFloat(String key, float defValue)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Retrieve a float value from the preferences.\\n     * \\n     * @param key The name of the preference to retrieve.\\n     * @param defValue Value to return if this preference does not exist.\\n     * \\n     * @return Returns the preference value if it exists, or defValue.  Throws\\n     * ClassCastException if there is a preference with this name that is not\\n     * a float.\\n     * \\n     * @throws ClassCastException\\n     \u0027}"}, {"color": "#97c2fc", "id": " boolean getBoolean(String key, boolean defValue)", "label": " boolean getBoolean(String key, boolean defValue)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Retrieve a boolean value from the preferences.\\n     * \\n     * @param key The name of the preference to retrieve.\\n     * @param defValue Value to return if this preference does not exist.\\n     * \\n     * @return Returns the preference value if it exists, or defValue.  Throws\\n     * ClassCastException if there is a preference with this name that is not\\n     * a boolean.\\n     * \\n     * @throws ClassCastException\\n     \u0027}"}, {"color": "#97c2fc", "id": " boolean contains(String key)", "label": " boolean contains(String key)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Checks whether the preferences contains a preference.\\n     * \\n     * @param key The name of the preference to check.\\n     * @return Returns true if the preference exists in the preferences,\\n     *         otherwise false.\\n     \u0027}"}, {"color": "#97c2fc", "id": " Editor edit()", "label": " Editor edit()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Create a new Editor for these preferences, through which you can make\\n     * modifications to the data in the preferences and atomically commit those\\n     * changes back to the SharedPreferences object.\\n     * \\n     * \u003cp\u003eNote that you \u003cem\u003emust\u003c/em\u003e call {@link Editor#commit} to have any\\n     * changes you perform in the Editor actually show up in the\\n     * SharedPreferences.\\n     * \\n     * @return Returns a new instance of the {@link Editor} interface, allowing\\n     * you to modify the values in this SharedPreferences object.\\n     \u0027}"}, {"color": "#97c2fc", "id": "commit", "label": "commit", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "Editor", "label": "Editor", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": " void registerOnSharedPreferenceChangeListener(OnSharedPreferenceChangeListener listener)", "label": " void registerOnSharedPreferenceChangeListener(OnSharedPreferenceChangeListener listener)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Registers a callback to be invoked when a change happens to a preference.\\n     *\\n     * \u003cp class=\"caution\"\u003e\u003cstrong\u003eCaution:\u003c/strong\u003e The preference manager does\\n     * not currently store a strong reference to the listener. You must store a\\n     * strong reference to the listener, or it will be susceptible to garbage\\n     * collection. We recommend you keep a reference to the listener in the\\n     * instance data of an object that will exist as long as you need the\\n     * listener.\u003c/p\u003e\\n     *\\n     * @param listener The callback that will run.\\n     * @see #unregisterOnSharedPreferenceChangeListener\\n     \u0027}"}, {"color": "#97c2fc", "id": " void unregisterOnSharedPreferenceChangeListener(OnSharedPreferenceChangeListener listener)", "label": " void unregisterOnSharedPreferenceChangeListener(OnSharedPreferenceChangeListener listener)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Unregisters a previous callback.\\n     *\\n     * @param listener The callback that should be unregistered.\\n     * @see #registerOnSharedPreferenceChangeListener\\n     \u0027}"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "android.content.SharedPreferences", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " Map\u003cString, ?\u003e getAll()"}, {"arrows": "to", "from": "android.content.SharedPreferences", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " String getString(String key, @Nullable String defValue)"}, {"arrows": "to", "from": "android.content.SharedPreferences", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " Set\u003cString\u003e getStringSet(String key, @Nullable Set\u003cString\u003e defValues)"}, {"arrows": "to", "from": "android.content.SharedPreferences", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " int getInt(String key, int defValue)"}, {"arrows": "to", "from": "android.content.SharedPreferences", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " long getLong(String key, long defValue)"}, {"arrows": "to", "from": "android.content.SharedPreferences", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " float getFloat(String key, float defValue)"}, {"arrows": "to", "from": "android.content.SharedPreferences", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " boolean getBoolean(String key, boolean defValue)"}, {"arrows": "to", "from": "android.content.SharedPreferences", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " boolean contains(String key)"}, {"arrows": "to", "from": "android.content.SharedPreferences", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " Editor edit()"}, {"arrows": "to", "from": "android.content.SharedPreferences", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " void registerOnSharedPreferenceChangeListener(OnSharedPreferenceChangeListener listener)"}, {"arrows": "to", "from": "android.content.SharedPreferences", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": " void unregisterOnSharedPreferenceChangeListener(OnSharedPreferenceChangeListener listener)"}, {"arrows": "to", "from": " Editor edit()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "commit"}, {"arrows": "to", "from": " Editor edit()", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "Editor"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
        </script>
