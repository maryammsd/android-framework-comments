        <center>
          <h1></h1>

        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             

             

             
             /* position absolute is important and the container has to be relative or absolute as well. */
          div.popup {
                 position:absolute;
                 top:0px;
                 left:0px;
                 display:none;
                 background-color:#f5f4ed;
                 -moz-border-radius: 3px;
                 -webkit-border-radius: 3px;
                 border-radius: 3px;
                 border: 1px solid #808074;
                 box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
          }

          /* hide the original tooltip */
          .vis-tooltip {
            display:none;
          }
             
        </style>

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "android.widget.Button", "label": "android.widget.Button", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * A user interface element the user can tap or click to perform an action.\\n *\\n * \u003cp\u003eTo display a button in an activity, add a button to the activity\\\u0027s layout XML file:\u003c/p\u003e\\n *\\n * \u003cpre\u003e\\n * \u0026lt;Button\\n *     android:id=\"@+id/button_id\"\\n *     android:layout_height=\"wrap_content\"\\n *     android:layout_width=\"wrap_content\"\\n *     android:text=\"@string/self_destruct\" /\u0026gt;\u003c/pre\u003e\\n *\\n * \u003cp\u003eTo specify an action when the button is pressed, set a click\\n * listener on the button object in the corresponding activity code:\u003c/p\u003e\\n *\\n * \u003cpre\u003e\\n * public class MyActivity extends Activity {\\n *     protected void onCreate(Bundle savedInstanceState) {\\n *         super.onCreate(savedInstanceState);\\n *\\n *         setContentView(R.layout.content_layout_id);\\n *\\n *         final Button button = findViewById(R.id.button_id);\\n *         button.setOnClickListener(new View.OnClickListener() {\\n *             public void onClick(View v) {\\n *                 // Code here executes on main thread after user presses button\\n *             }\\n *         });\\n *     }\\n * }\u003c/pre\u003e\\n *\\n * \u003cp\u003eThe above snippet creates an instance of {@link android.view.View.OnClickListener} and wires\\n * the listener to the button using\\n * {@link #setOnClickListener setOnClickListener(View.OnClickListener)}.\\n * As a result, the system executes the code you write in {@code onClick(View)} after the\\n * user presses the button.\u003c/p\u003e\\n *\\n * \u003cp class=\"note\"\u003eThe system executes the code in {@code onClick} on the\\n * \u003ca href=\"{@docRoot}guide/components/processes-and-threads.html#Threads\"\u003emain thread\u003c/a\u003e.\\n * This means your onClick code must execute quickly to avoid delaying your app\\\u0027s response\\n * to further user actions.  See\\n * \u003ca href=\"{@docRoot}training/articles/perf-anr.html\"\u003eKeeping Your App Responsive\u003c/a\u003e\\n * for more details.\u003c/p\u003e\\n *\\n * \u003cp\u003eEvery button is styled using the system\\\u0027s default button background, which is often\\n * different from one version of the platform to another. If you are not satisfied with the\\n * default button style, you can customize it. For more details and code samples, see the\\n * \u003ca href=\"{@docRoot}guide/topics/ui/controls/button.html#Style\"\u003eStyling Your Button\u003c/a\u003e\\n * guide.\u003c/p\u003e\\n *\\n * \u003cp\u003eFor all XML style attributes available on Button see\\n * {@link android.R.styleable#Button Button Attributes},\\n * {@link android.R.styleable#TextView TextView Attributes},\\n * {@link android.R.styleable#View View Attributes}.  See the\\n * \u003ca href=\"{@docRoot}guide/topics/ui/themes.html#ApplyingStyles\"\u003eStyles and Themes\u003c/a\u003e\\n * guide to learn how to implement and organize overrides to style-related attributes.\u003c/p\u003e\\n \u0027}"}]);
                  edges = new vis.DataSet([]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
