27}"}, {"color": "#97c2fc", "id": " Iterator\u003cE\u003e iterator()", "label": " Iterator\u003cE\u003e iterator()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns an iterator over the elements in this list in proper sequence.\\n     *\\n     * @return an iterator over the elements in this list in proper sequence\\n     \u0027}"}, {"color": "#97c2fc", "id": " Object[] toArray()", "label": " Object[] toArray()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns an array containing all of the elements in this list in proper\\n     * sequence (from first to last element).\\n     *\\n     * \u003cp\u003eThe returned array will be \"safe\" in that no references to it are\\n     * maintained by this list.  (In other words, this method must\\n     * allocate a new array even if this list is backed by an array).\\n     * The caller is thus free to modify the returned array.\\n     *\\n     * \u003cp\u003eThis method acts as bridge between array-based and collection-based\\n     * APIs.\\n     *\\n     * @return an array containing all of the elements in this list in proper\\n     *         sequence\\n     * @see Arrays#asList(Object[])\\n     \u0027}"}, {"color": "#97c2fc", "id": " T[] toArray(T[] a)", "label": " T[] toArray(T[] a)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns an array containing all of the elements in this list in\\n     * proper sequence (from first to last element); the runtime type of\\n     * the returned array is that of the specified array.  If the list fits\\n     * in the specified array, it is returned therein.  Otherwise, a new\\n     * array is allocated with the runtime type of the specified array and\\n     * the size of this list.\\n     *\\n     * \u003cp\u003eIf the list fits in the specified array with room to spare (i.e.,\\n     * the array has more elements than the list), the element in the array\\n     * immediately following the end of the list is set to {@code null}.\\n     * (This is useful in determining the length of the list \u003ci\u003eonly\u003c/i\u003e if\\n     * the caller knows that the list does not contain any null elements.)\\n     *\\n     * \u003cp\u003eLike the {@link #toArray()} method, this method acts as bridge between\\n     * array-based and collection-based APIs.  Further, this method allows\\n     * precise control over the runtime type of the output array, and may,\\n     * under certain circumstances, be used to save allocation costs.\\n     *\\n     * \u003cp\u003eSuppose {@code x} is a list known to contain only strings.\\n     * The following code can be used to dump the list into a newly\\n     * allocated array of {@code String}:\\n     *\\n     * \u003cpre\u003e{@code\\n     *     String[] y = x.toArray(new String[0]);\\n     * }\u003c/pre\u003e\\n     *\\n     * Note that {@code toArray(new Object[0])} is identical in function to\\n     * {@code toArray()}.\\n     *\\n     * @param a the array into which the elements of this list are to\\n     *          be stored, if it is big enough; otherwise, a new array of the\\n     *          same runtime type is allocated for this purpose.\\n     * @return an array containing the elements of this list\\n     * @throws ArrayStoreException if the runtime type of the specified array\\n     *         is not a supertype of the runtime type of every element in\\n     *         this list\\n     * @throws NullPointerException if the specified array is null\\n     \u0027}"}, {"color": "#97c2fc", "id": "toArray()", "label": "toArray()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": " boolean add(E e)", "label": " boolean add(E e)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Appends the specified element to the end of this list (optional\\n     * operation).\\n     *\\n     * \u003cp\u003eLists that support this operation may place limitations on what\\n     * elements may be added to this list.  In particular, some\\n     * lists will refuse to add null elements, and others will impose\\n     * restrictions on the type of elements that may be added.  List\\n     * classes should clearly specify in their documentation any restrictions\\n     * on what elements may be added.\\n     *\\n     * @param e element to be appended to this list\\n     * @return {@code true} (as specified by {@link Collection#add})\\n     * @throws UnsupportedOperationException if the {@code add} operation\\n     *         is not supported by this list\\n     * @throws ClassCastException if the class of the specified element\\n     *         prevents it from being added to this list\\n     * @throws NullPointerException if the specified element is null and this\\n     *         list does not permit null elements\\n     * @throws IllegalArgumentException if some property of this element\\n     *         prevents it from being added to this list\\n     \u0027}"}, {"color": "#97c2fc", "id": "add", "label": "add", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": " boolean remove(Object o)", "label": " boolean remove(Object o)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Removes the first occurrence of the specified element from this list,\\n     * if it is present (optional operation).  If this list does not contain\\n     * the element, it is unchanged.  More formally, removes the element with\\n     * the lowest index {@code i} such that\\n     * {@code Objects.equals(o, get(i))}\\n     * (if such an element exists).  Returns {@code true} if this list\\n     * contained the specified element (or equivalently, ", "id": " boolean addAll(Collection\u003c? extends E\u003e c)", "label": " boolean addAll(Collection\u003c? extends E\u003e c)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Appends all of the elements in the specified collection to the end of\\n     * this list, in the order that they are returned by the specified\\n     * collection\u0027s iterator (optional operation).  The behavior of this\\n     * operation is undefined if the specified collection is modified while\\n     * the operation is in progress.  (Note that this will occur if the\\n     * specified collection is this list, and it\u0027s nonempty.)\\n     *\\n     * @param c collection containing elements to be added to this list\\n     * @return {@code true} if this list changed as a result of the call\\n     * @throws UnsupportedOperationException if the {@code addAll} operation\\n     *         is not supported by this list\\n     * @throws ClassCastException if the class of an element of the specified\\n     *         collection prevents it from being added to this list\\n     * @throws NullPointerException if the specified collection contains one\\n     *         or more null elements and this list does not permit null\\n     *         elements, or if the specified collection is null\\n     * @throws IllegalArgumentException if some property of an element of the\\n     *         specified collection prevents it from being added to this list\\n     * @see #add(Object)\\n     \"}"}, {"color": "#97c2fc", "id": " boolean addAll(int index, Collection\u003c? extends E\u003e c)", "label": " boolean addAll(int index, Collection\u003c? extends E\u003e c)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Inserts all of the elements in the specified collection into this\\n     * list at the specified position (optional operation).  Shifts the\\n     * element currently at that position (if any) and any subsequent\\n     * elements to the right (increases their indices).  The new elements\\n     * will appear in this list in the order that they are returned by the\\n     * specified collection\u0027s iterator.  The behavior of this operation is\\n     * undefined if the specified collection is modified while the\\n     * operation is in progress.  (Note that this will occur if the specified\\n     * collection is this list, and it\u0027s nonempty.)\\n     *\\n     * @param index index at which to insert the first element from the\\n     *              specified collection\\n     * @param c collection containing elements to be added to this list\\n     * @return {@code true} if this list changed as a result of the call\\n     * @throws UnsupportedOperationException if the {@code addAll} operation\\n     *         is not supported by this list\\n     * @throws ClassCastException if the class of an element of the specified\\n     *         collection prevents it from being added to this list\\n     * @throws NullPointerException if the specified collection contains one\\n     *         or more null elements and this list does not permit null\\n     *         elements, or if the specified collection is null\\n     * @throws IllegalArgumentException if some property of an element of the\\n     *         specified collection prevents it from being added to this list\\n     * @throws IndexOutOfBoundsException if the index is out of range\\n     *         ({@code index \u003c 0 || index \u003e size()})\\n     \"}"}, {"color": "#97c2fc", "id": " boolean removeAll(Collection\u003c?\u003e c)", "label": " boolean removeAll(Collection\u003c?\u003e c)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Removes from this list all of its elements that are contained in the\\n     * specified collection (optional operation).\\n     *\\n     * @param c collection containing elements to be removed from this list\\n     * @return {@code true} if this list changed as a result of the call\\n     * @throws UnsupportedOperationException if the {@code removeAll} operation\\n     *         is not supported by this list\\n     * @throws ClassCastException if the class of an element of this list\\n     *         is incompatible with the specified collection\\n     * (\u003ca href=\"Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @throws NullPointerException if this list contains a null element and the\\n     *         specified collection does not permit null elements\\n     *         (\u003ca href=\"Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e),\\n     *         or if the specified collection is null\\n     * @see #remove(Object)\\n     * @see #contains(Object)\\n     \u0027}"}, {"color": "#97c2fc", "id": " boolean retainAll(Collection\u003c?\u003e c)", "label": " boolean retainAll(Collection\u003c?\u003e c)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Retains only the elements in this list that are contained in the\\n     * specified collection (optional operation).  In other words, removes\\n     * from this list all of its elements that are not contained in the\\n     * specified collection.\\n     *\\n     * @param c collection containing elements to be retained in this list\\n     * @return {@code true} if this list changed as a result of the call\\n     * @throws UnsupportedOperationException if the {@code retainAll} operation\\n     *         is not supported by this list\\n     * @throws ClassCastException if the class of an element of this list\\n     *         is incompatible with the specified collection\\n     * (\u003ca href=\"Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @throws NullPointerException if this list contains a null element and the\\n     *         specified collection does not permit null elements\\n     *         (\u003ca href=\"Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e),\\n     *         or if the specified collection is null\\n     * @see #remove(Object)\\n     * @see #contains(Object)\\n     \u0027}"}, {"color": "#97c2fc", "id": " void replaceAll(UnaryOperator\u003cE\u003e operator)", "label": " void replaceAll(UnaryOperator\u003cE\u003e operator)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Replaces each element of this list with the result of applying the\\n     * operator to that element.  Errors or runtime exceptions thrown by\\n     * the operator are relayed to the caller.\\n     *\\n     * @implSpec\\n     * The default implementation is equivalent to, for this {@code list}:\\n     * \u003cpre\u003e{@code\\n     *     final ListIterator\u003cE\u003e li = list.listIterator();\\n     *     while (li.hasNext()) {\\n     *         li.set(operator.apply(li.next()));\\n     *     }\\n     * }\u003c/pre\u003e\\n     *\\n     * If the list\\\u0027s list-iterator does not support the {@code set} operation\\n     * then an {@code UnsupportedOperationException} will be thrown when\\n     * replacing the first element.\\n     *\\n     * @param operator the operator to apply to each element\\n     * @throws UnsupportedOperationException if this list is unmodifiable.\\n     *         Implementations may throw this exception if an element\\n     *         cannot be replaced or if, in general, modification is not\\n     *         supported\\n     * @throws NullPointerException if the specified operator is null or\\n     *         if the operator result is a null value and this list does\\n     *         not permit null elements\\n     *         (\u003ca href=\"Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @since 1.8\\n     \u0027}"}, {"color": "#97c2fc", "id": " void sort(Comparator\u003c? super E\u003e c)", "label": " void sort(Comparator\u003c? super E\u003e c)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Sorts this list according to the order induced by the specified\\n     * {@link Comparator}.\\n     *\\n     * \u003cp\u003eAll elements in this list must be \u003ci\u003emutually comparable\u003c/i\u003e using the\\n     * specified comparator (that is, {@code c.compare(e1, e2)} must not throw\\n     * a {@code ClassCastException} for any elements {@code e1} and {@code e2}\\n     * in the list).\\n     *\\n     * \u003cp\u003eIf the specified comparator is {@code null} then all elements in this\\n     * list must implement the {@link Comparable} interface and the elements\\\u0027\\n     * {@linkplain Comparable natural ordering} should be used.\\n     *\\n     * \u003cp\u003eThis list must be modifiable, but need not be resizable.\\n     *\\n     * \u003cp\u003eFor apps running on and targeting Android versions greater than\\n     * Nougat (API level {@code \u003e 25}), {@link Collections#sort(List)}\\n     * delegates to this method. Such apps must not call\\n     * {@link Collections#sort(List)} from this method. Instead, prefer\\n     * not overriding this method at all. If you must override it, consider\\n     * this implementation:\\n     * \u003cpre\u003e\\n     * \u0026#064;Override\\n     * public void sort(Comparator\u0026lt;? super E\u0026gt; c) {\\n     *   Object[] elements = toArray();\\n     *   Arrays.sort(elements, c);\\n     *   ListIterator\u0026lt;E\u0026gt; iterator = (ListIterator\u0026lt;Object\u0026gt;) listIterator();\\n     *   for (Object element : elements) {\\n     *     iterator.next();\\n     *     iterator.set((E) element);\\n     *   }\\n     * }\\n     * \u003c/pre\u003e\\n     *\\n     * @implSpec\\n     * The default implementation obtains an array containing all elements in\\n     * this list, sorts the array, and iterates over this list resetting each\\n     * element from the corresponding position in the array. (This avoids the\\n     * n\u003csup\u003e2\u003c/sup\u003e log(n) performance that would result from attempting\\n     * to sort a linked list in place.)\\n     *\\n     * @implNote\\n     * This implementation is a stable, adaptive, iterative mergesort that\\n     * requires far fewer than n lg(n) comparisons when the input array is\\n     * partially sorted, while offering the performance of a traditional\\n     * mergesort when the input array is randomly ordered.  If the input array\\n     * is nearly sorted, the implementation requires approximately n\\n     * comparisons.  Temporary storage requirements vary from a small constant\\n     * for nearly sorted input arrays to n/2 object references for randomly\\n     * ordered input arrays.\\n     *\\n     * \u003cp\u003eThe implementation takes equal advantage of ascending and\\n     * descending order in its input array, and can take advantage of\\n     * ascending and descending order in different parts of the same\\n     * input array.  It is well-suited to merging two or more sorted arrays:\\n     * simply concatenate the arrays and sort the resulting array.\\n     *\\n     * \u003cp\u003eThe implementation was adapted from Tim Peters\\\u0027s list sort for Python\\n     * (\u003ca href=\"http://svn.python.org/projects/python/trunk/Objects/listsort.txt\"\u003e\\n     * TimSort\u003c/a\u003e).  It uses techniques from Peter McIlroy\\\u0027s \"Optimistic\\n     * Sorting and Information Theoretic Complexity\", in Proceedings of the\\n     * Fourth Annual ACM-SIAM Symposium on Discrete Algorithms, pp 467-474,\\n     * January 1993.\\n     *\\n     * @param c the {@code Comparator} used to compare list elements.\\n     *          A {@code null} value indicates that the elements\\\u0027\\n     *          {@linkplain Comparable natural ordering} should be used\\n     * @throws ClassCastException if the list contains elements that are not\\n     *         \u003ci\u003emutually comparable\u003c/i\u003e using the specified comparator\\n     * @throws UnsupportedOperationException if the list\\\u0027s list-iterator does\\n     *         not support the {@code set} operation\\n     * @throws IllegalArgumentException\\n     *         (\u003ca href=\"Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     *         if the comparator is found to violate the {@link Comparator}\\n     *         contract\\n     * @since 1.8\\n     \u0027}"}, {"color": "#97c2fc", "id": "Comparable", "label": "Comparable", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "sort(List)", "label": "sort(List)", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "Comparator", "label": "Comparator", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": " void clear()", "label": " void clear()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Removes all of the elements from this list (optional operation).\\n     * The list will be empty after this call returns.\\n     *\\n     * @throws UnsupportedOperationException if the {@code clear} operation\\n     *         is not supported by this list\\n     \u0027}"}, {"color": "#97c2fc", "id": " boolean equals(Object o)", "label": " boolean equals(Object o)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares the specified object with this list for equality.  Returns\\n     * {@code true} if and only if the specified object is also a list, both\\n     * lists have the same size, and all corresponding pairs of elements in\\n     * the two lists are \u003ci\u003eequal\u003c/i\u003e.  (Two elements {@code e1} and\\n     * {@code e2} are \u003ci\u003eequal\u003c/i\u003e if {@code Objects.equals(e1, e2)}.)\\n     * In other words, two lists are defined to be\\n     * equal if they contain the same elements in the same order.  This\\n     * definition ensures that the equals method works properly across\\n     * different implementations of the {@code List} interface.\\n     *\\n     * @param o the object to be compared for equality with this list\\n     * @return {@code true} if the specified object is equal to this list\\n     \u0027}"}, {"color": "#97c2fc", "id": " int hashCode()", "label": " int hashCode()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the hash code value for this list.  The hash code of a list\\n     * is defined to be the result of the following calculation:\\n     * \u003cpre\u003e{@code\\n     *     int hashCode = 1;\\n     *     for (E e : list)\\n     *         hashCode = 31*hashCode + (e==null ? 0 : e.hashCode());\\n     * }\u003c/pre\u003e\\n     * This ensures that {@code list1.equals(list2)} implies that\\n     * {@code list1.hashCode()==list2.hashCode()} for any two lists,\\n     * {@code list1} and {@code list2}, as required by the general\\n     * contract of {@link Object#hashCode}.\\n     *\\n     * @return the hash code value for this list\\n     * @see Object#equals(Object)\\n     * @see #equals(Object)\\n     \u0027}"}, {"color": "#97c2fc", "id": "hashCode", "label": "hashCode", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": " E get(int index)", "label": " E get(int index)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the element at the specified position in this list.\\n     *\\n     * @param index index of the element to return\\n     * @return the element at the specified position in this list\\n     * @throws IndexOutOfBoundsException if the index is out of range\\n     *         ({@code index \u003c 0 || index \u003e= size()})\\n     \u0027}"}, {"color": "#97c2fc", "id": " E set(int index, E element)", "label": " E set(int index, E element)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Replaces the element at the specified position in this list with the\\n     * specified element (optional operation).\\n     *\\n     * @param index index of the element to replace\\n     * @param element element to be stored at the specified position\\n     * @return the element previously at the specified position\\n     * @throws UnsupportedOperationException if the {@code set} operation\\n     *         is not supported by this list\\n     * @throws ClassCastException if the class of the specified element\\n     *         prevents it from being added to this list\\n     * @throws NullPointerException if the specified element is null and\\n     *         this list does not permit null elements\\n     * @throws IllegalArgumentException if some property of the specified\\n     *         element prevents it from being added to this list\\n     * @throws IndexOutOfBoundsException if the index is out of range\\n     *         ({@code index \u003c 0 || index \u003e= size()})\\n     \u0027}"}, {"color": "#97c2fc", "id": " void add(int index, E element)", "label": " void add(int index, E element)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Inserts the specified element at the specified position in this list\\n     * (optional operation).  Shifts the element currently at that position\\n     * (if any) and any subsequent elements to the right (adds one to their\\n     * indices).\\n     *\\n     * @param index index at which the specified element is to be inserted\\n     * @param element element to be inserted\\n     * @throws UnsupportedOperationException if the {@code add} operation\\n     *         is not supported by this list\\n     * @throws ClassCastException if the class of the specified element\\n     *         prevents it from being added to this list\\n     * @throws NullPointerException if the specified element is null and\\n     *         this list does not permit null elements\\n     * @throws IllegalArgumentException if some property of the specified\\n     *         element prevents it from being added to this list\\n     * @throws IndexOutOfBoundsException if the index is out of range\\n     *         ({@code index \u003c 0 || index \u003e size()})\\n     \u0027}"}, {"color": "#97c2fc", "id": " E remove(int index)", "label": " E remove(int index)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Removes the element at the specified position in this list (optional\\n     * operation).  Shifts any subsequent elements to the left (subtracts one\\n     * from their indices).  Returns the element that was removed from the\\n     * list.\\n     *\\n     * @param index the index of the element to be removed\\n     * @return the element previously at the specified position\\n     * @throws UnsupportedOperationException if the {@code remove} operation\\n     *         is not supported by this list\\n     * @throws IndexOutOfBoundsException if the index is out of range\\n     *         ({@code index \u003c 0 || index \u003e= size()})\\n     \u0027}"}, {"color": "#97c2fc", "id": " int indexOf(Object o)", "label": " int indexOf(Object o)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the index of the first occurrence of the specified element\\n     * in this list, or -1 if this list does not contain the element.\\n     * More formally, returns the lowest index {@code i} such that\\n     * {@code Objects.equals(o, get(i))},\\n     * or -1 if there is no such index.\\n     *\\n     * @param o element to search for\\n     * @return the index of the first occurrence of the specified element in\\n     *         this list, or -1 if this list does not contain the element\\n     * @throws ClassCastException if the type of the specified element\\n     *         is incompatible with this list\\n     *         (\u003ca href=\"Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @throws NullPointerException if the specified element is null and this\\n     *         list does not permit null elements\\n     *         (\u003ca href=\"Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     \u0027}"}, {"color": "#97c2fc", "id": " int lastIndexOf(Object o)", "label": " int lastIndexOf(Object o)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the index of the last occurrence of the specified element\\n     * in this list, or -1 if this list does not contain the element.\\n     * More formally, returns the highest index {@code i} such that\\n     * {@code Objects.equals(o, get(i))},\\n     * or -1 if there is no such index.\\n     *\\n     * @param o element to search for\\n     * @return the index of the last occurrence of the specified element in\\n     *         this list, or -1 if this list does not contain the element\\n     * @throws ClassCastException if the type of the specified element\\n     *         is incompatible with this list\\n     *         (\u003ca href=\"Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     * @throws NullPointerException if the specified element is null and this\\n     *         list does not permit null elements\\n     *         (\u003ca href=\"Collection.html#optional-restrictions\"\u003eoptional\u003c/a\u003e)\\n     \u0027}"}, {"color": "#97c2fc", "id": " ListIterator\u003cE\u003e listIterator()", "label": " ListIterator\u003cE\u003e listIterator()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a list iterator over the elements in this list (in proper\\n     * sequence).\\n     *\\n     * @return a list iterator over the elements in this list (in proper\\n     *         sequence)\\n     \u0027}"}, {"color": "#97c2fc", "id": " ListIterator\u003cE\u003e listIterator(int index)", "label": " ListIterator\u003cE\u003e listIterator(int index)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a list iterator over the elements in this list (in proper\\n     * sequence), starting at the specified position in the list.\\n     * The specified index indicates the first element that would be\\n     * returned by an initial call to {@link ListIterator#next next}.\\n     * An initial call to {@link ListIterator#previous previous} would\\n     * return the element with the specified index minus one.\\n     *\\n     * @param index index of the first element to be returned from the\\n     *        list iterator (by a call to {@link ListIterator#next next})\\n     * @return a list iterator over the elements in this list (in proper\\n     *         sequence), starting at the specified position in the list\\n     * @throws IndexOutOfBoundsException if the index is out of range\\n     *         ({@code index \u003c 0 || index \u003e size()})\\n     \u0027}"}, {"color": "#97c2fc", "id": "previous", "label": "previous", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "next", "label": "next", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": " List\u003cE\u003e subList(int fromIndex, int toIndex)", "label": " List\u003cE\u003e subList(int fromIndex, int toIndex)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a view of the portion of this list between the specified\\n     * {@code fromIndex}, inclusive, and {@code toIndex}, exclusive.  (If\\n     * {@code fromIndex} and {@code toIndex} are equal, the returned list is\\n     * empty.)  The returned list is backed by this list, so non-structural\\n     * changes in the returned list are reflected in this list, and vice-versa.\\n     * The returned list supports all of the optional list operations supported\\n     * by this list.\u003cp\u003e\\n     *\\n     * This method eliminates the need for explicit range operations (of\\n     * the sort that commonly exist for arrays).  Any operation that expects\\n     * a list can be used as a range operation by passing a subList view\\n     * instead of a whole list.  For example, the following idiom\\n     * removes a range of elements from a list:\\n     * \u003cpre\u003e{@code\\n     *      list.subList(from, to).clear();\\n     * }\u003c/pre\u003e\\n     * Similar idioms may be constructed for {@code indexOf} and\\n     * {@code lastIndexOf}, and all of the algorithms in the\\n     * {@code Collections} class can be applied to a subList.\u003cp\u003e\\n     *\\n     * The semantics of the list returned by this method become undefined if\\n     * the backing list (i.e., this list) is \u003ci\u003estructurally modified\u003c/i\u003e in\\n     * any way other than via the returned list.  (Structural modifications are\\n     * those that change the size of this list, or otherwise perturb it in such\\n     * a fashion that iterations in progress may yield incorrect results.)\\n     *\\n     * @param fromIndex low endpoint (inclusive) of the subList\\n     * @param toIndex high endpoint (exclusive) of the subList\\n     * @return a view of the specified range within this list\\n     * @throws IndexOutOfBoundsException for an illegal endpoint index value\\n     *         ({@code fromIndex \u003c 0 || toIndex \u003e size ||\\n     *         fromIndex \u003e toIndex})\\n     \u0027}"}, {"color": "#97c2fc", "id": " Spliterator\u003cE\u003e spliterator()", "label": " Spliterator\u003cE\u003e spliterator()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Creates a {@link Spliterator} over the elements in this list.\\n     *\\n     * \u003cp\u003eThe {@code Spliterator} reports {@link Spliterator#SIZED} and\\n     * {@link Spliterator#ORDERED}.  Implementations should document the\\n     * reporting of additional characteristic values.\\n     *\\n     * @implSpec\\n     * The default implementation creates a\\n     * \u003cem\u003e\u003ca href=\"Spliterator.html#binding\"\u003elate-binding\u003c/a\u003e\u003c/em\u003e\\n     * spliterator as follows:\\n     * \u003cul\u003e\\n     * \u003cli\u003eIf the list is an instance of {@link RandomAccess} then the default\\n     *     implementation creates a spliterator that traverses elements by\\n     *     invoking the method {@link List#get}.  If such invocation results or\\n     *     would result in an {@code IndexOutOfBoundsException} then the\\n     *     spliterator will \u003cem\u003efail-fast\u003c/em\u003e and throw a\\n     *     {@code ConcurrentModificationException}.\\n     *     If the list is also an instance of {@link AbstractList} then the\\n     *     spliterator will use the list\\\u0027s {@link AbstractList#modCount modCount}\\n     *     field to provide additional \u003cem\u003efail-fast\u003c/em\u003e behavior.\\n     * \u003cli\u003eOtherwise, the default implementation creates a spliterator from the\\n     *     list\\\u0027s {@code Iterator}.  The spliterator inherits the\\n     *     \u003cem\u003efail-fast\u003c/em\u003e of the list\\\u0027s iterator.\\n     * \u003c/ul\u003e\\n     *\\n     * @implNote\\n     * The created {@code Spliterator} additionally reports\\n     * {@link Spliterator#SUBSIZED}.\\n     *\\n     * @return a {@code Spliterator} over the elements in this list\\n     * @since 1.8\\n     \u0027}"}, {"color": "#97c2fc", "id": "AbstractList", "label": "AbstractList", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "get", "label": "get", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "SUBSIZED", "label": "SUBSIZED", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "modCount", "label": "modCount", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "RandomAccess", "label": "RandomAccess", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "ORDERED", "label": "ORDERED", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "SIZED", "label": "SIZED", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "Spliterator", "label": "Spliterator", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": " void addFirst(E e)", "label": " void addFirst(E e)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * {@inheritDoc}\\n     *\\n     * @implSpec\\n     * The implementation in this interface calls {@code add(0, e)}.\\n     *\\n     * @throws NullPointerException {@inheritDoc}\\n     * @throws UnsupportedOperationException {@inheritDoc}\\n     * @since 21\\n     \u0027}"}, {"color": "#97c2fc", "id": " void addLast(E e)", "label": " void addLast(E e)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * {@inheritDoc}\\n     *\\n     * @implSpec\\n     * The implementation in this interface calls {@code add(e)}.\\n     *\\n     * @throws NullPointerException {@inheritDoc}\\n     * @throws UnsupportedOperationException {@inheritDoc}\\n     * @since 21\\n     \u0027}"}, {"color": "#97c2fc", "id": " E getFirst()", "label": " E getFirst()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * {@inheritDoc}\\n     *\\n     * @implSpec\\n     * If this List is not empty, the implementation in this interface returns the result\\n     * of calling {@code get(0)}. Otherwise, it throws {@code NoSuchElementException}.\\n     *\\n     * @throws NoSuchElementException {@inheritDoc}\\n     * @since 21\\n     \u0027}"}, {"color": "#97c2fc", "id": " E getLast()", "label": " E getLast()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * {@inheritDoc}\\n     *\\n     * @implSpec\\n     * If this List is not empty, the implementation in this interface returns the result\\n     * of calling {@code get(size() - 1)}. Otherwise, it throws {@code NoSuchElementException}.\\n     *\\n     * @throws NoSuchElementException {@inheritDoc}\\n     * @since 21\\n     \u0027}"}, {"color": "#97c2fc", "id": " E removeFirst()", "label": " E removeFirst()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * {@inheritDoc}\\n     *\\n     * @implSpec\\n     * If this List is not empty, the implementation in this interface returns the result\\n     * of calling {@code remove(0)}. Otherwise, it throws {@code NoSuchElementException}.\\n     *\\n     * @throws NoSuchElementException {@inheritDoc}\\n     * @throws UnsupportedOperationException {@inheritDoc}\\n     * @since 21\\n     \u0027}"}, {"color": "#97c2fc", "id": " E removeLast()", "label": " E removeLast()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * {@inheritDoc}\\n     *\\n     * @implSpec\\n     * If this List is not empty, the implementation in this interface returns the result\\n     * of calling {@code remove(size() - 1)}. Otherwise, it throws {@code NoSuchElementException}.\\n     *\\n     * @throws NoSuchElementException {@inheritDoc}\\n     * @throws UnsupportedOperationException {@inheritDoc}\\n     * @since 21\\n     \u0027}"}                   nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
