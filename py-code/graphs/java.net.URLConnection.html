              // initialize global variables.

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "java.net.URLConnection", "label": "java.net.URLConnection", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\\n * The abstract class {@code URLConnection} is the superclass\\n * of all classes that represent a communications link between the\\n * application and a URL. Instances of this class can be used both to\\n * read from and to write to the resource referenced by the URL. In\\n * general, creating a connection to a URL is a multistep process:\\n *\\n * \u003ccenter\u003e\u003ctable border=2 summary=\"Describes the process of creating a connection to a URL: openConnection() and connect() over time.\"\u003e\\n * \u003ctr\u003e\u003cth\u003e{@code openConnection()}\u003c/th\u003e\\n *     \u003cth\u003e{@code connect()}\u003c/th\u003e\u003c/tr\u003e\\n * \u003ctr\u003e\u003ctd\u003eManipulate parameters that affect the connection to the remote\\n *         resource.\u003c/td\u003e\\n *     \u003ctd\u003eInteract with the resource; query header fields and\\n *         contents.\u003c/td\u003e\u003c/tr\u003e\\n * \u003c/table\u003e\\n * ----------------------------\u0026gt;\\n * \u003cbr\u003etime\u003c/center\u003e\\n *\\n * \u003col\u003e\\n * \u003cli\u003eThe connection object is created by invoking the\\n *     {@code openConnection} method on a URL.\\n * \u003cli\u003eThe setup parameters and general request properties are manipulated.\\n * \u003cli\u003eThe actual connection to the remote object is made, using the\\n *    {@code connect} method.\\n * \u003cli\u003eThe remote object becomes available. The header fields and the contents\\n *     of the remote object can be accessed.\\n * \u003c/ol\u003e\\n * \u003cp\u003e\\n * The setup parameters are modified using the following methods:\\n * \u003cul\u003e\\n *   \u003cli\u003e{@code setAllowUserInteraction}\\n *   \u003cli\u003e{@code setDoInput}\\n *   \u003cli\u003e{@code setDoOutput}\\n *   \u003cli\u003e{@code setIfModifiedSince}\\n *   \u003cli\u003e{@code setUseCaches}\\n * \u003c/ul\u003e\\n * \u003cp\u003e\\n * and the general request properties are modified using the method:\\n * \u003cul\u003e\\n *   \u003cli\u003e{@code setRequestProperty}\\n * \u003c/ul\u003e\\n * \u003cp\u003e\\n * Default values for the {@code AllowUserInteraction} and\\n * {@code UseCaches} parameters can be set using the methods\\n * {@code setDefaultAllowUserInteraction} and\\n * {@code setDefaultUseCaches}.\\n * \u003cp\u003e\\n * Each of the above {@code set} methods has a corresponding\\n * {@code get} method to retrieve the value of the parameter or\\n * general request property. The specific parameters and general\\n * request properties that are applicable are protocol specific.\\n * \u003cp\u003e\\n * The following methods are used to access the header fields and\\n * the contents after the connection is made to the remote object:\\n * \u003cul\u003e\\n *   \u003cli\u003e{@code getContent}\\n *   \u003cli\u003e{@code getHeaderField}\\n *   \u003cli\u003e{@code getInputStream}\\n *   \u003cli\u003e{@code getOutputStream}\\n * \u003c/ul\u003e\\n * \u003cp\u003e\\n * Certain header fields are accessed frequently. The methods:\\n * \u003cul\u003e\\n *   \u003cli\u003e{@code getContentEncoding}\\n *   \u003cli\u003e{@code getContentLength}\\n *   \u003cli\u003e{@code getContentType}\\n *   \u003cli\u003e{@code getDate}\\n *   \u003cli\u003e{@code getExpiration}\\n *   \u003cli\u003e{@code getLastModifed}\\n * \u003c/ul\u003e\\n * \u003cp\u003e\\n * provide convenient access to these fields. The\\n * {@code getContentType} method is used by the\\n * {@code getContent} method to determine the type of the remote\\n * object; subclasses may find it convenient to override the\\n * {@code getContentType} method.\\n * \u003cp\u003e\\n * In the common case, all of the pre-connection parameters and\\n * general request properties can be ignored: the pre-connection\\n * parameters and request properties default to sensible values. For\\n * most clients of this interface, there are only two interesting\\n * methods: {@code getInputStream} and {@code getContent},\\n * which are mirrored in the {@code URL} class by convenience methods.\\n * \u003cp\u003e\\n * More information on the request properties and header fields of\\n * an {@code http} connection can be found at:\\n * \u003cblockquote\u003e\u003cpre\u003e\\n * \u003ca href=\"http://www.ietf.org/rfc/rfc2616.txt\"\u003ehttp://www.ietf.org/rfc/rfc2616.txt\u003c/a\u003e\\n * \u003c/pre\u003e\u003c/blockquote\u003e\\n *\\n * Invoking the {@code close()} methods on the {@code InputStream} or {@code OutputStream} of an\\n * {@code URLConnection} after a request may free network resources associated with this\\n * instance, unless particular protocol specifications specify different behaviours\\n * for it.\\n *\\n * @author  James Gosling\\n * @see     java.net.URL#openConnection()\\n * @see     java.net.URLConnection#connect()\\n * @see     java.net.URLConnection#getContent()\\n * @see     java.net.URLConnection#getContentEncoding()\\n * @see     java.net.URLConnection#getContentLength()\\n * @see     java.net.URLConnection#getContentType()\\n * @see     java.net.URLConnection#getDate()\\n * @see     java.net.URLConnection#getExpiration()\\n * @see     java.net.URLConnection#getHeaderField(int)\\n * @see     java.net.URLConnection#getHeaderField(java.lang.String)\\n * @see     java.net.URLConnection#getInputStream()\\n * @see     java.net.URLConnection#getLastModified()\\n * @see     java.net.URLConnection#getOutputStream()\\n * @see     java.net.URLConnection#setAllowUserInteraction(boolean)\\n * @see     java.net.URLConnection#setDefaultUseCaches(boolean)\\n * @see     java.net.URLConnection#setDoInput(boolean)\\n * @see     java.net.URLConnection#setDoOutput(boolean)\\n * @see     java.net.URLConnection#setIfModifiedSince(long)\\n * @see     java.net.URLConnection#setRequestProperty(java.lang.String, java.lang.String)\\n * @see     java.net.URLConnection#setUseCaches(boolean)\\n * @since   JDK1.0\\n \u0027}"}, {"color": "#97c2fc", "id": "public static synchronized FileNameMap getFileNameMap()", "label": "public static synchronized FileNameMap getFileNameMap()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a {@link FileNameMap} implementation suitable for guessing a\\n     * content type based on a URL\\\u0027s \"file\" component.\\n     *\\n     * @see #guessContentTypeFromName(String)\\n     * @see #setFileNameMap(java.net.FileNameMap)\\n     *\\n     \u0027}"}, {"color": "#97c2fc", "id": "FileNameMap", "label": "FileNameMap", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "public static void setFileNameMap(FileNameMap map)", "label": "public static void setFileNameMap(FileNameMap map)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Sets the FileNameMap.\\n     * \u003cp\u003e\\n     * If there is a security manager, this method first calls\\n     * the security manager\u0027s {@code checkSetFactory} method\\n     * to ensure the operation is allowed.\\n     * This could result in a SecurityException.\\n     *\\n     * @param map the FileNameMap to be set\\n     * @exception  SecurityException  if a security manager exists and its\\n     *             {@code checkSetFactory} method doesn\u0027t allow the operation.\\n     * @see        SecurityManager#checkSetFactory\\n     * @see #getFileNameMap()\\n     * @since 1.2\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract void connect() throws IOException", "label": "public abstract void connect() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Opens a communications link to the resource referenced by this\\n     * URL, if such a connection has not already been established.\\n     * \u003cp\u003e\\n     * If the {@code connect} method is called when the connection\\n     * has already been opened (indicated by the {@code connected}\\n     * field having the value {@code true}), the call is ignored.\\n     * \u003cp\u003e\\n     * URLConnection objects go through two phases: first they are\\n     * created, then they are connected.  After being created, and\\n     * before being connected, various options can be specified\\n     * (e.g., doInput and UseCaches).  After connecting, it is an\\n     * error to try to set them.  Operations that depend on being\\n     * connected, like getContentLength, will implicitly perform the\\n     * connection, if necessary.\\n     *\\n     * @throws SocketTimeoutException if the timeout expires before\\n     *               the connection can be established\\n     * @exception  IOException  if an I/O error occurs while opening the\\n     *               connection.\\n     * @see java.net.URLConnection#connected\\n     * @see #getConnectTimeout()\\n     * @see #setConnectTimeout(int)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void setConnectTimeout(int timeout)", "label": "public void setConnectTimeout(int timeout)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Sets a specified timeout value, in milliseconds, to be used\\n     * when opening a communications link to the resource referenced\\n     * by this URLConnection.  If the timeout expires before the\\n     * connection can be established, a\\n     * java.net.SocketTimeoutException is raised. A timeout of zero is\\n     * interpreted as an infinite timeout.\\n\\n     * \u003cp\u003e Some non-standard implementation of this method may ignore\\n     * the specified timeout. To see the connect timeout set, please\\n     * call getConnectTimeout().\\n     *\\n     * \u003cp\u003e\u003cstrong\u003eWarning\u003c/strong\u003e: If the hostname resolves to multiple IP\\n     * addresses, Android\\\u0027s default implementation of {@link HttpURLConnection}\\n     * will try each in\\n     * \u003ca href=\"http://www.ietf.org/rfc/rfc3484.txt\"\u003eRFC 3484\u003c/a\u003e order. If\\n     * connecting to each of these addresses fails, multiple timeouts will\\n     * elapse before the connect attempt throws an exception. Host names\\n     * that support both IPv6 and IPv4 always have at least 2 IP addresses.\\n     *\\n     * @param timeout an {@code int} that specifies the connect\\n     *               timeout value in milliseconds\\n     * @throws IllegalArgumentException if the timeout parameter is negative\\n     *\\n     * @see #getConnectTimeout()\\n     * @see #connect()\\n     * @since 1.5\\n     \u0027}"}, {"color": "#97c2fc", "id": "HttpURLConnection", "label": "HttpURLConnection", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "public int getConnectTimeout()", "label": "public int getConnectTimeout()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns setting for connect timeout.\\n     * \u003cp\u003e\\n     * 0 return implies that the option is disabled\\n     * (i.e., timeout of infinity).\\n     *\\n     * @return an {@code int} that indicates the connect timeout\\n     *         value in milliseconds\\n     * @see #setConnectTimeout(int)\\n     * @see #connect()\\n     * @since 1.5\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void setReadTimeout(int timeout)", "label": "public void setReadTimeout(int timeout)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Sets the read timeout to a specified timeout, in\\n     * milliseconds. A non-zero value specifies the timeout when\\n     * reading from Input stream when a connection is established to a\\n     * resource. If the timeout expires before there is data available\\n     * for read, a java.net.SocketTimeoutException is raised. A\\n     * timeout of zero is interpreted as an infinite timeout.\\n     *\\n     *\u003cp\u003e Some non-standard implementation of this method ignores the\\n     * specified timeout. To see the read timeout set, please call\\n     * getReadTimeout().\\n     *\\n     * @param timeout an {@code int} that specifies the timeout\\n     * value to be used in milliseconds\\n     * @throws IllegalArgumentException if the timeout parameter is negative\\n     *\\n     * @see #getReadTimeout()\\n     * @see InputStream#read()\\n     * @since 1.5\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int getReadTimeout()", "label": "public int getReadTimeout()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns setting for read timeout. 0 return implies that the\\n     * option is disabled (i.e., timeout of infinity).\\n     *\\n     * @return an {@code int} that indicates the read timeout\\n     *         value in milliseconds\\n     *\\n     * @see #setReadTimeout(int)\\n     * @see InputStream#read()\\n     * @since 1.5\\n     \u0027}"}, {"color": "#97c2fc", "id": "public URL getURL()", "label": "public URL getURL()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the value of this {@code URLConnection}\u0027s {@code URL}\\n     * field.\\n     *\\n     * @return  the value of this {@code URLConnection}\u0027s {@code URL}\\n     *          field.\\n     * @see     java.net.URLConnection#url\\n     \"}"}, {"color": "#97c2fc", "id": "public int getContentLength()", "label": "public int getContentLength()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the value of the {@code content-length} header field.\\n     * \u003cP\u003e\\n     * \u003cB\u003eNote\u003c/B\u003e: {@link #getContentLengthLong() getContentLengthLong()}\\n     * should be preferred over this method, since it returns a {@code long}\\n     * instead and is therefore more portable.\u003c/P\u003e\\n     *\\n     * @return  the content length of the resource that this connection\u0027s URL\\n     *          references, {@code -1} if the content length is not known,\\n     *          or if the content length is greater than Integer.MAX_VALUE.\\n     \"}"}, {"color": "#97c2fc", "id": "getContentLengthLong()", "label": "getContentLengthLong()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public long getContentLengthLong()", "label": "public long getContentLengthLong()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the value of the {@code content-length} header field as a\\n     * long.\\n     *\\n     * @return  the content length of the resource that this connection\u0027s URL\\n     *          references, or {@code -1} if the content length is\\n     *          not known.\\n     * @since 7.0\\n     \"}"}, {"color": "#97c2fc", "id": "public String getContentType()", "label": "public String getContentType()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the value of the {@code content-type} header field.\\n     *\\n     * @return  the content type of the resource that the URL references,\\n     *          or {@code null} if not known.\\n     * @see     java.net.URLConnection#getHeaderField(java.lang.String)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String getContentEncoding()", "label": "public String getContentEncoding()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the value of the {@code content-encoding} header field.\\n     *\\n     * @return  the content encoding of the resource that the URL references,\\n     *          or {@code null} if not known.\\n     * @see     java.net.URLConnection#getHeaderField(java.lang.String)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public long getExpiration()", "label": "public long getExpiration()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the value of the {@code expires} header field.\\n     *\\n     * @return  the expiration date of the resource that this URL references,\\n     *          or 0 if not known. The value is the number of milliseconds since\\n     *          January 1, 1970 GMT.\\n     * @see     java.net.URLConnection#getHeaderField(java.lang.String)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public long getDate()", "label": "public long getDate()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the value of the {@code date} header field.\\n     *\\n     * @return  the sending date of the resource that the URL references,\\n     *          or {@code 0} if not known. The value returned is the\\n     *          number of milliseconds since January 1, 1970 GMT.\\n     * @see     java.net.URLConnection#getHeaderField(java.lang.String)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public long getLastModified()", "label": "public long getLastModified()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the value of the {@code last-modified} header field.\\n     * The result is the number of milliseconds since January 1, 1970 GMT.\\n     *\\n     * @return  the date the resource referenced by this\\n     *          {@code URLConnection} was last modified, or 0 if not known.\\n     * @see     java.net.URLConnection#getHeaderField(java.lang.String)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String getHeaderField(String name)", "label": "public String getHeaderField(String name)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the value of the named header field.\\n     * \u003cp\u003e\\n     * If called on a connection that sets the same header multiple times\\n     * with possibly different values, only the last value is returned.\\n     *\\n     *\\n     * @param   name   the name of a header field.\\n     * @return  the value of the named header field, or {@code null}\\n     *          if there is no such field in the header.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public Map\u003cString, List\u003cString\u003e\u003e getHeaderFields()", "label": "public Map\u003cString, List\u003cString\u003e\u003e getHeaderFields()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns an unmodifiable Map of the header fields.\\n     * The Map keys are Strings that represent the\\n     * response-header field names. Each Map value is an\\n     * unmodifiable List of Strings that represents\\n     * the corresponding field values.\\n     *\\n     * @return a Map of header fields\\n     * @since 1.4\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int getHeaderFieldInt(String name, int Default)", "label": "public int getHeaderFieldInt(String name, int Default)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the value of the named field parsed as a number.\\n     * \u003cp\u003e\\n     * This form of {@code getHeaderField} exists because some\\n     * connection types (e.g., {@code http-ng}) have pre-parsed\\n     * headers. Classes for that connection type can override this method\\n     * and short-circuit the parsing.\\n     *\\n     * @param   name      the name of the header field.\\n     * @param   Default   the default value.\\n     * @return  the value of the named field, parsed as an integer. The\\n     *          {@code Default} value is returned if the field is\\n     *          missing or malformed.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public long getHeaderFieldLong(String name, long Default)", "label": "public long getHeaderFieldLong(String name, long Default)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the value of the named field parsed as a number.\\n     * \u003cp\u003e\\n     * This form of {@code getHeaderField} exists because some\\n     * connection types (e.g., {@code http-ng}) have pre-parsed\\n     * headers. Classes for that connection type can override this method\\n     * and short-circuit the parsing.\\n     *\\n     * @param   name      the name of the header field.\\n     * @param   Default   the default value.\\n     * @return  the value of the named field, parsed as a long. The\\n     *          {@code Default} value is returned if the field is\\n     *          missing or malformed.\\n     * @since 7.0\\n     \u0027}"}, {"color": "#97c2fc", "id": "public long getHeaderFieldDate(String name, long Default)", "label": "public long getHeaderFieldDate(String name, long Default)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the value of the named field parsed as date.\\n     * The result is the number of milliseconds since January 1, 1970 GMT\\n     * represented by the named field.\\n     * \u003cp\u003e\\n     * This form of {@code getHeaderField} exists because some\\n     * connection types (e.g., {@code http-ng}) have pre-parsed\\n     * headers. Classes for that connection type can override this method\\n     * and short-circuit the parsing.\\n     *\\n     * @param   name     the name of the header field.\\n     * @param   Default   a default value.\\n     * @return  the value of the field, parsed as a date. The value of the\\n     *          {@code Default} argument is returned if the field is\\n     *          missing or malformed.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String getHeaderFieldKey(int n)", "label": "public String getHeaderFieldKey(int n)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the key for the {@code n}\u003csup\u003eth\u003c/sup\u003e header field.\\n     * It returns {@code null} if there are fewer than {@code n+1} fields.\\n     *\\n     * @param   n   an index, where {@code n\u003e=0}\\n     * @return  the key for the {@code n}\u003csup\u003eth\u003c/sup\u003e header field,\\n     *          or {@code null} if there are fewer than {@code n+1}\\n     *          fields.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String getHeaderField(int n)", "label": "public String getHeaderField(int n)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the value for the {@code n}\u003csup\u003eth\u003c/sup\u003e header field.\\n     * It returns {@code null} if there are fewer than\\n     * {@code n+1}fields.\\n     * \u003cp\u003e\\n     * This method can be used in conjunction with the\\n     * {@link #getHeaderFieldKey(int) getHeaderFieldKey} method to iterate through all\\n     * the headers in the message.\\n     *\\n     * @param   n   an index, where {@code n\u003e=0}\\n     * @return  the value of the {@code n}\u003csup\u003eth\u003c/sup\u003e header field\\n     *          or {@code null} if there are fewer than {@code n+1} fields\\n     * @see     java.net.URLConnection#getHeaderFieldKey(int)\\n     \u0027}"}, {"color": "#97c2fc", "id": "getHeaderFieldKey(int)", "label": "getHeaderFieldKey(int)", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public Object getContent() throws IOException", "label": "public Object getContent() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Retrieves the contents of this URL connection.\\n     * \u003cp\u003e\\n     * This method first determines the content type of the object by\\n     * calling the {@code getContentType} method. If this is\\n     * the first time that the application has seen that specific content\\n     * type, a content handler for that content type is created:\\n     * \u003col\u003e\\n     * \u003cli\u003eIf the application has set up a content handler factory instance\\n     *     using the {@code setContentHandlerFactory} method, the\\n     *     {@code createContentHandler} method of that instance is called\\n     *     with the content type as an argument; the result is a content\\n     *     handler for that content type.\\n     * \u003cli\u003eIf no content handler factory has yet been set up, or if the\\n     *     factory\u0027s {@code createContentHandler} method returns\\n     *     {@code null}, then the application loads the class named:\\n     *     \u003cblockquote\u003e\u003cpre\u003e\\n     *         sun.net.www.content.\u0026lt;\u003ci\u003econtentType\u003c/i\u003e\u0026gt;\\n     *     \u003c/pre\u003e\u003c/blockquote\u003e\\n     *     where \u0026lt;\u003ci\u003econtentType\u003c/i\u003e\u0026gt; is formed by taking the\\n     *     content-type string, replacing all slash characters with a\\n     *     {@code period} (\u0027.\u0027), and all other non-alphanumeric characters\\n     *     with the underscore character \u0027{@code _}\u0027. The alphanumeric\\n     *     characters are specifically the 26 uppercase ASCII letters\\n     *     \u0027{@code A}\u0027 through \u0027{@code Z}\u0027, the 26 lowercase ASCII\\n     *     letters \u0027{@code a}\u0027 through \u0027{@code z}\u0027, and the 10 ASCII\\n     *     digits \u0027{@code 0}\u0027 through \u0027{@code 9}\u0027. If the specified\\n     *     class does not exist, or is not a subclass of\\n     *     {@code ContentHandler}, then an\\n     *     {@code UnknownServiceException} is thrown.\\n     * \u003c/ol\u003e\\n     *\\n     * @return     the object fetched. The {@code instanceof} operator\\n     *               should be used to determine the specific kind of object\\n     *               returned.\\n     * @exception  IOException              if an I/O error occurs while\\n     *               getting the content.\\n     * @exception  UnknownServiceException  if the protocol does not support\\n     *               the content type.\\n     * @see        java.net.ContentHandlerFactory#createContentHandler(java.lang.String)\\n     * @see        java.net.URLConnection#getContentType()\\n     * @see        java.net.URLConnection#setContentHandlerFactory(java.net.ContentHandlerFactory)\\n     \"}"}, {"color": "#97c2fc", "id": "public Object getContent(Class[] classes) throws IOException", "label": "public Object getContent(Class[] classes) throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Retrieves the contents of this URL connection.\\n     *\\n     * @param classes the {@code Class} array\\n     * indicating the requested types\\n     * @return     the object fetched that is the first match of the type\\n     *               specified in the classes array. null if none of\\n     *               the requested types are supported.\\n     *               The {@code instanceof} operator should be used to\\n     *               determine the specific kind of object returned.\\n     * @exception  IOException              if an I/O error occurs while\\n     *               getting the content.\\n     * @exception  UnknownServiceException  if the protocol does not support\\n     *               the content type.\\n     * @see        java.net.URLConnection#getContent()\\n     * @see        java.net.ContentHandlerFactory#createContentHandler(java.lang.String)\\n     * @see        java.net.URLConnection#getContent(java.lang.Class[])\\n     * @see        java.net.URLConnection#setContentHandlerFactory(java.net.ContentHandlerFactory)\\n     * @since 1.3\\n     \u0027}"}, {"color": "#97c2fc", "id": "public Permission getPermission() throws IOException", "label": "public Permission getPermission() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a permission object representing the permission\\n     * necessary to make the connection represented by this\\n     * object. This method returns null if no permission is\\n     * required to make the connection. By default, this method\\n     * returns {@code java.security.AllPermission}. Subclasses\\n     * should override this method and return the permission\\n     * that best represents the permission required to make a\\n     * a connection to the URL. For example, a {@code URLConnection}\\n     * representing a {@code file:} URL would return a\\n     * {@code java.io.FilePermission} object.\\n     *\\n     * \u003cp\u003eThe permission returned may dependent upon the state of the\\n     * connection. For example, the permission before connecting may be\\n     * different from that after connecting. For example, an HTTP\\n     * sever, say foo.com, may redirect the connection to a different\\n     * host, say bar.com. Before connecting the permission returned by\\n     * the connection will represent the permission needed to connect\\n     * to foo.com, while the permission returned after connecting will\\n     * be to bar.com.\\n     *\\n     * \u003cp\u003ePermissions are generally used for two purposes: to protect\\n     * caches of objects obtained through URLConnections, and to check\\n     * the right of a recipient to learn about a particular URL. In\\n     * the first case, the permission should be obtained\\n     * \u003cem\u003eafter\u003c/em\u003e the object has been obtained. For example, in an\\n     * HTTP connection, this will represent the permission to connect\\n     * to the host from which the data was ultimately fetched. In the\\n     * second case, the permission should be obtained and tested\\n     * \u003cem\u003ebefore\u003c/em\u003e connecting.\\n     *\\n     * @return the permission object representing the permission\\n     * necessary to make the connection represented by this\\n     * URLConnection.\\n     *\\n     * @exception IOException if the computation of the permission\\n     * requires network or file I/O and an exception occurs while\\n     * computing it.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public InputStream getInputStream() throws IOException", "label": "public InputStream getInputStream() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns an input stream that reads from this open connection.\\n     *\\n     * A SocketTimeoutException can be thrown when reading from the\\n     * returned input stream if the read timeout expires before data\\n     * is available for read.\\n     *\\n     * @return     an input stream that reads from this open connection.\\n     * @exception  IOException              if an I/O error occurs while\\n     *               creating the input stream.\\n     * @exception  UnknownServiceException  if the protocol does not support\\n     *               input.\\n     * @see #setReadTimeout(int)\\n     * @see #getReadTimeout()\\n     \u0027}"}, {"color": "#97c2fc", "id": "public OutputStream getOutputStream() throws IOException", "label": "public OutputStream getOutputStream() throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns an output stream that writes to this connection.\\n     *\\n     * @return     an output stream that writes to this connection.\\n     * @exception  IOException              if an I/O error occurs while\\n     *               creating the output stream.\\n     * @exception  UnknownServiceException  if the protocol does not support\\n     *               output.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String toString()", "label": "public String toString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a {@code String} representation of this URL connection.\\n     *\\n     * @return  a string representation of this {@code URLConnection}.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void setDoInput(boolean doinput)", "label": "public void setDoInput(boolean doinput)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Sets the value of the {@code doInput} field for this\\n     * {@code URLConnection} to the specified value.\\n     * \u003cp\u003e\\n     * A URL connection can be used for input and/or output.  Set the DoInput\\n     * flag to true if you intend to use the URL connection for input,\\n     * false if not.  The default is true.\\n     *\\n     * @param   doinput   the new value.\\n     * @throws IllegalStateException if already connected\\n     * @see     java.net.URLConnection#doInput\\n     * @see #getDoInput()\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean getDoInput()", "label": "public boolean getDoInput()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the value of this {@code URLConnection}\u0027s\\n     * {@code doInput} flag.\\n     *\\n     * @return  the value of this {@code URLConnection}\u0027s\\n     *          {@code doInput} flag.\\n     * @see     #setDoInput(boolean)\\n     \"}"}, {"color": "#97c2fc", "id": "public void setDoOutput(boolean dooutput)", "label": "public void setDoOutput(boolean dooutput)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Sets the value of the {@code doOutput} field for this\\n     * {@code URLConnection} to the specified value.\\n     * \u003cp\u003e\\n     * A URL connection can be used for input and/or output.  Set the DoOutput\\n     * flag to true if you intend to use the URL connection for output,\\n     * false if not.  The default is false.\\n     *\\n     * @param   dooutput   the new value.\\n     * @throws IllegalStateException if already connected\\n     * @see #getDoOutput()\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean getDoOutput()", "label": "public boolean getDoOutput()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the value of this {@code URLConnection}\u0027s\\n     * {@code doOutput} flag.\\n     *\\n     * @return  the value of this {@code URLConnection}\u0027s\\n     *          {@code doOutput} flag.\\n     * @see     #setDoOutput(boolean)\\n     \"}"}, {"color": "#97c2fc", "id": "public void setAllowUserInteraction(boolean allowuserinteraction)", "label": "public void setAllowUserInteraction(boolean allowuserinteraction)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Set the value of the {@code allowUserInteraction} field of\\n     * this {@code URLConnection}.\\n     *\\n     * @param   allowuserinteraction   the new value.\\n     * @throws IllegalStateException if already connected\\n     * @see     #getAllowUserInteraction()\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean getAllowUserInteraction()", "label": "public boolean getAllowUserInteraction()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the value of the {@code allowUserInteraction} field for\\n     * this object.\\n     *\\n     * @return  the value of the {@code allowUserInteraction} field for\\n     *          this object.\\n     * @see     #setAllowUserInteraction(boolean)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static void setDefaultAllowUserInteraction(boolean defaultallowuserinteraction)", "label": "public static void setDefaultAllowUserInteraction(boolean defaultallowuserinteraction)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Sets the default value of the\\n     * {@code allowUserInteraction} field for all future\\n     * {@code URLConnection} objects to the specified value.\\n     *\\n     * @param   defaultallowuserinteraction   the new value.\\n     * @see     #getDefaultAllowUserInteraction()\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static boolean getDefaultAllowUserInteraction()", "label": "public static boolean getDefaultAllowUserInteraction()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the default value of the {@code allowUserInteraction}\\n     * field.\\n     * \u003cp\u003e\\n     * Ths default is \"sticky\", being a part of the static state of all\\n     * URLConnections.  This flag applies to the next, and all following\\n     * URLConnections that are created.\\n     *\\n     * @return  the default value of the {@code allowUserInteraction}\\n     *          field.\\n     * @see     #setDefaultAllowUserInteraction(boolean)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void setUseCaches(boolean usecaches)", "label": "public void setUseCaches(boolean usecaches)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Sets the value of the {@code useCaches} field of this\\n     * {@code URLConnection} to the specified value.\\n     * \u003cp\u003e\\n     * Some protocols do caching of documents.  Occasionally, it is important\\n     * to be able to \"tunnel through\" and ignore the caches (e.g., the\\n     * \"reload\" button in a browser).  If the UseCaches flag on a connection\\n     * is true, the connection is allowed to use whatever caches it can.\\n     *  If false, caches are to be ignored.\\n     *  The default value comes from DefaultUseCaches, which defaults to\\n     * true.\\n     *\\n     * @param usecaches a {@code boolean} indicating whether\\n     * or not to allow caching\\n     * @throws IllegalStateException if already connected\\n     * @see #getUseCaches()\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean getUseCaches()", "label": "public boolean getUseCaches()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the value of this {@code URLConnection}\u0027s\\n     * {@code useCaches} field.\\n     *\\n     * @return  the value of this {@code URLConnection}\u0027s\\n     *          {@code useCaches} field.\\n     * @see #setUseCaches(boolean)\\n     \"}"}, {"color": "#97c2fc", "id": "public void setIfModifiedSince(long ifmodifiedsince)", "label": "public void setIfModifiedSince(long ifmodifiedsince)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Sets the value of the {@code ifModifiedSince} field of\\n     * this {@code URLConnection} to the specified value.\\n     *\\n     * @param   ifmodifiedsince   the new value.\\n     * @throws IllegalStateException if already connected\\n     * @see     #getIfModifiedSince()\\n     \u0027}"}, {"color": "#97c2fc", "id": "public long getIfModifiedSince()", "label": "public long getIfModifiedSince()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the value of this object\u0027s {@code ifModifiedSince} field.\\n     *\\n     * @return  the value of this object\u0027s {@code ifModifiedSince} field.\\n     * @see #setIfModifiedSince(long)\\n     \"}"}, {"color": "#97c2fc", "id": "public boolean getDefaultUseCaches()", "label": "public boolean getDefaultUseCaches()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the default value of a {@code URLConnection}\\\u0027s\\n     * {@code useCaches} flag.\\n     * \u003cp\u003e\\n     * Ths default is \"sticky\", being a part of the static state of all\\n     * URLConnections.  This flag applies to the next, and all following\\n     * URLConnections that are created.\\n     *\\n     * @return  the default value of a {@code URLConnection}\\\u0027s\\n     *          {@code useCaches} flag.\\n     * @see     #setDefaultUseCaches(boolean)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void setDefaultUseCaches(boolean defaultusecaches)", "label": "public void setDefaultUseCaches(boolean defaultusecaches)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Sets the default value of the {@code useCaches} field to the\\n     * specified value.\\n     *\\n     * @param   defaultusecaches   the new value.\\n     * @see     #getDefaultUseCaches()\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void setRequestProperty(String key, String value)", "label": "public void setRequestProperty(String key, String value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Sets the general request property. If a property with the key already\\n     * exists, overwrite its value with the new value.\\n     *\\n     * \u003cp\u003e NOTE: HTTP requires all request properties which can\\n     * legally have multiple instances with the same key\\n     * to use a comma-separated list syntax which enables multiple\\n     * properties to be appended into a single property.\\n     *\\n     * @param   key     the keyword by which the request is known\\n     *                  (e.g., \"{@code Accept}\").\\n     * @param   value   the value associated with it.\\n     * @throws IllegalStateException if already connected\\n     * @throws NullPointerException if key is \u003cCODE\u003enull\u003c/CODE\u003e\\n     * @see #getRequestProperty(java.lang.String)\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void addRequestProperty(String key, String value)", "label": "public void addRequestProperty(String key, String value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Adds a general request property specified by a\\                           var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);
