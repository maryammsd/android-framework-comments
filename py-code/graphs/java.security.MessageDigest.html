        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             

             

             
             /* position absolute is important and the container has to be relative or absolute as well. */
          div.popup {
                 position:absolute;
                 top:0px;
                 left:0px;
                 display:none;
                 background-color:#f5f4ed;
                 -moz-border-radius: 3px;
                 -webkit-border-radius: 3px;
                 border-radius: 3px;
                 border: 1px solid #808074;
                 box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
          }

          /* hide the original tooltip */
          .vis-tooltip {
            display:none;
          }
             
        </style>

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',

              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "java.security.MessageDigest", "label": "java.security.MessageDigest", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\u0027}"}, {"color": "#97c2fc", "id": "public static MessageDigest getInstance(String algorithm) throws NoSuchAlgorithmException", "label": "public static MessageDigest getInstance(String algorithm) throws NoSuchAlgorithmException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a MessageDigest object that implements the specified digest\\n     * algorithm.\\n     *\\n     * \u003cp\u003e This method traverses the list of registered security Providers,\\n     * starting with the most preferred Provider.\\n     * A new MessageDigest object encapsulating the\\n     * MessageDigestSpi implementation from the first\\n     * Provider that supports the specified algorithm is returned.\\n     *\\n     * \u003cp\u003e Note that the list of registered providers may be retrieved via\\n     * the {@link Security#getProviders() Security.getProviders()} method.\\n     *\\n     * @implNote\\n     * The JDK Reference Implementation additionally uses the\\n     * {@code jdk.security.provider.preferred}\\n     * {@link Security#getProperty(String) Security} property to determine\\n     * the preferred provider order for the specified algorithm. This\\n     * may be different than the order of providers returned by\\n     * {@link Security#getProviders() Security.getProviders()}.\\n     *\\n     * @param algorithm the name of the algorithm requested.\\n     * See the MessageDigest section in the \u003ca href=\\n     * \"{@docRoot}/../specs/security/standard-names.html#messagedigest-algorithms\"\u003e\\n     * Java Security Standard Algorithm Names Specification\u003c/a\u003e\\n     * for information about standard algorithm names.\\n     *\\n     * @return a {@code MessageDigest} object that implements the\\n     *         specified algorithm\\n     *\\n     * @throws NoSuchAlgorithmException if no {@code Provider} supports a\\n     *         {@code MessageDigestSpi} implementation for the\\n     *         specified algorithm\\n     *\\n     * @throws NullPointerException if {@code algorithm} is {@code null}\\n     *\\n     * @see Provider\\n     \u0027}"}, {"color": "#97c2fc", "id": "getProperty(String)", "label": "getProperty(String)", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "getProviders()", "label": "getProviders()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public static MessageDigest getInstance(String algorithm, String provider) throws NoSuchAlgorithmException, NoSuchProviderException", "label": "public static MessageDigest getInstance(String algorithm, String provider) throws NoSuchAlgorithmException, NoSuchProviderException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a MessageDigest object that implements the specified digest\\n     * algorithm.\\n     *\\n     * \u003cp\u003e A new MessageDigest object encapsulating the\\n     * MessageDigestSpi implementation from the specified provider\\n     * is returned.  The specified provider must be registered\\n     * in the security provider list.\\n     *\\n     * \u003cp\u003e Note that the list of registered providers may be retrieved via\\n     * the {@link Security#getProviders() Security.getProviders()} method.\\n     *\\n     * @param algorithm the name of the algorithm requested.\\n     * See the MessageDigest section in the \u003ca href=\\n     * \"{@docRoot}/../specs/security/standard-names.html#messagedigest-algorithms\"\u003e\\n     * Java Security Standard Algorithm Names Specification\u003c/a\u003e\\n     * for information about standard algorithm names.\\n     *\\n     * @param provider the name of the provider.\\n     *\\n     * @return a {@code MessageDigest} object that implements the\\n     *         specified algorithm\\n     *\\n     * @throws IllegalArgumentException if the provider name is {@code null}\\n     *         or empty\\n     *\\n     * @throws NoSuchAlgorithmException if a {@code MessageDigestSpi}\\n     *         implementation for the specified algorithm is not\\n     *         available from the specified provider\\n     *\\n     * @throws NoSuchProviderException if the specified provider is not\\n     *         registered in the security provider list\\n     *\\n     * @throws NullPointerException if {@code algorithm} is {@code null}\\n     *\\n     * @see Provider\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static MessageDigest getInstance(String algorithm, Provider provider) throws NoSuchAlgorithmException", "label": "public static MessageDigest getInstance(String algorithm, Provider provider) throws NoSuchAlgorithmException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a MessageDigest object that implements the specified digest\\n     * algorithm.\\n     *\\n     * \u003cp\u003e A new MessageDigest object encapsulating the\\n     * MessageDigestSpi implementation from the specified Provider\\n     * object is returned.  Note that the specified Provider object\\n     * does not have to be registered in the provider list.\\n     *\\n     * @param algorithm the name of the algorithm requested.\\n     * See the MessageDigest section in the \u003ca href=\\n     * \"{@docRoot}/../specs/security/standard-names.html#messagedigest-algorithms\"\u003e\\n     * Java Security Standard Algorithm Names Specification\u003c/a\u003e\\n     * for information about standard algorithm names.\\n     *\\n     * @param provider the provider.\\n     *\\n     * @return a {@code MessageDigest} object that implements the\\n     *         specified algorithm\\n     *\\n     * @throws IllegalArgumentException if the specified provider is\\n     *         {@code null}\\n     *\\n     * @throws NoSuchAlgorithmException if a {@code MessageDigestSpi}\\n     *         implementation for the specified algorithm is not available\\n     *         from the specified {@code Provider} object\\n     *\\n     * @throws NullPointerException if {@code algorithm} is {@code null}\\n     *\\n     * @see Provider\\n     *\\n     * @since 1.4\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final Provider getProvider()", "label": "public final Provider getProvider()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the provider of this message digest object.\\n     *\\n     * @return the provider of this message digest object\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void update(byte input)", "label": "public void update(byte input)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Updates the digest using the specified byte.\\n     *\\n     * @param input the byte with which to update the digest.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void update(byte[] input, int offset, int len)", "label": "public void update(byte[] input, int offset, int len)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Updates the digest using the specified array of bytes, starting\\n     * at the specified offset.\\n     *\\n     * @param input the array of bytes.\\n     *\\n     * @param offset the offset to start from in the array of bytes.\\n     *\\n     * @param len the number of bytes to use, starting at\\n     * {@code offset}.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void update(byte[] input)", "label": "public void update(byte[] input)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Updates the digest using the specified array of bytes.\\n     *\\n     * @param input the array of bytes.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final void update(ByteBuffer input)", "label": "public final void update(ByteBuffer input)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Update the digest using the specified ByteBuffer. The digest is\\n     * updated using the {@code input.remaining()} bytes starting\\n     * at {@code input.position()}.\\n     * Upon return, the buffer\u0027s position will be equal to its limit;\\n     * its limit will not have changed.\\n     *\\n     * @param input the ByteBuffer\\n     * @since 1.5\\n     \"}"}, {"color": "#97c2fc", "id": "public byte[] digest()", "label": "public byte[] digest()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Completes the hash computation by performing final operations\\n     * such as padding. The digest is reset after this call is made.\\n     *\\n     * @return the array of bytes for the resulting hash value.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int digest(byte[] buf, int offset, int len) throws DigestException", "label": "public int digest(byte[] buf, int offset, int len) throws DigestException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Completes the hash computation by performing final operations\\n     * such as padding. The digest is reset after this call is made.\\n     *\\n     * @param buf output buffer for the computed digest\\n     *\\n     * @param offset offset into the output buffer to begin storing the digest\\n     *\\n     * @param len number of bytes within buf allotted for the digest\\n     *\\n     * @return the number of bytes placed into {@code buf}\\n     *\\n     * @exception DigestException if an error occurs.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public byte[] digest(byte[] input)", "label": "public byte[] digest(byte[] input)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Performs a final update on the digest using the specified array\\n     * of bytes, then completes the digest computation. That is, this\\n     * method first calls {@link #update(byte[]) update(input)},\\n     * passing the \u003ci\u003einput\u003c/i\u003e array to the {@code update} method,\\n     * then calls {@link #digest() digest()}.\\n     *\\n     * @param input the input to be updated before the digest is\\n     * completed.\\n     *\\n     * @return the array of bytes for the resulting hash value.\\n     \u0027}"}, {"color": "#97c2fc", "id": "update(byte", "label": "update(byte", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "digest()", "label": "digest()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public String toString()", "label": "public String toString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a string representation of this message digest object.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static boolean isEqual(byte[] digesta, byte[] digestb)", "label": "public static boolean isEqual(byte[] digesta, byte[] digestb)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares two digests for equality. Two digests are equal if they have\\n     * the same length and all bytes at corresponding positions are equal.\\n     *\\n     * @implNote\\n     * All bytes in {@code digesta} are examined to determine equality.\\n     * The calculation time depends only on the length of {@code digesta}.\\n     * It does not depend on the length of {@code digestb} or the contents\\n     * of {@code digesta} and {@code digestb}.\\n     *\\n     * @param digesta one of the digests to compare.\\n     *\\n     * @param digestb the other digest to compare.\\n     *\\n     * @return true if the digests are equal, false otherwise.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void reset()", "label": "public void reset()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Resets the digest for further use.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final String getAlgorithm()", "label": "public final String getAlgorithm()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a string that identifies the algorithm, independent of\\n     * implementation details. The name should be a standard\\n     * Java Security name (such as \"SHA-256\").\\n     * See the MessageDigest section in the \u003ca href=\\n     * \"{@docRoot}/../specs/security/standard-names.html#messagedigest-algorithms\"\u003e\\n     * Java Security Standard Algorithm Names Specification\u003c/a\u003e\\n     * for information about standard algorithm names.\\n     *\\n     * @return the name of the algorithm\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final int getDigestLength()", "label": "public final int getDigestLength()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the length of the digest in bytes, or 0 if this operation is\\n     * not supported by the provider and the implementation is not cloneable.\\n     *\\n     * @return the digest length in bytes, or 0 if this operation is not\\n     * supported by the provider and the implementation is not cloneable.\\n     *\\n     * @since 1.2\\n     \u0027}"}, {"color": "#97c2fc", "id": "public Object clone() throws CloneNotSupportedException", "label": "public Object clone() throws CloneNotSupportedException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a clone if the implementation is cloneable.\\n     *\\n     * @return a clone if the implementation is cloneable.\\n     *\\n     * @exception CloneNotSupportedException if this is called on an\\n     * implementation that does not support {@code Cloneable}.\\n     \u0027}"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static MessageDigest getInstance(String algorithm) throws NoSuchAlgorithmException"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static MessageDigest getInstance(String algorithm, String provider) throws NoSuchAlgorithmException, NoSuchProviderException"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static MessageDigest getInstance(String algorithm, Provider provider) throws NoSuchAlgorithmException"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public final Provider getProvider()"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void update(byte input)"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void update(byte[] input, int offset, int len)"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void update(byte[] input)"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public final void update(ByteBuffer input)"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public byte[] digest()"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public int digest(byte[] buf, int offset, int len) throws DigestException"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public byte[] digest(byte[] input)"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public String toString()"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public static boolean isEqual(byte[] digesta, byte[] digestb)"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public void reset()"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public final String getAlgorithm()"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public final int getDigestLength()"}, {"arrows": "to", "from": "java.security.MessageDigest", "title": "{\u0027type\u0027: \u0027child\u0027}", "to": "public Object clone() throws CloneNotSupportedException"}, {"arrows": "to", "from": "public static MessageDigest getInstance(String algorithm) throws NoSuchAlgorithmException", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "getProperty(String)"}, {"arrows": "to", "from": "public static MessageDigest getInstance(String algorithm) throws NoSuchAlgorithmException", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "getProviders()"}, {"arrows": "to", "from": "public static MessageDigest getInstance(String algorithm, String provider) throws NoSuchAlgorithmException, NoSuchProviderException", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "getProviders()"}, {"arrows": "to", "from": "public byte[] digest(byte[] input)", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "update(byte"}, {"arrows": "to", "from": "public byte[] digest(byte[] input)", "title": "{\u0027type\u0027: \u0027link\u0027}", "to": "digest()"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  
                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
