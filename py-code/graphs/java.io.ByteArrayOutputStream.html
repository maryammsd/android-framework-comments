                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "java.io.ByteArrayOutputStream", "label": "java.io.ByteArrayOutputStream", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\u0027}"}, {"color": "#97c2fc", "id": "private void ensureCapacity(int minCapacity)", "label": "private void ensureCapacity(int minCapacity)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Increases the capacity if necessary to ensure that it can hold\\n     * at least the number of elements specified by the minimum\\n     * capacity argument.\\n     *\\n     * @param  minCapacity the desired minimum capacity\\n     * @throws OutOfMemoryError if {@code minCapacity \u003c 0}.  This is\\n     * interpreted as a request for the unsatisfiably large capacity\\n     * {@code (long) Integer.MAX_VALUE + (minCapacity - Integer.MAX_VALUE)}.\\n     \u0027}"}, {"color": "#97c2fc", "id": "private void grow(int minCapacity)", "label": "private void grow(int minCapacity)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Increases the capacity to ensure that it can hold at least the\\n     * number of elements specified by the minimum capacity argument.\\n     *\\n     * @param minCapacity the desired minimum capacity\\n     \u0027}"}, {"color": "#97c2fc", "id": "public synchronized void write(int b)", "label": "public synchronized void write(int b)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Writes the specified byte to this {@code ByteArrayOutputStream}.\\n     *\\n     * @param   b   the byte to be written.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public synchronized void write(byte[] b, int off, int len)", "label": "public synchronized void write(byte[] b, int off, int len)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Writes {@code len} bytes from the specified byte array\\n     * starting at offset {@code off} to this {@code ByteArrayOutputStream}.\\n     *\\n     * @param   b     the data.\\n     * @param   off   the start offset in the data.\\n     * @param   len   the number of bytes to write.\\n     * @throws  NullPointerException if {@code b} is {@code null}.\\n     * @throws  IndexOutOfBoundsException if {@code off} is negative,\\n     * {@code len} is negative, or {@code len} is greater than\\n     * {@code b.length - off}\\n     \u0027}"}, {"color": "#97c2fc", "id": "public void writeBytes(byte[] b)", "label": "public void writeBytes(byte[] b)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Writes the complete contents of the specified byte array\\n     * to this {@code ByteArrayOutputStream}.\\n     *\\n     * @apiNote\\n     * This method is equivalent to {@link #write(byte[],int,int)\\n     * write(b, 0, b.length)}.\\n     *\\n     * @param   b     the data.\\n     * @throws  NullPointerException if {@code b} is {@code null}.\\n     * @since   11\\n     \u0027}"}, {"color": "#97c2fc", "id": "write(byte", "label": "write(byte", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public synchronized void writeTo(OutputStream out) throws IOException", "label": "public synchronized void writeTo(OutputStream out) throws IOException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Writes the complete contents of this {@code ByteArrayOutputStream} to\\n     * the specified output stream argument, as if by calling the output\\n     * stream\u0027s write method using {@code out.write(buf, 0, count)}.\\n     *\\n     * @param   out   the output stream to which to write the data.\\n     * @throws  NullPointerException if {@code out} is {@code null}.\\n     * @throws  IOException if an I/O error occurs.\\n     \"}"}, {"color": "#97c2fc", "id": "public synchronized void reset()", "label": "public synchronized void reset()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Resets the {@code count} field of this {@code ByteArrayOutputStream}\\n     * to zero, so that all currently accumulated output in the\\n     * output stream is discarded. The output stream can be used again,\\n     * reusing the already allocated buffer space.\\n     *\\n     * @see     java.io.ByteArrayInputStream#count\\n     \u0027}"}, {"color": "#97c2fc", "id": "public synchronized byte[] toByteArray()", "label": "public synchronized byte[] toByteArray()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Creates a newly allocated byte array. Its size is the current\\n     * size of this output stream and the valid contents of the buffer\\n     * have been copied into it.\\n     *\\n     * @return  the current contents of this output stream, as a byte array.\\n     * @see     java.io.ByteArrayOutputStream#size()\\n     \u0027}"}, {"color": "#97c2fc", "id": "public synchronized int size()", "label": "public synchronized int size()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the current size of the buffer.\\n     *\\n     * @return  the value of the {@code count} field, which is the number\\n     *          of valid bytes in this output stream.\\n     * @see     java.io.ByteArrayOutputStream#count\\n     \u0027}"}, {"color": "#97c2fc", "id": "public synchronized String toString()", "label": "public synchronized String toString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Converts the buffer\u0027s contents into a string decoding bytes using the\\n     * platform\u0027s default character set. The length of the new {@code String}\\n     * is a function of the character set, and hence may not be equal to the\\n     * size of the buffer.\\n     *\\n     * \u003cp\u003e This method always replaces malformed-input and unmappable-character\\n     * sequences with the default replacement string for the platform\u0027s\\n     * default character set. The {@linkplain java.nio.charset.CharsetDecoder}\\n     * class should be used when more control over the decoding process is\\n     * required.\\n     *\\n     * @return String decoded from the buffer\u0027s contents.\\n     * @since  1.1\\n     \"}"}, {"color": "#97c2fc", "id": "public synchronized String toString(String charsetName) throws UnsupportedEncodingException", "label": "public synchronized String toString(String charsetName) throws UnsupportedEncodingException", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Converts the buffer\\\u0027s contents into a string by decoding the bytes using\\n     * the named {@link java.nio.charset.Charset charset}.\\n     *\\n     * \u003cp\u003e This method is equivalent to {@code #toString(charset)} that takes a\\n     * {@link java.nio.charset.Charset charset}.\\n     *\\n     * \u003cp\u003e An invocation of this method of the form\\n     *\\n     * \u003cpre\u003e {@code\\n     *      ByteArrayOutputStream b = ...\\n     *      b.toString(\"UTF-8\")\\n     *      }\\n     * \u003c/pre\u003e\\n     *\\n     * behaves in exactly the same way as the expression\\n     *\\n     * \u003cpre\u003e {@code\\n     *      ByteArrayOutputStream b = ...\\n     *      b.toString(StandardCharsets.UTF_8)\\n     *      }\\n     * \u003c/pre\u003e\\n     *\\n     *\\n     * @param  charsetName  the name of a supported\\n     *         {@link java.nio.charset.Charset charset}\\n     * @return String decoded from the buffer\\\u0027s contents.\\n     * @throws UnsupportedEncodingException\\n     *         If the named charset is not supported\\n     * @since  1.1\\n     \u0027}"}, {"color": "#97c2fc", "id": "java.nio.charset.Charset", "label": "java.nio.charset.Charset", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\u0027}"}, {"color": "#97c2fc", "id": "private static void checkName(String s)", "label": "private static void checkName(String s)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Checks that the given string is a legal charset name. \u003c/p\u003e\\n     *\\n     * @param  s\\n     *         A purported charset name\\n     *\\n     * @throws  IllegalCharsetNameException\\n     *          If the given name is not a legal charset name\\n     \u0027}"}, {"color": "#97c2fc", "id": "private static Charset lookup(String charsetName)", "label": "private static Charset lookup(String charsetName)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 instance in a map for level 2 cache.\u0027}"}, {"color": "#97c2fc", "id": "public static boolean isSupported(String charsetName)", "label": "public static boolean isSupported(String charsetName)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether the named charset is supported.\\n     *\\n     * @param  charsetName\\n     *         The name of the requested charset; may be either\\n     *         a canonical name or an alias\\n     *\\n     * @return  {@code true} if, and only if, support for the named charset\\n     *          is available in the current Java virtual machine\\n     *\\n     * @throws IllegalCharsetNameException\\n     *         If the given charset name is illegal\\n     *\\n     * @throws  IllegalArgumentException\\n     *          If the given {@code charsetName} is null\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static Charset forName(String charsetName)", "label": "public static Charset forName(String charsetName)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a charset object for the named charset.\\n     *\\n     * @param  charsetName\\n     *         The name of the requested charset; may be either\\n     *         a canonical name or an alias\\n     *\\n     * @return  A charset object for the named charset\\n     *\\n     * @throws  IllegalCharsetNameException\\n     *          If the given charset name is illegal\\n     *\\n     * @throws  IllegalArgumentException\\n     *          If the given {@code charsetName} is null\\n     *\\n     * @throws  UnsupportedCharsetException\\n     *          If no support for the named charset is available\\n     *          in this instance of the Java virtual machine\\n     \u0027}"}, {"color": "#97c2fc", "id": "public static SortedMap\u003cString, Charset\u003e availableCharsets()", "label": "public static SortedMap\u003cString, Charset\u003e availableCharsets()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Constructs a sorted map from canonical charset names to charset objects.\\n     *\\n     * \u003cp\u003e The map returned by this method will have one entry for each charset\\n     * for which support is available in the current Java virtual machine.  If\\n     * two or more supported charsets have the same canonical name then the\\n     * resulting map will contain just one of them; which one it will contain\\n     * is not specified. \u003c/p\u003e\\n     *\\n     * \u003cp\u003e The invocation of this method, and the subsequent use of the\\n     * resulting map, may cause time-consuming disk or network I/O operations\\n     * to occur.  This method is provided for applications that need to\\n     * enumerate all of the available charsets, for example to allow user\\n     * charset selection.  This method is not used by the {@link #forName\\n     * forName} method, which instead employs an efficient incremental lookup\\n     * algorithm.\\n     *\\n     * \u003cp\u003e This method may return different results at different times if new\\n     * charset providers are dynamically made available to the current Java\\n     * virtual machine.  In the absence of such changes, the charsets returned\\n     * by this method are exactly those that can be retrieved via the {@link\\n     * #forName forName} method.  \u003c/p\u003e\\n     *\\n     * @return An immutable, case-insensitive map from canonical charset names\\n     *         to charset objects\\n     \u0027}"}, {"color": "#97c2fc", "id": "forNameforName", "label": "forNameforName", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "forName", "label": "forName", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public static Charset defaultCharset()", "label": "public static Charset defaultCharset()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the default charset of this Java virtual machine.\\n     *\\n     * \u003cp\u003eAndroid note: The Android platform default is always UTF-8.\\n     *\\n     * @return  A charset object for the default charset\\n     *\\n     * @since 1.5\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final String name()", "label": "public final String name()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns this charset\u0027s canonical name.\\n     *\\n     * @return  The canonical name of this charset\\n     \"}"}, {"color": "#97c2fc", "id": "public final Set\u003cString\u003e aliases()", "label": "public final Set\u003cString\u003e aliases()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns a set containing this charset\u0027s aliases.\\n     *\\n     * @return  An immutable set of this charset\u0027s aliases\\n     \"}"}, {"color": "#97c2fc", "id": "public String displayName()", "label": "public String displayName()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns this charset\u0027s human-readable name for the default locale.\\n     *\\n     * \u003cp\u003e The default implementation of this method simply returns this\\n     * charset\u0027s canonical name.  Concrete subclasses of this class may\\n     * override this method in order to provide a localized display name. \u003c/p\u003e\\n     *\\n     * @return  The display name of this charset in the default locale\\n     \"}"}, {"color": "#97c2fc", "id": "public final boolean isRegistered()", "label": "public final boolean isRegistered()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether or not this charset is registered in the \u003ca\\n     * href=\"http://www.iana.org/assignments/character-sets\"\u003eIANA Charset\\n     * Registry\u003c/a\u003e.\\n     *\\n     * @return  {@code true} if, and only if, this charset is known by its\\n     *          implementor to be registered with the IANA\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String displayName(Locale locale)", "label": "public String displayName(Locale locale)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns this charset\u0027s human-readable name for the given locale.\\n     *\\n     * \u003cp\u003e The default implementation of this method simply returns this\\n     * charset\u0027s canonical name.  Concrete subclasses of this class may\\n     * override this method in order to provide a localized display name. \u003c/p\u003e\\n     *\\n     * @param  locale\\n     *         The locale for which the display name is to be retrieved\\n     *\\n     * @return  The display name of this charset in the given locale\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract boolean contains(Charset cs)", "label": "public abstract boolean contains(Charset cs)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether or not this charset contains the given charset.\\n     *\\n     * \u003cp\u003e A charset \u003ci\u003eC\u003c/i\u003e is said to \u003ci\u003econtain\u003c/i\u003e a charset \u003ci\u003eD\u003c/i\u003e if,\\n     * and only if, every character representable in \u003ci\u003eD\u003c/i\u003e is also\\n     * representable in \u003ci\u003eC\u003c/i\u003e.  If this relationship holds then it is\\n     * guaranteed that every string that can be encoded in \u003ci\u003eD\u003c/i\u003e can also be\\n     * encoded in \u003ci\u003eC\u003c/i\u003e without performing any replacements.\\n     *\\n     * \u003cp\u003e That \u003ci\u003eC\u003c/i\u003e contains \u003ci\u003eD\u003c/i\u003e does not imply that each character\\n     * representable in \u003ci\u003eC\u003c/i\u003e by a particular byte sequence is represented\\n     * in \u003ci\u003eD\u003c/i\u003e by the same byte sequence, although sometimes this is the\\n     * case.\\n     *\\n     * \u003cp\u003e Every charset contains itself.\\n     *\\n     * \u003cp\u003e This method computes an approximation of the containment relation:\\n     * If it returns {@code true} then the given charset is known to be\\n     * contained by this charset; if it returns {@code false}, however, then\\n     * it is not necessarily the case that the given charset is not contained\\n     * in this charset.\\n     *\\n     * @param   cs\\n     *          The given charset\\n     *\\n     * @return  {@code true} if the given charset is contained in this charset\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract CharsetDecoder newDecoder()", "label": "public abstract CharsetDecoder newDecoder()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Constructs a new decoder for this charset.\\n     *\\n     * @return  A new decoder for this charset\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract CharsetEncoder newEncoder()", "label": "public abstract CharsetEncoder newEncoder()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Constructs a new encoder for this charset.\\n     *\\n     * @return  A new encoder for this charset\\n     *\\n     * @throws  UnsupportedOperationException\\n     *          If this charset does not support encoding\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean canEncode()", "label": "public boolean canEncode()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether or not this charset supports encoding.\\n     *\\n     * \u003cp\u003e Nearly all charsets support encoding.  The primary exceptions are\\n     * special-purpose \u003ci\u003eauto-detect\u003c/i\u003e charsets whose decoders can determine\\n     * which of several possible encoding schemes is in use by examining the\\n     * input byte sequence.  Such charsets do not support encoding because\\n     * there is no way to determine which encoding should be used on output.\\n     * Implementations of such charsets should override this method to return\\n     * {@code false}. \u003c/p\u003e\\n     *\\n     * @return  {@code true} if, and only if, this charset supports encoding\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final CharBuffer decode(ByteBuffer bb)", "label": "public final CharBuffer decode(ByteBuffer bb)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Convenience method that decodes bytes in this charset into Unicode\\n     * characters.\\n     *\\n     * \u003cp\u003e An invocation of this method upon a charset {@code cs} returns the\\n     * same result as the expression\\n     *\\n     * \u003cpre\u003e\\n     *     cs.newDecoder()\\n     *       .onMalformedInput(CodingErrorAction.REPLACE)\\n     *       .onUnmappableCharacter(CodingErrorAction.REPLACE)\\n     *       .decode(bb); \u003c/pre\u003e\\n     *\\n     * except that it is potentially more efficient because it can cache\\n     * decoders between successive invocations.\\n     *\\n     * \u003cp\u003e This method always replaces malformed-input and unmappable-character\\n     * sequences with this charset\u0027s default replacement byte array.  In order\\n     * to detect such sequences, use the {@link\\n     * CharsetDecoder#decode(java.nio.ByteBuffer)} method directly.  \u003c/p\u003e\\n     *\\n     * @param  bb  The byte buffer to be decoded\\n     *\\n     * @return  A char buffer containing the decoded characters\\n     \"}"}, {"color": "#97c2fc", "id": "decode(java.nio.ByteBuffer)", "label": "decode(java.nio.ByteBuffer)", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public final ByteBuffer encode(CharBuffer cb)", "label": "public final ByteBuffer encode(CharBuffer cb)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Convenience method that encodes Unicode characters into bytes in this\\n     * charset.\\n     *\\n     * \u003cp\u003e An invocation of this method upon a charset {@code cs} returns the\\n     * same result as the expression\\n     *\\n     * \u003cpre\u003e\\n     *     cs.newEncoder()\\n     *       .onMalformedInput(CodingErrorAction.REPLACE)\\n     *       .onUnmappableCharacter(CodingErrorAction.REPLACE)\\n     *       .encode(bb); \u003c/pre\u003e\\n     *\\n     * except that it is potentially more efficient because it can cache\\n     * encoders between successive invocations.\\n     *\\n     * \u003cp\u003e This method always replaces malformed-input and unmappable-character\\n     * sequences with this charset\u0027s default replacement string.  In order to\\n     * detect such sequences, use the {@link\\n     * CharsetEncoder#encode(java.nio.CharBuffer)} method directly.  \u003c/p\u003e\\n     *\\n     * @param  cb  The char buffer to be encoded\\n     *\\n     * @return  A byte buffer containing the encoded characters\\n     \"}"}, {"color": "#97c2fc", "id": "encode(java.nio.CharBuffer)", "label": "encode(java.nio.CharBuffer)", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public final ByteBuffer encode(String str)", "label": "public final ByteBuffer encode(String str)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Convenience method that encodes a string into bytes in this charset.\\n     *\\n     * \u003cp\u003e An invocation of this method upon a charset {@code cs} returns the\\n     * same result as the expression\\n     *\\n     * \u003cpre\u003e\\n     *     cs.encode(CharBuffer.wrap(s)); \u003c/pre\u003e\\n     *\\n     * @param  str  The string to be encoded\\n     *\\n     * @return  A byte buffer containing the encoded characters\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final int compareTo(Charset that)", "label": "public final int compareTo(Charset that)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares this charset to another.\\n     *\\n     * \u003cp\u003e Charsets are ordered by their canonical names, without regard to\\n     * case. \u003c/p\u003e\\n     *\\n     * @param  that\\n     *         The charset to which this charset is to be compared\\n     *\\n     * @return A negative integer, zero, or a positive integer as this charset\\n     *         is less than, equal to, or greater than the specified charset\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final int hashCode()", "label": "public final int hashCode()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Computes a hashcode for this charset.\\n     *\\n     * @return  An integer hashcode\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final boolean equals(Object ob)", "label": "public final boolean equals(Object ob)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether or not this object is equal to another.\\n     *\\n     * \u003cp\u003e Two charsets are equal if, and only if, they have the same canonical\\n     * names.  A charset is never equal to any other type of object.  \u003c/p\u003e\\n     *\\n     * @return  {@code true} if, and only if, this charset is equal to the\\n     *          given object\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final String toString()", "label": "public final String toString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a string describing this charset.\\n     *\\n     * @return  A string describing this charset\\n     \u0027}"}, {"color": "#97c2fc", "id": "public synchronized String toString(Charset charset)", "label": "public synchronized String toString(Charset charset)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Converts the buffer\u0027s contents into a string by decoding the bytes using\\n     * the specified {@link java.nio.charset.Charset charset}. The length of the new\\n     * {@code String} is a function of the charset, and hence may not be equal\\n     * to the length of the byte array.\\n     *\\n     * \u003cp\u003e This method always replaces malformed-input and unmappable-character\\n     * sequences with the charset\u0027s default replacement string. The {@link\\n     * java.nio.charset.CharsetDecoder} class should be used when more control\\n     * over the decoding process is required.\\n     *\\n     * @param      charset  the {@linkplain java.nio.charset.Charset charset}\\n     *             to be used to decode the {@code bytes}\\n     * @return     String decoded from the buffer\u0027s contents.\\n     * @since      10\\n     \"}"}, {"color": "#97c2fc", "id": "java.nio.charset.CharsetDecoder", "label": "java.nio.charset.CharsetDecoder", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\u0027}"}, {"color": "#97c2fc", "id": "public final Charset charset()", "label": "public final Charset charset()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the charset that created this decoder.\\n     *\\n     * @return  This decoder\u0027s charset\\n     \"}"}, {"color": "#97c2fc", "id": "public final String replacement()", "label": "public final String replacement()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns this decoder\u0027s replacement value.\\n     *\\n     * @return  This decoder\u0027s current replacement,\\n     *          which is never {@code null} and is never empty\\n     \"}"}, {"color": "#97c2fc", "id": "public final CharsetDecoder replaceWith(String newReplacement)", "label": "public final CharsetDecoder replaceWith(String newReplacement)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Changes this decoder\u0027s replacement value.\\n     *\\n     * \u003cp\u003e This method invokes the {@link #implReplaceWith implReplaceWith}\\n     * method, passing the new replacement, after checking that the new\\n     * replacement is acceptable.  \u003c/p\u003e\\n     *\\n     * @param  newReplacement  The new replacement; must not be\\n     *         {@code null}, must have non-zero length,\\n\\n     *         and must not be longer than the value returned by the\\n     *         {@link #maxCharsPerByte() maxCharsPerByte} method\\n\\n\\n\\n\\n\\n\\n     *\\n     * @return  This decoder\\n     *\\n     * @throws  IllegalArgumentException\\n     *          If the preconditions on the parameter do not hold\\n     \"}"}, {"color": "#97c2fc", "id": "maxCharsPerByte()", "label": "maxCharsPerByte()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "implReplaceWith", "label": "implReplaceWith", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "protected void implReplaceWith(String newReplacement)", "label": "protected void implReplaceWith(String newReplacement)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Reports a change to this decoder\u0027s replacement value.\\n     *\\n     * \u003cp\u003e The default implementation of this method does nothing.  This method\\n     * should be overridden by decoders that require notification of changes to\\n     * the replacement.  \u003c/p\u003e\\n     *\\n     * @param  newReplacement    The replacement value\\n     \"}"}, {"color": "#97c2fc", "id": "public CodingErrorAction malformedInputAction()", "label": "public CodingErrorAction malformedInputAction()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns this decoder\u0027s current action for malformed-input errors.\\n     *\\n     * @return The current malformed-input action, which is never {@code null}\\n     \"}"}, {"color": "#97c2fc", "id": "public final CharsetDecoder onMalformedInput(CodingErrorAction newAction)", "label": "public final CharsetDecoder onMalformedInput(CodingErrorAction newAction)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Changes this decoder\u0027s action for malformed-input errors.\\n     *\\n     * \u003cp\u003e This method invokes the {@link #implOnMalformedInput\\n     * implOnMalformedInput} method, passing the new action.  \u003c/p\u003e\\n     *\\n     * @param  newAction  The new action; must not be {@code null}\\n     *\\n     * @return  This decoder\\n     *\\n     * @throws IllegalArgumentException\\n     *         If the precondition on the parameter does not hold\\n     \"}"}, {"color": "#97c2fc", "id": "implOnMalformedInputimplOnMalformedInput", "label": "implOnMalformedInputimplOnMalformedInput", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "protected void implOnMalformedInput(CodingErrorAction newAction)", "label": "protected void implOnMalformedInput(CodingErrorAction newAction)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Reports a change to this decoder\u0027s malformed-input action.\\n     *\\n     * \u003cp\u003e The default implementation of this method does nothing.  This method\\n     * should be overridden by decoders that require notification of changes to\\n     * the malformed-input action.  \u003c/p\u003e\\n     *\\n     * @param  newAction  The new action\\n     \"}"}, {"color": "#97c2fc", "id": "public CodingErrorAction unmappableCharacterAction()", "label": "public CodingErrorAction unmappableCharacterAction()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns this decoder\u0027s current action for unmappable-character errors.\\n     *\\n     * @return The current unmappable-character action, which is never\\n     *         {@code null}\\n     \"}"}, {"color": "#97c2fc", "id": "public final CharsetDecoder onUnmappableCharacter(CodingErrorAction newAction)", "label": "public final CharsetDecoder onUnmappableCharacter(CodingErrorAction newAction)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Changes this decoder\u0027s action for unmappable-character errors.\\n     *\\n     * \u003cp\u003e This method invokes the {@link #implOnUnmappableCharacter\\n     * implOnUnmappableCharacter} method, passing the new action.  \u003c/p\u003e\\n     *\\n     * @param  newAction  The new action; must not be {@code null}\\n     *\\n     * @return  This decoder\\n     *\\n     * @throws IllegalArgumentException\\n     *         If the precondition on the parameter does not hold\\n     \"}"}, {"color": "#97c2fc", "id": "implOnUnmappableCharacterimplOnUnmappableCharacter", "label": "implOnUnmappableCharacterimplOnUnmappableCharacter", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "protected void implOnUnmappableCharacter(CodingErrorAction newAction)", "label": "protected void implOnUnmappableCharacter(CodingErrorAction newAction)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Reports a change to this decoder\u0027s unmappable-character action.\\n     *\\n     * \u003cp\u003e The default implementation of this method does nothing.  This method\\n     * should be overridden by decoders that require notification of changes to\\n     * the unmappable-character action.  \u003c/p\u003e\\n     *\\n     * @param  newAction  The new action\\n     \"}"}, {"color": "#97c2fc", "id": "public final float averageCharsPerByte()", "label": "public final float averageCharsPerByte()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the average number of characters that will be produced for each\\n     * byte of input.  This heuristic value may be used to estimate the size\\n     * of the output buffer required for a given input sequence.\\n     *\\n     * @return  The average number of characters produced\\n     *          per byte of input\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final float maxCharsPerByte()", "label": "public final float maxCharsPerByte()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the maximum number of characters that will be produced for each\\n     * byte of input.  This value may be used to compute the worst-case size\\n     * of the output buffer required for a given input sequence. This value\\n     * accounts for any necessary content-independent prefix or suffix\\n\\n\\n\\n\\n     * characters.\\n\\n     *\\n     * @return  The maximum number of characters that will be produced per\\n     *          byte of input\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final CoderResult decode(ByteBuffer in, CharBuffer out, boolean endOfInput)", "label": "public final CoderResult decode(ByteBuffer in, CharBuffer out, boolean endOfInput)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Decodes as many bytes as possible from the given input buffer,\\n     * writing the results to the given output buffer.\\n     *\\n     * \u003cp\u003e The buffers are read from, and written to, starting at their current\\n     * positions.  At most {@link Buffer#remaining in.remaining()} bytes\\n     * will be read and at most {@link Buffer#remaining out.remaining()}\\n     * characters will be written.  The buffers\\\u0027 positions will be advanced to\\n     * reflect the bytes read and the characters written, but their marks and\\n     * limits will not be modified.\\n     *\\n     * \u003cp\u003e In addition to reading bytes from the input buffer and writing\\n     * characters to the output buffer, this method returns a {@link CoderResult}\\n     * object to describe its reason for termination:\\n     *\\n     * \u003cul\u003e\\n     *\\n     *   \u003cli\u003e\u003cp\u003e {@link CoderResult#UNDERFLOW} indicates that as much of the\\n     *   input buffer as possible has been decoded.  If there is no further\\n     *   input then the invoker can proceed to the next step of the\\n     *   \u003ca href=\"#steps\"\u003edecoding operation\u003c/a\u003e.  Otherwise this method\\n     *   should be invoked again with further input.  \u003c/p\u003e\u003c/li\u003e\\n     *\\n     *   \u003cli\u003e\u003cp\u003e {@link CoderResult#OVERFLOW} indicates that there is\\n     *   insufficient space in the output buffer to decode any more bytes.\\n     *   This method should be invoked again with an output buffer that has\\n     *   more {@linkplain Buffer#remaining remaining} characters. This is\\n     *   typically done by draining any decoded characters from the output\\n     *   buffer.  \u003c/p\u003e\u003c/li\u003e\\n     *\\n     *   \u003cli\u003e\u003cp\u003e A {@linkplain CoderResult#malformedForLength\\n     *   malformed-input} result indicates that a malformed-input\\n     *   error has been detected.  The malformed bytes begin at the input\\n     *   buffer\\\u0027s (possibly incremented) position; the number of malformed\\n     *   bytes may be determined by invoking the result object\\\u0027s {@link\\n     *   CoderResult#length() length} method.  This case applies only if the\\n     *   {@linkplain #onMalformedInput malformed action} of this decoder\\n     *   is {@link CodingErrorAction#REPORT}; otherwise the malformed input\\n     *   will be ignored or replaced, as requested.  \u003c/p\u003e\u003c/li\u003e\\n     *\\n     *   \u003cli\u003e\u003cp\u003e An {@linkplain CoderResult#unmappableForLength\\n     *   unmappable-character} result indicates that an\\n     *   unmappable-character error has been detected.  The bytes that\\n     *   decode the unmappable character begin at the input buffer\\\u0027s (possibly\\n     *   incremented) position; the number of such bytes may be determined\\n     *   by invoking the result object\\\u0027s {@link CoderResult#length() length}\\n     *   method.  This case applies only if the {@linkplain #onUnmappableCharacter\\n     *   unmappable action} of this decoder is {@link\\n     *   CodingErrorAction#REPORT}; otherwise the unmappable character will be\\n     *   ignored or replaced, as requested.  \u003c/p\u003e\u003c/li\u003e\\n     *\\n     * \u003c/ul\u003e\\n     *\\n     * In any case, if this method is to be reinvoked in the same decoding\\n     * operation then care should be taken to preserve any bytes remaining\\n     * in the input buffer so that they are available to the next invocation.\\n     *\\n     * \u003cp\u003e The {@code endOfInput} parameter advises this method as to whether\\n     * the invoker can provide further input beyond that contained in the given\\n     * input buffer.  If there is a possibility of providing additional input\\n     * then the invoker should pass {@code false} for this parameter; if there\\n     * is no possibility of providing further input then the invoker should\\n     * pass {@code true}.  It is not erroneous, and in fact it is quite\\n     * common, to pass {@code false} in one invocation and later discover that\\n     * no further input was actually available.  It is critical, however, that\\n     * the final invocation of this method in a sequence of invocations always\\n     * pass {@code true} so that any remaining undecoded input will be treated\\n     * as being malformed.\\n     *\\n     * \u003cp\u003e This method works by invoking the {@link #decodeLoop decodeLoop}\\n     * method, interpreting its results, handling error conditions, and\\n     * reinvoking it as necessary.  \u003c/p\u003e\\n     *\\n     *\\n     * @param  in\\n     *         The input byte buffer\\n     *\\n     * @param  out\\n     *         The output character buffer\\n     *\\n     * @param  endOfInput\\n     *         {@code true} if, and only if, the invoker can provide no\\n     *         additional input bytes beyond those in the given buffer\\n     *\\n     * @return  A coder-result object describing the reason for termination\\n     *\\n     * @throws  IllegalStateException\\n     *          If a decoding operation is already in progress and the previous\\n     *          step was an invocation neither of the {@link #reset reset}\\n     *          method, nor of this method with a value of {@code false} for\\n     *          the {@code endOfInput} parameter, nor of this method with a\\n     *          value of {@code true} for the {@code endOfInput} parameter\\n     *          but a return value indicating an incomplete decoding operation\\n     *\\n     * @throws  CoderMalfunctionError\\n     *          If an invocation of the decodeLoop method threw\\n     *          an unexpected exception\\n     *\\n     * @throws  NullPointerException if input or output buffer is null\\n     \u0027}"}, {"color": "#97c2fc", "id": "decodeLoop", "label": "decodeLoop", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "reset", "label": "reset", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "OVERFLOW", "label": "OVERFLOW", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "UNDERFLOW", "label": "UNDERFLOW", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "remaining", "label": "remaining", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "java.nio.Buffer", "label": "java.nio.Buffer", "shape": "dot", "title": "{\u0027type\u0027: \u0027class\u0027, \u0027comment\u0027: \u0027\u0027}"}, {"color": "#97c2fc", "id": " static IllegalArgumentException createSameBufferEx irmation of causing no app compat.\u0027}"}, {"color": "#97c2fc", "id": "private IllegalArgumentException createPositionException(int newPosition)", "label": "private IllegalArgumentException createPositionException(int newPosition)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Verify that {@code 0 \u003c newPosition \u003c= limit}\\n     *\\n     * @param newPosition\\n     *        The new position value\\n     *\\n     * @throws IllegalArgumentException\\n     *         If the specified position is out of bounds.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final int limit()", "label": "public final int limit()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns this buffer\u0027s limit.\\n     *\\n     * @return  The limit of this buffer\\n     \"}"}, {"color": "#97c2fc", "id": "public Buffer limit(int newLimit)", "label": "public Buffer limit(int newLimit)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 Android-changed: Un-final the method until confirmation of causing no app compat.\u0027}"}, {"color": "#97c2fc", "id": "private IllegalArgumentException createLimitException(int newLimit)", "label": "private IllegalArgumentException createLimitException(int newLimit)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Verify that {@code 0 \u003c newLimit \u003c= capacity}\\n     *\\n     * @param newLimit\\n     *        The new limit value\\n     *\\n     * @throws IllegalArgumentException\\n     *         If the specified limit is out of bounds.\\n     \u0027}"}, {"color": "#97c2fc", "id": "public Buffer mark()", "label": "public Buffer mark()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 Android-changed: Un-final the method until confirmation of causing no app compat.\u0027}"}, {"color": "#97c2 tion\\n     *          If the {@code capacity} is a negative integer\\n     \"}"}, {"color": "#97c2fc", "id": "BIG_ENDIAN", "label": "BIG_ENDIAN", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "hasArray", "label": "hasArray", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public static ByteBuffer allocate(int capacity)", "label": "public static ByteBuffer allocate(int capacity)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Allocates a new byte buffer.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s position will be zero, its limit will be its\\n     * capacity, its mark will be undefined, each of its elements will be\\n     * initialized to zero, and its byte order will be\\n\\n     * {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n\\n     * It will have a {@link #array backing array}, and its\\n     * {@link #arrayOffset array offset} will be zero.\\n     *\\n     * @param  capacity\\n     *         The new buffer\u0027s capacity, in bytes\\n     *\\n     * @return  The new byte buffer\\n     *\\n     * @throws  IllegalArgumentException\\n     *          If the {@code capacity} is a negative integer\\n     \"}"}, {"color": "#97c2fc", "id": "array", "label": "array", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "arrayOffset", "label": "arrayOffset", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public static ByteBuffer wrap(byte[] array, int offset, int length)", "label": "public static ByteBuffer wrap(byte[] array, int offset, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Wraps a byte array into a buffer.\\n     *\\n     * \u003cp\u003e The new buffer will be backed by the given byte array;\\n     * that is, modifications to the buffer will cause the array to be modified\\n     * and vice versa.  The new buffer\u0027s capacity will be\\n     * {@code array.length}, its position will be {@code offset}, its limit\\n     * will be {@code offset + length}, its mark will be undefined, and its\\n     * byte order will be\\n\\n     * {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n\\n     * Its {@link #array backing array} will be the given array, and\\n     * its {@link #arrayOffset array offset} will be zero.  \u003c/p\u003e\\n     *\\n     * @param  array\\n     *         The array that will back the new buffer\\n     *\\n     * @param  offset\\n     *         The offset of the subarray to be used; must be non-negative and\\n     *         no larger than {@code array.length}.  The new buffer\u0027s position\\n     *         will be set to this value.\\n     *\\n     * @param  length\\n     *         The length of the subarray to be used;\\n     *         must be non-negative and no larger than\\n     *         {@code array.length - offset}.\\n     *         The new buffer\u0027s limit will be set to {@code offset + length}.\\n     *\\n     * @return  The new byte buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If the preconditions on the {@code offset} and {@code length}\\n     *          parameters do not hold\\n     \"}"}, {"color": "#97c2fc", "id": "public static ByteBuffer wrap(byte[] array)", "label": "public static ByteBuffer wrap(byte[] array)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Wraps a byte array into a buffer.\\n     *\\n     * \u003cp\u003e The new buffer will be backed by the given byte array;\\n     * that is, modifications to the buffer will cause the array to be modified\\n     * and vice versa.  The new buffer\u0027s capacity and limit will be\\n     * {@code array.length}, its position will be zero, its mark will be\\n     * undefined, and its byte order will be\\n\\n     * {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n\\n     * Its {@link #array backing array} will be the given array, and its\\n     * {@link #arrayOffset array offset} will be zero.  \u003c/p\u003e\\n     *\\n     * @param  array\\n     *         The array that will back this buffer\\n     *\\n     * @return  The new byte buffer\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer slice()", "label": "public abstract ByteBuffer slice()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a new byte buffer whose content is a shared subsequence of\\n     * this buffer\u0027s content.\\n     *\\n     * \u003cp\u003e The content of the new buffer will start at this buffer\u0027s current\\n     * position.  Changes to this buffer\u0027s content will be visible in the new\\n     * buffer, and vice versa; the two buffers\u0027 position, limit, and mark\\n     * values will be independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s position will be zero, its capacity and its limit\\n     * will be the number of bytes remaining in this buffer, its mark will be\\n     * undefined, and its byte order will be\\n\\n     * {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n     * The new buffer will be direct if, and only if, this buffer is direct, and\\n     * it will be read-only if, and only if, this buffer is read-only.  \u003c/p\u003e\\n     *\\n     * @return  The new byte buffer\\n\\n     *\\n     * @see #alignedSlice(int)\\n\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer slice(int index, int length)", "label": "public abstract ByteBuffer slice(int index, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a new byte buffer whose content is a shared subsequence of\\n     * this buffer\u0027s content.\\n     *\\n     * \u003cp\u003e The content of the new buffer will start at position {@code index}\\n     * in this buffer, and will contain {@code length} elements. Changes to\\n     * this buffer\u0027s content will be visible in the new buffer, and vice versa;\\n     * the two buffers\u0027 position, limit, and mark values will be independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s position will be zero, its capacity and its limit\\n     * will be {@code length}, its mark will be undefined, and its byte order\\n     * will be\\n\\n     * {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n     * The new buffer will be direct if, and only if, this buffer is direct,\\n     * and it will be read-only if, and only if, this buffer is read-only. \u003c/p\u003e\\n     *\\n     * @param   index\\n     *          The position in this buffer at which the content of the new\\n     *          buffer will start; must be non-negative and no larger than\\n     *          {@link #limit() limit()}\\n     *\\n     * @param   length\\n     *          The number of elements the new buffer will contain; must be\\n     *          non-negative and no larger than {@code limit() - index}\\n     *\\n     * @return  The new buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative or greater than {@code limit()},\\n     *          {@code length} is negative, or {@code length \u003e limit() - index}\\n     *\\n     * @since 13\\n     \"}"}, {"color": "#97c2fc", "id": "limit()", "label": "limit()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer duplicate()", "label": "public abstract ByteBuffer duplicate()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a new byte buffer that shares this buffer\u0027s content.\\n     *\\n     * \u003cp\u003e The content of the new buffer will be that of this buffer.  Changes\\n     * to this buffer\u0027s content will be visible in the new buffer, and vice\\n     * versa; the two buffers\u0027 position, limit, and mark values will be\\n     * independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s capacity, limit, position,\\n\\n     * and mark values will be identical to those of this buffer, and its byte\\n     * order will be {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n     * The new buffer will be direct if, and only if, this buffer is direct, and\\n     * it will be read-only if, and only if, this buffer is read-only.  \u003c/p\u003e\\n     *\\n     * @return  The new byte buffer\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer asReadOnlyBuffer()", "label": "public abstract ByteBuffer asReadOnlyBuffer()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a new, read-only byte buffer that shares this buffer\u0027s\\n     * content.\\n     *\\n     * \u003cp\u003e The content of the new buffer will be that of this buffer.  Changes\\n     * to this buffer\u0027s content will be visible in the new buffer; the new\\n     * buffer itself, however, will be read-only and will not allow the shared\\n     * content to be modified.  The two buffers\u0027 position, limit, and mark\\n     * values will be independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s capacity, limit, position,\\n\\n     * and mark values will be identical to those of this buffer, and its byte\\n     * order will be {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n\\n\\n\\n     *\\n     * \u003cp\u003e If this buffer is itself read-only then this method behaves in\\n     * exactly the same way as the {@link #duplicate duplicate} method.  \u003c/p\u003e\\n     *\\n     * @return  The new, read-only byte buffer\\n     \"}"}, {"color": "#97c2fc", "id": "duplicate", "label": "duplicate", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public abstract byte get()", "label": "public abstract byte get()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Relative \u003ci\u003eget\u003c/i\u003e method.  Reads the byte at this buffer\u0027s\\n     * current position, and then increments the position.\\n     *\\n     * @return  The byte at the buffer\u0027s current position\\n     *\\n     * @throws  BufferUnderflowException\\n     *          If the buffer\u0027s current position is not smaller than its limit\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer put(byte b)", "label": "public abstract ByteBuffer put(byte b)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Relative \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e Writes the given byte into this buffer at the current\\n     * position, and then increments the position. \u003c/p\u003e\\n     *\\n     * @param  b\\n     *         The byte to be written\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferOverflowException\\n     *          If this buffer\u0027s current position is not smaller than its limit\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract byte get(int index)", "label": "public abstract byte get(int index)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Absolute \u003ci\u003eget\u003c/i\u003e method.  Reads the byte at the given\\n     * index.\\n     *\\n     * @param  index\\n     *         The index from which the byte will be read\\n     *\\n     * @return  The byte at the given index\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative\\n     *          or not smaller than the buffer\u0027s limit\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer put(int index, byte b)", "label": "public abstract ByteBuffer put(int index, byte b)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Absolute \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e Writes the given byte into this buffer at the given\\n     * index. \u003c/p\u003e\\n     *\\n     * @param  index\\n     *         The index at which the byte will be written\\n     *\\n     * @param  b\\n     *         The byte value to be written\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative\\n     *          or not smaller than the buffer\u0027s limit\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \"}"}, {"color": "#97c2fc", "id": "public ByteBuffer get(byte[] dst, int offset, int length)", "label": "public ByteBuffer get(byte[] dst, int offset, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Relative bulk \u003ci\u003eget\u003c/i\u003e method.\\n     *\\n     * \u003cp\u003e This method transfers bytes from this buffer into the given\\n     * destination array.  If there are fewer bytes remaining in the\\n     * buffer than are required to satisfy the request, that is, if\\n     * {@code length}\u0026nbsp;{@code \u003e}\u0026nbsp;{@code remaining()}, then no\\n     * bytes are transferred and a {@link BufferUnderflowException} is\\n     * thrown.\\n     *\\n     * \u003cp\u003e Otherwise, this method copies {@code length} bytes from this\\n     * buffer into the given array, starting at the current position of this\\n     * buffer and at the given offset in the array.  The position of this\\n     * buffer is then incremented by {@code length}.\\n     *\\n     * \u003cp\u003e In other words, an invocation of this method of the form\\n     * \u003ccode\u003esrc.get(dst,\u0026nbsp;off,\u0026nbsp;len)\u003c/code\u003e has exactly the same effect as\\n     * the loop\\n     *\\n     * \u003cpre\u003e{@code\\n     *     for (int i = off; i \u003c off + len; i++)\\n     *         dst[i] = src.get();\\n     * }\u003c/pre\u003e\\n     *\\n     * except that it first checks that there are sufficient bytes in\\n     * this buffer and it is potentially much more efficient.\\n     *\\n     * @param  dst\\n     *         The array into which bytes are to be written\\n     *\\n     * @param  offset\\n     *         The offset within the array of the first byte to be\\n     *         written; must be non-negative and no larger than\\n     *         {@code dst.length}\\n     *\\n     * @param  length\\n     *         The maximum number of bytes to be written to the given\\n     *         array; must be non-negative and no larger than\\n     *         {@code dst.length - offset}\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferUnderflowException\\n     *          If there are fewer than {@code length} bytes\\n     *          remaining in this buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If the preconditions on the {@code offset} and {@code length}\\n     *          parameters do not hold\\n     \u0027}"}, {"color": "#97c2fc", "id": "BufferUnderflowException", "label": "BufferUnderflowException", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "public ByteBuffer get(byte[] dst)", "label": "public ByteBuffer get(byte[] dst)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Relative bulk \u003ci\u003eget\u003c/i\u003e method.\\n     *\\n     * \u003cp\u003e This method transfers bytes from this buffer into the given\\n     * destination array.  An invocation of this method of the form\\n     * {@code src.get(a)} behaves in exactly the same way as the invocation\\n     *\\n     * \u003cpre\u003e\\n     *     src.get(a, 0, a.length) \u003c/pre\u003e\\n     *\\n     * @param   dst\\n     *          The destination array\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferUnderflowException\\n     *          If there are fewer than {@code length} bytes\\n     *          remaining in this buffer\\n     \u0027}"}, {"color": "#97c2fc", "id": "public ByteBuffer get(int index, byte[] dst, int offset, int length)", "label": "public ByteBuffer get(int index, byte[] dst, int offset, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Absolute bulk \u003ci\u003eget\u003c/i\u003e method.\\n     *\\n     * \u003cp\u003e This method transfers {@code length} bytes from this\\n     * buffer into the given array, starting at the given index in this\\n     * buffer and at the given offset in the array.  The position of this\\n     * buffer is unchanged.\\n     *\\n     * \u003cp\u003e An invocation of this method of the form\\n     * \u003ccode\u003esrc.get(index,\u0026nbsp;dst,\u0026nbsp;offset,\u0026nbsp;length)\u003c/code\u003e\\n     * has exactly the same effect as the following loop except that it first\\n     * checks the consistency of the supplied parameters and it is potentially\\n     * much more efficient:\\n     *\\n     * \u003cpre\u003e{@code\\n     *     for (int i = offset, j = index; i \u003c offset + length; i++, j++)\\n     *         dst[i] = src.get(j);\\n     * }\u003c/pre\u003e\\n     *\\n     * @param  index\\n     *         The index in this buffer from which the first byte will be\\n     *         read; must be non-negative and less than {@code limit()}\\n     *\\n     * @param  dst\\n     *         The destination array\\n     *\\n     * @param  offset\\n     *         The offset within the array of the first byte to be\\n     *         written; must be non-negative and less than\\n     *         {@code dst.length}\\n     *\\n     * @param  length\\n     *         The number of bytes to be written to the given array;\\n     *         must be non-negative and no larger than the smaller of\\n     *         {@code limit() - index} and {@code dst.length - offset}\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If the preconditions on the {@code index}, {@code offset}, and\\n     *          {@code length} parameters do not hold\\n     *\\n     * @since 13\\n     \u0027}"}, {"color": "#97c2fc", "id": "public ByteBuffer get(int index, byte[] dst)", "label": "public ByteBuffer get(int index, byte[] dst)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Absolute bulk \u003ci\u003eget\u003c/i\u003e method.\\n     *\\n     * \u003cp\u003e This method transfers bytes from this buffer into the given\\n     * destination array.  The position of this buffer is unchanged.  An\\n     * invocation of this method of the form\\n     * \u003ccode\u003esrc.get(index,\u0026nbsp;dst)\u003c/code\u003e behaves in exactly the same\\n     * way as the invocation:\\n     *\\n     * \u003cpre\u003e\\n     *     src.get(index, dst, 0, dst.length) \u003c/pre\u003e\\n     *\\n     * @param  index\\n     *         The index in this buffer from which the first byte will be\\n     *         read; must be non-negative and less than {@code limit()}\\n     *\\n     * @param  dst\\n     *         The destination array\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative, not smaller than {@code limit()},\\n     *          or {@code limit() - index \u003c dst.length}\\n     *\\n     * @since 13\\n     \u0027}"}, {"color": "#97c2fc", "id": "public ByteBuffer put(ByteBuffer src)", "label": "public ByteBuffer put(ByteBuffer src)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Relative bulk \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e This method transfers the bytes remaining in the given source\\n     * buffer into this buffer.  If there are more bytes remaining in the\\n     * source buffer than in this buffer, that is, if\\n     * {@code src.remaining()}\u0026nbsp;{@code \u003e}\u0026nbsp;{@code remaining()},\\n     * then no bytes are transferred and a {@link\\n     * BufferOverflowException} is thrown.\\n     *\\n     * \u003cp\u003e Otherwise, this method copies\\n     * \u003ci\u003en\u003c/i\u003e\u0026nbsp;=\u0026nbsp;{@code src.remaining()} bytes from the given\\n     * buffer into this buffer, starting at each buffer\u0027s current position.\\n     * The positions of both buffers are then incremented by \u003ci\u003en\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e In other words, an invocation of this method of the form\\n     * {@code dst.put(src)} has exactly the same effect as the loop\\n     *\\n     * \u003cpre\u003e\\n     *     while (src.hasRemaining())\\n     *         dst.put(src.get()); \u003c/pre\u003e\\n     *\\n     * except that it first checks that there is sufficient space in this\\n     * buffer and it is potentially much more efficient.  If this buffer and\\n     * the source buffer share the same backing array or memory, then the\\n     * result will be as if the source elements were first copied to an\\n     * intermediate location before being written into this buffer.\\n     *\\n     * @param  src\\n     *         The source buffer from which bytes are to be read;\\n     *         must not be this buffer\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferOverflowException\\n     *          If there is insufficient space in this buffer\\n     *          for the remaining bytes in the source buffer\\n     *\\n     * @throws  IllegalArgumentException\\n     *          If the source buffer is this buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \"}"}, {"color": "#97c2fc", "id": "BufferOverflowException", "label": "BufferOverflowException", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "public ByteBuffer put(int index, ByteBuffer src, int offset, int length)", "label": "public ByteBuffer put(int index, ByteBuffer src, int offset, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Absolute bulk \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e This method transfers {@code length} bytes into this buffer from\\n     * the given source buffer, starting at the given {@code offset} in the\\n     * source buffer and the given {@code index} in this buffer. The positions\\n     * of both buffers are unchanged.\\n     *\\n     * \u003cp\u003e In other words, an invocation of this method of the form\\n     * \u003ccode\u003edst.put(index,\u0026nbsp;src,\u0026nbsp;offset,\u0026nbsp;length)\u003c/code\u003e\\n     * has exactly the same effect as the loop\\n     *\\n     * \u003cpre\u003e{@code\\n     * for (int i = offset, j = index; i \u003c offset + length; i++, j++)\\n     *     dst.put(j, src.get(i));\\n     * }\u003c/pre\u003e\\n     *\\n     * except that it first checks the consistency of the supplied parameters\\n     * and it is potentially much more efficient.  If this buffer and\\n     * the source buffer share the same backing array or memory, then the\\n     * result will be as if the source elements were first copied to an\\n     * intermediate location before being written into this buffer.\\n     *\\n     * @param index\\n     *        The index in this buffer at which the first byte will be\\n     *        written; must be non-negative and less than {@code limit()}\\n     *\\n     * @param src\\n     *        The buffer from which bytes are to be read\\n     *\\n     * @param offset\\n     *        The index within the source buffer of the first byte to be\\n     *        read; must be non-negative and less than {@code src.limit()}\\n     *\\n     * @param length\\n     *        The number of bytes to be read from the given buffer;\\n     *        must be non-negative and no larger than the smaller of\\n     *        {@code limit() - index} and {@code src.limit() - offset}\\n     *\\n     * @return This buffer\\n     *\\n     * @throws IndexOutOfBoundsException\\n     *         If the preconditions on the {@code index}, {@code offset}, and\\n     *         {@code length} parameters do not hold\\n     *\\n     * @throws ReadOnlyBufferException\\n     *         If this buffer is read-only\\n     *\\n     * @since 16\\n     \u0027}"}, {"color": "#97c2fc", "id": "public ByteBuffer put(byte[] src, int offset, int length)", "label": "public ByteBuffer put(byte[] src, int offset, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Relative bulk \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e This method transfers bytes into this buffer from the given\\n     * source array.  If there are more bytes to be copied from the array\\n     * than remain in this buffer, that is, if\\n     * {@code length}\u0026nbsp;{@code \u003e}\u0026nbsp;{@code remaining()}, then no\\n     * bytes are transferred and a {@link BufferOverflowException} is\\n     * thrown.\\n     *\\n     * \u003cp\u003e Otherwise, this method copies {@code length} bytes from the\\n     * given array into this buffer, starting at the given offset in the array\\n     * and at the current position of this buffer.  The position of this buffer\\n     * is then incremented by {@code length}.\\n     *\\n     * \u003cp\u003e In other words, an invocation of this method of the form\\n     * \u003ccode\u003edst.put(src,\u0026nbsp;off,\u0026nbsp;len)\u003c/code\u003e has exactly the same effect as\\n     * the loop\\n     *\\n     * \u003cpre\u003e{@code\\n     *     for (int i = off; i \u003c off + len; i++)\\n     *         dst.put(src[i]);\\n     * }\u003c/pre\u003e\\n     *\\n     * except that it first checks that there is sufficient space in this\\n     * buffer and it is potentially much more efficient.\\n     *\\n     * @param  src\\n     *         The array from which bytes are to be read\\n     *\\n     * @param  offset\\n     *         The offset within the array of the first byte to be read;\\n     *         must be non-negative and no larger than {@code src.length}\\n     *\\n     * @param  length\\n     *         The number of bytes to be read from the given array;\\n     *         must be non-negative and no larger than\\n     *         {@code src.length - offset}\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferOverflowException\\n     *          If there is insufficient space in this buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If the preconditions on the {@code offset} and {@code length}\\n     *          parameters do not hold\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final ByteBuffer put(byte[] src)", "label": "public final ByteBuffer put(byte[] src)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Relative bulk \u003ci\u003eput\u003c/i\u003e method\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n
