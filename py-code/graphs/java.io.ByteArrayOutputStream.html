   *\\n     * @return  This buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative, not smaller than {@code limit()},\\n     *          or {@code limit() - index \u003c src.length}\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     *\\n     * @since 13\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final boolean hasArray()", "label": "public final boolean hasArray()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether or not this buffer is backed by an accessible byte\\n     * array.\\n     *\\n     * \u003cp\u003e If this method returns {@code true} then the {@link #array() array}\\n     * and {@link #arrayOffset() arrayOffset} methods may safely be invoked.\\n     * \u003c/p\u003e\\n     *\\n     * @return  {@code true} if, and only if, this buffer\\n     *          is backed by an array and is not read-only\\n     \u0027}"}, {"color": "#97c2fc", "id": "array()", "label": "array()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "arrayOffset()", "label": "arrayOffset()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public final byte[] array()", "label": "public final byte[] array()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the byte array that backs this\\n     * buffer\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e Modifications to this buffer\u0027s content will cause the returned\\n     * array\u0027s content to be modified, and vice versa.\\n     *\\n     * \u003cp\u003e Invoke the {@link #hasArray hasArray} method before invoking this\\n     * method in order to ensure that this buffer has an accessible backing\\n     * array.  \u003c/p\u003e\\n     *\\n     * @return  The array that backs this buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is backed by an array but is read-only\\n     *\\n     * @throws  UnsupportedOperationException\\n     *          If this buffer is not backed by an accessible array\\n     \"}"}, {"color": "#97c2fc", "id": "public final int arrayOffset()", "label": "public final int arrayOffset()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the offset within this buffer\u0027s backing array of the first\\n     * element of the buffer\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e If this buffer is backed by an array then buffer position \u003ci\u003ep\u003c/i\u003e\\n     * corresponds to array index \u003ci\u003ep\u003c/i\u003e\u0026nbsp;+\u0026nbsp;{@code arrayOffset()}.\\n     *\\n     * \u003cp\u003e Invoke the {@link #hasArray hasArray} method before invoking this\\n     * method in order to ensure that this buffer has an accessible backing\\n     * array.  \u003c/p\u003e\\n     *\\n     * @return  The offset within this buffer\u0027s array\\n     *          of the first element of the buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is backed by an array but is read-only\\n     *\\n     * @throws  UnsupportedOperationException\\n     *          If this buffer is not backed by an accessible array\\n     \"}"}, {"color": "#97c2fc", "id": "public Buffer rewind()", "label": "public Buffer rewind()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Rewinds this buffer.  The position is set to zero and the mark is\\n     * discarded.\\n     *\\n     * \u003cp\u003e Invoke this method before a sequence of channel-write or \u003ci\u003eget\u003c/i\u003e\\n     * operations, assuming that the limit has already been set\\n     * appropriately.  For example:\\n     *\\n     * \u003cblockquote\u003e\u003cpre\u003e\\n     * out.write(buf);    // Write remaining data\\n     * buf.rewind();      // Rewind buffer\\n     * buf.get(array);    // Copy data into array\u003c/pre\u003e\u003c/blockquote\u003e\\n     *\\n     * @return  This buffer\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer compact()", "label": "public abstract ByteBuffer compact()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Compacts this buffer\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e The bytes between the buffer\u0027s current position and its limit,\\n     * if any, are copied to the beginning of the buffer.  That is, the\\n     * byte at index \u003ci\u003ep\u003c/i\u003e\u0026nbsp;=\u0026nbsp;{@code position()} is copied\\n     * to index zero, the byte at index \u003ci\u003ep\u003c/i\u003e\u0026nbsp;+\u0026nbsp;1 is copied\\n     * to index one, and so forth until the byte at index\\n     * {@code limit()}\u0026nbsp;-\u0026nbsp;1 is copied to index\\n     * \u003ci\u003en\u003c/i\u003e\u0026nbsp;=\u0026nbsp;{@code limit()}\u0026nbsp;-\u0026nbsp;{@code 1}\u0026nbsp;-\u0026nbsp;\u003ci\u003ep\u003c/i\u003e.\\n     * The buffer\u0027s position is then set to \u003ci\u003en+1\u003c/i\u003e and its limit is set to\\n     * its capacity.  The mark, if defined, is discarded.\\n     *\\n     * \u003cp\u003e The buffer\u0027s position is set to the number of bytes copied,\\n     * rather than to zero, so that an invocation of this method can be\\n     * followed immediately by an invocation of another relative \u003ci\u003eput\u003c/i\u003e\\n     * method. \u003c/p\u003e\\n     *\\n\\n     *\\n     * \u003cp\u003e Invoke this method after writing data from a buffer in case the\\n     * write was incomplete.  The following loop, for example, copies bytes\\n     * from one channel to another via the buffer {@code buf}:\\n     *\\n     * \u003cblockquote\u003e\u003cpre\u003e{@code\\n     *   buf.clear();          // Prepare buffer for use\\n     *   while (in.read(buf) \u003e= 0 || buf.position != 0) {\\n     *       buf.flip();\\n     *       out.write(buf);\\n     *       buf.compact();    // In case of partial write\\n     *   }\\n     * }\u003c/pre\u003e\u003c/blockquote\u003e\\n     *\\n\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract boolean isDirect()", "label": "public abstract boolean isDirect()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether or not this buffer is\\n     * \u003ca href=\"ByteBuffer.html#direct\"\u003e\u003ci\u003edirect\u003c/i\u003e\u003c/a\u003e.\\n     *\\n     * @return  {@code true} if, and only if, this buffer is direct\\n     *\\n     * @since 1.6\\n     \u0027}"}, {"color": "#97c2fc", "id": "public String toString()", "label": "public String toString()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns a string summarizing the state of this buffer.\\n     *\\n     * @return  A summary string\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int hashCode()", "label": "public int hashCode()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the current hash code of this buffer.\\n     *\\n     * \u003cp\u003e The hash code of a byte buffer depends only upon its remaining\\n     * elements; that is, upon the elements from {@code position()} up to, and\\n     * including, the element at {@code limit()}\u0026nbsp;-\u0026nbsp;{@code 1}.\\n     *\\n     * \u003cp\u003e Because buffer hash codes are content-dependent, it is inadvisable\\n     * to use buffers as keys in hash maps or similar data structures unless it\\n     * is known that their contents will not change.  \u003c/p\u003e\\n     *\\n     * @return  The current hash code of this buffer\\n     \u0027}"}, {"color": "#97c2fc", "id": "public boolean equals(Object ob)", "label": "public boolean equals(Object ob)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether or not this buffer is equal to another object.\\n     *\\n     * \u003cp\u003e Two byte buffers are equal if, and only if,\\n     *\\n     * \u003col\u003e\\n     *\\n     *   \u003cli\u003e\u003cp\u003e They have the same element type,  \u003c/p\u003e\u003c/li\u003e\\n     *\\n     *   \u003cli\u003e\u003cp\u003e They have the same number of remaining elements, and\\n     *   \u003c/p\u003e\u003c/li\u003e\\n     *\\n     *   \u003cli\u003e\u003cp\u003e The two sequences of remaining elements, considered\\n     *   independently of their starting positions, are pointwise equal.\\n\\n\\n\\n\\n\\n\\n\\n     *   \u003c/p\u003e\u003c/li\u003e\\n     *\\n     * \u003c/ol\u003e\\n     *\\n     * \u003cp\u003e A byte buffer is not equal to any other type of object.  \u003c/p\u003e\\n     *\\n     * @param  ob  The object to which this buffer is to be compared\\n     *\\n     * @return  {@code true} if, and only if, this buffer is equal to the\\n     *           given object\\n     \u0027}"}, {"color": "#97c2fc", "id": "public int compareTo(ByteBuffer that)", "label": "public int compareTo(ByteBuffer that)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Compares this buffer to another.\\n     *\\n     * \u003cp\u003e Two byte buffers are compared by comparing their sequences of\\n     * remaining elements lexicographically, without regard to the starting\\n     * position of each sequence within its corresponding buffer.\\n\\n\\n\\n\\n\\n\\n\\n\\n     * Pairs of {@code byte} elements are compared as if by invoking\\n     * {@link Byte#compare(byte,byte)}.\\n\\n     *\\n     * \u003cp\u003e A byte buffer is not comparable to any other type of object.\\n     *\\n     * @return  A negative integer, zero, or a positive integer as this buffer\\n     *          is less than, equal to, or greater than the given buffer\\n     \u0027}"}, {"color": "#97c2fc", "id": "compare(byte", "label": "compare(byte", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public int mismatch(ByteBuffer that)", "label": "public int mismatch(ByteBuffer that)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Finds and returns the relative index of the first mismatch between this\\n     * buffer and a given buffer.  The index is relative to the\\n     * {@link #position() position} of each buffer and will be in the range of\\n     * 0 (inclusive) up to the smaller of the {@link #remaining() remaining}\\n     * elements in each buffer (exclusive).\\n     *\\n     * \u003cp\u003e If the two buffers share a common prefix then the returned index is\\n     * the length of the common prefix and it follows that there is a mismatch\\n     * between the two buffers at that index within the respective buffers.\\n     * If one buffer is a proper prefix of the other then the returned index is\\n     * the smaller of the remaining elements in each buffer, and it follows that\\n     * the index is only valid for the buffer with the larger number of\\n     * remaining elements.\\n     * Otherwise, there is no mismatch.\\n     *\\n     * @param  that\\n     *         The byte buffer to be tested for a mismatch with this buffer\\n     *\\n     * @return  The relative index of the first mismatch between this and the\\n     *          given buffer, otherwise -1 if no mismatch.\\n     *\\n     * @since 11\\n     \u0027}"}, {"color": "#97c2fc", "id": "position()", "label": "position()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "remaining()", "label": "remaining()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public final ByteOrder order()", "label": "public final ByteOrder order()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Retrieves this buffer\u0027s byte order.\\n     *\\n     * \u003cp\u003e The byte order is used when reading or writing multibyte values, and\\n     * when creating buffers that are views of this byte buffer.  The order of\\n     * a newly-created byte buffer is always {@link ByteOrder#BIG_ENDIAN\\n     * BIG_ENDIAN}.  \u003c/p\u003e\\n     *\\n     * @return  This buffer\u0027s byte order\\n     \"}"}, {"color": "#97c2fc", "id": "BIG_ENDIANBIG_ENDIAN", "label": "BIG_ENDIANBIG_ENDIAN", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public final ByteBuffer order(ByteOrder bo)", "label": "public final ByteBuffer order(ByteOrder bo)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Modifies this buffer\u0027s byte order.\\n     *\\n     * @param  bo\\n     *         The new byte order,\\n     *         either {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}\\n     *         or {@link ByteOrder#LITTLE_ENDIAN LITTLE_ENDIAN}\\n     *\\n     * @return  This buffer\\n     \"}"}, {"color": "#97c2fc", "id": "LITTLE_ENDIAN", "label": "LITTLE_ENDIAN", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "public final int alignmentOffset(int index, int unitSize)", "label": "public final int alignmentOffset(int index, int unitSize)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the memory address, pointing to the byte at the given index,\\n     * modulo the given unit size.\\n     *\\n     * \u003cp\u003e The return value is non-negative in the range of {@code 0}\\n     * (inclusive) up to {@code unitSize} (exclusive), with zero indicating\\n     * that the address of the byte at the index is aligned for the unit size,\\n     * and a positive value that the address is misaligned for the unit size.\\n     * If the address of the byte at the index is misaligned, the return value\\n     * represents how much the index should be adjusted to locate a byte at an\\n     * aligned address.  Specifically, the index should either be decremented by\\n     * the return value if the latter is not greater than {@code index}, or be\\n     * incremented by the unit size minus the return value.  Therefore given\\n     * \u003cblockquote\u003e\u003cpre\u003e\\n     * int value = alignmentOffset(index, unitSize)\u003c/pre\u003e\u003c/blockquote\u003e\\n     * then the identities\\n     * \u003cblockquote\u003e\u003cpre\u003e\\n     * alignmentOffset(index - value, unitSize) == 0, value \u0026le; index\u003c/pre\u003e\u003c/blockquote\u003e\\n     * and\\n     * \u003cblockquote\u003e\u003cpre\u003e\\n     * alignmentOffset(index + (unitSize - value), unitSize) == 0\u003c/pre\u003e\u003c/blockquote\u003e\\n     * must hold.\\n     *\\n     * @apiNote\\n     * This method may be utilized to determine if unit size bytes from an\\n     * index can be accessed atomically, if supported by the native platform.\\n     *\\n     * @implNote\\n     * This implementation throws {@code UnsupportedOperationException} for\\n     * non-direct buffers when the given unit size is greater than {@code 8}.\\n     *\\n     * @param  index\\n     *         The index to query for alignment offset, must be non-negative, no\\n     *         upper bounds check is performed\\n     *\\n     * @param  unitSize\\n     *         The unit size in bytes, must be a power of {@code 2}\\n     *\\n     * @return  The indexed byte\u0027s memory address modulo the unit size\\n     *\\n     * @throws IllegalArgumentException\\n     *         If the index is negative or the unit size is not a power of\\n     *         {@code 2}\\n     *\\n     * @throws UnsupportedOperationException\\n     *         If the native platform does not guarantee stable alignment offset\\n     *         values for the given unit size when managing the memory regions\\n     *         of buffers of the same kind as this buffer (direct or\\n     *         non-direct).  For example, if garbage collection would result\\n     *         in the moving of a memory region covered by a non-direct buffer\\n     *         from one location to another and both locations have different\\n     *         alignment characteristics.\\n     *\\n     * @see #alignedSlice(int)\\n     * @since 9\\n     \"}"}, {"color": "#97c2fc", "id": "public final ByteBuffer alignedSlice(int unitSize)", "label": "public final ByteBuffer alignedSlice(int unitSize)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a new byte buffer whose content is a shared and aligned\\n     * subsequence of this buffer\u0027s content.\\n     *\\n     * \u003cp\u003e The content of the new buffer will start at this buffer\u0027s current\\n     * position rounded up to the index of the nearest aligned byte for the\\n     * given unit size, and end at this buffer\u0027s limit rounded down to the index\\n     * of the nearest aligned byte for the given unit size.\\n     * If rounding results in out-of-bound values then the new buffer\u0027s capacity\\n     * and limit will be zero.  If rounding is within bounds the following\\n     * expressions will be true for a new buffer {@code nb} and unit size\\n     * {@code unitSize}:\\n     * \u003cpre\u003e{@code\\n     * nb.alignmentOffset(0, unitSize) == 0\\n     * nb.alignmentOffset(nb.limit(), unitSize) == 0\\n     * }\u003c/pre\u003e\\n     *\\n     * \u003cp\u003e Changes to this buffer\u0027s content will be visible in the new\\n     * buffer, and vice versa; the two buffers\u0027 position, limit, and mark\\n     * values will be independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s position will be zero, its capacity and its limit\\n     * will be the number of bytes remaining in this buffer or fewer subject to\\n     * alignment, its mark will be undefined, and its byte order will be\\n     * {@link ByteOrder#BIG_ENDIAN BIG_ENDIAN}.\\n     *\\n     * The new buffer will be direct if, and only if, this buffer is direct, and\\n     * it will be read-only if, and only if, this buffer is read-only.  \u003c/p\u003e\\n     *\\n     * @apiNote\\n     * This method may be utilized to create a new buffer where unit size bytes\\n     * from index, that is a multiple of the unit size, may be accessed\\n     * atomically, if supported by the native platform.\\n     *\\n     * @implNote\\n     * This implementation throws {@code UnsupportedOperationException} for\\n     * non-direct buffers when the given unit size is greater than {@code 8}.\\n     *\\n     * @param  unitSize\\n     *         The unit size in bytes, must be a power of {@code 2}\\n     *\\n     * @return  The new byte buffer\\n     *\\n     * @throws IllegalArgumentException\\n     *         If the unit size not a power of {@code 2}\\n     *\\n     * @throws UnsupportedOperationException\\n     *         If the native platform does not guarantee stable aligned slices\\n     *         for the given unit size when managing the memory regions\\n     *         of buffers of the same kind as this buffer (direct or\\n     *         non-direct).  For example, if garbage collection would result\\n     *         in the moving of a memory region covered by a non-direct buffer\\n     *         from one location to another and both locations have different\\n     *         alignment characteristics.\\n     *\\n     * @see #alignmentOffset(int, int)\\n     * @see #slice()\\n     * @since 9\\n     \"}"}, {"color": "#97c2fc", "id": " abstract byte _get(int i)", "label": " abstract byte _get(int i)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 package-private\u0027}"}, {"color": "#97c2fc", "id": " abstract void _put(int i, byte b)", "label": " abstract void _put(int i, byte b)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 package-private\u0027}"}, {"color": "#97c2fc", "id": "public abstract char getChar()", "label": "public abstract char getChar()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Relative \u003ci\u003eget\u003c/i\u003e method for reading a char value.\\n     *\\n     * \u003cp\u003e Reads the next two bytes at this buffer\u0027s current position,\\n     * composing them into a char value according to the current byte order,\\n     * and then increments the position by two.  \u003c/p\u003e\\n     *\\n     * @return  The char value at the buffer\u0027s current position\\n     *\\n     * @throws  BufferUnderflowException\\n     *          If there are fewer than two bytes\\n     *          remaining in this buffer\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer putChar(char value)", "label": "public abstract ByteBuffer putChar(char value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Relative \u003ci\u003eput\u003c/i\u003e method for writing a char\\n     * value\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e Writes two bytes containing the given char value, in the\\n     * current byte order, into this buffer at the current position, and then\\n     * increments the position by two.  \u003c/p\u003e\\n     *\\n     * @param  value\\n     *         The char value to be written\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferOverflowException\\n     *          If there are fewer than two bytes\\n     *          remaining in this buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract char getChar(int index)", "label": "public abstract char getChar(int index)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Absolute \u003ci\u003eget\u003c/i\u003e method for reading a char value.\\n     *\\n     * \u003cp\u003e Reads two bytes at the given index, composing them into a\\n     * char value according to the current byte order.  \u003c/p\u003e\\n     *\\n     * @param  index\\n     *         The index from which the bytes will be read\\n     *\\n     * @return  The char value at the given index\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative\\n     *          or not smaller than the buffer\u0027s limit,\\n     *          minus one\\n     \"}"}, {"color": "#97c2fc", "id": " abstract char getCharUnchecked(int index)", "label": " abstract char getCharUnchecked(int index)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 BEGIN Android-added: {get,put}*Unchecked() accessors.\u0027}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer putChar(int index, char value)", "label": "public abstract ByteBuffer putChar(int index, char value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Absolute \u003ci\u003eput\u003c/i\u003e method for writing a char\\n     * value\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003 \n     *\\n     * \u003cp\u003e Reads the next eight bytes at this buffer\u0027s current position,\\n     * composing them into a double value according to the current byte order,\\n     * and then increments the position by eight.  \u003c/p\u003e\\n     *\\n     * @return  The double value at the buffer\u0027s current position\\n     *\\n     * @throws  BufferUnderflowException\\n     *          If there are fewer than eight bytes\\n     *          remaining in this buffer\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer putDouble(double value)", "label": "public abstract ByteBuffer putDouble(double value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Relative \u003ci\u003eput\u003c/i\u003e method for writing a double\\n     * value\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e Writes eight bytes containing the given double value, in the\\n     * current byte order, into this buffer at the current position, and then\\n     * increments the position by eight.  \u003c/p\u003e\\n     *\\n     * @param  value\\n     *         The double value to be written\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  BufferOverflowException\\n     *          If there are fewer than eight bytes\\n     *          remaining in this buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract double getDouble(int index)", "label": "public abstract double getDouble(int index)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Absolute \u003ci\u003eget\u003c/i\u003e method for reading a double value.\\n     *\\n     * \u003cp\u003e Reads eight bytes at the given index, composing them into a\\n     * double value according to the current byte order.  \u003c/p\u003e\\n     *\\n     * @param  index\\n     *         The index from which the bytes will be read\\n     *\\n     * @return  The double value at the given index\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative\\n     *          or not smaller than the buffer\u0027s limit,\\n     *          minus seven\\n     \"}"}, {"color": "#97c2fc", "id": " abstract double getDoubleUnchecked(int index)", "label": " abstract double getDoubleUnchecked(int index)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 BEGIN Android-added: {get,put}*Unchecked() accessors.\u0027}"}, {"color": "#97c2fc", "id": "public abstract ByteBuffer putDouble(int index, double value)", "label": "public abstract ByteBuffer putDouble(int index, double value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Absolute \u003ci\u003eput\u003c/i\u003e method for writing a double\\n     * value\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e Writes eight bytes containing the given double value, in the\\n     * current byte order, into this buffer at the given index.  \u003c/p\u003e\\n     *\\n     * @param  index\\n     *         The index at which the bytes will be written\\n     *\\n     * @param  value\\n     *         The double value to be written\\n     *\\n     * @return  This buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative\\n     *          or not smaller than the buffer\u0027s limit,\\n     *          minus seven\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is read-only\\n     \"}"}, {"color": "#97c2fc", "id": " abstract void putDoubleUnchecked(int index, double value)", "label": " abstract void putDoubleUnchecked(int index, double value)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027 BEGIN Android-added: {get,put}*Unchecked() accessors.\u0027}"}, {"color": "#97c2fc", "id": "public abstract DoubleBuffer asDoubleBuffer()", "label": "public abstract DoubleBuffer asDoubleBuffer()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a view of this byte buffer as a double buffer.\\n     *\\n     * \u003cp\u003e The content of the new buffer will start at this buffer\u0027s current\\n     * position.  Changes to this buffer\u0027s content will be visible in the new\\n     * buffer, and vice versa; the two buffers\u0027 position, limit, and mark\\n     * values will be independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s position will be zero, its capacity and its limit\\n     * will be the number of bytes remaining in this buffer divided by\\n     * eight, its mark will be undefined, and its byte order will be that\\n     * of the byte buffer at the moment the view is created.  The new buffer\\n     * will be direct if, and only if, this buffer is direct, and it will be\\n     * read-only if, and only if, this buffer is read-only.  \u003c/p\u003e\\n     *\\n     * @return  A new double buffer\\n     \"}"}, {"color": "#97c2fc", "id": "public final int remaining()", "label": "public final int remaining()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Returns the number of elements between the current position and the\\n     * limit.\\n     *\\n     * @return  The number of elements remaining in this buffer\\n     \u0027}"}, {"color": "#97c2fc", "id": "public final boolean hasRemaining()", "label": "public final boolean hasRemaining()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether there are any elements between the current position and\\n     * the limit.\\n     *\\n     * @return  {@code true} if, and only if, there is at least one element\\n     *          remaining in this buffer\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract boolean isReadOnly()", "label": "public abstract boolean isReadOnly()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether or not this buffer is read-only.\\n     *\\n     * @return  {@code true} if, and only if, this buffer is read-only\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract boolean hasArray()", "label": "public abstract boolean hasArray()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Tells whether or not this buffer is backed by an accessible\\n     * array.\\n     *\\n     * \u003cp\u003e If this method returns {@code true} then the {@link #array() array}\\n     * and {@link #arrayOffset() arrayOffset} methods may safely be invoked.\\n     * \u003c/p\u003e\\n     *\\n     * @return  {@code true} if, and only if, this buffer\\n     *          is backed by an array and is not read-only\\n     *\\n     * @since 1.6\\n     \u0027}"}, {"color": "#97c2fc", "id": "public abstract Object array()", "label": "public abstract Object array()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the array that backs this\\n     * buffer\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e This method is intended to allow array-backed buffers to be\\n     * passed to native code more efficiently. Concrete subclasses\\n     * provide more strongly-typed return values for this method.\\n     *\\n     * \u003cp\u003e Modifications to this buffer\u0027s content will cause the returned\\n     * array\u0027s content to be modified, and vice versa.\\n     *\\n     * \u003cp\u003e Invoke the {@link #hasArray hasArray} method before invoking this\\n     * method in order to ensure that this buffer has an accessible backing\\n     * array.  \u003c/p\u003e\\n     *\\n     * @return  The array that backs this buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is backed by an array but is read-only\\n     *\\n     * @throws  UnsupportedOperationException\\n     *          If this buffer is not backed by an accessible array\\n     *\\n     * @since 1.6\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract int arrayOffset()", "label": "public abstract int arrayOffset()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Returns the offset within this buffer\u0027s backing array of the first\\n     * element of the buffer\u0026nbsp;\u0026nbsp;\u003ci\u003e(optional operation)\u003c/i\u003e.\\n     *\\n     * \u003cp\u003e If this buffer is backed by an array then buffer position \u003ci\u003ep\u003c/i\u003e\\n     * corresponds to array index \u003ci\u003ep\u003c/i\u003e\u0026nbsp;+\u0026nbsp;{@code arrayOffset()}.\\n     *\\n     * \u003cp\u003e Invoke the {@link #hasArray hasArray} method before invoking this\\n     * method in order to ensure that this buffer has an accessible backing\\n     * array.  \u003c/p\u003e\\n     *\\n     * @return  The offset within this buffer\u0027s array\\n     *          of the first element of the buffer\\n     *\\n     * @throws  ReadOnlyBufferException\\n     *          If this buffer is backed by an array but is read-only\\n     *\\n     * @throws  UnsupportedOperationException\\n     *          If this buffer is not backed by an accessible array\\n     *\\n     * @since 1.6\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract Buffer slice()", "label": "public abstract Buffer slice()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a new buffer whose content is a shared subsequence of\\n     * this buffer\u0027s content.\\n     *\\n     * \u003cp\u003e The content of the new buffer will start at this buffer\u0027s current\\n     * position.  Changes to this buffer\u0027s content will be visible in the new\\n     * buffer, and vice versa; the two buffers\u0027 position, limit, and mark\\n     * values will be independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s position will be zero, its capacity and its limit\\n     * will be the number of elements remaining in this buffer, its mark will be\\n     * undefined. The new buffer will be direct if, and only if, this buffer is\\n     * direct, and it will be read-only if, and only if, this buffer is\\n     * read-only.  \u003c/p\u003e\\n     *\\n     * @return  The new buffer\\n     *\\n     * @since 9\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract Buffer slice(int index, int length)", "label": "public abstract Buffer slice(int index, int length)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a new buffer whose content is a shared subsequence of\\n     * this buffer\u0027s content.\\n     *\\n     * \u003cp\u003e The content of the new buffer will start at position {@code index}\\n     * in this buffer, and will contain {@code length} elements. Changes to\\n     * this buffer\u0027s content will be visible in the new buffer, and vice versa;\\n     * the two buffers\u0027 position, limit, and mark values will be independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s position will be zero, its capacity and its limit\\n     * will be {@code length}, its mark will be undefined. The new buffer will\\n     * be direct if, and only if, this buffer is direct, and it will be\\n     * read-only if, and only if, this buffer is read-only.  \u003c/p\u003e\\n     *\\n     * @param   index\\n     *          The position in this buffer at which the content of the new\\n     *          buffer will start; must be non-negative and no larger than\\n     *          {@link #limit() limit()}\\n     *\\n     * @param   length\\n     *          The number of elements the new buffer will contain; must be\\n     *          non-negative and no larger than {@code limit() - index}\\n     *\\n     * @return  The new buffer\\n     *\\n     * @throws  IndexOutOfBoundsException\\n     *          If {@code index} is negative or greater than {@code limit()},\\n     *          {@code length} is negative, or {@code length \u003e limit() - index}\\n     *\\n     * @since 13\\n     \"}"}, {"color": "#97c2fc", "id": "public abstract Buffer duplicate()", "label": "public abstract Buffer duplicate()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Creates a new buffer that shares this buffer\u0027s content.\\n     *\\n     * \u003cp\u003e The content of the new buffer will be that of this buffer.  Changes\\n     * to this buffer\u0027s content will be visible in the new buffer, and vice\\n     * versa; the two buffers\u0027 position, limit, and mark values will be\\n     * independent.\\n     *\\n     * \u003cp\u003e The new buffer\u0027s capacity, limit, position and mark values will be\\n     * identical to those of this buffer. The new buffer will be direct if, and\\n     * only if, this buffer is direct, and it will be read-only if, and only if,\\n     * this buffer is read-only.  \u003c/p\u003e\\n     *\\n     * @return  The new buffer\\n     *\\n     * @since 9\\n     \"}"}, {"color": "#97c2fc", "id": " abstract Object base()", "label": " abstract Object base()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     *\\n     * @return the base reference, paired with the address\\n     * field, which in combination can be used for unsafe access into a heap\\n     * buffer or direct byte buffer (and views of).\\n     \u0027}"}, {"color": "#97c2fc", "id": " final int nextGetIndex()", "label": " final int nextGetIndex()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Checks the current position against the limit, throwing a {@link\\n     * BufferUnderflowException} if it is not smaller than the limit, and then\\n     * increments the position.\\n     *\\n     * @return  The current position value, before it is incremented\\n     \u0027}"}, {"color": "#97c2fc", "id": " final int nextPutIndex()", "label": " final int nextPutIndex()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Checks the current position against the limit, throwing a {@link\\n     * BufferOverflowException} if it is not smaller than the limit, and then\\n     * increments the position.\\n     *\\n     * @return  The current position value, before it is incremented\\n     \u0027}"}, {"color": "#97c2fc", "id": " final int checkIndex(int i)", "label": " final int checkIndex(int i)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Checks the given index against the limit, throwing an {@link\\n     * IndexOutOfBoundsException} if it is not smaller than the limit\\n     * or is smaller than zero.\\n     \u0027}"}, {"color": "#97c2fc", "id": "IndexOutOfBoundsException", "label": "IndexOutOfBoundsException", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "length()", "label": "length()", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "REPORT", "label": "REPORT", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u0027comment\u0027: \u0027No comment available\u0027}"}, {"color": "#97c2fc", "id": "CoderResult", "label": "CoderResult", "shape": "dot", "title": "{}"}, {"color": "#97c2fc", "id": "public final CoderResult flush(CharBuffer out)", "label": "public final CoderResult flush(CharBuffer out)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Flushes this decoder.\\n     *\\n     * \u003cp\u003e Some decoders maintain internal state and may need to write some\\n     * final characters to the output buffer once the overall input sequence has\\n     * been read.\\n     *\\n     * \u003cp\u003e Any additional output is written to the output buffer beginning at\\n     * its current position.  At most {@link Buffer#remaining out.remaining()}\\n     * characters will be written.  The buffer\\\u0027s position will be advanced\\n     * appropriately, but its mark and limit will not be modified.\\n     *\\n     * \u003cp\u003e If this method completes successfully then it returns {@link\\n     * CoderResult#UNDERFLOW}.  If there is insufficient room in the output\\n     * buffer then it returns {@link CoderResult#OVERFLOW}.  If this happens\\n     * then this method must be invoked again, with an output buffer that has\\n     * more room, in order to complete the current \u003ca href=\"#steps\"\u003edecoding\\n     * operation\u003c/a\u003e.\\n     *\\n     * \u003cp\u003e If this decoder has already been flushed then invoking this method\\n     * has no effect.\\n     *\\n     * \u003cp\u003e This method invokes the {@link #implFlush implFlush} method to\\n     * perform the actual flushing operation.  \u003c/p\u003e\\n     *\\n     * @param  out\\n     *         The output character buffer\\n     *\\n     * @return  A coder-result object, either {@link CoderResult#UNDERFLOW} or\\n     *          {@link CoderResult#OVERFLOW}\\n     *\\n     * @throws  IllegalStateException\\n     *          If the previous step of the current decoding operation was an\\n     *          invocation neither of the {@link #flush flush} method nor of\\n     *          the three-argument {@link\\n     *          #decode(ByteBuffer,CharBuffer,boolean) decode} method\\n     *          with a value of {@code true} for the {@code endOfInput}\\n     *          parameter\\n     \u0027}"}, {"color": "#97c2fc", "id": "flush", "label": "flush", "shape": "dot", "title": "{\u0027type\u0027: \u0027link-shadow\u0027, \u o comment available\u0027}"}, {"color": "#97c2fc", "id": "protected void implReset()", "label": "protected void implReset()", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \u0027\\n     * Resets this decoder, clearing any charset-specific internal state.\\n     *\\n     * \u003cp\u003e The default implementation of this method does nothing.  This method\\n     * should be overridden by decoders that maintain internal state.  \u003c/p\u003e\\n     \u0027}"}, {"color": "#97c2fc", "id": "protected abstract CoderResult decodeLoop(ByteBuffer in, CharBuffer out)", "label": "protected abstract CoderResult decodeLoop(ByteBuffer in, CharBuffer out)", "shape": "dot", "title": "{\u0027type\u0027: \u0027method\u0027, \u0027comment\u0027: \"\\n     * Decodes one or more bytes into one or more characters.\\n     *\\n     * \u003cp\u003e This method encapsulates the basic decoding loop, decoding as many\\n     * bytes as possible until it either runs out of input, runs out of room\\n     * in the output buffer, or encounters a decoding error.  This method is\\n     * invoked by the {@link #decode decode} method, which handles result\\n     * interpretation and error recovery.\\n     *\\n     * \u003cp\u003e The buffers are read from, and written to, starting at their current\\n     * positions.  At most {@link Buffer#remaining in.remaining()} bytes\\n     * will be read, and at most {@link Buffer#remaining out.remaining()}\\n     * characters will be written.  The buffers\u0027 positions will be advanced to\\n     * reflect the bytes read and the characters written, but their marks and\\n     * limits will not be modified.\\n     *\\n     * \u003cp\u003e This method returns a {@link CoderResult} object to describe its\\n     * reason for termination, in the same manner as the {@link #decode decode}\\n     * method.  Most implementations of this method will handle decoding errors\\n     * by returning an appropriate result object for interpre                   allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false

    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,

                  // make a custom popup
                      var popup = document.createElement("div");
                      popup.className = 'popup';
                      popupTimeout = null;
                      popup.addEventListener('mouseover', function () {
                          console.log(popup)
                          if (popupTimeout !== null) {
                              clearTimeout(popupTimeout);
                              popupTimeout = null;
                          }
                      });
                      popup.addEventListener('mouseout', function () {
                          if (popupTimeout === null) {
                              hidePopup();
                          }
                      });
                      container.appendChild(popup);


                      // use the popup event to show
                      network.on("showPopup", function (params) {
                          showPopup(params);
                      });

                      // use the hide event to hide it
                      network.on("hidePopup", function (params) {
                          hidePopup();
                      });

                      // hiding the popup through css
                      function hidePopup() {
                          popupTimeout = setTimeout(function () { popup.style.display = 'none'; }, 500);
                      }

                      // showing the popup
                      function showPopup(nodeId) {
                          // get the data from the vis.DataSet
                          var nodeData = nodes.get([nodeId]);
                          popup.innerHTML = nodeData[0].title;

                          // get the position of the node
                          var posCanvas = network.getPositions([nodeId])[nodeId];

                          // get the bounding box of the node
                          var boundingBox = network.getBoundingBox(nodeId);

                          //position tooltip:
                          posCanvas.x = posCanvas.x + 0.5 * (boundingBox.right - boundingBox.left);

                          // convert coordinates to the DOM space
                          var posDOM = network.canvasToDOM(posCanvas);

                          // Give it an offset
                          posDOM.x += 10;
                          posDOM.y -= 20;

                          // show and place the tooltip.
                          popup.style.display = 'block';
                          popup.style.top = posDOM.y + 'px';
                          popup.style.left = posDOM.x + 'px';
                      }
                  


                  
                      network.on("stabilizationProgress", function(params) {
                          document.getElementById('loadingBar').removeAttribute("style");
                          var maxWidth = 496;
                          var minWidth = 20;
                          var widthFactor = params.iterations/params.total;
                          var width = Math.max(minWidth,maxWidth * widthFactor);
                          document.getElementById('bar').style.width = width + 'px';
                          document.getElementById('text').innerHTML = Math.round(widthFactor*100) + '%';
                      });
                      network.once("stabilizationIterationsDone", function() {
                          document.getElementById('text').innerHTML = '100%';
                          document.getElementById('bar').style.width = '496px';
                          document.getElementById('loadingBar').style.opacity = 0;
                          // really clean the dom element
                          setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
                      });
                  

                  return network;

              }
